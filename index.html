  const totalPrincipal = sum(activeAccs, a => Number(a.principal || 0));
  const calcInt = (a, p) => getAccountInterest(a, p);
  const expectedInterest = sum(activeAccs, a => calcInt(a, state.bankProducts.find(p=>p.id===a.productId)));
  const fundProducts = products.filter(p => p.type === 'fund' && p.status === 'active');

  const type = ui.filters.tbType || 'deposit';
  const typeSelect = Field('1. 상품 종류', 'tbType', Select('tbType', [{value:'deposit',label:'예금'}, {value:'savings',label:'적금'}, {value:'fund',label:'펀드'}, {value:'bond',label:'채권'}], type, 'tbTypeChange'));
  const nameInput = Field('2. 상품명', 'tbName', Input('tbName', {placeholder:'상품명', maxlength:20}));
  
  let dynamicFields = '';
  if (type === 'deposit' || type === 'savings') {
    dynamicFields = `<div class="grid-3">${Field('납입액(P)', 'tbAmt', Input('tbAmt', {type:'number', value:10, min:1}))}${Field(type==='deposit'?'만기(일)':'납입(일)', 'tbDur', Input('tbDur', {type:'number', value:7, min:1}))}${Field('이자', 'tbRate', `<div class="hstack" style="gap:4px;">${Input('tbRate', {type:'number', value:10, min:0}).replace('class="input"','class="input" style="flex:1"')}${Select('tbRateType', [{value:'percent', label:'%'}, {value:'point', label:'P'}], 'percent').replace('class="select"','class="select" style="width:60px; min-height:36px; padding:0 4px;"')}</div>`)}</div>`;
  } else if (type === 'fund') {
    dynamicFields = `
      <div class="grid-2">${Field('1구좌(P)', 'tbAmt', Input('tbAmt', {type:'number', value:10, min:1}))}${Field('기간(일)', 'tbDur', Input('tbDur', {type:'number', value:7, min:1}))}</div>
      <div class="grid-3" style="margin-top:12px;">
        ${Field('미션', 'tbMission', Input('tbMission', {placeholder:'소음 0건'}))}
        ${Field('성공 보상', 'tbSucc', `<div class="hstack" style="gap:4px;">${Input('tbSucc', {type:'number', value:5, min:0}).replace('class="input"','class="input" style="flex:1"')}${Select('tbSuccType', [{value:'point', label:'P'}, {value:'percent', label:'%'}], 'point').replace('class="select"','class="select" style="width:60px; min-height:36px; padding:0 4px;"')}</div>`)}
        ${Field('실패 손실', 'tbFail', `<div class="hstack" style="gap:4px;">${Input('tbFail', {type:'number', value:5, min:0}).replace('class="input"','class="input" style="flex:1"')}${Select('tbFailType', [{value:'point', label:'P'}, {value:'percent', label:'%'}], 'point').replace('class="select"','class="select" style="width:60px; min-height:36px; padding:0 4px;"')}</div>`)}
      </div>`;
  } else if (type === 'bond') {
    dynamicFields = `<div class="grid-3">${Field('판매가(P)', 'tbAmt', Input('tbAmt', {type:'number', value:8, min:1}))}${Field('만기(일)', 'tbDur', Input('tbDur', {type:'number', value:7, min:1}))}${Field('액면가(P)', 'tbFace', Input('tbFace', {type:'number', value:10, min:1}))}</div>`;
  }

  const teacherCreateCard = Card({ title: '새 금융 상품 개설', body: `
    <div class="grid-2">${typeSelect}${nameInput}</div>
    ${dynamicFields}
    <div class="grid-2" style="margin-top:12px;">
      ${Field('가입 정원 (비우면 무제한)', 'tbMax', Input('tbMax', {type:'number', placeholder:'무제한', min:1}))}
      ${Field('가입 마감일 (비우면 무제한)', 'tbDead', Input('tbDead', {type:'date'}))}
    </div>
    ${Button({ label: '상품 개설하기', act: 'bankProductCreateTeacher', cls: 'btn-primary btn-block btn-lg', style: 'margin-top:12px;' })}
  `});

    // 상품 종류 필터 (전체 · 예금 · 적금 · 펀드 · 채권)
  const PROD_FILTERS = ['all', 'deposit', 'savings', 'fund', 'bond'];
  const prodFilter = PROD_FILTERS.includes(ui.filters.tbProdFilter) ? ui.filters.tbProdFilter : 'all';
  const countOf = (t) => products.filter(p => p.type === t).length;
  const prodFilterTabs = Tabs([
    { key: 'all',     label: `전체 (${products.length})` },
    { key: 'deposit', label: `⏳ 예금 (${countOf('deposit')})` },
    { key: 'savings', label: `🎯 적금 (${countOf('savings')})` },
    { key: 'fund',    label: `⛵ 펀드 (${countOf('fund')})` },
    { key: 'bond',    label: `🎟️ 채권 (${countOf('bond')})` },
  ], prodFilter, 'tbProdFilter', {}, 'team-tabs');
  const filteredProducts = products.filter(p => prodFilter === 'all' || p.type === prodFilter);

  const productCards = filteredProducts.map(p => {
    const currentSubs = state.bankAccounts.filter(a => a.productId === p.id && a.status === 'active').length;

    const maxSubs = p.maxSubscribers ? p.maxSubscribers : '무제한';
    const deadline = p.joinDeadline ? p.joinDeadline : '무제한';
    
    let icon = '', typeBadge = '', desc = '', cardStyle = '';
      const baseAmt = Number(p.amount) || 0;
      const baseRate = Number(p.interestRate) || 0;
      const dur = Number(p.duration) || 1;
      const interestStr = p.interestType === 'point' ? `${baseRate}P` : `${baseRate}%`;
      const expectedDepRet = p.interestType === 'point' ? (baseAmt + baseRate) : (baseAmt + Math.floor(baseAmt * baseRate/100));
      const expectedSavRet = p.interestType === 'point' ? ((baseAmt * dur) + baseRate) : ((baseAmt * dur) + Math.floor((baseAmt * dur) * baseRate/100));

      if (p.type === 'deposit') {
        icon = '⏳'; typeBadge = `<span class="badge" style="background:#D9CEF1; color:var(--text);">예금</span>`;
        cardStyle = `background: #F4F0FC; border: 1px solid #D9CEF1;`;
        desc = `[예시] ${p.amount}P 투자 시 ${p.duration}일 뒤 이자 ${interestStr}가 붙어 총 ${expectedDepRet}P 수령. (가입 시 금액 자유 설정)`;
      } else if (p.type === 'savings') {
        icon = '🎯'; typeBadge = `<span class="badge" style="background:#C4E8D6; color:var(--text);">적금</span>`;
        cardStyle = `background: #F0F9F5; border: 1px solid #C4E8D6;`;
        desc = `[예시] 매일 ${p.amount}P씩 ${p.duration}일 납입(총 ${p.amount*p.duration}P) 시 만기 이자 ${interestStr}가 붙어 총 ${expectedSavRet}P 수령. (가입 시 금액 자유 설정)`;
      } else if (p.type === 'fund') {
        const succStr = p.successRewardType === 'percent' ? `${p.successReward}%` : `${p.successReward}P`;
        const failStr = p.failPenaltyType === 'percent' ? `${p.failPenalty}%` : `${p.failPenalty}P`;
        icon = '⛵'; typeBadge = `<span class="badge" style="background:#FDD0B8; color:var(--text);">펀드</span>`;
        cardStyle = `background: #FFF5F0; border: 1px solid #FDD0B8;`;
        desc = `미션: ${esc(p.mission)}<br>[예시] ${p.amount}P 투자 시 성공 +${succStr}, 실패 -${failStr} 조건부 수익. (가입 시 금액 자유 설정)`;
      } else if (p.type === 'bond') {
        icon = '🎟️'; typeBadge = `<span class="badge" style="background:#B8DAFC; color:var(--text);">채권</span>`;
        cardStyle = `background: #F2F8FF; border: 2px dashed #B8DAFC;`;
        desc = `[예시] ${p.amount}P에 할인 구매 시 ${p.duration}일 뒤 만기 때 ${p.faceValue}P로 돌려받는 상품. (가입 시 금액 자유 설정)`;
      }

    return `
      <div class="coupon-card" style="display:flex; flex-direction:column; height:100%; ${cardStyle}">
        <div class="coupon-card-head" style="background:transparent; border-bottom:none;">
          <span>${typeBadge}</span>
          ${Badge(p.status==='active'?'운용 중':'중지', p.status==='active'?'badge-clean':'badge-outline')}
        </div>
        <div class="coupon-card-body" style="flex:1; padding:20px 16px; text-align:center;">
          <div class="coupon-card-emoji" aria-hidden="true">${icon}</div>
          <div class="coupon-card-name" style="font-size:16px;">${esc(p.name)}</div>
          <p class="coupon-card-desc" style="margin-top:8px;">${desc}</p>
          <div class="muted" style="font-size:12px; margin-top:8px; text-align:center;">
            가입 현황: ${currentSubs} / ${maxSubs}명<br>
            가입 마감: ${deadline}
          </div>
        </div>
        <div class="coupon-card-footer coupon-card-controls" style="padding:12px; background:transparent; border-top:1px solid rgba(0,0,0,0.05);">
          <div class="hstack" style="width:100%; justify-content:center; gap:4px;">
            ${Button({ label: '조건 수정', act: 'bankProductEditAsk', args: { id: p.id }, cls: 'btn-sm' }).replace('class="btn ', 'class="btn " style="padding: 0 8px; white-space: nowrap;"')}
            ${Button({ label: p.status==='active'?'판매 중지':'판매 재개', act: 'bankProductStatus', args: { id: p.id, status: p.status==='active'?'stopped':'active' }, cls: 'btn-sm btn-ghost' }).replace('class="btn ', 'class="btn " style="flex:1; padding: 0 4px; white-space: nowrap;"')}
            ${Button({ label: '삭제', act: 'bankProductDeleteAsk', args: { id: p.id }, cls: 'btn-sm btn-danger' }).replace('class="btn ', 'class="btn " style="padding: 0 8px; white-space: nowrap;"')}
          </div>
        </div>
      </div>
    `;
  }).join('');

  const activeStatuses = ['active', 'matured', 'pendingClaim'];
  const uniqueBankerIds = [...new Set(state.bankAccounts.filter(a => activeStatuses.includes(a.status)).map(a => a.bankerId))];
  const oldBankerOpts = uniqueBankerIds.map(id => {
    const count = state.bankAccounts.filter(a => a.bankerId === id && activeStatuses.includes(a.status)).length;
    return {
      value: id,
      label: id === TEACHER_ID ? `선생님 (진행 ${count}건)` : (state.users[id] ? `${state.users[id].name} (진행 ${count}건)` : `삭제된 행원 (진행 ${count}건)`)
    };
  });
  // 💡 화이트팀 목록 뒤에 '계좌 영구 폐기' 옵션을 하나 더 끼워 넣습니다.
  const newBankerOpts = [
    ...teamMembers('white').map(m => ({value: m.id, label: m.name})),
    {value: 'DELETE_ACCOUNTS', label: '❌ 계좌 영구 폐기 (삭제)'}
  ];

  let transferCard = '';
  if (uniqueBankerIds.length > 0) {
    transferCard = Card({ title: '고객 담당 행원 변경 (일괄 이관 및 폐기)', body: `
      <p class="help" style="margin-bottom:12px;">특정 행원이 관리 중인 모든 고객의 계좌를 다른 화이트팀 행원에게 일괄 이관하거나 폐기합니다.</p>
      <div class="grid-2">
        ${Field('기존 담당', 'oldBanker', Select('oldBanker', oldBankerOpts))}
        ${Field('새 담당 (화이트팀)', 'newBanker', Select('newBanker', newBankerOpts))}
      </div>
      ${Button({ label: '모든 고객 이관 또는 폐기', act: 'bankerTransferAsk', cls: 'btn-primary btn-block', style: 'margin-top:12px;' })}
    `});
  } else {
    transferCard = Card({ title: '고객 담당 행원 변경 (일괄 이관 및 폐기)', body: EmptyState('아직 이관할 고객 계좌가 없습니다') });
  }

  return Card({ title: '은행 건전성 모니터링', body: `
    <div class="grid-3">${ReportChip('화이트팀 금고 잔액', vaultPoint + 'P')}${ReportChip('전체 예치 원금', totalPrincipal + 'P')}${ReportChip('지급 예정 총 이자', expectedInterest + 'P', vaultPoint < expectedInterest ? 'badge-danger' : 'badge-clean')}</div>
    <p class="help" style="margin-top:8px;">금고 잔액이 지급 예정 이자보다 적으면 화이트팀에 파산 경보가 뜹니다.</p>
  ` }) 
  + teacherCreateCard
  + Card({ title: '펀드 미션 결과 최종 판정', body: fundProducts.length ? fundProducts.map(p => {
    const investors = state.bankAccounts.filter(a => a.productId === p.id && a.status === 'active').length;
    const succStr = p.successRewardType === 'percent' ? `${p.successReward}%` : `${p.successReward}P`;
    const failStr = p.failPenaltyType === 'percent' ? `${p.failPenalty}%` : `${p.failPenalty}P`;
    return Row(`${esc(p.name)} ${Badge(`투자자 ${investors}명`, 'badge-point')}`, `미션: ${esc(p.mission)}<br>성공 수익 +${succStr} / 실패 손실 -${failStr}`, 
      Button({ label: '미션 성공', act: 'fundSettle', args: { id: p.id, result: 'success' }, cls: 'btn-sm btn-clean' }) + Button({ label: '미션 실패', act: 'fundSettle', args: { id: p.id, result: 'fail' }, cls: 'btn-sm btn-danger' }));
  }).join('') : EmptyState('현재 운용 중인 펀드가 없어요') })
  + Card({ title: '신상품 심사 대기', body: pend.length ? pend.map(r => RequestRow(r, Button({ label: '승인', act: 'teamApprove', args: { id: r.id }, cls: 'btn-primary btn-sm' }) + Button({ label: '거절', act: 'openReject', args: { id: r.id }, cls: 'btn-ghost btn-sm' }))).join('') : EmptyState('대기 중인 제안이 없어요') })
   + Card({
      title: '운영 중인 상품 목록',
      right: Badge(`${filteredProducts.length} / ${products.length}개`, 'badge-outline'),
      body: prodFilterTabs + (
        filteredProducts.length
          ? `<div class="coupon-grid">${productCards}</div>`
          : EmptyState(prodFilter === 'all' ? '상품이 없어요' : '해당 종류의 상품이 없어요')
      ),
    })

  + Card({
      title: '현재 가입된 학생 계좌 목록 (이자 조율 · 삭제)',
      right: Badge(`진행 중 ${activeAccs.length}건 · 예정 이자 합계 ${expectedInterest}P`, 'badge-point'),
      body: activeAccs.length ? activeAccs.map(a => {
        const p = state.bankProducts.find(x => x.id === a.productId);
        const u = state.users[a.userId];
        const typeLabel = p ? ({ deposit: '예금', savings: '적금', fund: '펀드', bond: '채권' }[p.type] || p.type) : '미상';
        const statusBadge = a.status === 'pendingClaim' ? Badge('수령 심사 중', 'badge-warn') : a.status === 'matured' ? Badge('만기 달성', 'badge-clean') : Badge('운용 중', 'badge-outline');
        const curInt = calcInt(a, p);
        const isAdjusted = a.customInterest !== undefined && a.customInterest !== null;
        const canAdjustInt = p && p.type !== 'fund';
        const expectedTotal = Number(a.targetPrincipal || a.principal || 0) + curInt;

        const controls = `
          ${canAdjustInt ? `
            <span class="help">이자(P)</span>
            ${NumberBox(`bai_${a.id}`, curInt, 0, 76)}
            ${Button({ label: '이자 조율', act: 'bankAccountInterestSave', args: { id: a.id }, cls: 'btn-sm btn-primary' })}
          ` : ''}
          ${Button({ label: '✕ 삭제', act: 'bankAccountDeleteAsk', args: { id: a.id }, cls: 'btn-sm btn-danger' })}
        `;

        return Row(
          `${esc(actorName(a.userId))} ${TeamBadge(u?.teamId)} · ${Badge(typeLabel, 'badge-point')} ${esc(p ? p.name : '삭제된 상품')} ${statusBadge} ${isAdjusted ? Badge('이자 조율됨', 'badge-gold') : ''}`,
          `담당 행원: ${esc(actorName(a.bankerId))} · 가입일: ${a.joinedAt.split('T')[0]}<br>` +
          `납입 원금: <strong>${a.principal}P</strong> (목표 ${a.targetPrincipal || a.principal}P) · ` +
          (canAdjustInt ? `적용 이자: <strong>${curInt}P</strong> · 만기 시 총 수령 예정: <strong>${expectedTotal}P</strong>` : `조건부 펀드 상품 (위 펀드 판정에서 정산)`),
          controls
        );
      }).join('') : EmptyState('현재 가입된 학생 계좌가 없어요')
    })
  + (transferCard ? transferCard : '');
}

Object.assign(ACTIONS, {
  toggleBankHistory() {
    ui.filters.showBankHistory = !ui.filters.showBankHistory;
    render();
  },
  bpTypeChange({ value }) { 
    ui.filters.bpType = value; 
    render(); 
  },
    tbTypeChange({ value }) { 
    ui.filters.tbType = value; 
    render(); 
  },
  tbProdFilter({ key }) {
    ui.filters.tbProdFilter = key;
    render();
  },
  sbProdFilter({ key }) {
    ui.filters.sbProdFilter = key;
    render();
  },

  bankPropose() {
    const r = runTx(() => {
      createRequest({ type: 'bankProductProposal', fromUid: currentActorUid(), teamId: 'white', payload: { 
        type: val('bpType'), name: val('bpName'), amount: toInt(val('bpAmt')), duration: toInt(val('bpDur')), interestRate: toInt(val('bpRate')), interestType: val('bpRateType') || 'percent',
        mission: val('bpMission'), successReward: toInt(val('bpSucc')), successRewardType: val('bpSuccType') || 'point', failPenalty: toInt(val('bpFail')), failPenaltyType: val('bpFailType') || 'point', faceValue: toInt(val('bpFace')),
        maxSubscribers: toInt(val('bpMax')) || null, joinDeadline: val('bpDead') || null
      } });
    });
    if(r.ok) { Toast('제안서를 보냈어요', 'success'); render(); }
  },
  bankProductStatus({ id, status }) {
    const r = runTx(() => { const p = state.bankProducts.find(x => x.id === id); if(p) p.status = status; });
    if(r.ok) Toast('상태를 변경했어요', 'success');
  },
  bankProductEditAsk({ id }) {
    if (!isTeacher()) return;
    const p = state.bankProducts.find(x => x.id === id);
    if (!p) return;
    let extraFields = '';
    if (p.type === 'deposit' || p.type === 'savings') {
      extraFields = `
        <div class="grid-2">
          ${Field('이자 수치', 'bpeRate', Input('bpeRate', { type: 'number', value: Number(p.interestRate || 0), min: 0 }))}
          ${Field('이자 단위 (P / %)', 'bpeRateType', Select('bpeRateType', [{ value: 'point', label: '포인트 (P 정액)' }, { value: 'percent', label: '퍼센트 (% 정률)' }], p.interestType || 'percent'))}
        </div>
      `;
    } else if (p.type === 'bond') {
      extraFields = Field('만기 액면가(P)', 'bpeFace', Input('bpeFace', { type: 'number', value: Number(p.faceValue || 0), min: 1 }));
    }
    Modal({
      title: `"${p.name}" 상품 조건 수정`,
      body: `
        ${Field('상품명', 'bpeName', Input('bpeName', { value: p.name, maxlength: 20 }))}
        <div class="grid-2">
          ${Field('기준 금액(P)', 'bpeAmt', Input('bpeAmt', { type: 'number', value: Number(p.amount || 1), min: 1 }))}
          ${Field('기간(일)', 'bpeDur', Input('bpeDur', { type: 'number', value: Number(p.duration || 1), min: 1 }))}
        </div>
        ${extraFields}
        <div class="field" style="margin-top:8px;">
          ${Toggle('bpeSyncAccs', '이미 가입한 학생 계좌에도 새 이자 기준 일괄 적용', true, '켜면 기존 가입 계좌의 개별 조율값을 초기화하고 바뀐 상품 기준으로 재계산해요.')}
        </div>
      `,
      actions: [{ label: '저장하기', act: 'bankProductEditSave', args: { id }, cls: 'btn-primary' }],
    });
  },
  bankProductEditSave({ id }) {
    if (!isTeacher()) return;
    const p = state.bankProducts.find(x => x.id === id);
    if (!p) return;
    const name = val('bpeName').trim() || p.name;
    const amount = Math.max(1, toInt(val('bpeAmt')) || p.amount);
    const duration = Math.max(1, toInt(val('bpeDur')) || p.duration);
    const syncAccs = checked('bpeSyncAccs');

    const r = runTx(() => {
      p.name = name;
      p.amount = amount;
      p.duration = duration;
      if (p.type === 'deposit' || p.type === 'savings') {
        p.interestRate = Math.max(0, toInt(val('bpeRate')) || 0);
        p.interestType = val('bpeRateType') === 'point' ? 'point' : 'percent';
      } else if (p.type === 'bond') {
        p.faceValue = Math.max(1, toInt(val('bpeFace')) || p.faceValue);
      }
      if (syncAccs) {
        state.bankAccounts.filter(a => a.productId === p.id && ['active', 'matured', 'pendingClaim'].includes(a.status)).forEach(a => {
          delete a.customInterest;
          if (p.type === 'bond') {
            const joinAmt = Number(a.joinAmount || a.principal || p.amount);
            a.customFaceValue = Math.floor(joinAmt * (p.faceValue / p.amount));
          }
        });
      }
    });
    if (r.ok) {
      closeModal();
      Toast('상품 조건과 이자 표기를 수정했어요!', 'success');
      render();
    }
  },
  bankProductDeleteAsk({ id }) {
    const p = state.bankProducts.find(x => x.id === id);
    if (!p) return;

  bankJoinDo({ productId, bankerId, creditType }) {
        const u = currentUser();
    const p = state.bankProducts.find(x => x.id === productId);
    const minAmt = Math.max(1, Number(p.amount) || 1);

    let joinAmount;
    if (p.type === 'fund') {
      // 펀드: 1구좌 금액으로 고정
      joinAmount = minAmt;
    } else {
      // 예금·적금·채권: 상품 납입액(기준액) 이상만 허용
      joinAmount = toInt(val('joinAmount'));
      if (!isInt(joinAmount) || joinAmount < minAmt) {
        Toast(`이 상품의 가입금액은 최소 ${minAmt}P입니다. ${minAmt}P 이상으로 설정해주세요.`, 'warn');
        return { ok: false };   // 모달을 닫지 않고 다시 입력받아요
      }
    }
    
    if(p.type !== 'savings' && u.balances.point < joinAmount) { Toast(`포인트가 부족해요 (필요: ${joinAmount}P)`, 'warn'); return { ok: false }; }

    
    const r = runTx(() => {
      const accountId = uid();
      spendCredit(userRef(u.id), 1, creditType, 'bankFee', `상품 가입 수수료 (${p.name} · 담당 ${actorName(bankerId)})`, { createdBy: u.id, ref: { productId, accountId, bankerId } });
      
      if (p.type !== 'savings') {
        transfer({ type: 'bankJoin', from: userRef(u.id), to: vaultRef('white'), currency: 'point', amount: joinAmount, memo: `은행 상품 투자 (${p.name} · 담당 ${actorName(bankerId)})`, createdBy: u.id, ref: { productId, accountId, bankerId } });
      } else {
        transfer({ type: 'bankJoin', from: userRef(u.id), to: vaultRef('white'), currency: 'point', amount: joinAmount, memo: `적금 첫 납입 (${p.name} · 담당 ${actorName(bankerId)})`, createdBy: u.id, ref: { productId, accountId, bankerId } });
      }
      
      const targetPrincipal = (p.type === 'savings') ? (joinAmount * p.duration) : joinAmount;
      const ratio = joinAmount / p.amount;
      
      let customFaceValue = null;
      if (p.type === 'bond') customFaceValue = Math.floor(joinAmount * (p.faceValue / p.amount));
      
      let customSucc = null, customFail = null;
      if (p.type === 'fund') {
         customSucc = p.successRewardType === 'percent' ? p.successReward : Math.floor(p.successReward * ratio);
         customFail = p.failPenaltyType === 'percent' ? p.failPenalty : Math.floor(p.failPenalty * ratio);
      }

      state.bankAccounts.push({ 
        id: accountId, productId, userId: u.id, bankerId, 
        joinAmount, principal: joinAmount, targetPrincipal, duration: p.duration, 
        customFaceValue, customSucc, customFail,
        joinedAt: nowISO(), lastDepositAt: getDateKey(), status: 'active' 
      });
    });
    if(r.ok) { closeModal(); Toast('투자를 시작했어요!', 'success'); render(); }

      transfer({ type: 'bankPayout', from: vaultRef('white'), to: userRef(a.userId), currency: 'point', amount: payout, memo: `은행 만기 지급 (${p.name}) - 행원 ${actorName(bankerId)}`, createdBy: bankerId, ref: { productId: p.id, accountId: a.id, bankerId } });

    const r = runTx(() => {
      accs.forEach(a => {

          transfer({ type: 'bankPayout', from: vaultRef('white'), to: userRef(a.userId), currency: 'point', amount: a.principal + reward, memo: `펀드 성공 수익 지급 (${p.name})`, createdBy: TEACHER_ID, ref: { productId: p.id, accountId: a.id, result: 'success' } });
        } else {
          const penalty = p.failPenaltyType === 'percent' ? Math.floor(a.principal * (p.failPenalty / 100)) : (a.customFail || p.failPenalty);

        }
        a.status = 'claimed';
      });
      p.status = 'closed';
    });
    if(r.ok) { Toast(`펀드 판정이 완료되어 ${accs.length}명에게 적용되었습니다.`, 'success'); render(); }

      let count = 0;
      const activeStatuses = ['active', 'matured', 'pendingClaim'];
      if (newId === 'DELETE_ACCOUNTS') {
        const before = state.bankAccounts.length;
        // 💡 폐기: 해당 행원의 계좌 중 '현재 진행 중인' 것만 필터링하여 지웁니다. (과거 기록은 보존)
        state.bankAccounts = state.bankAccounts.filter(a => !(a.bankerId === oldId && activeStatuses.includes(a.status)));
        count = before - state.bankAccounts.length;
      } else {
        state.bankAccounts.forEach(a => {
          if (a.bankerId === oldId && activeStatuses.includes(a.status)) {
            a.bankerId = newId;
            count++;
          }
        });
      }
      return { count, isDelete: newId === 'DELETE_ACCOUNTS' };
    });
    if (r.ok) {
      closeModal();
      Toast(r.result.isDelete ? `고객 계좌 ${r.result.count}건을 영구 폐기했어요.` : `고객 계좌 ${r.result.count}건을 이관했어요!`, 'success');
      render();
    }
  }
});
</script>
</body>
</html>
