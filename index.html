   41. 교사(관리자) 모드 – 공해 조정 (G장) : 게이지 / 프리셋 3종 / 변동 이력 / 세금 이벤트
===================================================== */
const POLLUTION_PRESET_LABEL = {
  credit: '크레딧 사용',
  duty: '1인1역 미실시',
  noise: '교실 소음',
  leaderMiss: '팀장 미승인',
  manual: '직접 입력',
  grantClose: '지급 종료 미지급',
  coupon: '쿠폰',
  tax: '세금 리셋',
  refund: '환불·롤백',
};

function TaxEventDetailBody(event) {
  const percentage = Math.round(event.rate * 100);
  const polluters = event.polluters || [];
  const cleaners = event.cleaners || [];
  const tierSummary = event.tierEnabled
    ? `<div class="card card-soft" style="margin-bottom:12px; padding:12px;">
        <div class="label" style="margin-bottom:6px">⚖️ 가산·면제 규칙 적용 (단계 ${Math.round((event.tierStep || 0) * 100)}%)</div>
        <div class="help">🚨 유발 Top3: ${polluters.length ? polluters.map((p) => `${esc(p.name)} ${p.rank}위 ${Math.round(p.rate * 100)}%`).join(' · ') : '없음'}</div>
        <div class="help">🍀 정화 Top3(면제): ${cleaners.length ? cleaners.map((p) => `${esc(p.name)} ${p.rank}위`).join(' · ') : '없음'}</div>
      </div>`
    : '<p class="help" style="margin-bottom:12px">가산·면제 규칙 OFF · 전원 기본 세율 적용</p>';
  const tierCell = (d) => {
    if (d.tier === 'cleaner') return Badge(`면제 (정화 ${d.rank}위)`, 'badge-clean');
    if (d.tier === 'polluter') return Badge(`${Math.round(d.rate * 100)}% (유발 ${d.rank}위)`, 'badge-danger');
    return `<span class="muted">${Math.round((d.rate ?? event.rate) * 100)}%</span>`;
  };

  return `
    <p class="muted" style="margin-bottom:8px">
      ${formatDateTime(event.createdAt)}
      · 공해 ${event.pollutionBefore} / ${event.threshold} 도달
      · 기본 세율 ${percentage}%
    </p>
    ${tierSummary}


    <div class="table-scroll">
      <table class="table" style="min-width: 600px;">
        <thead>
                    <tr>
            <th>징수 대상</th>
            <th>세율</th>
            ${CURRENCIES.map(cur => `<th class="num">${CURRENCY_LABEL[cur]}</th>`).join('')}
          </tr>

        </thead>

        <tbody>
          ${event.details.map((detail) => `
            <tr>
                            <td style="white-space:nowrap;">
                ${esc(detail.name || actorName(detail.uid))}
              </td>
              <td style="white-space:nowrap;">${tierCell(detail)}</td>

              ${CURRENCIES.map(cur => `
                <td class="num">
                  ${detail[cur] ? `${detail[cur].before}→${detail[cur].after}<br><span class="muted" style="font-size:12px">(−${detail[cur].loss})</span>` : '-'}
                </td>
              `).join('')}
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}
function pollutionAppliedDelta(log) {
  if (
    Number.isFinite(log.before) &&
    Number.isFinite(log.after)
  ) {
    return log.after - log.before;
  }

  return Number(log.delta) || 0;
}

function PollutionStatisticsCard() {
  const logs = state.pollutionLogs.filter(
    (log) => log.preset !== 'tax'
  );

  const byPreset = {};
  let increase = 0;
  let decrease = 0;

  logs.forEach((log) => {
    const applied = pollutionAppliedDelta(log);

    if (applied > 0) {
      increase += applied;
    } else if (applied < 0) {
      decrease += -applied;
    }

    const preset = log.preset || 'manual';

    byPreset[preset] =
      (byPreset[preset] || 0) + applied;
  });

  const events = state.pollutionEvents;

  // 모든 재화별 소멸된 세금 총합 계산
  const taxTotals = Object.fromEntries(CURRENCIES.map(c => [c, 0]));
  events.forEach(event => {
    event.details.forEach(detail => {
      CURRENCIES.forEach(cur => {
        if(detail[cur]) taxTotals[cur] += detail[cur].loss;
      });
    });
  });

    const taxReportChips = CURRENCIES.map(cur =>
    ReportChip(`소멸한 ${CURRENCY_LABEL[cur]}`, taxTotals[cur])
  ).join('');

  const surchargedCount = sum(events, (e) => (e.polluters || []).length);
  const exemptCount = sum(events, (e) => (e.cleaners || []).length);
  const tierChips =
    ReportChip('가산·면제 규칙', state.settings.taxTierEnabled ? 'ON' : 'OFF') +
    ReportChip('유발 가산 적용 (누적)', `${surchargedCount}명`) +
    ReportChip('정화 면제 적용 (누적)', `${exemptCount}명`);


  const reasons = Object.entries(byPreset)
    .sort((a, b) => b[1] - a[1])
    .map(([preset, total]) =>
      Row(
        POLLUTION_PRESET_LABEL[preset] || preset,
        '',
        `
          <span class="num" style="font-weight:700">
            ${total > 0 ? '+' : ''}${total}
          </span>
        `
      )
    )
    .join('');

  return Card({
    title: '공해·세금 통계',
    body: `
      <div class="grid-3">
        ${ReportChip('누적 증가', `+${increase}`)}
        ${ReportChip('누적 감소', `−${decrease}`)}
        ${ReportChip('세금 집행', `${events.length}회`)}
      </div>

            <div class="grid-3" style="margin-top:12px">
        ${taxReportChips}
      </div>

      <div class="grid-3" style="margin-top:12px">
        ${tierChips}
      </div>


      <div class="section">
        <div class="section-title">원인별 실제 변동 합계</div>
        ${
          reasons ||
          EmptyState('공해 변동이 없어요')
        }
      </div>

      <p class="stats-note">
        게이지에 실제로 반영된 변동량을 집계해요.
        0 아래나 임계값 위로 넘어간 요청 수량은 제외해요.
        세금 집행 후 0으로 돌아간 변화는 누적 감소에서 제외해요.
      </p>
    `,
  });
}

function PollutionTaxEventsCard() {
  const events = state.pollutionEvents
    .slice()
    .reverse();

  return Card({
    title: '세금 이벤트',
    right: Badge(
      `${events.length}회`,
      events.length ? 'badge-danger' : 'badge-outline'
    ),
    body: events.length
      ? events.map((event) => {
          const lossText = CURRENCIES.map(cur => {
            const l = sum(event.details, d => d[cur] ? d[cur].loss : 0);
            return l > 0 ? `${CURRENCY_LABEL[cur]} ${l}` : null;
          }).filter(Boolean).join(' · ') || '소멸 없음';

          return Row(
            `${formatDateTime(event.createdAt)} · ` +
            `세율 ${Math.round(event.rate * 100)}%`,
            `공해 ${event.pollutionBefore} / ${event.threshold} 도달<br>` +
                        `총 소멸: ${lossText}<br>` +
            `대상 ${event.details.length}곳 (학생 및 팀 금고)<br>` +
            (event.tierEnabled
              ? `⚖️ 유발 가산 ${(event.polluters || []).length}명 · 정화 면제 ${(event.cleaners || []).length}명`
              : '⚖️ 단일 세율 (가산·면제 OFF)'),

            Button({
              label: '세부 내역',
              act: 'openTaxEvent',
              args: { id: event.id },
              cls: 'btn-sm',
            })
          );
        }).join('')
      : EmptyState('세금이 집행된 적이 없어요'),
  });
}

        Button({
          label: '인원수 확인 후 반영',
          act: 'pollutionPreset',
          args: { preset: 'duty' },
          cls: 'btn-warn btn-block',
        }),
        PresetCloseButton('pollutionPresetHideAsk', {
          key: 'duty',
        })
      );

  const customPresets = customs.map((preset) => {
    const sign = preset.delta > 0 ? '+' : '−';
    const amount = Math.abs(preset.delta);

    return ruleCard(
      preset.label,
      `
        <p class="help" style="margin-bottom:var(--sp-3)">
          ${Badge('고정 규칙', 'badge-outline')}
          누를 때마다 공해 ${sign}${amount}를 반영해요.
        </p>
      `,
      Button({
        label: `공해 ${sign}${amount}`,
        act: 'pollutionPreset',
        args: {
          preset: 'custom',
          id: preset.id,
        },
        cls: `${preset.delta > 0 ? 'btn-warn' : 'btn-clean'} btn-block`,
      }),
      PresetCloseButton('pollutionCustomRemoveAsk', {
        id: preset.id,
      })
    );
  }).join('');

  const presets = Card({
    title: '공해 지수 조정',
    body: `
      <div class="pollution-rule-layout">
        ${manualPreset}

        <div class="grid-2 pollution-rule-grid">
          ${noisePreset}
          ${teamPreset}
          ${dutyPreset}
          ${customPresets}
        </div>
      </div>

      <p class="help" style="margin-top:var(--sp-3)">
        각 버튼은 누를 때마다 반영해요.
        1인1역 미실시는 인원수 확인 모달을 거쳐요.
        고정 규칙은 직접 조정의 변동량·사유를 저장해 만든 프리셋이에요.
        숨긴 프리셋은 설정 '규칙 수치' 탭에서 복구할 수 있어요.
        긴 규칙 내용과 입력 항목은 카드 안에서 스크롤해 확인할 수 있어요.
      </p>
    `,
  });

  const historyRows = logs.map((log) => {
    const requested = Number(log.delta) || 0;
    const applied = pollutionAppliedDelta(log);

    const difference = requested !== applied
      ? ` · 실제 반영 ${applied > 0 ? '+' : ''}${applied}`
      : '';

    return Row(
      `
        <span class="num" style="font-weight:700">
          ${requested > 0 ? '+' : ''}${requested}
        </span>

        ${Badge(
          POLLUTION_PRESET_LABEL[log.preset] || log.preset,
          requested > 0 ? 'badge-warn' : 'badge-clean'
        )}

        ${esc(log.reason)}
      `,
      `${formatDateTime(log.createdAt)} · ` +
      `${log.before} → ${log.after}${difference} · ` +
      `${esc(actorName(log.createdBy))}`
    );
  }).join('');

  const history = Card({
    title: '공해 변동 이력 (최신 60건까지 조회)',
    right: Badge(
      `화면 ${logs.length}건 / 전체 ${state.pollutionLogs.length}건`,
      'badge-outline'
    ),
    body: logs.length
      ? MeasuredRecordList(
          historyRows,
          6,
          '공해 변동 이력'
        )
      : EmptyState('변동 기록이 없어요'),
  });

  return (
    publishCard +
    pendingTax +
    presets +
    history +
    PollutionStatisticsCard() +
    PollutionTaxEventsCard()
  );
}

/* =====================================================
   42. 교사(관리자) 모드 – 투표 (I장 투표권 연동) : 생성 / 진행 중 결과·마감 / 지난 투표
   + 학생 홈용 VoteCard(u) (기본 1인 1표). renderHome의 parts에 한 줄 추가해 사용 (아래 패치 참고)
===================================================== */

/* =====================================================
   43. 교사(관리자) 모드 – 지급·몰수·거래 관리 (D·H장) : 직접 지급 / 조정 / 전 재화 몰수 / 거래 취소·롤백
===================================================== */
const CURRENCY_OPTIONS = CURRENCIES.map((c) => ({ value: c, label: CURRENCY_LABEL[c] }));
function walletDraftKey(ref) {
  return `${ref.kind}:${ref.id}`;
}

function walletControlId(ref, field) {
  const encodedId = encodeURIComponent(String(ref.id))
    .replace(/%/g, '_');

  return `wm_${ref.kind}_${encodedId}_${field}`;
}

function walletDraftHasChanges(draft) {
  return !!draft && CURRENCIES.some(
    (currency) => (draft.deltas[currency] || 0) !== 0
  );
}

function makeWalletDraft(ref) {
  return {
    ref: { ...ref },
    base: { ...walletOf(ref) },
    deltas: Object.fromEntries(
      CURRENCIES.map((currency) => [currency, 0])
    ),
    reason: '',
    sourceMode: 'mint',
    sourceTeam:
      ref.kind === 'user'
        ? getUser(ref.id).teamId
        : ref.id,
  };
}

function getWalletDraft(ref) {
  const key = walletDraftKey(ref);
  let draft = ui.walletDrafts[key];

  if (!draft) {
    draft = makeWalletDraft(ref);
    ui.walletDrafts[key] = draft;
  }

  // 변경 예정 수량이 없는 카드는 최신 잔고를 기준으로 삼습니다.
  // 입력한 사유와 지급 출처는 유지합니다.
  if (!walletDraftHasChanges(draft)) {
    draft.base = { ...walletOf(ref) };
  }

  return draft;
}

function resetWalletDraft(ref) {
  const draft = makeWalletDraft(ref);
  ui.walletDrafts[walletDraftKey(ref)] = draft;
  return draft;
}

function walletDraftIsStale(ref, draft) {
  const wallet = walletOf(ref);

  return CURRENCIES.some(
    (currency) => wallet[currency] !== draft.base[currency]
  );
}

function readWalletReason(ref) {
  const draft = getWalletDraft(ref);
  const input = document.getElementById(
    walletControlId(ref, 'reason')
  );

  if (input) {
    draft.reason = input.value;
  }

  return draft.reason;
}

function dirtyWalletDraftCount() {
  return Object.values(ui.walletDrafts).filter(
    walletDraftHasChanges
  ).length;
}
function WalletManagementCard(ref) {
  const draft = getWalletDraft(ref);
  const wallet = walletOf(ref);
  const isStudent = ref.kind === 'user';
  const student = isStudent ? getUser(ref.id) : null;
  const dirty = walletDraftHasChanges(draft);
  const stale = dirty && walletDraftIsStale(ref, draft);
  const key = walletDraftKey(ref);

  // 학생 지갑은 무조건 '새로 발행' 모드로 고정합니다.
  if (isStudent) {
    draft.sourceMode = 'mint';
  }

  const rows = CURRENCIES.map((currency) => {
    const delta = draft.deltas[currency] || 0;
    const current = wallet[currency];
    const planned = draft.base[currency] + delta;

    let preview;
    if (delta === 0) {
      preview = `${current}`;
    } else if (stale) {
      preview = `현재 ${current}<br>편집 ${draft.base[currency]} → ${planned} (${delta > 0 ? '+' : ''}${delta})`;
    } else {
      preview = `${current} → <strong>${planned}</strong>`;
    }

    return `
      <div class="wallet-edit-row">
        <div class="wallet-currency-label">${CURRENCY_LABEL[currency]}</div>
        <div class="wallet-balance-preview num">${preview}</div>
        <div class="wallet-edit-buttons">
          <input
            type="number"
            inputmode="numeric"
            class="input num wallet-delta-input"
            value="${delta}"
            aria-label="${esc(`${walletName(ref)}${CURRENCY_LABEL[currency]} 변경 수량`)}"
            ${onChange('walletStepInput', { ref: key, currency })}
          >
        </div>
      </div>
    `;
  }).join('');

  const reasonId = walletControlId(ref, 'reason');
  const reasonInput = Input(reasonId, {
    value: draft.reason,
    placeholder: '사유 (예: 발표 우수)',
    maxlength: 100,
    live: 'walletReasonInput',
  }).replace('<input ', `<input data-wallet-ref="${esc(key)}" `);

  const hasBalance = CURRENCIES.some((currency) => wallet[currency] > 0);

  const body = `
    ${stale ? '<div class="wallet-stale-note">실제 잔고가 바뀌었어요. 되돌리기를 눌러 주세요.</div>' : ''}
    <div class="wallet-edit-list">${rows}</div>
    ${!isStudent ? '<p class="wallet-draft-note">금고의 + 조정은 새로 발행하고, − 조정은 소멸시켜요.</p>' : ''}
    <div class="wallet-reason">${Field('사유 (필수)', reasonId, reasonInput)}</div>
    <div class="wallet-card-actions">
      ${Button({ label: '반영', act: 'walletApply', args: { ref: key }, cls: 'btn-primary btn-sm', disabled: !dirty || stale })}
      ${Button({ label: '되돌리기', act: 'walletReset', args: { ref: key }, cls: 'btn-ghost btn-sm' })}
      ${Button({ label: '몰수', act: 'walletConfiscateAsk', args: { ref: key }, cls: 'btn-danger btn-sm', disabled: !hasBalance })}
    </div>
  `;

  return Card({
    title: walletName(ref),
    cls: `wallet-card ${dirty ? 'is-dirty' : ''}`,
    right: TeamBadge(isStudent ? student.teamId : ref.id) + (dirty ? Badge('반영 전', 'badge-warn') : ''),
    body,
  });
}

function renderWalletManagement() {
  const filter = ui.walletFilter;
  const query = String(filter.query || '').trim().toLocaleLowerCase('ko');

  const students = activeStudents().filter((student) => {
    const teamMatches = filter.teamId === 'all' || student.teamId === filter.teamId;
    const nameMatches = !query || student.name.toLocaleLowerCase('ko').includes(query);
    return teamMatches && nameMatches;
  });

  const dirtyCount = dirtyWalletDraftCount();

  const filters = Card({
    title: '재화 개별 관리',
    right: dirtyCount ? Badge(`반영 전 ${dirtyCount}개`, 'badge-warn') : '',
    body: `
      <div class="wallet-filter-grid">
        ${Field('학생 팀', 'walletTeamFilter', Select('walletTeamFilter', [{ value: 'all', label: '전체 팀' }, ...TEAM_IDS.map((teamId) => ({ value: teamId, label: `${TEAM_LABEL[teamId]}팀` }))], filter.teamId, 'walletTeamFilter'))}
        ${Field('학생 이름 검색', 'walletNameSearch', Input('walletNameSearch', { value: filter.query, placeholder: '이름을 입력해 주세요', live: 'walletSearchInput' }))}
      </div>
      <div class="hstack">
        ${Button({ label: '전체 학생 보기', act: 'walletClearFilters', cls: 'btn-ghost btn-sm' })}
      </div>
    `,
  });

 const studentCards = students.length
    ? `<div class="wallet-grid">${students.map((student) => WalletManagementCard(userRef(student.id))).join('')}</div>`
    : EmptyState('조건에 맞는 학생이 없어요');

  const vaultCards = `<div class="wallet-grid">${TEAM_IDS.map((teamId) => WalletManagementCard(vaultRef(teamId))).join('')}</div>`;

  return `
    ${filters}
    <section class="console-section">
      <h2 class="console-section-heading">학생 지갑 (${students.length}명)</h2>
      ${studentCards}
    </section>
    <section class="console-section">
      <h2 class="console-section-heading">팀 금고 (5개)</h2>
      ${vaultCards}
    </section>
  `;
}function renderTeacherTradeManagement() {
  const open = state.trades
    .filter((trade) => trade.status === 'open')
    .slice()
    .reverse();

  const accepted = state.trades
    .filter((trade) => trade.status === 'accepted')
    .slice()
    .reverse()
    .slice(0, 30);

  const others = state.trades
    .filter(
      (trade) =>
        !['open', 'accepted'].includes(trade.status)
    )
    .slice()
    .reverse()
    .slice(0, 20);

  const selectedReason = ui.filters.caReason || '학기 정리';

  const cancelAllControls = open.length
    ? `
      <div class="hstack" style="margin-bottom:12px">
        ${
          Select(
            'caReason',
            [
              { value: '학기 정리', label: '학기 정리' },
              { value: '규칙 변경', label: '규칙 변경' },
              {
                value: '문제 거래 정리',
                label: '문제 거래 정리',
              },
              {
                value: '기타',
                label: '기타(직접 입력)',
              },
            ],
            selectedReason,
            'caReasonChange'
          ).replace(
            'class="select"',
            'class="select" style="width:auto"'
          )
        }

        ${
          selectedReason === '기타'
            ? Input('caReasonText', {
                placeholder: '사유 입력',
                maxlength: 100,
              }).replace(
                'class="input"',
                'class="input" style="flex:1"'
              )
            : ''
        }

        ${Button({
          label: `미체결 거래 모두 취소 (${open.length}건)`,
          act: 'tradesCancelAllAsk',
          cls: 'btn-warn',
        })}
      </div>
    `
    : '';

  return (
    Card({
      title: '미체결 거래',
      right: Badge(
        `${open.length}건`,
        open.length ? 'badge-warn' : 'badge-outline'
      ),
      body:
        cancelAllControls +
        (
          open.length
            ? open.map((trade) =>
                TradeRow(
                  trade,
                  Button({
                    label: '이 거래 취소',
                    act: 'tradeCancelTeacher',
                    args: { id: trade.id },
                    cls: 'btn-sm btn-ghost',
                  })
                )
              ).join('')
            : EmptyState('미체결 거래가 없어요')
        ),
    }) +
    Card({
      title: '체결된 거래 (최근 30건)',
      body: accepted.length
        ? accepted.map((trade) =>
            TradeRow(
              trade,
              Button({
                label: '롤백',
                act: 'openRollback',
                args: { id: trade.id },
                cls: 'btn-sm btn-danger',
              })
            )
          ).join('')
        : EmptyState('체결된 거래가 없어요'),
    }) +
    Card({
      title: '취소·거절·롤백된 거래 (최근 20건)',
      body: others.length
        ? others.map((trade) => TradeRow(trade)).join('')
        : EmptyState('기록이 없어요'),
    })
  );
}

function renderTeacherManage() {
  const tab = ['wallets', 'trades'].includes(
    ui.teacherTab.manage
  )
    ? ui.teacherTab.manage
    : 'wallets';

  ui.teacherTab.manage = tab;

  const tabs = Tabs(
    [
      {
        key: 'wallets',
        label: '재화 개별 관리',
      },
      {
        key: 'trades',
        label: '거래 관리',
        count: state.trades.filter(
          (trade) => trade.status === 'open'
        ).length,
      },
    ],
    tab,
    'mgTab'
  );

  return tabs + (
    tab === 'trades'
      ? renderTeacherTradeManagement()
      : renderWalletManagement()
  );
}
Object.assign(ACTIONS, {
  mgTab({ key }) {
    if (!['wallets', 'trades'].includes(key)) return;
    if (ui.teacherTab.manage === key) return;

    guardWalletNavigation(() => {
      ui.teacherTab.manage = key;
      ui.picker.clear();
      render();
    });
  },

  walletTeamFilter({ value }) {
    ui.walletFilter.teamId = TEAM_IDS.includes(value)
      ? value
      : 'all';

    render();
  },

  walletSearchInput({ value }, element) {
    const selectionStart = element.selectionStart;
    const selectionEnd = element.selectionEnd;

    ui.walletFilter.query = value;

    render();

    const replacement = $('#walletNameSearch');

    if (replacement) {
      replacement.focus({ preventScroll: true });

      if (
        selectionStart !== null &&
        selectionEnd !== null
      ) {
        replacement.setSelectionRange(
          selectionStart,
          selectionEnd
        );
      }
    }
  },

  walletStepInput({ ref: key, currency, value }) {
    if (!isTeacher()) return;
    const ref = parseRef(key);
    if (!ref) return;
    const draft = getWalletDraft(ref);
    draft.deltas[currency] = toInt(value) || 0;
    render();
  },

  walletClearFilters() {
    ui.walletFilter.teamId = 'all';
    ui.walletFilter.query = '';
    render();
  },

  walletReasonInput({ value }, element) {
    if (!isTeacher()) return;

    const ref = parseRef(element.dataset.walletRef);
    if (!ref) return;

    const draft = getWalletDraft(ref);
    draft.reason = value;
  },

  walletSourceMode({ ref: key, value }) {
    if (!isTeacher()) return;
    if (!['mint', 'vaultToUser'].includes(value)) return;

    const ref = parseRef(key);
    if (!ref || ref.kind !== 'user') return;

    const draft = getWalletDraft(ref);
    readWalletReason(ref);
    draft.sourceMode = value;

    render();
  },

  walletSourceTeam({ ref: key, value }) {
    if (!isTeacher()) return;
    if (!TEAM_IDS.includes(value)) return;

    const ref = parseRef(key);
    if (!ref || ref.kind !== 'user') return;

    const draft = getWalletDraft(ref);
    readWalletReason(ref);
    draft.sourceTeam = value;

    render();
  },

  walletStep({ ref: key, currency, step }) {
    if (!isTeacher()) return;
    if (!CURRENCIES.includes(currency)) return;
    if (![-5, -1, 1, 5].includes(step)) return;

    const ref = parseRef(key);
    if (!ref) return;

    const draft = getWalletDraft(ref);
    readWalletReason(ref);

    if (
      walletDraftHasChanges(draft) &&
      walletDraftIsStale(ref, draft)
    ) {
      Toast(
        '잔고가 바뀌었어요. 되돌리기를 누르고 다시 조정해 주세요',
        'warn'
      );
      return;
    }

    const nextDelta = draft.deltas[currency] + step;
    const nextBalance = draft.base[currency] + nextDelta;

    if (
      !Number.isSafeInteger(nextDelta) ||
      !Number.isSafeInteger(nextBalance)
    ) {
      Toast('수량이 너무 커요', 'warn');
      return;
    }

    if (nextBalance < 0) {
      Toast('잔고는 0보다 작아질 수 없어요', 'warn');
      return;
    }

    draft.deltas[currency] = nextDelta;
    render();
  },

  walletReset({ ref: key }) {
    if (!isTeacher()) return;

    const ref = parseRef(key);
    if (!ref) return;

    resetWalletDraft(ref);
    render();
    Toast('변경을 되돌렸어요', 'success');
  },

  walletApply({ ref: key }) {
    if (!isTeacher()) return;

    const ref = parseRef(key);
    if (!ref) return;

    const draft = getWalletDraft(ref);
    const reason = readWalletReason(ref);

    const result = applyWalletChanges({
      ref,
      base: { ...draft.base },
      deltas: { ...draft.deltas },
      reason,
      sourceMode: draft.sourceMode,
      sourceTeam: draft.sourceTeam,
    });

    if (!result.ok) return;

    resetWalletDraft(ref);
    render();

    Toast(
      `${walletName(ref)}의 재화 변경을 반영했어요`,
      'success'
    );
  },

  walletConfiscateAsk({ ref: key }) {
    if (!isTeacher()) return;

    const ref = parseRef(key);
    if (!ref) return;

    const reason = readWalletReason(ref).trim();

    if (!reason) {
      Toast('몰수 사유를 입력해 주세요', 'warn');
      return;
    }

    if (reason.length > 100) {
      Toast('사유는 100자 이내로 적어 주세요', 'warn');
      return;
    }

    const draft = getWalletDraft(ref);

    const draftNotice = walletDraftHasChanges(draft)
      ? '\n이 카드의 반영 전 변경은 버리고 실제 잔고를 몰수해요.'
      : '';

    Confirm(
      '전액 몰수',
      `${walletName(ref)}의 모든 재화를 몰수할까요?\n` +
      `사유: ${reason}\n` +
      '라이프·크레딧·무공해 크레딧·포인트·골드가 모두 0이 돼요.' +
      draftNotice +
      '\n되돌릴 수 없어요.',
      'walletConfiscateDo',
      {
        ref: key,
        reason,
      },
      'btn-danger',
      '전액 몰수'
    );
  },

  walletConfiscateDo({ ref: key, reason }) {
    if (!isTeacher()) return;

    const ref = parseRef(key);
    if (!ref) return;

    const result = ref.kind === 'user'
      ? confiscateAll(ref.id, reason)
      : confiscateVault(ref.id, reason);

    if (!result.ok) return;

    resetWalletDraft(ref);
    closeModal();
    render();

    Toast('전 재화를 몰수했어요', 'warn');
  },

  caReasonChange({ value }) {
    ui.filters.caReason = value;
    refresh();
  },

  tradeCancelTeacher({ id }) {
    const result = cancelTrade(
      id,
      TEACHER_ID,
      '선생님 취소'
    );

    if (result.ok) {
      Toast('거래를 취소했어요', 'success');
    }
  },

  tradesCancelAllAsk() {
    const selected = val('caReason');

    const reason = selected === '기타'
      ? val('caReasonText').trim()
      : selected;

    if (!reason) {
      Toast('사유를 입력해 주세요', 'warn');
      return;
    }

    Confirm(
      '미체결 거래 모두 취소',
      `미체결 거래를 모두 취소할까요?\n사유: ${reason}`,
      'tradesCancelAllDo',
      { reason },
      'btn-warn',
      '모두 취소'
    );
  },

  tradesCancelAllDo({ reason }) {
    const result = cancelAllOpenTrades(reason);

    if (result.ok) {
      closeModal();
      Toast(
        `${result.result}건을 취소했어요`,
        'success'
      );
    }
  },

  openRollback({ id }) {
    const trade = getTrade(id);

    const missingUser = [trade.proposer, trade.counterpart].some(
      (ref) =>
        ref?.kind === 'user' &&
        !state.users[ref.id]
    );

    if (missingUser) {
      Toast(
        '거래한 학생이 삭제되어 이 거래를 되돌릴 수 없어요. 이력은 그대로 남아 있어요.',
        'warn'
      );
      return;
    }

    Modal({
      title: '거래 롤백',
      body: `
        ${TradeRow(trade)}

        <p class="help" style="margin:8px 0">
          이동한 재화와 수수료를 반대로 되돌려요.
          수수료가 일반 크레딧이면 공해도 복구돼요.
          되돌릴 쪽 잔고가 부족하면 실패해요.
        </p>

        ${Field(
          '사유 (필수)',
          'rbReason',
          Input('rbReason', {
            placeholder: '예: 강요에 의한 거래',
            maxlength: 100,
          })
        )}
      `,
      actions: [{
        label: '롤백하기',
        act: 'rollbackDo',
        args: { id },
        cls: 'btn-danger',
      }],
    });
  },

  rollbackDo({ id }) {
    const result = rollbackTrade(id, val('rbReason'));

    if (result.ok) {
      closeModal();
      Toast('거래를 되돌렸어요', 'success');
    }
  },
});
window.addEventListener('beforeunload', (event) => {
  if (!hasUnsavedWalletChanges()) return;

  event.preventDefault();
  event.returnValue = '';
});

const NOTICE_CATEGORIES = ['재화', '팀', '공해', '거래', '쿠폰', '기타'];

    <div class="field">${Toggle(`${p}Pinned`, '상단 고정', n ? n.pinned : false)}</div>`;
}function renderTeacherNotices() {
  const list = state.notices.slice().sort((a, b) => (b.pinned - a.pinned) || b.createdAt.localeCompare(a.createdAt));
  return Card({ title: '공지 작성', body: NoticeFormBody() + Button({ label: '공지 올리기', act: 'noticeAdd', cls: 'btn-primary btn-lg btn-block' }) })
    + Card({ title: '공지 목록', right: Badge(`${list.length}건`, 'badge-outline'), body: list.length ? list.map((n) => Row(`${n.pinned ? Badge('고정', 'badge-point') : ''} ${Badge(n.category, 'badge-outline')} ${esc(n.title)}`, `<span class="pre">${esc(n.body)}</span><br><span class="help">${formatDateTime(n.createdAt)}</span>`,
      `${Button({ label: n.pinned ? '고정 해제' : '고정', act: 'noticePin', args: { id: n.id, pinned: !n.pinned }, cls: 'btn-sm btn-ghost' })}${Button({ label: '수정', act: 'openNoticeEdit', args: { id: n.id }, cls: 'btn-sm' })}${Button({ label: '삭제', act: 'noticeDeleteAsk', args: { id: n.id, title: n.title }, cls: 'btn-sm btn-ghost' })}`)).join('') : EmptyState('공지가 없어요') });
}function noticeCategoryFrom(prefix) { const v = val(`${prefix}Cat`); if (v === '__new') { const c = val(`${prefix}CatNew`).trim(); if (!c) throw new Error('새 카테고리 이름을 입력해 주세요'); return c; } return v || '기타'; }
Object.assign(ACTIONS, {

  noticePin({ id, pinned }) { updateNotice(id, { pinned }); },
  openNoticeEdit({ id }) { const n = state.notices.find((x) => x.id === id); if (!n) return; ui.filters.neNewCat = false; Modal({ title: '공지 수정', body: () => NoticeFormBody(n), actions: [{ label: '저장', act: 'noticeEditSave', args: { id }, cls: 'btn-primary' }] }); },
  noticeEditSave({ id }) { const r = updateNotice(id, { category: noticeCategoryFrom('ne'), title: val('neTitle').trim() || undefined, body: val('neBody'), pinned: checked('nePinned') }); if (r.ok) { closeModal(); Toast('공지를 수정했어요', 'success'); } },
  noticeDeleteAsk({ id, title }) { Confirm('공지 삭제', `"${title}" 공지를 삭제할까요?`, 'noticeDeleteDo', { id }, 'btn-danger', '삭제'); },
  noticeDeleteDo({ id }) { const r = deleteNotice(id); if (r.ok) { closeModal(); Toast('공지를 삭제했어요', 'success'); } },
});

}

}

Object.assign(ACTIONS, {

/* =====================================================
   45. 교사(관리자) 모드 – 전체 이력 : 학생·재화·기간·유형 필터 (유형에 "자율 지불" 포함) · CSV 내려받기
===================================================== */
function historyFilter() {
  if (!ui.filters.hist) {
    ui.filters.hist = {
      userId: '',
      currency: '',
      type: '',
      fromDate: '',
      toDate: '',
    };
  }

  return ui.filters.hist;
}
function historyStudentOptions() {
  const currentStudents = activeStudents();

  const historicalIds = new Set();

  state.transactions.forEach((transaction) => {
    [
      transaction.from,
      transaction.to,
      transaction.feePayer,
    ].forEach((ref) => {
      if (ref?.kind === 'user' && ref.id) {
        historicalIds.add(ref.id);
      }
    });
  });

  const deletedIds = [...historicalIds]
    .filter((id) => !state.users[id])
    .sort();

  return [
    {
      value: '',
      label: '전체 학생',
    },

    ...currentStudents.map((student) => ({
      value: student.id,
      label:
        `${student.name} ` +
        `(${TEAM_LABEL[student.teamId]})`,
    })),

    ...deletedIds.map((id, index) => ({
      value: id,
      label:
        deletedIds.length === 1
          ? '(삭제된 학생)'
          : `(삭제된 학생) · 기록 ${index + 1}`,
    })),
  ];
}
function renderTeacherTransactionHistory() {
  const filter = historyFilter();

  const transactions = filterTransactions({
    userId: filter.userId || null,
    currency: filter.currency || null,
    type: filter.type || null,
    fromDate: filter.fromDate || null,
    toDate: filter.toDate || null,
  });

  const shown = transactions.slice(0, 200);

  const amounts = {};

  transactions.forEach((transaction) => {
    amounts[transaction.currency] =
      (amounts[transaction.currency] || 0) +
      transaction.amount;
  });

  const pollutionRequested = sum(
    transactions,
    (transaction) => transaction.pollutionDelta || 0
  );

  const typeOptions = [
    {
      value: '',
      label: '전체 유형',
    },
    ...Object.entries(TX_TYPE_LABEL).map(([key, label]) => ({
      value: key,
      label,
    })),
  ];

  const studentSelect = Select(
    'hfUser',
    historyStudentOptions(),
    filter.userId
  ).replace(
    '<select ',
    `<select ${onChange('histSet', { k: 'userId' })} `
  );

  const currencySelect = Select(
    'hfCur',
    [
      {
        value: '',
        label: '전체 재화',
      },
      ...CURRENCY_OPTIONS,
    ],
    filter.currency
  ).replace(
    '<select ',
    `<select ${onChange('histSet', { k: 'currency' })} `
  );

  const typeSelect = Select(
    'hfType',
    typeOptions,
    filter.type
  ).replace(
    '<select ',
    `<select ${onChange('histSet', { k: 'type' })} `
  );

  const fromInput = Input('hfFrom', {
    type: 'date',
    value: filter.fromDate,
  }).replace(
    '<input ',
    `<input ${onChange('histSet', { k: 'fromDate' })} `
  );

  const toInput = Input('hfTo', {
    type: 'date',
    value: filter.toDate,
  }).replace(
    '<input ',
    `<input ${onChange('histSet', { k: 'toDate' })} `
  );

  const amountText = Object.entries(amounts)
    .map(
      ([currency, amount]) =>
        `${CURRENCY_LABEL[currency]} ${amount}`
    )
    .join(' · ') || '-';

  const filterCard = Card({
    title: '거래 이력 필터',
    body: `
      <div class="grid-3">
        ${Field('학생', 'hfUser', studentSelect)}
        ${Field('재화', 'hfCur', currencySelect)}
        ${Field('유형', 'hfType', typeSelect)}
      </div>

      <div class="grid-3">
        ${Field('시작일', 'hfFrom', fromInput)}
        ${Field('종료일', 'hfTo', toInput)}

        <div class="field">
          <span class="label">조회·내려받기</span>

          <div class="hstack">
            ${Button({
              label: '오늘만',
              act: 'histToday',
              cls: 'btn-sm',
            })}

            ${Button({
              label: '필터 초기화',
              act: 'histReset',
              cls: 'btn-sm btn-ghost',
            })}

            ${Button({
              label: 'CSV 내려받기',
              act: 'histCsv',
              cls: 'btn-sm btn-primary',
              disabled: transactions.length === 0,
            })}
          </div>
        </div>
      </div>

            <p class="help">
        필터 검색 결과 전체 ${transactions.length}건 중
        최신 ${shown.length}건을 화면에 불러왔어요.
        화면 조회 한도는 200건이에요.
      </p>

      <p class="help" style="margin-top:4px">
        필터 검색 결과 전체의 기록 수량 합계는 ${esc(amountText)}예요.
        거래 수량 합계는 현재 잔고나 순증감이 아니에요.
        CSV에는 화면 조회 한도와 관계없이 검색 결과 전체가 들어가요.
        원본 거래 기록은 삭제하지 않아요.
      </p>


      <p class="help" style="margin-top:4px">
        거래 기록의 공해 요청 합계:
        ${pollutionRequested > 0 ? '+' : ''}${pollutionRequested}.
        실제 공해 변화와 세금 통계는 공해 조정 화면에서 확인해 주세요.
      </p>
    `,
  });

    const historyCard = Card({
    title: '거래 기록',
    right: Badge(
      `화면 ${shown.length}건 / 검색 결과 ${transactions.length}건`,
      'badge-outline'
    ),
    body: shown.length
      ? MeasuredRecordList(
          shown.map((transaction) =>
            TxRow(
              transaction,
              filter.userId
                ? userRef(filter.userId)
                : null
            )
          ).join(''),
          10,
          '전체 이력의 거래 기록'
        )
      : EmptyState('조건에 맞는 기록이 없어요'),
  });


  return filterCard + historyCard;
}

function IssueStatisticsCard() {
  const issued = getIssueTotals();
  const settings = state.settings;

  const quizCount = state.quizzes.length;

  const completedHomework = state.homeworkHelps.filter(
    (homework) => homework.status === 'confirmed'
  ).length;

  const quizRewards = Object.fromEntries(
    CURRENCIES.map((currency) => [currency, 0])
  );

  state.transactions
    .filter((transaction) => transaction.type === 'quizReward')
    .forEach((transaction) => {
      if (
        Object.prototype.hasOwnProperty.call(
          quizRewards,
          transaction.currency
        )
      ) {
        quizRewards[transaction.currency] += transaction.amount;
      }
    });

  const quizRewardText = CURRENCIES
    .filter((currency) => quizRewards[currency] > 0)
    .map(
      (currency) =>
        `${CURRENCY_LABEL[currency]} ${quizRewards[currency]}`
    )
    .join(' · ') || '아직 없어요';

  return Card({
    title: '발행·지급 누계',
    body: `
      <div class="grid-3">
        ${ReportChip('라이프 지급', issued.life)}
        ${ReportChip('크레딧 지급', issued.credit)}
        ${ReportChip('화이트 포인트 발행', issued.point)}
      </div>

      <div class="grid-3" style="margin-top:12px">
        ${ReportChip('골드 승인 지급', issued.gold)}

        ${ReportChip(
          '오늘 포인트 발행',
          `${getDailyIssued('white').point} / ${settings.dailyPointCap}`
        )}

        ${ReportChip(
          '오늘 골드 지급',
          `${getDailyIssued('gold').gold} / ${settings.dailyGoldCap}`
        )}
      </div>

      <div class="section">
        ${Row(
          '퀴즈 보상 누계',
          esc(quizRewardText)
        )}

        ${Row(
          '학습 활동',
          `퀴즈 ${quizCount}개 등록 · ` +
          `숙제 도우미 완료 ${completedHomework}건`
        )}
      </div>

      <p class="stats-note">
        거래 기록의 지급 유형별 누계예요.
        시작 잔고는 포함하지 않아요.
        교사의 직접 발행·조정·몰수·금고 배분은
        아래 교사 조정 통계에서 따로 보여요.
      </p>

      <p class="stats-note">
        출석·일일기록에서 교사가 실행한 일반 라이프·크레딧 지급은
        각각의 지급 누계에 포함돼요.
      </p>
    `,
  });
}

function TeacherAdjustmentStatisticsCard() {
  const totals = getTeacherAdjustmentTotals();

  const rows = CURRENCIES.map((currency) => {
    const row = totals[currency];

    return `
      <tr>
        <th scope="row">${CURRENCY_LABEL[currency]}</th>
        <td class="num">${row.minted}</td>
        <td class="num">${row.removed}</td>
        <td class="num">${row.confiscated}</td>
        <td class="num">${row.distributed}</td>
        <td class="num">${row.count}</td>
      </tr>
    `;
  }).join('');

  return Card({
    title: '교사 조정',
    body: `
      <div class="table-scroll">
        <table class="table">
          <thead>
            <tr>
              <th>재화</th>
              <th class="num">새 발행</th>
              <th class="num">소멸</th>
              <th class="num">소멸 중 몰수</th>
              <th class="num">금고→학생</th>
              <th class="num">기록 수</th>
            </tr>
          </thead>

          <tbody>
            ${rows}
          </tbody>
        </table>
      </div>

      <p class="stats-note">
        학생 지갑과 팀 금고에 대한 교사 관리 기록을 합산해요.
        교사 조정은 포인트·골드 일일 한도를 사용하지 않아요.
      </p>

      <p class="stats-note">
        '소멸 중 몰수'는 '소멸'에 이미 포함된 수량이에요.
        '금고→학생'은 기존 재화의 이동이므로 새 발행에 더하지 않아요.
        기록 수는 카드 반영 횟수가 아니라 재화별 거래 기록 수예요.
      </p>
    `,
  });
}

function StoreSalesStatisticsCard() {
  const black = getStoreReport('black');
  const gold = getStoreReport('gold');

  const blackItemMargin =
    black.itemRevenue - black.itemCost;

  const blackCouponMargin =
    black.couponRevenue - black.couponCost;

  const goldCouponMargin =
    gold.couponRevenue - gold.couponCost;

  return Card({
    title: '매점·쿠폰 매출',
    body: `
      <div class="section-title">
        ${TeamBadge('black')} 블랙팀 · 포인트
      </div>

      <div class="grid-3">
        ${ReportChip('물품 매출', black.itemRevenue)}
        ${ReportChip('판매 물품 원가', black.itemCost)}
        ${ReportChip('물품 차익', blackItemMargin)}

      <div class="grid-3" style="margin-top:12px">
        ${ReportChip('쿠폰 매출', black.couponRevenue)}
        ${ReportChip('판매 쿠폰 원가', black.couponCost)}
        ${ReportChip('쿠폰 차익', blackCouponMargin)}
      </div>

      <div class="grid-3" style="margin-top:12px">

        ${ReportChip('판매 건수', black.salesCount)}
        ${ReportChip('현재 금고 포인트', black.vault.point)}
      </div>

      <div class="section">
        <div class="section-title">
          ${TeamBadge('gold')} 골드팀 · 골드
        </div>

        <div class="grid-3">
          ${ReportChip('쿠폰 매출', gold.couponRevenue)}
          ${ReportChip('판매 쿠폰 원가', gold.couponCost)}
          ${ReportChip('쿠폰 차익', goldCouponMargin)}
        </div>

        <div class="grid-3" style="margin-top:12px">
          ${ReportChip('전체 사입 지출', gold.wholesaleSpent)}
          ${ReportChip('판매 건수', gold.salesCount)}
          ${ReportChip('현재 금고 골드', gold.vault.gold)}
        </div>
      </div>

      <p class="stats-note">
        판매 원가는 각 판매 기록에 저장된 원가를 합산해요.
        전체 사입 지출에는 아직 판매하지 않은 재고도 포함돼요.
        차익은 매출에서 판매 원가만 뺀 값이에요.
      </p>

      <p class="stats-note">
        금고에는 거래·교사 조정·학생 배분도 반영되므로
        현재 금고 잔고와 판매 차익은 같지 않을 수 있어요.
      </p>
    `,
  });
}

function OfflinePayStatisticsCard() {
  const grouped = new Map();

  state.transactions
    .filter(
      (transaction) => transaction.type === 'offlinePay'
    )
    .forEach((transaction) => {
      const dateKey = transaction.dateKey;

      if (!grouped.has(dateKey)) {
        grouped.set(dateKey, {
          dateKey,
          count: 0,
          credit: 0,
          cleanCredit: 0,
          total: 0,
        });
      }

      const row = grouped.get(dateKey);

      row.count += 1;
      row.total += transaction.amount;

      if (transaction.currency === 'credit') {
        row.credit += transaction.amount;
      } else if (transaction.currency === 'cleanCredit') {
        row.cleanCredit += transaction.amount;
      }
    });

  const days = [...grouped.values()].sort(
    (a, b) => b.dateKey.localeCompare(a.dateKey)
  );

  const totalAmount = sum(days, (day) => day.total);
  const totalCount = sum(days, (day) => day.count);

  return Card({
    title: '일별 크레딧 자율 지불 합계',
    right: Badge(
      `전체 ${totalCount}건 · ${totalAmount}크레딧`,
      'badge-credit'
    ),
    body: days.length
      ? `
        <div class="table-scroll">
          <table class="table">
            <thead>
              <tr>
                <th>날짜</th>
                <th class="num">건수</th>
                <th class="num">일반</th>
                <th class="num">무공해</th>
                <th class="num">합계</th>
              </tr>
            </thead>

            <tbody>
              ${days.map((day) => `
                <tr>
                  <td>
                    ${esc(day.dateKey)}
                    ${
                      day.dateKey === getDateKey()
                        ? Badge('오늘', 'badge-point')
                        : ''
                    }
                  </td>
                  <td class="num">${day.count}</td>
                  <td class="num">${day.credit}</td>
                  <td class="num">${day.cleanCredit}</td>
                  <td class="num">${day.total}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>

        <p class="stats-note">
          '크레딧 지불하기'의 자율 지불 기록만 포함해요.
          매점 추가 크레딧·거래 수수료·퀴즈 힌트 비용은 제외해요.
          삭제된 학생의 과거 지불 기록도 포함해요.
        </p>
      `
      : EmptyState('자율 지불 기록이 없어요'),
  });
}

function renderTeacherStatistics() {
  return `
    <p class="muted" style="margin-bottom:12px">
      전체 기간의 기록을 집계해요.
      거래 이력 탭의 학생·기간 필터는 적용하지 않아요.
    </p>

    ${IssueStatisticsCard()}
    ${TeacherAdjustmentStatisticsCard()}
    ${StoreSalesStatisticsCard()}
    ${OfflinePayStatisticsCard()}
  `;
}


function renderTeacherHistory() {
  const tab = ['transactions', 'statistics'].includes(
    ui.teacherTab.history
  )
    ? ui.teacherTab.history
    : 'transactions';

  ui.teacherTab.history = tab;

  const tabs = Tabs(
    [
      {
        key: 'transactions',
        label: '거래 이력',
      },
      {
        key: 'statistics',
        label: '통계 리포트',
      },
    ],
    tab,
    'teacherHistoryTab'
  );

  return tabs + (
    tab === 'statistics'
      ? renderTeacherStatistics()
      : renderTeacherTransactionHistory()
  );
}
function transactionsToCsv(list) {
  const head = ['일시', '날짜키', '유형', '보낸 곳', '받은 곳', '재화', '수량', '수수료', '수수료 재화', '공해 변동', '메모', '처리자'];
  const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = list.map((t) => [formatDateTime(t.createdAt), t.dateKey, TX_TYPE_LABEL[t.type] || t.type, walletName(t.from), walletName(t.to), CURRENCY_LABEL[t.currency], t.amount, t.fee || 0, t.feeCurrency ? CURRENCY_LABEL[t.feeCurrency] : '', t.pollutionDelta || 0, t.memo, actorName(t.createdBy)].map(q).join(','));
  return '\uFEFF' + [head.map(q).join(','), ...rows].join('\n');
}Object.assign(ACTIONS, {
  teacherHistoryTab({ key }) {
    if (!['transactions', 'statistics'].includes(key)) {
      return;
    }

    guardWalletNavigation(() => {
      ui.teacherTab.history = key;
      render();
    });
  },

  histSet({ k, value }) {
    if (
      ![
        'userId',
        'currency',
        'type',
        'fromDate',
        'toDate',
      ].includes(k)
    ) {
      return;
    }

    const filter = historyFilter();
    const previous = filter[k];

    filter[k] = value;

    if (
      filter.fromDate &&
      filter.toDate &&
      filter.fromDate > filter.toDate
    ) {
      filter[k] = previous;
      Toast(
        '시작일은 종료일보다 늦을 수 없어요',
        'warn'
      );
    }

    render();
  },

  histToday() {
    const filter = historyFilter();
    const today = getDateKey();

    filter.fromDate = today;
    filter.toDate = today;

    render();
  },

  histReset() {
    ui.filters.hist = null;
    render();
  },

  histCsv() {
    if (!isTeacher()) return;

    const filter = historyFilter();

    const transactions = filterTransactions({
      userId: filter.userId || null,
      currency: filter.currency || null,
      type: filter.type || null,
      fromDate: filter.fromDate || null,
      toDate: filter.toDate || null,
    });

    const blob = new Blob(
      [transactionsToCsv(transactions)],
      { type: 'text/csv;charset=utf-8' }
    );

    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');

    anchor.href = url;
    anchor.download = `학급경제_이력_${getDateKey()}.csv`;

    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();

    setTimeout(() => {
      URL.revokeObjectURL(url);
    }, 1000);

    Toast(
      `${transactions.length}건을 CSV로 내려받았어요`,
      'success'
    );
  },
});

/* =====================================================
   46. 교사(관리자) 모드 – 리포트 : 발행량 / 매점·쿠폰 매출 / 공해 / 세금 / 1인1역 미실시 / 팀장 교체 / 일별 자율 지불
===================================================== */
function ReportChip(label, value, cls = '') { return `<div class="chip ${cls}"><span class="chip-label">${esc(label)}</span><span class="chip-value num">${value}</span></div>`; }
</script>
