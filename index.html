  const tierSummary = event.tierEnabled
    ? `<div class="card card-soft" style="margin-bottom:12px; padding:12px;">
        <div class="label" style="margin-bottom:6px">⚖️ 가산·면제 규칙 적용 (단계 ${Math.round((event.tierStep || 0) * 100)}%)</div>
        <div class="help">🚨 유발 Top3: ${polluters.length ? polluters.map((p) => `${esc(p.name)} ${p.rank}위 ${Math.round(p.rate * 100)}%`).join(' · ') : '없음'}</div>
        <div class="help">🍀 정화 Top3(면제): ${cleaners.length ? cleaners.map((p) => `${esc(p.name)} ${p.rank}위`).join(' · ') : '없음'}</div>
      </div>`
    : '<p class="help" style="margin-bottom:12px">가산·면제 규칙 OFF · 전원 기본 세율 적용</p>';
  const tierCell = (d) => {
    if (d.tier === 'cleaner') return Badge(`면제 (정화 ${d.rank}위)`, 'badge-clean');
    if (d.tier === 'polluter') return Badge(`${Math.round(d.rate * 100)}% (유발 ${d.rank}위)`, 'badge-danger');
    return `<span class="muted">${Math.round((d.rate ?? event.rate) * 100)}%</span>`;
  };

  return `
    <p class="muted" style="margin-bottom:8px">
      ${formatDateTime(event.createdAt)}
      · 공해 ${event.pollutionBefore} / ${event.threshold} 도달
      · 기본 세율 ${percentage}%
    </p>
    ${tierSummary}


    <div class="table-scroll">
      <table class="table" style="min-width: 600px;">
        <thead>
                    <tr>
            <th>징수 대상</th>
            <th>세율</th>
            ${CURRENCIES.map(cur => `<th class="num">${CURRENCY_LABEL[cur]}</th>`).join('')}
          </tr>

        </thead>

        <tbody>
          ${event.details.map((detail) => `
            <tr>
                            <td style="white-space:nowrap;">
                ${esc(detail.name || actorName(detail.uid))}
              </td>
              <td style="white-space:nowrap;">${tierCell(detail)}</td>

              ${CURRENCIES.map(cur => `
                <td class="num">
                  ${detail[cur] ? `${detail[cur].before}→${detail[cur].after}<br><span class="muted" style="font-size:12px">(−${detail[cur].loss})</span>` : '-'}
                </td>
              `).join('')}
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}
function pollutionAppliedDelta(log) {
  if (
    Number.isFinite(log.before) &&
    Number.isFinite(log.after)
  ) {
    return log.after - log.before;
  }

  return Number(log.delta) || 0;
}

function PollutionStatisticsCard() {
  const logs = state.pollutionLogs.filter(
    (log) => log.preset !== 'tax'
  );

  const byPreset = {};
  let increase = 0;
  let decrease = 0;

  logs.forEach((log) => {
    const applied = pollutionAppliedDelta(log);

    if (applied > 0) {
      increase += applied;
    } else if (applied < 0) {
      decrease += -applied;
    }

    const preset = log.preset || 'manual';

    byPreset[preset] =
      (byPreset[preset] || 0) + applied;
  });

  const events = state.pollutionEvents;

  // 모든 재화별 소멸된 세금 총합 계산
  const taxTotals = Object.fromEntries(CURRENCIES.map(c => [c, 0]));
  events.forEach(event => {
    event.details.forEach(detail => {
      CURRENCIES.forEach(cur => {
        if(detail[cur]) taxTotals[cur] += detail[cur].loss;
      });
    });
  });

    const taxReportChips = CURRENCIES.map(cur =>
    ReportChip(`소멸한 ${CURRENCY_LABEL[cur]}`, taxTotals[cur])
  ).join('');

  const surchargedCount = sum(events, (e) => (e.polluters || []).length);
  const exemptCount = sum(events, (e) => (e.cleaners || []).length);
  const tierChips =
    ReportChip('가산·면제 규칙', state.settings.taxTierEnabled ? 'ON' : 'OFF') +
    ReportChip('유발 가산 적용 (누적)', `${surchargedCount}명`) +
    ReportChip('정화 면제 적용 (누적)', `${exemptCount}명`);


  const reasons = Object.entries(byPreset)
    .sort((a, b) => b[1] - a[1])

      Row(
        POLLUTION_PRESET_LABEL[preset] || preset,

        `
          <span class="num" style="font-weight:700">
            ${total > 0 ? '+' : ''}${total}
          </span>
        `
      )
    )
    .join('');

  return Card({
    title: '공해·세금 통계',
    body: `
      <div class="grid-3">
        ${ReportChip('누적 증가', `+${increase}`)}
        ${ReportChip('누적 감소', `−${decrease}`)}
        ${ReportChip('세금 집행', `${events.length}회`)}
      </div>

            <div class="grid-3" style="margin-top:12px">
        ${taxReportChips}
      </div>

      <div class="grid-3" style="margin-top:12px">
        ${tierChips}
      </div>


      <div class="section">
        <div class="section-title">원인별 실제 변동 합계</div>
        ${
          reasons ||
          EmptyState('공해 변동이 없어요')
        }
      </div>

      <p class="stats-note">
        게이지에 실제로 반영된 변동량을 집계해요.
        0 아래나 임계값 위로 넘어간 요청 수량은 제외해요.
        세금 집행 후 0으로 돌아간 변화는 누적 감소에서 제외해요.
      </p>
    `,
  });
}

function PresetCloseButton(actName, args) {

}

/** 세금 리셋(preset === 'tax')을 기준으로 시즌 목록 생성 */
function getPollutionSeasons() {
  const logs = state.pollutionLogs || [];
  const taxIndices = [];
  logs.forEach((l, idx) => { if (l.preset === 'tax') taxIndices.push(idx); });

  const seasons = [];
  let prevIdx = 0;
  let prevISO = '';

  taxIndices.forEach((taxIdx, i) => {
    const taxLog = logs[taxIdx];
    const endISO = taxLog.createdAt || '';
    const sliceLogs = logs.slice(prevIdx, taxIdx);
    seasons.push({
      key: `season_${i}_${taxLog.id}`,
      label: `📁 ${taxLog.dateKey} (${formatTime(taxLog.createdAt)}) 세금 집행 마감분`,
      logs: sliceLogs,
      startISO: prevISO,
      endISO,
      isCurrent: false,
    });
    prevIdx = taxIdx + 1;
    prevISO = endISO;
  });

  seasons.push({
    key: 'current',
    label: '🟢 현재 진행 중인 공해 (이번 세금 주기)',
    logs: logs.slice(prevIdx),
    startISO: prevISO,
    endISO: '9999-99-99',
    isCurrent: true,
  });

  return seasons.reverse(); // 최신순 정렬
}

/** 특정 시즌의 9가지 공해 유발 요인 · 친환경 활동 · Net Score · 팀별 기여도 정밀 분석 */
function computeSeasonPollutionData(seasonKey = 'current') {
  const seasons = getPollutionSeasons();
  const season = seasons.find(s => s.key === seasonKey) || seasons[0];
  const txMap = new Map(state.transactions.map(t => [t.id, t]));

  const students = {};
  activeStudents().forEach(u => {
    students[u.id] = {
      uid: u.id,
      name: u.name,
      teamId: u.teamId,
      badTotal: 0,
      goodTotal: 0,
      netScore: 0,
      badByFactor: {},
      goodByFactor: {},
      badLogs: [],
      goodLogs: [],
    };
  });

  const byTeam = { white: 0, blue: 0, red: 0, black: 0, gold: 0 };
  const teamVaultPollution = { white: 0, blue: 0, red: 0, black: 0, gold: 0 };
  let totalDelta = 0;
  let commonDelta = 0;

  const addBad = (uid, factor, detail, amount, createdAt) => {
    const s = students[uid];
    if (!s || amount <= 0) return;
    const val = round3(amount);
    s.badTotal = round3(s.badTotal + val);
    s.badByFactor[factor] = round3((s.badByFactor[factor] || 0) + val);
    s.badLogs.push({ at: createdAt, factor, detail, amount: val });
  };

  const addGood = (uid, factor, detail, amount, createdAt) => {
    const s = students[uid];
    if (!s || amount <= 0) return;
    const val = round3(amount);
    s.goodTotal = round3(s.goodTotal + val);
    s.goodByFactor[factor] = round3((s.goodByFactor[factor] || 0) + val);
    s.goodLogs.push({ at: createdAt, factor, detail, amount: val });
  };

  // 크레딧 소비 거래(tx)로부터 1~6번 요인명 판별
  const classifyCreditFactor = (tx, fallbackReason = '') => {
    if (!tx) {
      if (fallbackReason.includes('자율 지불')) return { factor: '개인 소비', detail: fallbackReason.replace('크레딧 자율 지불:', '').trim() };
      return { factor: '개인 소비', detail: fallbackReason };
    }
    const memo = tx.memo || fallbackReason || '';
    if (tx.type === 'offlinePay') return { factor: '개인 소비', detail: memo };
    if (tx.type === 'spendFee') return { factor: '상점 이용', detail: memo.replace('구매 추가 크레딧:', '').trim() || memo };
    if (tx.type === 'bankFee') {
      if (memo.includes('채권')) return { factor: '금융활동(채권 판매)', detail: memo };
      return { factor: '금융활동(상품 가입)', detail: memo };
    }
    if (tx.type === 'quizHint') return { factor: '학습활동(퀴즈 힌트)', detail: memo };
    if (tx.type === 'tradeFee') return { factor: '개인 거래', detail: memo };
    return { factor: '개인 소비', detail: memo };
  };

  // 1. 공해 로그 분석 (9가지 유발 요인 & 정화권 쿠폰 사용)
  season.logs.forEach(log => {
    // 정화권 쿠폰 사용 (The Good)
    if (log.delta < 0 && log.preset === 'coupon') {
      if (log.ref && log.ref.requestId) {
        const req = state.requests.find(r => r.id === log.ref.requestId);
        if (req && students[req.fromUid]) {
          const cpName = req.payload?.couponName || '공해 정화권';
          addGood(req.fromUid, '공해 정화권 사용', cpName, Math.abs(log.delta), log.createdAt);
        }
      }
      return;
    }

    if (log.delta <= 0) {
      return;
    }

    totalDelta += log.delta;

    // 요인 7·8: 5대 생활영역 미실시(라이프 미지급) & 1인1역 미실시(크레딧 미지급) 구분
    if (log.preset === 'grantClose' && log.ref && Array.isArray(log.ref.uids) && log.ref.uids.length) {
      const per = log.delta / log.ref.uids.length;
      const isLife = log.ref.currency === 'life' || (log.reason && log.reason.includes('라이프'));
      const factorName = isLife ? '5대 생활영역 미실시' : '1인1역 미실시';
      const detailText = isLife
        ? '라이프 미지급 (지각·자습·양치·숙제·배움노트)'
        : '크레딧 미지급 (1인1역 미실시)';
      log.ref.uids.forEach(uid => {
        if (students[uid]) {
          addBad(uid, factorName, detailText, per, log.createdAt);
          byTeam[students[uid].teamId] = round3(byTeam[students[uid].teamId] + per);
        }
      });
      return;
    }

    // 요인 8: 팀장 미승인
    if (log.preset === 'leaderMiss' && log.ref && Array.isArray(log.ref.teamIds) && log.ref.teamIds.length) {
      const per = log.delta / log.ref.teamIds.length;
      log.ref.teamIds.forEach(tid => {
        if (TEAM_IDS.includes(tid)) byTeam[tid] = round3(byTeam[tid] + per);
        const leaderUid = state.teams[tid]?.leaderUid;
        if (leaderUid && students[leaderUid]) {
          addBad(leaderUid, '팀장 미승인', `${TEAM_LABEL[tid]}팀 팀장 미승인`, per, log.createdAt);
        } else if (TEAM_IDS.includes(tid)) {
          teamVaultPollution[tid] = round3(teamVaultPollution[tid] + per);
        }
      });
      return;
    }

    // 요인 9: 봉사 지연
    if (log.reason && log.reason.includes('[봉사지연]')) {
      const parts = log.reason.split(' ');
      if (parts.length >= 2) {
        const u = Object.values(state.users).find(x => x.name === parts[1]);
        if (u && students[u.id]) {
          addBad(u.id, '봉사 지연', '학급 봉사 완료 지연', log.delta, log.createdAt);
          byTeam[u.teamId] = round3(byTeam[u.teamId] + log.delta);
          return;
        }
      }
    }

    // 요인 1~6: 일반 크레딧 사용
    if (log.preset === 'credit') {
      const tx = log.ref?.txId ? txMap.get(log.ref.txId) : null;
      let payer = log.ref?.payer || null;
      if (!payer && tx) {
        payer = (tx.from && tx.currency === 'credit' && tx.amount > 0) ? tx.from : tx.feePayer;
      }
      if (!payer && state.users[log.createdBy]) {
        payer = { kind: 'user', id: log.createdBy };
      }

      if (payer?.kind === 'user' && students[payer.id]) {
        const { factor, detail } = classifyCreditFactor(tx, log.reason);
        addBad(payer.id, factor, detail, log.delta, log.createdAt);
        byTeam[students[payer.id].teamId] = round3(byTeam[students[payer.id].teamId] + log.delta);
        return;
      } else if (payer?.kind === 'vault' && TEAM_IDS.includes(payer.id)) {
        byTeam[payer.id] = round3(byTeam[payer.id] + log.delta);
        teamVaultPollution[payer.id] = round3(teamVaultPollution[payer.id] + log.delta);
        return;
      }
    }

    // 그 외 학생이 직접 발생시킨 기타 로그
    if (students[log.createdBy]) {
      const u = students[log.createdBy];
      addBad(u.uid, '개인 소비', log.reason || '기타', log.delta, log.createdAt);
      byTeam[u.teamId] = round3(byTeam[u.teamId] + log.delta);
      return;
    }

    commonDelta = round3(commonDelta + log.delta);
  });

  // 2. 무공해 크레딧 사용 내역 분석 (켜져 있으면 설정된 감소 배수, 꺼져 있으면 1개당 1점)
  const cleanUnitPt = state.settings.useCleanCreditReduce
    ? Math.max(1, toInt(state.settings.cleanCreditReduceDelta) || 1)
    : 1;

  state.transactions.forEach(tx => {
    if (season.startISO && tx.createdAt <= season.startISO) return;
    if (season.endISO && tx.createdAt > season.endISO) return;
    if (tx.type === 'cleanExchange' || tx.type === 'confiscate' || tx.type === 'pollutionTax' || tx.type === 'adminAdjust') return;

    // 본 거래가 무공해 크레딧 소각(사용)인 경우
    if (tx.currency === 'cleanCredit' && tx.from?.kind === 'user' && tx.to === null && tx.amount > 0) {
      if (students[tx.from.id]) {
        const { factor, detail } = classifyCreditFactor(tx, tx.memo);
        addGood(tx.from.id, '무공해 크레딧 사용', `${factor}${detail ? ` (${detail})` : ''}`, tx.amount * cleanUnitPt, tx.createdAt);
      }
    }
    // 거래 수수료를 무공해 크레딧으로 지불한 경우
    if (tx.fee > 0 && tx.feeCurrency === 'cleanCredit' && tx.feePayer?.kind === 'user') {
      if (students[tx.feePayer.id]) {
        addGood(tx.feePayer.id, '무공해 크레딧 사용', `개인 거래 수수료`, tx.fee * cleanUnitPt, tx.createdAt);
      }
    }
  });

  // 3. 학생별 Net Score 및 주요 원인 뱃지 계산
  const studentList = Object.values(students).map(s => {
    s.netScore = round3(s.badTotal - s.goodTotal);
    s.badLogs.sort((a, b) => String(b.at).localeCompare(String(a.at)));
    s.goodLogs.sort((a, b) => String(b.at).localeCompare(String(a.at)));

    const topBad = Object.entries(s.badByFactor).sort((a, b) => b[1] - a[1])[0];
    const topGood = Object.entries(s.goodByFactor).sort((a, b) => b[1] - a[1])[0];

    s.topBadLabel = topBad ? `🏷️ ${topBad[0]} (+${topBad[1]})` : '';
    s.topGoodLabel = topGood ? `🌱 ${topGood[0]} (+${topGood[1]})` : '';

    if (s.badTotal > 0 && s.badTotal >= s.goodTotal) {
      s.mainBadge = { text: `🏷️ 주요 유발: ${topBad[0]}`, cls: 'badge-warn' };
    } else if (s.goodTotal > 0) {
      s.mainBadge = { text: `🌱 ${topGood[0]} 실천`, cls: 'badge-clean' };
    } else {
      s.mainBadge = { text: '✨ 무공해 청정', cls: 'badge-outline' };
    }
    return s;
  });

  const positiveTotal = round3(Math.max(0, sum(Object.values(byTeam)) + Math.max(0, commonDelta)));

  return {
    season,
    seasons,
    byTeam,
    teamVaultPollution,
    totalDelta,
    commonDelta,
    positiveTotal,
    studentList,
  };
}

/** 교사 모드 > 공해 조정 > [학생 공해 관리] 대시보드 렌더링 */
function renderStudentPollutionDashboard() {
  const seasonKey = ui.filters.polSeason || 'current';
  const data = computeSeasonPollutionData(seasonKey);
  const openDetails = ui.filters.polOpenDetails || {};

  const fmtNum = (n) => (n % 1 !== 0 ? n.toFixed(1) : String(n));
  const netBadge = (net) => {
    if (net > 0) return `<span class="badge" style="background:color-mix(in srgb, var(--danger) 22%, var(--card)); color:#B71C1C; border:1px solid var(--danger); font-variant-numeric:tabular-nums;">순수 기여도 +${fmtNum(net)}</span>`;
    if (net < 0) return `<span class="badge" style="background:color-mix(in srgb, var(--clean) 35%, var(--card)); color:#1B5E20; border:1px solid #81C784; font-variant-numeric:tabular-nums;">순수 기여도 ${fmtNum(net)}</span>`;
    return `<span class="badge badge-outline num">순수 기여도 0</span>`;
  };

  // 1. 시즌 선택 바
  const seasonSelect = Select(
    'polSeasonSel',
    data.seasons.map(s => ({ value: s.key, label: s.label })),
    data.season.key,
    'polSeasonChange'
  );

  // 2. 팀별 공해 기여도 (많이 유발한 순서 정렬 + 마우스 호버 툴팁 + 학급 공통 막대)
  const sortedTeams = TEAM_IDS.slice().sort((a, b) => (data.byTeam[b] || 0) - (data.byTeam[a] || 0));
  const positiveTotal = data.positiveTotal;

  const teamBarsHtml = sortedTeams.map((tid, idx) => {
    const val = data.byTeam[tid] || 0;
    const pct = positiveTotal > 0 ? Math.min(100, Math.max(0, (val / positiveTotal) * 100)).toFixed(1) : '0.0';
    const bgColor = tid === 'white' ? '#FFFFFF' : TEAM_COLOR[tid];
    const extraStyle = tid === 'white' ? 'border: 1px solid var(--border); box-sizing: border-box;' : '';

    // 해당 팀원들의 공해 유발량 내림차순 정렬
    const members = data.studentList
      .filter(s => s.teamId === tid)
      .sort((a, b) => b.badTotal - a.badTotal || a.name.localeCompare(b.name, 'ko'));

    const vaultVal = data.teamVaultPollution[tid] || 0;
    const memberTooltipRows = members.map((m, mIdx) => `
      <div class="hstack between" style="font-size:13px; padding:3px 0; border-bottom:1px dashed rgba(255,255,255,0.15);">
        <span>${mIdx + 1}위. <strong>${esc(m.name)}</strong> ${m.topBadLabel ? `<span style="opacity:0.8; font-size:11px;">(${esc(m.topBadLabel.replace('🏷️ ', ''))})</span>` : ''}</span>
        <span class="num" style="font-weight:700; color:${m.badTotal > 0 ? '#FF8A80' : '#CFD8DC'};">${m.badTotal > 0 ? `+${fmtNum(m.badTotal)}점` : '0점'}</span>
      </div>
    `).join('');

    const vaultRow = vaultVal > 0 ? `
      <div class="hstack between" style="font-size:12px; padding-top:4px; margin-top:4px; color:#FFE082;">
        <span>🏦 팀 금고 공통 (도매 사입 수수료 등)</span>
        <span class="num" style="font-weight:700;">+${fmtNum(vaultVal)}점</span>
      </div>
    ` : '';

    return `
      <div class="pol-team-row" tabindex="0">
        <div class="hstack between" style="font-size:14px; font-weight:700; margin-bottom:4px;">
          <span>${idx + 1}위 · ${TeamBadge(tid)} ${TEAM_LABEL[tid]}팀</span>
          <span class="num">${fmtNum(val)}점 (${pct}%)</span>
        </div>
        <div class="gauge-track" style="height:16px;">
          <div class="gauge-fill" style="width:${pct}%; background:${bgColor}; ${extraStyle}"></div>
        </div>
        <div class="pol-team-tooltip" role="tooltip">
          <div style="font-weight:700; font-size:14px; margin-bottom:6px; color:#FFF;">📊 ${TEAM_LABEL[tid]}팀 팀원별 공해 유발 지분 (총 ${fmtNum(val)}점)</div>
          ${memberTooltipRows || '<div style="font-size:12px; opacity:0.8;">팀원이 없어요</div>'}
          ${vaultRow}
        </div>
      </div>
    `;
  }).join('');

  // 3. 🚨 개인 공해 유발 순위 (The Bad)
  const badRanked = data.studentList.slice().sort((a, b) => b.badTotal - a.badTotal || b.netScore - a.netScore || a.name.localeCompare(b.name, 'ko'));
  const badRowsHtml = badRanked.map((s, idx) => {
    const isOpen = !!openDetails[`bad_${s.uid}`];
    const medal = s.badTotal > 0 ? (idx === 0 ? '🥇 1위' : idx === 1 ? '🥈 2위' : idx === 2 ? '🥉 3위' : `${idx + 1}위`) : '-';
    const factorSummary = Object.entries(s.badByFactor)
      .sort((a, b) => b[1] - a[1])
      .map(([f, v]) => `<span class="badge badge-warn" style="margin:2px;">${esc(f)} +${fmtNum(v)}</span>`)
      .join('');

    const logItems = s.badLogs.length
      ? s.badLogs.map(l => `
          <div class="hstack between" style="padding:6px 8px; border-bottom:1px solid var(--border); font-size:13px;">
            <span class="muted num" style="min-width:115px;">${formatDateTime(l.at)}</span>
            <span style="flex:1; font-weight:600;">${Badge(l.factor, 'badge-outline')} ${esc(l.detail || '')}</span>
            <span class="num" style="font-weight:700; color:#C62828;">+${fmtNum(l.amount)}</span>
          </div>
        `).join('')
      : `<div class="muted" style="padding:8px; font-size:13px;">이 기간에 발생한 개인 공해 유발 내역이 없어요.</div>`;

    return `
      <div class="pol-accordion-item ${isOpen ? 'is-open' : ''}">
        <button type="button" class="pol-accordion-head" ${act('togglePolDetail', { key: `bad_${s.uid}` })}>
          <div class="hstack" style="gap:8px; flex:1; min-width:0;">
            <span class="badge ${idx < 3 && s.badTotal > 0 ? 'badge-danger' : 'badge-outline'} num" style="min-width:52px; justify-content:center;">${medal}</span>
            <strong style="font-size:15px;">${esc(s.name)}</strong>
            ${TeamBadge(s.teamId)}
            ${Badge(s.mainBadge.text, s.mainBadge.cls)}
          </div>
          <div class="hstack" style="gap:8px;">
            ${netBadge(s.netScore)}
            <span class="num" style="font-weight:800; font-size:16px; color:${s.badTotal > 0 ? '#C62828' : 'var(--muted)'}; min-width:56px; text-align:right;">+${fmtNum(s.badTotal)}점</span>
            <span class="muted" style="font-size:12px;">${isOpen ? '▲' : '▼'}</span>
          </div>
        </button>
        ${isOpen ? `
          <div class="pol-accordion-body">
            ${factorSummary ? `<div style="margin-bottom:8px;">${factorSummary}</div>` : ''}
            <div style="background:var(--card); border:1px solid var(--border); border-radius:8px; overflow:hidden;">
              ${logItems}
            </div>
          </div>
        ` : ''}
      </div>
    `;
  }).join('');

  // 4. 🍀 개인 정화·친환경 활동 순위 (The Good: 정화권 사용 + 무공해 크레딧 사용)
  const goodRanked = data.studentList.slice().sort((a, b) => b.goodTotal - a.goodTotal || a.netScore - b.netScore || a.name.localeCompare(b.name, 'ko'));
  const goodRowsHtml = goodRanked.map((s, idx) => {
    const isOpen = !!openDetails[`good_${s.uid}`];
    const medal = s.goodTotal > 0 ? (idx === 0 ? '🍀 1위' : idx === 1 ? '🌿 2위' : idx === 2 ? '🌱 3위' : `${idx + 1}위`) : '-';
    const factorSummary = Object.entries(s.goodByFactor)
      .sort((a, b) => b[1] - a[1])
      .map(([f, v]) => `<span class="badge badge-clean" style="margin:2px;">${esc(f)} +${fmtNum(v)}점</span>`)
      .join('');

    const logItems = s.goodLogs.length
      ? s.goodLogs.map(l => `
          <div class="hstack between" style="padding:6px 8px; border-bottom:1px solid var(--border); font-size:13px;">
            <span class="muted num" style="min-width:115px;">${formatDateTime(l.at)}</span>
            <span style="flex:1; font-weight:600;">${Badge(l.factor, 'badge-clean')} ${esc(l.detail || '')}</span>
            <span class="num" style="font-weight:700; color:#2E7D32;">+${fmtNum(l.amount)}점</span>
          </div>
        `).join('')
      : `<div class="muted" style="padding:8px; font-size:13px;">이 기간에 기록된 정화권·무공해 크레딧 사용 내역이 없어요.</div>`;

    return `
      <div class="pol-accordion-item ${isOpen ? 'is-open' : ''}">
        <button type="button" class="pol-accordion-head" ${act('togglePolDetail', { key: `good_${s.uid}` })}>
          <div class="hstack" style="gap:8px; flex:1; min-width:0;">
            <span class="badge ${idx < 3 && s.goodTotal > 0 ? 'badge-clean' : 'badge-outline'} num" style="min-width:52px; justify-content:center;">${medal}</span>
            <strong style="font-size:15px;">${esc(s.name)}</strong>
            ${TeamBadge(s.teamId)}
            ${s.topGoodLabel ? Badge(s.topGoodLabel, 'badge-clean') : Badge('기록 없음', 'badge-outline')}
          </div>
          <div class="hstack" style="gap:8px;">
            ${netBadge(s.netScore)}
            <span class="num" style="font-weight:800; font-size:16px; color:${s.goodTotal > 0 ? '#2E7D32' : 'var(--muted)'}; min-width:56px; text-align:right;">+${fmtNum(s.goodTotal)}점</span>
            <span class="muted" style="font-size:12px;">${isOpen ? '▲' : '▼'}</span>
          </div>
        </button>
        ${isOpen ? `
          <div class="pol-accordion-body">
            ${factorSummary ? `<div style="margin-bottom:8px;">${factorSummary}</div>` : ''}
            <div style="background:var(--card); border:1px solid var(--border); border-radius:8px; overflow:hidden;">
              ${logItems}
            </div>
          </div>
        ` : ''}
      </div>
    `;
  }).join('');

  const styles = `
    <style>
      .pol-team-row { position: relative; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); margin-bottom: 10px; transition: background 0.15s ease; outline: none; }
      .pol-team-row:hover, .pol-team-row:focus-within { background: var(--card); border-color: var(--text); }
      .pol-team-tooltip { display: none; position: absolute; left: 12px; right: 12px; top: calc(100% - 4px); z-index: 70; background: rgba(43, 42, 58, 0.96); color: #FFF; padding: 12px 14px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.22); pointer-events: none; }
      .pol-team-row:hover .pol-team-tooltip, .pol-team-row:focus-within .pol-team-tooltip { display: block; }
      .pol-accordion-item { border: 1px solid var(--border); border-radius: 12px; background: var(--card); margin-bottom: 8px; overflow: hidden; }
      .pol-accordion-item.is-open { border-color: var(--text); }
      .pol-accordion-head { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; text-align: left; background: transparent; cursor: pointer; flex-wrap: wrap; }
      .pol-accordion-head:hover { background: var(--bg); }
      .pol-accordion-body { padding: 12px 14px; background: var(--bg); border-top: 1px dashed var(--border); }
    </style>
  `;

  return styles +
    Card({
      title: '📅 조회 기간 선택 (세금 리셋 주기별)',
      body: `
        ${Field('조회할 시즌(기간)', 'polSeasonSel', seasonSelect, '공해가 가득 차서 세금이 집행될 때마다 이전 기록이 날짜별로 자동 보관됩니다.')}
      `,
    }) +
    Card({
      title: '📊 팀별 공해 기여도 (마우스를 올리면 팀원별 유발 수치가 보여요)',
      right: Badge(`많이 유발한 팀 순 · 총 ${fmtNum(positiveTotal)}점`, 'badge-outline'),
      body: teamBarsHtml + (data.commonDelta > 0 ? (() => {
        const cPct = positiveTotal > 0 ? Math.min(100, Math.max(0, (data.commonDelta / positiveTotal) * 100)).toFixed(1) : '0.0';
        return `
          <div class="pol-team-row" style="border-style:dashed; margin-top:12px;">
            <div class="hstack between" style="font-size:14px; font-weight:700; margin-bottom:4px; color:var(--muted);">
              <span>학급 공통 (교실 소음 · 수동 반영 등)</span>
              <span class="num">${fmtNum(data.commonDelta)}점 (${cPct}%)</span>
            </div>
            <div class="gauge-track" style="height:16px;">
              <div class="gauge-fill" style="width:${cPct}%; background:var(--pollution);"></div>
            </div>
          </div>
        `;
      })() : ''),
    }) +
    Card({
      title: '🚨 개인 공해 유발 순위 (클릭하여 10가지 요인별 상세 내역 보기)',
      right: Badge('유발량순 · 순수 기여도(유발-정화) 표시', 'badge-danger'),
      body: `
        <p class="help" style="margin-bottom:12px;">
          집계 요인(10종): 개인 소비, 상점 이용, 금융활동(상품 가입), 금융활동(채권 판매), 학습활동(퀴즈 힌트), 개인 거래, 5대 생활영역 미실시(라이프 미지급), 1인1역 미실시(크레딧 미지급), 팀장 미승인, 봉사 지연
        </p>
        ${badRowsHtml || EmptyState('학생이 없어요')}
      `,
    }) +
    Card({
      title: '🍀 개인 정화권·무공해 크레딧 사용 순위 (클릭하여 상세 내역 보기)',
      right: Badge('친환경 점수순 (정화권 + 무공해 크레딧 1개당 +1점)', 'badge-clean'),
      body: `
        <p class="help" style="margin-bottom:12px;">
          공해 정화권 쿠폰으로 낮춘 공해 점수와 무공해 크레딧을 사용한 횟수(2개 사용 시 +2점)를 합산합니다.
        </p>
        ${goodRowsHtml || EmptyState('학생이 없어요')}
      `,
    });
}

function renderTeacherPollution() {
  const tab = ['control', 'students'].includes(ui.teacherTab.pollution)
    ? ui.teacherTab.pollution
    : 'control';
  ui.teacherTab.pollution = tab;

  const tabs = Tabs(
    [
      { key: 'control', label: '공해 조정' },
      { key: 'students', label: '학생 공해 관리' },
    ],
    tab,
    'polTab'
  );

  if (tab === 'students') {
    return tabs + renderStudentPollutionDashboard();
  }

  const settings = state.settings;
  const selectedTeams = ui.filters.lmTeams || [];
  const hidden = settings.hiddenPollutionPresets || [];
  const customs = settings.customPollutionPresets || [];

  const logs = state.pollutionLogs
    .slice()
    .sort((a, b) =>
      String(b.createdAt || '').localeCompare(
        String(a.createdAt || '')
      )
    )
    .slice(0, 60);

  const ruleCard = (title, content, action, closeButton = '') => `
    <div class="card card-soft pollution-preset pollution-rule-card">
      ${closeButton}

      <div class="pollution-rule-content">
        <h3 class="pollution-preset-title">${esc(title)}</h3>
        ${content}
      </div>

      <div class="pollution-preset-action">
        ${action}
      </div>
    </div>
  `;

  // 🛑 추가: 기여도 공개 스위치 카드
  const publishCard = Card({
    title: '학생 공해바 기여도 조회 설정',
    body: `
      ${Row('📊 팀별 기여도 그래프 공개', '학생들이 자신의 공해 바를 누르면 볼 수 있어요.', Button({ label: settings.showTeamPollution ? '공개 중' : '비공개', act: 'togglePolSet', args: { k: 'showTeamPollution' }, cls: settings.showTeamPollution ? 'btn-clean btn-sm' : 'btn-ghost btn-sm' }))}
      ${Row('🚨 공해 유발 Top 3 학생 공개', '공해를 가장 많이 발생시킨 상위 3명을 실명으로 공개해요.', Button({ label: settings.showTopPolluters ? '공개 중' : '비공개', act: 'togglePolSet', args: { k: 'showTopPolluters' }, cls: settings.showTopPolluters ? 'btn-warn btn-sm' : 'btn-ghost btn-sm' }))}
      ${Row('🍀 공해 정화 Top 3 학생 공개', '정화권 쿠폰으로 공해를 낮춘 상위 3명을 실명으로 공개해요.', Button({ label: settings.showTopCleaners ? '공개 중' : '비공개', act: 'togglePolSet', args: { k: 'showTopCleaners' }, cls: settings.showTopCleaners ? 'btn-life btn-sm' : 'btn-ghost btn-sm' }))}
    `
  });

  const pendingTax = settings.pendingTaxEventId
    ? Card({
        cls: 'card-warn',
        title: '세금 집행 대기',
        body: `
          <p style="margin-bottom:var(--sp-3)">
            아직 처리하지 못한 공해 세금이 있어요.
            지금 집행하거나 앱을 다시 열면 재시도해요.
          </p>

          ${Button({
            label: '지금 집행',
            act: 'taxRetry',
            cls: 'btn-danger',
          })}
        `,
      })
    : '';

  const manualPreset = `
    <div class="card card-soft pollution-preset pollution-manual-card">
      <h3 class="pollution-preset-title">직접 조정</h3>

      ${Field(
        '변동량 (음수면 감소)',
        'plDelta',
        Input('plDelta', {
          type: 'number',
          value: 0,
        })
      )}

      ${Field(
        '사유 (필수)',
        'plReason',
        Input('plReason', {
          placeholder: '예: 공해를 잘못 반영해서 수정',
          maxlength: 100,
        })
      )}

      <div class="pollution-preset-action">
        ${Button({
          label: '반영하기',
          act: 'pollutionPreset',
          args: { preset: 'manual' },
          cls: 'btn-primary btn-block',
        })}

        ${Button({
          label: '고정 규칙으로 저장(영구 반영)',
          act: 'pollutionCustomSave',
          cls: 'btn-ghost btn-block',
        })}
      </div>
    </div>
  `;

  const noisePreset = ruleCard(
    '교실 소음',
    Field(
      '메모 (선택)',
      'plNoiseReason',
      Input('plNoiseReason', {
        placeholder: '예: 수업 중 큰 소리',
        maxlength: 50,
      })
    ),
    Button({
      label: `공해 +${settings.noiseDelta}`,
      act: 'pollutionPreset',
      args: { preset: 'noise' },
      cls: 'btn-warn btn-block',
    })
  );

  const teamButtons = TEAM_IDS.map((teamId) => `
    <button
      type="button"
      class="name-btn team-${teamId} ${selectedTeams.includes(teamId) ? 'selected' : ''}"
      style="min-height:var(--touch);padding:var(--sp-1) var(--sp-3)"
      ${act('lmTeamToggle', { t: teamId })}
      aria-pressed="${selectedTeams.includes(teamId) ? 'true' : 'false'}"
    >${TEAM_LABEL[teamId]}</button>
  `).join('');

  const teamPreset = ruleCard(
    '팀장 미승인',
    `
      <p class="help" style="margin-bottom:var(--sp-2)">
        팀당 공해 ${settings.leaderMissDelta}를 올려요.
      </p>
      <div class="hstack">${teamButtons}</div>
    `,
    Button({
      label: selectedTeams.length
        ? `공해 +${settings.leaderMissDelta * selectedTeams.length} (${selectedTeams.length}팀)`
        : '팀을 선택해 주세요',
      act: 'pollutionPreset',
      args: { preset: 'leaderMiss' },
      cls: 'btn-warn btn-block',
      disabled: selectedTeams.length === 0,
    })
  );

  const dutyPreset = hidden.includes('duty')
    ? ''
    : ruleCard(
        '1인1역 미실시',
        `
          ${Field(
            '인원수',
            'plDutyCount',
            Input('plDutyCount', {
              type: 'number',
              value: 1,
              min: 1,
            }),
            `입력한 인원수 × ${settings.dutyMissDelta}만큼 올려요.`
          )}

          <p class="help" style="margin-bottom:var(--sp-3)">
            학생별 역할·출석·크레딧 지급 기록과 자동으로 연결하지 않아요.
            선생님이 확인한 인원수를 입력해 주세요.
          </p>
        `,
        Button({
          label: '인원수 확인 후 반영',
          act: 'pollutionPreset',
          args: { preset: 'duty' },
          cls: 'btn-warn btn-block',
        }),
        PresetCloseButton('pollutionPresetHideAsk', {
          key: 'duty',
        })
      );

  const customPresets = customs.map((preset) => {
    const sign = preset.delta > 0 ? '+' : '−';
    const amount = Math.abs(preset.delta);

    return ruleCard(
      preset.label,
      `
        <p class="help" style="margin-bottom:var(--sp-3)">
          ${Badge('고정 규칙', 'badge-outline')}
          누를 때마다 공해 ${sign}${amount}를 반영해요.
        </p>
      `,
      Button({
        label: `공해 ${sign}${amount}`,
        act: 'pollutionPreset',
        args: {
          preset: 'custom',
          id: preset.id,
        },
        cls: `${preset.delta > 0 ? 'btn-warn' : 'btn-clean'} btn-block`,
      }),
      PresetCloseButton('pollutionCustomRemoveAsk', {
        id: preset.id,
      })
    );
  }).join('');

  const presets = Card({
    title: '공해 지수 조정',
    body: `
      <div class="pollution-rule-layout">
        ${manualPreset}

        <div class="grid-2 pollution-rule-grid">
          ${noisePreset}
          ${teamPreset}
          ${dutyPreset}
          ${customPresets}
        </div>
      </div>

      <p class="help" style="margin-top:var(--sp-3)">
        각 버튼은 누를 때마다 반영해요.
        1인1역 미실시는 인원수 확인 모달을 거쳐요.
        고정 규칙은 직접 조정의 변동량·사유를 저장해 만든 프리셋이에요.
        숨긴 프리셋은 설정 '규칙 수치' 탭에서 복구할 수 있어요.
        긴 규칙 내용과 입력 항목은 카드 안에서 스크롤해 확인할 수 있어요.
      </p>
    `,
  });

  const historyRows = logs.map((log) => {
    const requested = Number(log.delta) || 0;
    const applied = pollutionAppliedDelta(log);

    const difference = requested !== applied
      ? ` · 실제 반영 ${applied > 0 ? '+' : ''}${applied}`
      : '';

    return Row(
      `
        <span class="num" style="font-weight:700">
          ${requested > 0 ? '+' : ''}${requested}
        </span>

        ${Badge(
          POLLUTION_PRESET_LABEL[log.preset] || log.preset,
          requested > 0 ? 'badge-warn' : 'badge-clean'
        )}

        ${esc(log.reason)}
      `,
      `${formatDateTime(log.createdAt)} · ` +
      `${log.before} → ${log.after}${difference} · ` +
      `${esc(actorName(log.createdBy))}`
    );
  }).join('');

  const history = Card({
    title: '공해 변동 이력 (최신 60건까지 조회)',
    right: Badge(
      `화면 ${logs.length}건 / 전체 ${state.pollutionLogs.length}건`,
      'badge-outline'
    ),
    body: logs.length
      ? MeasuredRecordList(
          historyRows,
          6,
          '공해 변동 이력'
        )
      : EmptyState('변동 기록이 없어요'),
  });

  return (
    tabs +
    publishCard +
    pendingTax +
    presets +
    history +
    PollutionStatisticsCard() +
    PollutionTaxEventsCard()
  );
}


Object.assign(ACTIONS, {
  polTab({ key }) {
    if (!['control', 'students'].includes(key)) return;
    ui.teacherTab.pollution = key;
    render();
  },

  polSeasonChange({ value }) {
    ui.filters.polSeason = value || 'current';
    render();
  },

  togglePolDetail({ key }) {
    if (!ui.filters.polOpenDetails) ui.filters.polOpenDetails = {};
    ui.filters.polOpenDetails[key] = !ui.filters.polOpenDetails[key];
    render();
  },

  lmTeamToggle({ t }) {
    if (!TEAM_IDS.includes(t)) return;

    const selected = new Set(ui.filters.lmTeams || []);

    if (selected.has(t)) {
      selected.delete(t);
    } else {
      selected.add(t);
    }

    ui.filters.lmTeams = [...selected];
    refresh();
  },

  pollutionPreset({ preset, id }) {
    if (!isTeacher()) return;

    if (preset === 'duty') {
      const count = Number(val('plDutyCount'));

      if (!Number.isSafeInteger(count) || count < 1) {
        Toast('인원수는 1 이상의 정수로 입력해 주세요', 'warn');
        return;
      }

      const delta = count * state.settings.dutyMissDelta;

      if (!Number.isSafeInteger(delta)) {
        Toast('인원수가 너무 커요', 'warn');
        return;
      }

      Confirm(
        '1인1역 미실시 반영',
        `${count}명 × ${state.settings.dutyMissDelta} = 공해 +${delta}를 반영할까요?\n` +
        '학생별 역할 기록은 저장하지 않아요.\n' +
        '같은 인원을 이미 반영하지 않았는지 확인해 주세요.',
        'pollutionDutyConfirm',
        { count },
        'btn-warn',
        '반영하기'
      );

      return;
    }

    let result;

    if (preset === 'noise') {
      result = adjustPollutionManual('noise', { reason: val('plNoiseReason') });
    } else if (preset === 'leaderMiss') {
      result = adjustPollutionManual('leaderMiss', { teamIds: ui.filters.lmTeams || [] });
    } else if (preset === 'manual') {
      result = adjustPollutionManual('manual', { delta: val('plDelta'), reason: val('plReason') });
    } else if (preset === 'custom') {
      const custom = (state.settings.customPollutionPresets || []).find((p) => p.id === id);
      if (!custom) {
        Toast('프리셋을 찾을 수 없어요', 'warn');
        return;
      }
      result = adjustPollutionManual('manual', { delta: custom.delta, reason: custom.label });
    } else {
      return;
    }

    if (!result.ok) return;

    ui.filters.lmTeams = [];
    render();

    Toast(
      result.result === 0
        ? '설정된 증가량이 0이라 공해는 바뀌지 않았어요'
        : `공해 조정 ${result.result > 0 ? '+' : ''}${result.result} 요청을 반영했어요`,
      result.result > 0 ? 'warn' : 'success'
    );
  },

  pollutionCustomSave() {
    if (!isTeacher()) return;
    const delta = toInt(val('plDelta'));
    const label = val('plReason').trim();
    if (!isInt(delta) || delta === 0) { Toast('0이 아닌 정수를 입력해 주세요', 'warn'); return; }
    if (!label) { Toast('사유를 입력해 주세요', 'warn'); return; }
    if (label.length > 100) { Toast('사유는 100자 이내로 적어 주세요', 'warn'); return; }
    const list = [...(state.settings.customPollutionPresets || []), { id: uid(), label, delta }];
    const result = updateSettings({ customPollutionPresets: list });
    if (result.ok) Toast(`"${label}" 프리셋을 고정 규칙으로 저장했어요`, 'success');
  },

  pollutionCustomRemoveAsk({ id }) {
    if (!isTeacher()) return;
    const custom = (state.settings.customPollutionPresets || []).find((p) => p.id === id);
    if (!custom) return;
    Confirm('프리셋 삭제', `"${custom.label}" (공해 ${custom.delta > 0 ? '+' : ''}${custom.delta}) 프리셋을 삭제할까요?\n이미 반영한 공해 이력은 그대로 남아요.`, 'pollutionCustomRemoveDo', { id }, 'btn-danger', '삭제');
  },

  pollutionCustomRemoveDo({ id }) {
    if (!isTeacher()) return;
    const list = (state.settings.customPollutionPresets || []).filter((p) => p.id !== id);
    const result = updateSettings({ customPollutionPresets: list });
    if (result.ok) { closeModal(); Toast('프리셋을 삭제했어요', 'success'); }
  },

  pollutionPresetHideAsk({ key }) {
    if (!isTeacher() || !HIDEABLE_POLLUTION_PRESETS.includes(key)) return;
    Confirm('프리셋 숨기기', `"${POLLUTION_PRESET_LABEL[key] || key}" 프리셋 박스를 숨길까요?\n설정 '규칙 수치' 탭 하단의 '숨긴 프리셋 복구'로 되돌릴 수 있어요.`, 'pollutionPresetHideDo', { key }, 'btn-warn', '숨기기');
  },

  pollutionPresetHideDo({ key }) {
    if (!isTeacher()) return;
    const list = [...new Set([...(state.settings.hiddenPollutionPresets || []), key])];
    const result = updateSettings({ hiddenPollutionPresets: list });
    if (result.ok) { closeModal(); Toast('프리셋을 숨겼어요', 'success'); }
  },

  pollutionPresetRestore() {
    if (!isTeacher()) return;
    const result = updateSettings({ hiddenPollutionPresets: [] });
    if (result.ok) Toast('숨긴 프리셋을 모두 복구했어요', 'success');
  },

  pollutionDutyConfirm({ count }) {
    const result = adjustPollutionManual('duty', { count });
    if (!result.ok) return;

    closeModal();
    render();

    Toast(
      result.result === 0
        ? '설정된 증가량이 0이라 공해는 바뀌지 않았어요'
        : `${count}명, 공해 +${result.result} 요청을 반영했어요`,
      result.result > 0 ? 'warn' : 'success'
    );
  },

  openTaxEvent({ id }) {
    const event = state.pollutionEvents.find(
      (candidate) => candidate.id === id
    );

    if (!event) return;

    Modal({
      title: '공해 정화 세금 – 학생별 내역',
      body: TaxEventDetailBody(event),
      cancelLabel: '닫기',
    });
  },

  taxRetry() {
    if (!isTeacher()) return;

    const eventId = state.settings.pendingTaxEventId;

    if (!eventId) {
      Toast('집행을 기다리는 세금이 없어요', 'success');
      return;
    }

    const result = runPollutionTax(eventId);

    if (result.ok) {
      Toast('세금 집행 상태를 확인했어요', 'success');
    }

    render();
  },

  // 🛑 추가: 공개 설정 토글 액션
  togglePolSet({ k }) {
    if(!isTeacher()) return;
    state.settings[k] = !state.settings[k];
    saveState(); render();
  },

  // 🛑 공해바 클릭 시 기여도 모달 띄우기 ('학생 공해 관리' 계산 엔진과 100% 동일)
  showPollutionStats() {
    const contrib = computePollutionContribution('current');
    const { byTeam, commonDelta, positiveTotal, topPolluters, topCleaners } = contrib;
    const plan = getTaxPlan();
    const fmtNum = (n) => (n % 1 !== 0 ? n.toFixed(1) : String(n));

    const vis = getPollutionStatsVisibility();
    const showTeam = vis.team || isTeacher();
    const showTop = vis.top || isTeacher();
    const showCleaners = vis.cleaners || isTeacher();

    let body = '<p class="muted" style="margin-bottom:16px;">이번 세금 주기(리셋 이후) 동안 발생한 공해 비율이에요.</p>';
    if (vis.auto) {
      body += `<div class="card card-danger" style="margin-bottom:16px; padding:12px;"><strong>🚨 자동 공개 발동!</strong><br><span class="help">공해가 ${vis.threshold} 이상이 되어 선생님이 비공개로 둔 기여도 분석이 모두에게 공개됐어요.</span></div>`;
    }

    if (showTeam) {
      const sortedTeams = TEAM_IDS.slice().sort((a, b) => (byTeam[b] || 0) - (byTeam[a] || 0));
      const teamRows = sortedTeams.map((t, idx) => {
        const val = byTeam[t] || 0;
        const pct = positiveTotal > 0 ? Math.min(100, Math.max(0, (val / positiveTotal) * 100)).toFixed(1) : '0.0';
        const bgColor = t === 'white' ? '#FFFFFF' : TEAM_COLOR[t];
        const extraStyle = t === 'white' ? 'border: 1px solid var(--border); box-sizing: border-box;' : '';
        return `<div style="margin-bottom:8px;"><div class="hstack between" style="font-size:13px; font-weight:bold; margin-bottom:4px;"><span>${idx + 1}위 · ${TEAM_LABEL[t]}팀</span><span class="num">${fmtNum(val)}점 (${pct}%)</span></div><div class="gauge-track" style="height:12px;"><div class="gauge-fill" style="width:${pct}%; background:${bgColor}; ${extraStyle}"></div></div></div>`;
      }).join('');

      let commonRow = '';
      if (commonDelta > 0) {
        const cPct = positiveTotal > 0 ? Math.min(100, Math.max(0, (commonDelta / positiveTotal) * 100)).toFixed(1) : '0.0';
        commonRow = `<div style="margin-bottom:8px; margin-top:12px; border-top:1px dashed var(--border); padding-top:8px;"><div class="hstack between" style="font-size:13px; font-weight:bold; margin-bottom:4px;"><span style="color:var(--muted)">학급 공통 (교실 소음 · 수동 반영 등)</span><span class="num" style="color:var(--muted)">${fmtNum(commonDelta)}점 (${cPct}%)</span></div><div class="gauge-track" style="height:12px; background:var(--bg);"><div class="gauge-fill" style="width:${cPct}%; background:var(--pollution);"></div></div></div>`;
      }

      body += `<div class="card card-soft" style="margin-bottom:16px;"><div class="label" style="margin-bottom:8px;">📊 팀별 공해 기여도 (많이 유발한 팀 순)</div>${teamRows}${commonRow}</div>`;
    }

    let rankHtml = '';

    if (showTop) {
      const topRows = topPolluters.map((p, idx) => {
        const u = state.users[p.uid];
        const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : '🥉';
        const t = plan.enabled ? plan.byUid[p.uid] : null;
        const taxBadge = !t ? '' : t.tier === 'cleaner' ? Badge('정화 Top3 → 면제', 'badge-clean') : Badge(`예상 세율 ${Math.round(t.rate * 100)}%`, 'badge-danger');
        return Row(`${medal} ${esc(u.name)} ${TeamBadge(u.teamId)}`, taxBadge, `<span class="num" style="color:var(--danger); font-weight:bold;">+${fmtNum(p.value)}점</span>`);
      }).join('');
      if (plan.enabled) {
        const basePct = Math.round(plan.base * 100), stepPct = Math.round(plan.step * 100);
        body += `<p class="help" style="margin-bottom:8px;">⚖️ 세금 규칙: 기본 ${basePct}% · 유발 3위 ${Math.min(100, basePct + stepPct)}% / 2위 ${Math.min(100, basePct + stepPct * 2)}% / 1위 ${Math.min(100, basePct + stepPct * 3)}% · 정화 Top3는 면제</p>`;
      }

      rankHtml += `<div class="card card-soft" style="margin:0;"><div class="label" style="margin-bottom:8px;">🚨 유발 Top 3<br><span class="muted" style="font-size:12px; font-weight:normal;">(10가지 공해 유발 요인 합산)</span></div>${topRows || EmptyState('기록이 없어요')}</div>`;
    }

    if (showCleaners) {
      const cleanerRows = topCleaners.map((p, idx) => {
        const u = state.users[p.uid];
        const medal = idx === 0 ? '🍀' : idx === 1 ? '🌿' : '🌱';
        const exemptBadge = plan.enabled && plan.byUid[p.uid]?.tier === 'cleaner' ? Badge('세금 면제', 'badge-clean') : '';
        return Row(`${medal} ${esc(u.name)} ${TeamBadge(u.teamId)}`, exemptBadge, `<span class="num" style="color:#2E7D32; font-weight:bold;">+${fmtNum(p.value)}점</span>`);
      }).join('');
      rankHtml += `<div class="card card-soft" style="margin:0;"><div class="label" style="margin-bottom:8px;">🍀 정화 Top 3<br><span class="muted" style="font-size:12px; font-weight:normal;">(정화권 + 무공해 크레딧 합산)</span></div>${cleanerRows || EmptyState('기록이 없어요')}</div>`;
    }

    if (rankHtml) {
      body += `<div class="grid-2">${rankHtml}</div>`;
    }
    
    if (!showTeam && !showTop && !showCleaners) {
      body += EmptyState('선생님이 기여도를 비공개로 설정했어요.');
    }
    
    body += `
      <div style="margin-top: var(--sp-4);">
        ${Button({ label: '닫기', act: 'closeModal', cls: 'btn-ghost btn-block btn-lg' })}
      </div>
    `;
    
    Modal({ title: '공해 기여도 분석', body, noCancel: true });
  },
});

/* =====================================================
   42. 교사(관리자) 모드 – 투표 (I장 투표권 연동) : 생성 / 진행 중 결과·마감 / 지난 투표
   + 학생 홈용 VoteCard(u) (기본 1인 1표). renderHome의 parts에 한 줄 추가해 사용 (아래 패치 참고)
===================================================== */

/* =====================================================
   43. 교사(관리자) 모드 – 지급·몰수·거래 관리 (D·H장) : 직접 지급 / 조정 / 전 재화 몰수 / 거래 취소·롤백
===================================================== */
const CURRENCY_OPTIONS = CURRENCIES.map((c) => ({ value: c, label: CURRENCY_LABEL[c] }));
function walletDraftKey(ref) {
  return `${ref.kind}:${ref.id}`;
}

function walletControlId(ref, field) {
  const encodedId = encodeURIComponent(String(ref.id))
    .replace(/%/g, '_');

  return `wm_${ref.kind}_${encodedId}_${field}`;
}

function walletDraftHasChanges(draft) {
  return !!draft && CURRENCIES.some(
    (currency) => (draft.deltas[currency] || 0) !== 0
  );
}

function makeWalletDraft(ref) {
  return {
    ref: { ...ref },
    base: { ...walletOf(ref) },
    deltas: Object.fromEntries(
      CURRENCIES.map((currency) => [currency, 0])
    ),
    reason: '',
    sourceMode: 'mint',
    sourceTeam:
      ref.kind === 'user'
        ? getUser(ref.id).teamId
        : ref.id,
  };
}

function getWalletDraft(ref) {
  const key = walletDraftKey(ref);
  let draft = ui.walletDrafts[key];

  if (!draft) {
    draft = makeWalletDraft(ref);
    ui.walletDrafts[key] = draft;
  }

  // 변경 예정 수량이 없는 카드는 최신 잔고를 기준으로 삼습니다.
  // 입력한 사유와 지급 출처는 유지합니다.
  if (!walletDraftHasChanges(draft)) {
    draft.base = { ...walletOf(ref) };
  }

  return draft;
}

function resetWalletDraft(ref) {
  const draft = makeWalletDraft(ref);
  ui.walletDrafts[walletDraftKey(ref)] = draft;
  return draft;
}

function walletDraftIsStale(ref, draft) {
  const wallet = walletOf(ref);

  return CURRENCIES.some(
    (currency) => wallet[currency] !== draft.base[currency]
  );
}

function readWalletReason(ref) {
  const draft = getWalletDraft(ref);
  const input = document.getElementById(
    walletControlId(ref, 'reason')
  );

  if (input) {
    draft.reason = input.value;
  }

  return draft.reason;
}

function dirtyWalletDraftCount() {
  return Object.values(ui.walletDrafts).filter(
    walletDraftHasChanges
  ).length;
}
function WalletManagementCard(ref) {
  const draft = getWalletDraft(ref);
  const wallet = walletOf(ref);
  const isStudent = ref.kind === 'user';
  const student = isStudent ? getUser(ref.id) : null;
  const dirty = walletDraftHasChanges(draft);
  const stale = dirty && walletDraftIsStale(ref, draft);
  const key = walletDraftKey(ref);

  // 학생 지갑은 무조건 '새로 발행' 모드로 고정합니다.
  if (isStudent) {
    draft.sourceMode = 'mint';
  }

  const rows = CURRENCIES.map((currency) => {
    const delta = draft.deltas[currency] || 0;
    const current = wallet[currency];
    const planned = draft.base[currency] + delta;

    let preview;
    if (delta === 0) {
      preview = `${current}`;
    } else if (stale) {
      preview = `현재 ${current}<br>편집 ${draft.base[currency]} → ${planned} (${delta > 0 ? '+' : ''}${delta})`;
    } else {
      preview = `${current} → <strong>${planned}</strong>`;
    }

    return `
      <div class="wallet-edit-row" style="grid-template-columns: 32px minmax(0, 1fr) 72px;">
        <div class="wallet-currency-label" title="${CURRENCY_LABEL[currency]}" style="display:flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:50%; background:var(--${currency === 'cleanCredit' ? 'clean' : currency}); color:var(--text);">
          ${ICON[currency].replace('<svg ', '<svg style="width:18px;height:18px;" ')}
        </div>
        <div class="wallet-balance-preview num" style="text-align:center;">${preview}</div>
        <div class="wallet-edit-buttons">
          <input
            type="number"
            inputmode="numeric"
            class="input num wallet-delta-input"
            value="${delta}"
            aria-label="${esc(`${walletName(ref)}${CURRENCY_LABEL[currency]} 변경 수량`)}"
            ${onChange('walletStepInput', { ref: key, currency })}
          >
        </div>
      </div>
    `;
  }).join('');

  const reasonId = walletControlId(ref, 'reason');
  const reasonInput = Input(reasonId, {
    value: draft.reason,
    placeholder: '사유 (예: 발표 우수)',
    maxlength: 100,
    live: 'walletReasonInput',
  }).replace('<input ', `<input data-wallet-ref="${esc(key)}" `);

  const hasBalance = CURRENCIES.some((currency) => wallet[currency] > 0);

  const body = `
    ${stale ? '<div class="wallet-stale-note">실제 잔고가 바뀌었어요. 되돌리기를 눌러 주세요.</div>' : ''}
    <div class="wallet-edit-list">${rows}</div>
    ${!isStudent ? '<p class="wallet-draft-note">금고의 + 조정은 새로 발행하고, − 조정은 소멸시켜요.</p>' : ''}
    <div class="wallet-reason">${Field('사유 (필수)', reasonId, reasonInput)}</div>
    <div class="wallet-card-actions">
      ${Button({ label: '반영', act: 'walletApply', args: { ref: key }, cls: 'btn-primary btn-sm', disabled: !dirty || stale })}
      ${Button({ label: '되돌리기', act: 'walletReset', args: { ref: key }, cls: 'btn-ghost btn-sm' })}
      ${Button({ label: '몰수', act: 'walletConfiscateAsk', args: { ref: key }, cls: 'btn-danger btn-sm', disabled: !hasBalance })}
    </div>
  `;

  return Card({
    title: walletName(ref),
    cls: `wallet-card ${dirty ? 'is-dirty' : ''}`,
    right: TeamBadge(isStudent ? student.teamId : ref.id) + (dirty ? Badge('반영 전', 'badge-warn') : ''),
    body,
  });
}

function renderWalletManagement() {
  const filter = ui.walletFilter;
  const query = String(filter.query || '').trim().toLocaleLowerCase('ko');

  const students = activeStudents().filter((student) => {
    const teamMatches = filter.teamId === 'all' || student.teamId === filter.teamId;
    const nameMatches = !query || student.name.toLocaleLowerCase('ko').includes(query);
    return teamMatches && nameMatches;
  });

  const dirtyCount = dirtyWalletDraftCount();

  const filters = Card({
    title: '재화 개별 관리',
    right: dirtyCount ? Badge(`반영 전 ${dirtyCount}개`, 'badge-warn') : '',
    body: `
      <div class="wallet-filter-grid">
        ${Field('학생 팀', 'walletTeamFilter', Select('walletTeamFilter', [{ value: 'all', label: '전체 팀' }, ...TEAM_IDS.map((teamId) => ({ value: teamId, label: `${TEAM_LABEL[teamId]}팀` }))], filter.teamId, 'walletTeamFilter'))}
        ${Field('학생 이름 검색', 'walletNameSearch', Input('walletNameSearch', { value: filter.query, placeholder: '이름을 입력해 주세요', live: 'walletSearchInput' }))}
      </div>
      <div class="hstack">
        ${Button({ label: '전체 학생 보기', act: 'walletClearFilters', cls: 'btn-ghost btn-sm' })}
      </div>
    `,
  });

 const studentCards = students.length
    ? `<div class="wallet-grid">${students.map((student) => WalletManagementCard(userRef(student.id))).join('')}</div>`
    : EmptyState('조건에 맞는 학생이 없어요');

  const vaultCards = `<div class="wallet-grid">${TEAM_IDS.map((teamId) => WalletManagementCard(vaultRef(teamId))).join('')}</div>`;

  return `
    ${filters}
    <section class="console-section">
      <h2 class="console-section-heading">학생 지갑 (${students.length}명)</h2>
      ${studentCards}
    </section>
    <section class="console-section">
      <h2 class="console-section-heading">팀 금고 (5개)</h2>
      ${vaultCards}
    </section>
  `;
}function renderTeacherTradeManagement() {
  const open = state.trades
    .filter((trade) => trade.status === 'open')
    .slice()
    .reverse();

  const accepted = state.trades
    .filter((trade) => trade.status === 'accepted')
    .slice()
    .reverse()
    .slice(0, 30);

  const others = state.trades
    .filter(
      (trade) =>
        !['open', 'accepted'].includes(trade.status)
    )
    .slice()
    .reverse()
    .slice(0, 20);

  const selectedReason = ui.filters.caReason || '학기 정리';

  const cancelAllControls = open.length
    ? `
      <div class="hstack" style="margin-bottom:12px">
        ${
          Select(
            'caReason',
            [
              { value: '학기 정리', label: '학기 정리' },
              { value: '규칙 변경', label: '규칙 변경' },
              {
                value: '문제 거래 정리',
                label: '문제 거래 정리',
              },
              {
                value: '기타',
                label: '기타(직접 입력)',
              },
            ],
            selectedReason,
            'caReasonChange'
          ).replace(
            'class="select"',
            'class="select" style="width:auto"'
          )
        }

        ${
          selectedReason === '기타'
            ? Input('caReasonText', {
                placeholder: '사유 입력',
                maxlength: 100,
              }).replace(
                'class="input"',
                'class="input" style="flex:1"'
              )
            : ''
        }

        ${Button({
          label: `미체결 거래 모두 취소 (${open.length}건)`,
          act: 'tradesCancelAllAsk',
          cls: 'btn-warn',
        })}
      </div>
    `
    : '';

  return (
    Card({
      title: '미체결 거래',
      right: Badge(
        `${open.length}건`,
        open.length ? 'badge-warn' : 'badge-outline'
      ),
      body:
        cancelAllControls +
        (
          open.length
            ? open.map((trade) =>
                TradeRow(
                  trade,
                  Button({
                    label: '이 거래 취소',
                    act: 'tradeCancelTeacher',
                    args: { id: trade.id },
                    cls: 'btn-sm btn-ghost',
                  })
                )
              ).join('')
            : EmptyState('미체결 거래가 없어요')
        ),
    }) +
    Card({
      title: '체결된 거래 (최근 30건)',
      body: accepted.length
        ? accepted.map((trade) =>
            TradeRow(
              trade,
              Button({
                label: '롤백',
                act: 'openRollback',
                args: { id: trade.id },
                cls: 'btn-sm btn-danger',
              })
            )
          ).join('')
        : EmptyState('체결된 거래가 없어요'),
    }) +
    Card({
      title: '취소·거절·롤백된 거래 (최근 20건)',
      body: others.length
        ? others.map((trade) => TradeRow(trade)).join('')
        : EmptyState('기록이 없어요'),
    })
  );
}

function renderTeacherManage() {
  const tab = ['wallets', 'trades', 'bank'].includes(
    ui.teacherTab.manage
  )
    ? ui.teacherTab.manage
    : 'wallets';

  ui.teacherTab.manage = tab;

  const tabs = Tabs(
    [
      {
        key: 'wallets',
        label: '재화 개별 관리',
      },
      {
        key: 'trades',
        label: '거래 관리',
        count: state.trades.filter(
          (trade) => trade.status === 'open'
        ).length,
      },
      {
        key: 'bank',
        label: '화이트 은행 관리',
        count: pendingRequests({ type: 'bankProductProposal' }).length,
      }
    ],
    tab,
    'mgTab'
  );

  return tabs + (
    tab === 'trades' ? renderTeacherTradeManagement() : 
    tab === 'bank' ? renderTeacherBank() : 
    renderWalletManagement()
  );
}
Object.assign(ACTIONS, {
  mgTab({ key }) {
    if (!['wallets', 'trades', 'bank'].includes(key)) return;
    if (ui.teacherTab.manage === key) return;

    guardWalletNavigation(() => {
      ui.teacherTab.manage = key;
      ui.picker.clear();
      render();
    });
  },

  walletTeamFilter({ value }) {
    ui.walletFilter.teamId = TEAM_IDS.includes(value)
      ? value
      : 'all';

    render();
  },

  walletSearchInput({ value }, element) {
    const selectionStart = element.selectionStart;
    const selectionEnd = element.selectionEnd;

    ui.walletFilter.query = value;

    render();

    const replacement = $('#walletNameSearch');

    if (replacement) {
      replacement.focus({ preventScroll: true });

      if (
        selectionStart !== null &&
        selectionEnd !== null
      ) {
        replacement.setSelectionRange(
          selectionStart,
          selectionEnd
        );
      }
    }
  },

  walletStepInput({ ref: key, currency, value }) {
    if (!isTeacher()) return;
    const ref = parseRef(key);
    if (!ref) return;
    const draft = getWalletDraft(ref);
    draft.deltas[currency] = toInt(value) || 0;
    render();
  },

  walletClearFilters() {
    ui.walletFilter.teamId = 'all';
    ui.walletFilter.query = '';
    render();
  },

  walletReasonInput({ value }, element) {
    if (!isTeacher()) return;

    const ref = parseRef(element.dataset.walletRef);
    if (!ref) return;

    const draft = getWalletDraft(ref);
    draft.reason = value;
  },

  walletSourceMode({ ref: key, value }) {
    if (!isTeacher()) return;
    if (!['mint', 'vaultToUser'].includes(value)) return;

    const ref = parseRef(key);
    if (!ref || ref.kind !== 'user') return;

    const draft = getWalletDraft(ref);
    readWalletReason(ref);
    draft.sourceMode = value;

    render();
  },

  walletSourceTeam({ ref: key, value }) {
    if (!isTeacher()) return;
    if (!TEAM_IDS.includes(value)) return;

    const ref = parseRef(key);
    if (!ref || ref.kind !== 'user') return;

    const draft = getWalletDraft(ref);
    readWalletReason(ref);
    draft.sourceTeam = value;

    render();
  },

  walletStep({ ref: key, currency, step }) {
    if (!isTeacher()) return;
    if (!CURRENCIES.includes(currency)) return;
    if (![-5, -1, 1, 5].includes(step)) return;

    const ref = parseRef(key);
    if (!ref) return;

    const draft = getWalletDraft(ref);
    readWalletReason(ref);

    if (
      walletDraftHasChanges(draft) &&
      walletDraftIsStale(ref, draft)
    ) {
      Toast(
        '잔고가 바뀌었어요. 되돌리기를 누르고 다시 조정해 주세요',
        'warn'
      );
      return;
    }

    const nextDelta = draft.deltas[currency] + step;
    const nextBalance = draft.base[currency] + nextDelta;

    if (
      !Number.isSafeInteger(nextDelta) ||
      !Number.isSafeInteger(nextBalance)
    ) {
      Toast('수량이 너무 커요', 'warn');
      return;
    }

    if (nextBalance < 0) {
      Toast('잔고는 0보다 작아질 수 없어요', 'warn');
      return;
    }

    draft.deltas[currency] = nextDelta;
    render();
  },

  walletReset({ ref: key }) {
    if (!isTeacher()) return;

    const ref = parseRef(key);
    if (!ref) return;

    resetWalletDraft(ref);
    render();
    Toast('변경을 되돌렸어요', 'success');
  },

  walletApply({ ref: key }) {
    if (!isTeacher()) return;

    const ref = parseRef(key);
    if (!ref) return;

    const draft = getWalletDraft(ref);
    const reason = readWalletReason(ref);

    const result = applyWalletChanges({
      ref,
      base: { ...draft.base },
      deltas: { ...draft.deltas },
      reason,
      sourceMode: draft.sourceMode,
      sourceTeam: draft.sourceTeam,
    });

    if (!result.ok) return;

    resetWalletDraft(ref);
    render();

    Toast(
      `${walletName(ref)}의 재화 변경을 반영했어요`,
      'success'
    );
  },

  walletConfiscateAsk({ ref: key }) {
    if (!isTeacher()) return;

    const ref = parseRef(key);
    if (!ref) return;

    const reason = readWalletReason(ref).trim();

    if (!reason) {
      Toast('몰수 사유를 입력해 주세요', 'warn');
      return;
    }

    if (reason.length > 100) {
      Toast('사유는 100자 이내로 적어 주세요', 'warn');
      return;
    }

    const draft = getWalletDraft(ref);

    const draftNotice = walletDraftHasChanges(draft)
      ? '\n이 카드의 반영 전 변경은 버리고 실제 잔고를 몰수해요.'
      : '';

    Confirm(
      '전액 몰수',
      `${walletName(ref)}의 모든 재화를 몰수할까요?\n` +
      `사유: ${reason}\n` +
      '라이프·크레딧·무공해 크레딧·포인트·골드가 모두 0이 돼요.' +
      draftNotice +
      '\n되돌릴 수 없어요.',
      'walletConfiscateDo',
      {
        ref: key,
        reason,
      },
      'btn-danger',
      '전액 몰수'
    );
  },

  walletConfiscateDo({ ref: key, reason }) {
    if (!isTeacher()) return;

    const ref = parseRef(key);
    if (!ref) return;

    const result = ref.kind === 'user'
      ? confiscateAll(ref.id, reason)
      : confiscateVault(ref.id, reason);

    if (!result.ok) return;

    resetWalletDraft(ref);
    closeModal();
    render();

    Toast('전 재화를 몰수했어요', 'warn');
  },

  caReasonChange({ value }) {
    ui.filters.caReason = value;
    refresh();
  },

  tradeCancelTeacher({ id }) {
    const result = cancelTrade(
      id,
      TEACHER_ID,
      '선생님 취소'
    );

    if (result.ok) {
      Toast('거래를 취소했어요', 'success');
    }
  },

  tradesCancelAllAsk() {
    const selected = val('caReason');

    const reason = selected === '기타'
      ? val('caReasonText').trim()
      : selected;

    if (!reason) {
      Toast('사유를 입력해 주세요', 'warn');
      return;
    }

    Confirm(
      '미체결 거래 모두 취소',
      `미체결 거래를 모두 취소할까요?\n사유: ${reason}`,
      'tradesCancelAllDo',
      { reason },
      'btn-warn',
      '모두 취소'
    );
  },

  tradesCancelAllDo({ reason }) {
    const result = cancelAllOpenTrades(reason);

    if (result.ok) {
      closeModal();
      Toast(
        `${result.result}건을 취소했어요`,
        'success'
      );
    }
  },

  openRollback({ id }) {
    const trade = getTrade(id);

    const missingUser = [trade.proposer, trade.counterpart].some(
      (ref) =>
        ref?.kind === 'user' &&
        !state.users[ref.id]
    );

    if (missingUser) {
      Toast(
        '거래한 학생이 삭제되어 이 거래를 되돌릴 수 없어요. 이력은 그대로 남아 있어요.',
        'warn'
      );
      return;
    }

    Modal({
      title: '거래 롤백',
      body: `
        ${TradeRow(trade)}

        <p class="help" style="margin:8px 0">

}function noticeCategoryFrom(prefix) { const v = val(`${prefix}Cat`); if (v === '__new') { const c = val(`${prefix}CatNew`).trim(); if (!c) throw new Error('새 카테고리 이름을 입력해 주세요'); return c; } return v || '기타'; }

});
function captureNoticePageInputs() {

}

function restoreNoticePageInputs(inputs) {

}

Object.assign(ACTIONS, {

function historyFilter() {
  if (!ui.filters.hist) {
    ui.filters.hist = {
      userId: '',
      currency: '',
      type: '',
      fromDate: '',
      toDate: '',
    };
  }

  return ui.filters.hist;
}
function historyStudentOptions() {
  const currentStudents = activeStudents();

  const historicalIds = new Set();

  state.transactions.forEach((transaction) => {
    [
      transaction.from,
      transaction.to,
      transaction.feePayer,
    ].forEach((ref) => {
      if (ref?.kind === 'user' && ref.id) {
        historicalIds.add(ref.id);
      }
    });
  });

  const deletedIds = [...historicalIds]
    .filter((id) => !state.users[id])
    .sort();

  return [
    {
      value: '',
      label: '전체 학생',
    },

    ...currentStudents.map((student) => ({
      value: student.id,
      label:
        `${student.name} ` +
        `(${TEAM_LABEL[student.teamId]})`,
    })),

    ...deletedIds.map((id, index) => ({
      value: id,
      label:
        deletedIds.length === 1
          ? '(삭제된 학생)'
          : `(삭제된 학생) · 기록 ${index + 1}`,
    })),
  ];
}

function OfflinePayStatisticsCard() {
  const grouped = new Map();

  state.transactions
    .filter(
      (transaction) => transaction.type === 'offlinePay'
    )
    .forEach((transaction) => {
      const dateKey = transaction.dateKey;

      if (!grouped.has(dateKey)) {
        grouped.set(dateKey, {
          dateKey,
          count: 0,
          credit: 0,
          cleanCredit: 0,
          total: 0,
        });
      }

      const row = grouped.get(dateKey);

      row.count += 1;
      row.total += transaction.amount;

      if (transaction.currency === 'credit') {
        row.credit += transaction.amount;
      } else if (transaction.currency === 'cleanCredit') {
        row.cleanCredit += transaction.amount;
      }
    });

  const days = [...grouped.values()].sort(
    (a, b) => b.dateKey.localeCompare(a.dateKey)
  );

  const totalAmount = sum(days, (day) => day.total);
  const totalCount = sum(days, (day) => day.count);

  return Card({
    title: '일별 크레딧 자율 지불 합계',
    right: Badge(
      `전체 ${totalCount}건 · ${totalAmount}크레딧`,
      'badge-credit'
    ),
    body: days.length

function transactionsToCsv(list) {
  const head = ['일시', '날짜키', '유형', '보낸 곳', '받은 곳', '재화', '수량', '수수료', '수수료 재화', '공해 변동', '메모', '처리자'];
  const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = list.map((t) => [formatDateTime(t.createdAt), t.dateKey, TX_TYPE_LABEL[t.type] || t.type, walletName(t.from), walletName(t.to), CURRENCY_LABEL[t.currency], t.amount, t.fee || 0, t.feeCurrency ? CURRENCY_LABEL[t.feeCurrency] : '', t.pollutionDelta || 0, t.memo, actorName(t.createdBy)].map(q).join(','));
  return '\uFEFF' + [head.map(q).join(','), ...rows].join('\n');
}Object.assign(ACTIONS, {
  teacherHistoryTab({ key }) {
    if (!['transactions', 'statistics'].includes(key)) {
      return;
    }

    guardWalletNavigation(() => {
      ui.teacherTab.history = key;
      render();
    });
  },

  histSet({ k, value }) {
    if (
      ![
        'userId',
        'currency',
        'type',
        'fromDate',
        'toDate',
      ].includes(k)
    ) {
      return;
    }

    const filter = historyFilter();
    const previous = filter[k];

    filter[k] = value;

    if (
      filter.fromDate &&
      filter.toDate &&
      filter.fromDate > filter.toDate
    ) {
      filter[k] = previous;
      Toast(
        '시작일은 종료일보다 늦을 수 없어요',
        'warn'
      );
    }

    render();
  },

  histToday() {
    const filter = historyFilter();
    const today = getDateKey();

    filter.fromDate = today;
    filter.toDate = today;

    render();
  },

  histReset() {
    ui.filters.hist = null;
    render();
  },

  histCsv() {
    if (!isTeacher()) return;

    const filter = historyFilter();

    const transactions = filterTransactions({
      userId: filter.userId || null,
      currency: filter.currency || null,
      type: filter.type || null,
      fromDate: filter.fromDate || null,
      toDate: filter.toDate || null,
    });

    const blob = new Blob(
      [transactionsToCsv(transactions)],
      { type: 'text/csv;charset=utf-8' }
    );

    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');

    anchor.href = url;
    anchor.download = `학급경제_이력_${getDateKey()}.csv`;

    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();

    setTimeout(() => {
      URL.revokeObjectURL(url);
    }, 1000);

    Toast(
      `${transactions.length}건을 CSV로 내려받았어요`,
      'success'
    );
  },
});

// 2. 렌더링 함수 (교사 조율 이자 최우선 반영 공통 헬퍼)
function getAccountInterest(a, p) {
  if (!a || !p) return 0;
  if (a.customInterest !== undefined && a.customInterest !== null && Number.isFinite(Number(a.customInterest))) {
    return Math.max(0, Math.trunc(Number(a.customInterest)));
  }
  if (p.type === 'bond') {
    return Math.max(0, Number(a.customFaceValue ?? p.faceValue ?? 0) - Number(a.principal || 0));
  }
  if (p.type === 'fund') return 0;
  const baseRate = Number(p.interestRate || 0);
  const baseAmt = Math.max(1, Number(p.amount || 1));
  const joinAmt = Number(a.joinAmount || baseAmt);
  const targetPrin = Number(a.targetPrincipal || joinAmt);
  return p.interestType === 'point'
    ? Math.floor(baseRate * (joinAmt / baseAmt))
    : Math.floor(targetPrin * (baseRate / 100));
}

function formatAccountInterestLabel(a, p) {
  if (!a || !p) return '';
  const curInt = getAccountInterest(a, p);
  if (a.customInterest !== undefined && a.customInterest !== null) {
    return `확정 이자 ${curInt}P (선생님 조율)`;
  }
  if (p.type === 'bond') {
    const face = Number(a.customFaceValue ?? p.faceValue ?? 0);
    return `만기 액면가 ${face}P (수익 +${curInt}P)`;
  }
  if (p.interestType === 'point') {
    return `약정 이자 ${curInt}P (정액)`;
  }
  return `약정 이율 ${Number(p.interestRate || 0)}% (이자 +${curInt}P)`;
}

      else btnHtml = `<div class="hstack" style="width:100%;">${Button({ label: '거래소에 팔기', act: 'bondSellAsk', args: { id: a.id }, cls: 'btn-ghost btn-sm' }).replace('class="btn ', 'class="btn " style="flex:1;"')}</div>`;
    }

        </div>
      </div>
    `;
  }).join('');

  const portfolioBody = myAccs.length ? `<div class="coupon-grid" style="margin-bottom:24px;">${portfolioCards}</div>` : EmptyState('가입한 상품이 없어요');

  const showHistory = !!ui.filters.showBankHistory;
  const historyRows = historyAccs.map(a => {
    const p = state.bankProducts.find(x => x.id === a.productId) || { name: '삭제된 상품', type: 'unknown' };
    const isClaimed = a.status === 'claimed';
    const badgeLabel = isClaimed ? (p.type === 'fund' ? '결과 정산됨' : '만기 수령') : (a.userId !== u.id ? '양도됨' : '중도 해지');
    const statusBadge = Badge(badgeLabel, isClaimed ? 'badge-clean' : 'badge-outline');
    
    let received = a.principal;
    let isSuccess = null;

    if (isClaimed) {
      if (p.type === 'deposit' || p.type === 'savings') {
        const interest = getAccountInterest(a, p);
        received = Number(a.principal || 0) + interest;
      } else if (p.type === 'bond') {
        received = Number(a.customFaceValue ?? p.faceValue ?? 0);
      } else if (p.type === 'fund') {
        const tx = state.transactions.slice().reverse().find(t => t.to && t.to.id === a.userId && t.memo && t.memo.includes(p.name) && (t.memo.includes('펀드 성공') || t.memo.includes('펀드 실패')));
        if (tx) {
          received = tx.amount;
          isSuccess = tx.memo.includes('성공');
        }
      }
    }
    
    const profit = received - a.principal;
    const yieldPct = a.principal > 0 ? Math.round((profit / a.principal) * 100) : 0;
    const yieldHtml = `<span style="color:${profit > 0 ? 'var(--clean)' : profit < 0 ? 'var(--danger)' : 'var(--muted)'};">수익률 ${profit > 0 ? '+' : ''}${yieldPct}%</span>`;
    const profitHtml = `<span style="color:${profit > 0 ? 'var(--clean)' : profit < 0 ? 'var(--danger)' : 'var(--muted)'}; font-weight:bold;">수익금 ${profit > 0 ? '+' : ''}${profit}P</span>`;

    let detailText = '';
    if (isClaimed) {
      if (p.type === 'fund') {
         detailText = `투자금 ${a.principal}P · <strong>${isSuccess ? '미션 성공! 🎉' : (isSuccess === false ? '미션 실패 😢' : '정산 완료')}</strong><br>${profitHtml} (${yieldHtml}) = <strong>총 ${received}P 수령</strong>`;
      } else {
         detailText = `투자금(구매가) ${a.principal}P<br>${profitHtml} (${yieldHtml}) = <strong>총 ${received}P 수령</strong>`;
      }
    } else {
      if (a.userId !== u.id) detailText = `구매가 ${a.principal}P · <strong>거래소를 통해 양도됨</strong>`;
      else detailText = `투자금 ${a.principal}P 반환 <span class="muted">(중도 해지)</span>`;
    }

    return Row(`${esc(p.name)} ${statusBadge}`, `${detailText}<br><span class="muted">가입일: ${a.joinedAt.split('T')[0]}</span>`);
  }).join('');

  const historySection = `
    <div style="margin-top:24px; padding-top:16px; border-top:1px dashed var(--border);">
      <div class="hstack between" style="margin-bottom:12px;">
        <span class="label">종료된 상품 기록</span>
        ${Button({ label: showHistory ? '기록 숨기기' : '기록 보기', act: 'toggleBankHistory', cls: 'btn-sm btn-ghost' })}
      </div>
      ${showHistory ? (historyAccs.length ? historyRows : EmptyState('종료된 기록이 없어요')) : ''}
    </div>
  `;

  return tabs + Card({ title: '나의 투자 현황', body: portfolioBody + historySection });
}
function renderWhiteBankDashboard(u) {
  const vaultPoint = getTeam('white').vault.point;
  const activeAccs = state.bankAccounts.filter(a => ['active', 'matured', 'pendingClaim'].includes(a.status));
  const totalPrincipal = sum(activeAccs, a => a.principal);
  const calcInt = (a, p) => getAccountInterest(a, p);
  const totalExpectedInterest = sum(activeAccs, a => calcInt(a, state.bankProducts.find(p=>p.id===a.productId)));
  const isAlarm = vaultPoint < totalExpectedInterest;

  const stats = {};
  activeAccs.forEach(a => {
    const p = state.bankProducts.find(x=>x.id===a.productId);
    if(!stats[a.bankerId]) stats[a.bankerId] = { principal: 0, interest: 0, count: 0 };
    stats[a.bankerId].principal += a.principal;
    stats[a.bankerId].interest += calcInt(a, p);
    stats[a.bankerId].count += 1;
  });

  const bankerRows = Object.entries(stats).sort((a, b) => b[1].principal - a[1].principal).map(([bId, s]) => {
    const name = state.users[bId]?.name || '알 수 없음';
    return Row(

        0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); transform: scale(1); }

    <div style="background:var(--clean); color:white; padding:16px; border-radius:12px; text-align:center; margin-bottom:24px; font-weight:bold; font-size:18px; box-shadow: 0 4px 10px rgba(52,199,89,0.3);">

  return Card({ title: '🏦 화이트 은행 통합 전광판', body: `
    ${alarmHtml}
    <div class="grid-3" style="margin-bottom:24px;">
      <div style="padding:20px 12px; border-radius:12px; background:var(--bg); border:1px solid var(--border); text-align:center;">
        <div class="muted" style="margin-bottom:8px; font-size:13px;">화이트팀 금고 잔액</div>
        <div style="font-size:28px; font-weight:900; color:var(--primary);">${vaultPoint}P</div>
      </div>
      <div style="padding:20px 12px; border-radius:12px; background:var(--bg); border:1px solid var(--border); text-align:center;">
        <div class="muted" style="margin-bottom:8px; font-size:13px;">전체 예치 원금</div>
        <div style="font-size:28px; font-weight:900; color:var(--text);">${totalPrincipal}P</div>
      </div>
      <div style="padding:20px 12px; border-radius:12px; background:var(--bg); border:1px solid var(--border); text-align:center;">
        <div class="muted" style="margin-bottom:8px; font-size:13px;">지급 예정 총 이자</div>

    <div style="font-weight:bold; font-size:16px; margin-bottom:12px; color:var(--text);">📊 동료 행원별 영업 실적 공유</div>
    <div style="background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:8px;">

}

    dynamicFields = `
      <div class="grid-2">
        ${Field('3. 1구좌 투자금(P)', 'bpAmt', Input('bpAmt', {type:'number', value:10, min:1}))}

        ${Field('6. 성공 보상', 'bpSucc', `<div class="hstack" style="gap:4px;">${Input('bpSucc', {type:'number', value:5, min:0}).replace('class="input"','class="input" style="flex:1"')}${Select('bpSuccType', [{value:'point', label:'P'}, {value:'percent', label:'%'}], 'point').replace('class="select"','class="select" style="width:60px; min-height:36px; padding:0 4px;"')}</div>`)}
        ${Field('7. 실패 손실', 'bpFail', `<div class="hstack" style="gap:4px;">${Input('bpFail', {type:'number', value:5, min:0}).replace('class="input"','class="input" style="flex:1"')}${Select('bpFailType', [{value:'point', label:'P'}, {value:'percent', label:'%'}], 'point').replace('class="select"','class="select" style="width:60px; min-height:36px; padding:0 4px;"')}</div>`)}
      </div>

    if(!p) return '';
    const end = new Date(new Date(a.joinedAt).getTime() + a.duration * 86400000);
    const dDay = Math.max(0, Math.ceil((end - new Date()) / 86400000));
    const isMatured = a.status === 'matured' || dDay === 0;
    const isPending = a.status === 'pendingClaim';

    let icon = '', typeBadge = '', detail = '';
    const interestInfo = esc(formatAccountInterestLabel(a, p));
    if (p.type === 'deposit') {
      icon = '⏳'; typeBadge = Badge('예금', 'badge-point');
      detail = `${interestInfo} · ${isPending ? '<strong style="color:var(--danger)">지급 요청됨!</strong>' : isMatured ? '<strong style="color:var(--clean)">만기 달성</strong>' : `만기 D-${dDay}`}`;
    } else if (p.type === 'savings') {
      icon = '🎯'; typeBadge = Badge('적금', 'badge-clean');
      const unitAmt = Math.max(1, Number(a.joinAmount || p.amount || 1));
      const curStamps = Math.floor(Number(a.principal || 0) / unitAmt);
      detail = `${interestInfo} · 납입 <strong style="color:var(--clean)">${curStamps}/${p.duration}회</strong>${isPending ? ' · <strong style="color:var(--danger)">지급 요청됨!</strong>' : ''}`;

  return proposeCard + bankerGaugeCard + Card({ title: '내 고객 관리', body: clientCards || EmptyState('아직 나를 지명한 고객이 없어요') });
