/** 쿠폰 사용 → couponRedeem 요청(효과별 담당자 확인). payload로 투표 선택·이동 팀 전달 */
function redeemCoupon(userId, couponId, payload = {}) {
  return runTx(() => {
    const student = getUser(userId);

    const coupon = student.coupons.find(
      (candidate) => candidate.id === couponId
    );

    if (!coupon) {
      throw new Error('쿠폰을 찾을 수 없어요');
    }

    if (couponStatus(coupon) !== 'unused') {
      throw new Error('사용할 수 없는 쿠폰이에요');
    }

    const requestPayload = {
      couponId,
      couponName: coupon.name,
      effectType: coupon.effectType,
      effectAmount: coupon.effectAmount,
    };

    if (coupon.effectType === 'teamChange') {
      if (
        !TEAM_IDS.includes(payload.toTeamId) ||
        payload.toTeamId === student.teamId
      ) {
        throw new Error('이동할 팀을 선택해 주세요');
      }

      requestPayload.toTeamId = payload.toTeamId;
    }

    coupon.status = 'pendingRedeem';

    const request = createRequest({
      type: 'couponRedeem',
      fromUid: userId,
      teamId: student.teamId,
      payload: requestPayload,
    });

    const handler = effectHandler(coupon.effectType);

    if (handler !== 'teacher') {
      notifyTeam(
        handler,
        `${student.name}이(가) 쿠폰 "${coupon.name}" 사용을 요청했어요. 확인해 주세요.`,
        'info',
        {
          requestId: request.id,
          type: 'couponRedeem',
        }
      );
    }

    return request;
  });
}
function applyCouponEffect(request, actor, extra = {}) {
  const student = getUser(request.fromUid);

  const coupon = student.coupons.find(
    (candidate) => candidate.id === request.payload.couponId
  );

  if (!coupon) {
    throw new Error('쿠폰을 찾을 수 없어요');
  }

  if (coupon.status !== 'pendingRedeem') {
    throw new Error('사용 대기 중인 쿠폰이 아니에요');
  }

  switch (coupon.effectType) {
    case 'pollutionReduce': {
      const reduction = Math.abs(coupon.effectAmount || 0);

      applyPollution(
        -reduction,
        `쿠폰 사용: ${coupon.name} (${student.name})`,
        'coupon',
        { requestId: request.id }
      );

      notifyAllStudents(
        `${student.name}이(가) "${coupon.name}"을(를) 사용해 공해 지수가 ${reduction} 내려갔어요.`,
        'success'
      );

      break;
    }

    case 'teamChange': {
      const nextTeamId = request.payload.toTeamId;

      if (
        !TEAM_IDS.includes(nextTeamId) ||
        nextTeamId === student.teamId
      ) {
        throw new Error('이동할 팀을 다시 확인해 주세요');
      }

      const teamRequest = createRequest({
        type: 'teamChange',
        fromUid: student.id,
        teamId: student.teamId,
        payload: {
          toTeamId: nextTeamId,
          couponId: coupon.id,
        },
      });

      notify(
        student.id,
        `팀 이동 요청이 선생님께 전달되었어요. (→ ${TEAM_LABEL[nextTeamId]}팀)`,
        'info',
        { requestId: teamRequest.id }
      );

      break;
    }

    default:
      // 확인만·숙제 면제·기타 효과는 담당자 확인으로 완료합니다.
      break;
  }

  coupon.status = 'used';
  coupon.usedAt = nowISO();
  coupon.usedBy = actor;

  notify(
    student.id,
    `쿠폰 "${coupon.name}" 사용이 확인되었어요.${
      extra.memo ? ` (${extra.memo})` : ''
    }`,
    'success'
  );
}

/** 교사 수동 공해 조정. preset: noise | leaderMiss | manual */
function adjustPollutionManual(
  preset,
  {
    delta = 0,
    reason = '',
    teamIds = [],
    count = 0,
  } = {}
) {
  return runTx(() => {
    if (!isTeacher()) {
      throw new Error('선생님만 공해를 조정할 수 있어요');
    }

    const settings = state.settings;
    let change;
    let text;
    let reference = {};

    if (preset === 'noise') {
      change = settings.noiseDelta;
      text = reason
        ? `교실 소음 (${String(reason).trim()})`
        : '교실 소음';
    } else if (preset === 'leaderMiss') {
      const selected = [
        ...new Set(
          (teamIds || []).filter((teamId) =>
            TEAM_IDS.includes(teamId)
          )
        ),
      ];

      if (!selected.length) {
        throw new Error('팀을 1개 이상 선택해 주세요');
      }

      change = settings.leaderMissDelta * selected.length;

      text =
        '팀장 미승인: ' +
        selected
          .map((teamId) => `${TEAM_LABEL[teamId]}팀`)
          .join(', ');

      reference = {
        teamIds: selected,
        unitDelta: settings.leaderMissDelta,
      };
    } else if (preset === 'duty') {
      const people = Number(count);

      if (!Number.isSafeInteger(people) || people < 1) {
        throw new Error('인원수는 1 이상의 정수로 입력해 주세요');
      }

      change = people * settings.dutyMissDelta;

      if (!Number.isSafeInteger(change)) {
        throw new Error('인원수가 너무 커요. 다시 확인해 주세요');
      }

      text =
        `1인1역 미실시 ${people}명 ` +
        `(직접 입력, 1명당 ${settings.dutyMissDelta})`;

      reference = {
        count: people,
        unitDelta: settings.dutyMissDelta,
        manual: true,
      };
    } else if (preset === 'manual') {
      change = Number(delta);

      if (!Number.isSafeInteger(change) || change === 0) {
        throw new Error('0이 아닌 정수를 입력해 주세요');
      }

      text = assertReason(reason, 100);
    } else {
      throw new Error('공해 조정 방법을 선택해 주세요');
    }

    if (change !== 0) {
      applyPollution(change, text, preset, reference);

      notifyAllStudents(
        change > 0
          ? `선생님이 공해 지수를 ${change}만큼 올렸어요(${text})`
          : `선생님이 공해 지수를 ${-change}만큼 내렸어요(${text})`,
        change > 0 ? 'warn' : 'success'
      );
    }

    return change;
  });
}

function addStudents(namesText, teamId) {
  return runTx(() => {
    if (!isTeacher()) {
      throw new Error('선생님만 학생을 추가할 수 있어요');
    }

    if (!TEAM_IDS.includes(teamId)) {
      throw new Error('팀을 선택해 주세요');
    }

    const names = String(namesText || '')
      .split('\n')
      .map((name) => name.trim())
      .filter(Boolean);

    if (!names.length) {
      throw new Error('이름을 한 줄에 하나씩 입력해 주세요');
    }

    const created = names.map((name) => {
      const id = `s_${uid().slice(3)}`;

      const student = makeUser(
        id,
        name,
        teamId,
        state.settings
      );

      state.users[id] = student;
      return student;
    });

    const team = getTeam(teamId);

    if (!team.leaderUid) {
      team.leaderUid = created[0].id;

      team.leaderHistory.push({
        uid: created[0].id,
        fromUid: null,
        by: TEACHER_ID,
        at: nowISO(),
        memo: '첫 팀원 자동 팀장',
      });
    }

    return created;
  });
}
function cancelStudentHandovers(
  userId,
  actorUid = TEACHER_ID,
  reason = '학생 정보 변경으로 팀장 교체 요청 취소'
) {
  assertInTx();

  state.requests.forEach((request) => {
    if (
      request.type === 'leaderHandover' &&
      (
        request.fromUid === userId ||
        request.targetUid === userId
      )
    ) {
      cancelPendingRequest(request, actorUid, reason);
    }
  });

  TEAM_IDS.forEach((teamId) => {
    const team = getTeam(teamId);
    const handover = team.pendingHandover;

    if (
      handover &&
      (
        handover.fromUid === userId ||
        handover.toUid === userId
      )
    ) {
      const request = state.requests.find(
        (candidate) => candidate.id === handover.requestId
      );

      if (request) {
        cancelPendingRequest(request, actorUid, reason);
      }

      team.pendingHandover = null;
    }
  });
}
function updateStudent(userId, patch) {
  return runTx(() => {
    if (!isTeacher()) {
      throw new Error('선생님만 수정할 수 있어요');
    }

    const student = getUser(userId);

    if (patch.name !== undefined) {
      const name = String(patch.name).trim();

      if (!name) {
        throw new Error('이름을 입력해 주세요');
      }

      student.name = name;
    }

    if (
      patch.teamId !== undefined &&
      patch.teamId !== student.teamId
    ) {
      if (!TEAM_IDS.includes(patch.teamId)) {
        throw new Error('팀이 올바르지 않아요');
      }

      cancelStudentHandovers(
        userId,
        TEACHER_ID,
        '팀 변경으로 팀장 교체 요청 취소'
      );

      const oldTeam = getTeam(student.teamId);

      if (oldTeam.leaderUid === userId) {
        oldTeam.leaderUid = null;

        oldTeam.leaderHistory.push({
          uid: null,
          fromUid: userId,
          by: TEACHER_ID,
          at: nowISO(),
          memo: '팀 변경으로 공석',
        });
      }

      student.teamId = patch.teamId;

function deleteStudent(userId) {
  return runTx(() => {
    if (!isTeacher()) {
      throw new Error('선생님만 학생을 삭제할 수 있어요');
    }

    const student = getUser(userId);
    const name = student.name;
    const deletedAt = nowISO();

    cancelStudentHandovers(
      userId,
      TEACHER_ID,
      '학생 삭제로 팀장 교체 요청 취소'
    );

    TEAM_IDS.forEach((teamId) => {
      const team = getTeam(teamId);

      if (team.leaderUid !== userId) return;

      team.leaderUid = null;

      team.leaderHistory.push({
        uid: null,
        fromUid: userId,
        by: TEACHER_ID,
        at: deletedAt,
        memo: '학생 삭제로 팀장 공석',
      });
    });

    const cancelledTradeIds = [];

    state.trades.forEach((trade) => {
      if (trade.status !== 'open') return;

      const related =
        trade.createdBy === userId ||
        sameRef(trade.proposer, userRef(userId)) ||
        sameRef(trade.counterpart, userRef(userId));

      if (!related) return;

      trade.status = 'cancelled';
      trade.resolvedAt = deletedAt;
      trade.cancelReason = '학생 삭제로 미체결 거래 취소';

      cancelledTradeIds.push(trade.id);

      [trade.proposer, trade.counterpart].forEach((ref) => {
        if (
          ref?.kind === 'user' &&
          ref.id !== userId &&
          state.users[ref.id]
        ) {
          notify(
            ref.id,
            '거래와 관련된 학생이 삭제되어 미체결 거래를 취소했어요.',
            'warn',
            { tradeId: trade.id }
          );
        }
      });
    });

    let cancelledRequests = 0;

    state.requests.forEach((request) => {
      const related =
        request.fromUid === userId ||
        request.targetUid === userId;

      if (!related) return;

      if (
        cancelPendingRequest(
          request,
          TEACHER_ID,
          '학생 삭제로 미처리 요청 취소'
        )
      ) {
        cancelledRequests += 1;
      }
    });

    // 숙제 도우미는 별도 상태 모델이므로 따로 정리합니다.
    state.homeworkHelps.forEach((homework) => {
      const related =
        homework.requesterUid === userId ||
        homework.helperUid === userId;

      if (
        !related ||
        !['open', 'accepted', 'done'].includes(homework.status)
      ) {
        return;
      }

      homework.status = 'cancelled';
      homework.cancelledAt = deletedAt;
      homework.cancelReason = '학생 삭제로 도움 요청 취소';

      const otherUid =
        homework.requesterUid === userId
          ? homework.helperUid
          : homework.requesterUid;

      if (otherUid && otherUid !== userId) {
        notify(
          otherUid,
          '관련 학생이 삭제되어 숙제 도움 요청을 취소했어요.',
          'warn',
          { homeworkId: homework.id }
        );
      }
    });

    // 🛑 추가된 은행 시스템(학급 은행) 예치금 정리 로직 
    // 1. 전학생(삭제된 학생)이 고객으로 가입했던 예적금, 펀드, 채권 계좌를 완전히 삭제합니다.
    state.bankAccounts = state.bankAccounts.filter(account => account.userId !== userId);
    
    // 2. 만약 삭제된 전학생이 화이트팀 '행원'이었을 경우, 그 학생이 담당하던 다른 고객들의 계좌가 붕 뜨지 않도록 담당 행원을 선생님(교사)으로 이관합니다.
    state.bankAccounts.forEach(account => {
      if (account.bankerId === userId) {
        account.bankerId = TEACHER_ID;
      }
    });

    // 🛑 추가된 학급 은행 예치금 및 행원 담당자 정리 로직
    state.bankAccounts = state.bankAccounts.filter(account => account.userId !== userId);
    state.bankAccounts.forEach(account => {
      if (account.bankerId === userId) {
        account.bankerId = TEACHER_ID; // 삭제된 행원의 고객을 선생님에게 임시 이관
      }
    });

    const discardedCoupons = student.coupons.length;

    // 잔고·보유 쿠폰·알림을 포함한 학생 객체를 완전히 제거합니다.
    // 거래·승인 요청·출석 기록·로그·완료된 도움 기록은 보존합니다.
    delete state.users[userId];

    return {
      userId,
      name,
      cancelledTrades: cancelledTradeIds.length,
      cancelledRequests,
      discardedCoupons,
    };
  });
}

}/** 학생 PIN 설정(첫 로그인 강제 변경·내 정보 변경 공용). currentPin은 강제 변경 시 생략 */
async function setPin(userId, newPin, newPinConfirm, currentPin = null) {

    if ((await sha256(currentPin)) !== u.pinHash) return { ok: false, error: '현재 PIN 번호가 달라요' };

  const hash = await sha256(newPin);
  return runTx(() => { u.pinHash = hash; u.mustResetPin = false; });   // TODO: Firebase 연동
}function updateSettings(patch) {

function txInvolves(tx, ref) { return sameRef(tx.from, ref) || sameRef(tx.to, ref) || sameRef(tx.feePayer, ref); }
function getUserTransactions(userId) { const ref = userRef(userId); return state.transactions.filter((t) => txInvolves(t, ref)).sort((a, b) => b.createdAt.localeCompare(a.createdAt)); }
function filterTransactions({ userId = null, currency = null, type = null, fromDate = null, toDate = null } = {}) {
  return state.transactions.filter((t) =>
    (!userId || txInvolves(t, userRef(userId))) && (!currency || t.currency === currency) && (!type || t.type === type) &&
    (!fromDate || t.dateKey >= fromDate) && (!toDate || t.dateKey <= toDate)).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
}function getOfflinePayDailyTotals() {
  const m = {};

  return Object.entries(m).sort((a, b) => b[0].localeCompare(a[0])).map(([dateKey, total]) => ({ dateKey, total }));
}function getIssueTotals() {
  return {
    point: sum(state.transactions.filter((t) => t.type === 'pointIssue'), (t) => t.amount),
    gold: sum(state.transactions.filter((t) => t.type === 'goldIssue'), (t) => t.amount),

function getTeacherAdjustmentTotals() {
  const totals = Object.fromEntries(
    CURRENCIES.map((currency) => [
      currency,
      {
        minted: 0,
        removed: 0,
        confiscated: 0,
        distributed: 0,
        count: 0,
      },
    ])
  );

  const managementTypes = new Set([
    'adminGrant',
    'adminAdjust',
    'confiscate',
    'vaultToUser',
  ]);

  state.transactions.forEach((transaction) => {
    const row = totals[transaction.currency];

    if (!row || !managementTypes.has(transaction.type)) {
      return;
    }

    row.count += 1;

    if (transaction.type === 'vaultToUser') {
      row.distributed += transaction.amount;
      return;
    }

    if (!transaction.from && transaction.to) {
      row.minted += transaction.amount;
    }

    if (transaction.from && !transaction.to) {
      row.removed += transaction.amount;

      if (transaction.type === 'confiscate') {
        row.confiscated += transaction.amount;
      }
    }
  });

  return totals;
}

async function init() {

      // 서버에 데이터가 있으면 서버 데이터를 가져와서 적용
      state = migrateState(doc.data().value);

      // 서버에 데이터가 없으면 (최초 실행) 로컬 확인 후 새로 생성

        state = loadState() || buildSeedState(false);
        saveState(); // 만든 초기 데이터를 서버로 업로드
      }
    }

    Object.values(state.users).forEach((student) => {
      if (!student.pinHash) {
        student.pinHash = DEFAULT_PIN_HASH;
        student.mustResetPin = true;
      }
    });

    state.version = STATE_VERSION;

    session = loadSession();
    if (
      session &&
      (
        !['teacher', 'student'].includes(session.role) ||
        (session.role === 'student' && !state.users[session.uid])
      )
    ) {
      session = null;
      saveSession();
    }

    if (state.settings.pendingTaxEventId) {
      runPollutionTax(state.settings.pendingTaxEventId);
    }

    if (typeof render === 'function') {
      render();
    }
  }, (error) => {
    console.error("Firebase 실시간 동기화 에러:", error);
    // 오프라인이거나 서버 통신 실패 시 로컬 데이터로 대체 실행

      if (typeof render === 'function') render();
    }
  });
}

let measuredListFrame = 0;
const measuredListObserved = new Set();

const measuredListResizeObserver =
  typeof ResizeObserver === 'function'
    ? new ResizeObserver(() => {
        scheduleMeasuredRecordLists();
      })
    : null;

function scheduleMeasuredRecordLists() {
  if (measuredListFrame) return;

  measuredListFrame = requestAnimationFrame(() => {
    measuredListFrame = 0;
    updateMeasuredRecordLists();
  });
}

function updateMeasuredRecordLists() {
  const containers = Array.from(
    document.querySelectorAll(
      '#app [data-list-visible], #modal-root [data-list-visible]'
    )
  );

  const nextObserved = new Set();

  containers.forEach((container) => {
    if (!container.isConnected) return;

    const rows = Array.from(container.children).filter(
      (element) => element.classList.contains('row')
    );

    nextObserved.add(container);
    rows.forEach((row) => nextObserved.add(row));

    const visibleCount = Math.max(
      1,
      Number(container.dataset.listVisible) || 1
    );

    if (!container.getClientRects().length) {
      return;
    }

    if (rows.length <= visibleCount) {
      if (container.style.maxHeight !== 'none') {
        container.style.maxHeight = 'none';
      }
      return;
    }

    const containerTop = container.getBoundingClientRect().top;
    const lastVisibleBottom =
      rows[visibleCount - 1].getBoundingClientRect().bottom;

    const height = Math.max(
      0,
      lastVisibleBottom - containerTop + container.scrollTop
    );

    if (height <= 0) return;

    const nextHeight = `${height}px`;

    if (container.style.maxHeight !== nextHeight) {
      container.style.maxHeight = nextHeight;
    }
  });

  if (!measuredListResizeObserver) return;

  measuredListObserved.forEach((element) => {
    if (!nextObserved.has(element)) {
      measuredListResizeObserver.unobserve(element);
      measuredListObserved.delete(element);
    }
  });

  nextObserved.forEach((element) => {
    if (measuredListObserved.has(element)) return;

    measuredListObserved.add(element);
    measuredListResizeObserver.observe(element);
  });
}

  'resize',

/** 공해 게이지 – 진행률 바 + "현재 / 임계값" + "세금까지 n 남음" (학생 홈·레드 패널·교사 요약 공용) */

    0,
    100
  );

  const warnRatio = (100 / 200) * 100;
  const dangerRatio = (170 / 200) * 100;

  const warningClass =
    percentage > dangerRatio
      ? 'danger'
      : percentage >= warnRatio
        ? 'warn'
        : '';

  const remaining = Math.max(0, threshold - pollution);

  const meterLabel =
    `공해 지수 ${pollution} / ${threshold}. ` +
    `세금까지 ${remaining} 남음`;

  if (compact) {
    return `
      <div class="compact-gauge ${warningClass}">
        <button type="button" class="compact-gauge-line" data-act="showPollutionStats" style="border:none; background:transparent;">

            <span class="compact-gauge-fill" style="width:${percentage}%"></span>
            <span class="compact-gauge-value">${pollution} / ${threshold}</span>
          </span>
                    <span class="compact-gauge-remaining">세금까지 ${remaining} 남음</span>
          ${PollutionStatsSignal()}

        </button>
      </div>
    `;
  }

  return `
    <button type="button"
      class="gauge ${warningClass}"
      role="meter"
      aria-label="${esc(meterLabel)}"
      aria-valuemin="0"
      aria-valuemax="${threshold}"
      aria-valuenow="${pollution}"
      data-act="showPollutionStats"
      style="cursor:pointer; display:block; width:100%; border:none; background:transparent; text-align:left; padding:0;"
    >

        <span>공해 지수</span>
        ${
          percentage >= 100
            ? Badge('세금 집행', 'badge-danger')
            : percentage > dangerRatio
              ? Badge('위험', 'badge-danger')
              : percentage >= warnRatio
                ? Badge('주의', 'badge-warn')

      </div>

      <div class="gauge-track">
        <div
          class="gauge-fill"
          style="width:${percentage}%"
        ></div>
        <div class="gauge-text num">
          ${pollution} / ${threshold}
        </div>
      </div>

      <div class="gauge-sub">
        세금까지 ${remaining} 남음
      </div>
    </button>
  `;
}

    'history',
    'students',
    'settings',

  if (!teacherViews.includes(ui.teacherView)) {
    ui.teacherView = 'summary';
  }

    const allowedTabs = {
    students: ['list', 'add', 'leaders'],
    settings: ['numbers', 'timetable', 'texts', 'effects', 'account'],
    coupons: ['issue', 'catalog', 'shop', 'purchases'],
    warehouse: ['add', 'catalog', 'listings', 'purchases'],
    pollution: ['control', 'students'],
    manage: ['wallets', 'trades', 'bank'],
    history: ['transactions', 'statistics'],
  };


  Object.entries(allowedTabs).forEach(([group, keys]) => {
    if (!keys.includes(ui.teacherTab[group])) {
      ui.teacherTab[group] = keys[0];
    }
  });

  const permittedTeacherTabKeys = new Set([
    ...Object.keys(allowedTabs),
    'grantCur',
  ]);

  Object.keys(ui.teacherTab).forEach((key) => {
    if (!permittedTeacherTabKeys.has(key)) {
      delete ui.teacherTab[key];
    }
  });

  if (!['life', 'credit'].includes(ui.teacherTab.grantCur)) {
    ui.teacherTab.grantCur = 'life';

  const studentViews = [
    'home',
    'team',
    'trade',

  ];

  if (!studentViews.includes(ui.view)) {

function syncBodyClasses() {

    session && session.role === 'student' && state
      ? state.users[session.uid]
      : null;

  const teamId =
    student &&
    !student.mustResetPin &&
    TEAM_IDS.includes(student.teamId)
      ? student.teamId
      : null;

  TEAM_IDS.forEach((id) => {
    document.body.classList.toggle(
      `theme-team-${id}`,
      id === teamId

  });

  document.body.classList.toggle(
    'is-locked',
    isSessionLocked()
  );
}



function render() {
  const app = $('#app');
  if (!app || !state) return;

  const scrollY = window.scrollY;
  let html;

  try {
    if (
      session &&
      session.role === 'student' &&
      !state.users[session.uid]
    ) {
      session = null;
      saveSession();
    }

    normalizeUiState();

    if (!session) {
      html = renderLogin();
    } else if (session.role === 'teacher' && !ui.previewUid) {
      html = renderTeacher();
    } else {
      const student = currentUser();

      html = !student
        ? renderLogin()
        : student.mustResetPin
          ? renderPinReset(student)
          : renderStudent(student);

  } catch (error) {
    console.error('[render 실패]', error);

    html = `

    `;
  }

    syncBodyClasses();
  app.innerHTML = html;
  renderModal();
  window.scrollTo(0, scrollY);
  scheduleMeasuredRecordLists();
}

  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'back', '0', 'cancel'];
  return `<div class="pin-dots" aria-label="입력한 자리 수 ${ui.pin.length}">${dots}</div><div class="keypad">${keys.map((k) => {
    if (k === 'back') return `<button type="button" class="key" ${act('pinKey', { k: 'back' })} aria-label="지우기">←</button>`;
    if (k === 'cancel') return backAct ? `<button type="button" class="key key-ghost" ${act(backAct)}>${esc(backLabel)}</button>` : '<span></span>';
    return `<button type="button" class="key" ${act('pinKey', { k })}>${k}</button>`;
  }).join('')}</div>`;
}function renderLogin() {
  const tabs = `<div class="login-tabs">
    <button type="button" class="tab ${ui.loginTab === 'student' ? 'active' : ''}" ${act('loginTab', { tab: 'student' })}>학생 로그인</button>

    body = Card({ title: '교사 로그인', body: `${Field('비밀번호', 'teacherPw', `<input id="teacherPw" class="input" type="password" placeholder="비밀번호" autocomplete="current-password">`)}${Button({ label: '로그인', act: 'teacherLogin', cls: 'btn-primary btn-block btn-lg' })}<p class="help" style="margin-top:8px">기본 비밀번호는 1234예요. 교사(관리자) 모드 설정에서 바꿀 수 있어요.</p>` });
  } else if (!ui.loginUid) {
    const list = activeStudents();
    body = Card({ title: '이름을 눌러 주세요', body: list.length ? NameGrid(list, 'loginPick') : EmptyState('등록된 학생이 없어요. 선생님이 먼저 학생을 추가해 주세요.') });
  } else {
    const u = getUser(ui.loginUid);
    body = Card({ title: `${u.name} · PIN 번호 4자리`, right: TeamBadge(u.teamId), body: Keypad('loginBack', '다른 이름') });
  }
  return `<div class="topbar"><div class="title">학급 경제 시스템</div><span class="muted num">${getDateKey()} ${getTimeKey()}</span></div>${tabs}${body}`;
}function renderPinReset(u) {
  const step = ui.pinStage && ui.pinStage.first !== null ? 2 : 1;
  return `<div class="topbar"><div class="title">PIN 번호 새로 만들기</div>${Button({ label: '로그아웃', act: 'logout', cls: 'btn-ghost btn-sm' })}</div>
    ${Card({ title: `${u.name}, 새 PIN을 만들어요`, right: Badge(`${step} / 2 단계`), body: `<p style="margin-bottom:12px">${step === 1 ? '사용할 새 PIN 4자리를 눌러 주세요. 0000은 사용할 수 없어요.' : '확인을 위해 같은 PIN을 한 번 더 눌러 주세요.'}</p>${Keypad(step === 2 ? 'pinResetRestart' : null, '처음부터')}` })}`;
}async function handlePinComplete(pin) {
  if (!session) {
    const r = await loginStudent(ui.loginUid, pin);
    ui.pin = '';
    if (!r.ok) { Toast(r.error, 'danger'); render(); return; }
    ui.loginUid = null; ui.view = 'home'; ui.pinStage = null; render(); return;
  }
  const u = currentUser();
  if (!u || !u.mustResetPin) { ui.pin = ''; render(); return; }
  if (!ui.pinStage) ui.pinStage = { first: null };
  if (pin === '0000') { Toast('0000은 사용할 수 없어요', 'danger'); ui.pin = ''; render(); return; }
  if (ui.pinStage.first === null) { ui.pinStage.first = pin; ui.pin = ''; render(); return; }
  const r = await setPin(u.id, ui.pinStage.first, pin);
  ui.pin = '';
  if (!r.ok) { Toast(r.error || '두 번 입력한 PIN이 서로 달라요', 'danger'); ui.pinStage = { first: null }; render(); return; }
  ui.pinStage = null; Toast('새 PIN을 저장했어요!', 'success'); render();
}Object.assign(ACTIONS, {
  loginTab({ tab }) { ui.loginTab = tab; ui.loginUid = null; ui.pin = ''; render(); },
  loginPick({ uid: id }) { ui.loginUid = id; ui.pin = ''; render(); },
  loginBack() { ui.loginUid = null; ui.pin = ''; render(); },
  pinResetRestart() { ui.pinStage = { first: null }; ui.pin = ''; render(); },
  pinKey({ k }) {
    if (k === 'back') { ui.pin = ui.pin.slice(0, -1); render(); return; }
    if (ui.pin.length >= 4) return;
    ui.pin += k; render();
    if (ui.pin.length === 4) return handlePinComplete(ui.pin);
  },
  teacherLogin() { const r = loginTeacher(val('teacherPw')); if (!r.ok) { Toast(r.error, 'danger'); return; } ui.teacherView = 'summary'; render(); },
  logout() { ui.view = 'home'; ui.pinStage = null; ui.pin = ''; ui.picker.clear(); closeModal(); logout(); },
  closeModal() { closeModal(); },
  modalBackdrop(args, el, e) { if (e && e.target === el) closeModal(); },
  pickToggle({ uid: id, single }) { if (single) { const had = ui.picker.has(id); ui.picker.clear(); if (!had) ui.picker.add(id); } else if (ui.picker.has(id)) ui.picker.delete(id); else ui.picker.add(id); refresh(); },
  subTab({ group, key }) { ui.sub[group] = key; ui.picker.clear(); render(); },
});

  return Card({ title: '알림 · 이력 · 공지', right, body: tabs + body });

function VaultTransactionRow(transaction, ref) {

function getVaultHistoryEntries(teamId) {
  const ref = vaultRef(teamId);
  const team = getTeam(teamId);

  const transactions = state.transactions.filter(
    (transaction) => txInvolves(transaction, ref)
  );

  const allTransactionIds = new Set(
    state.transactions.map((transaction) => transaction.id)
  );

  const usedMatches = new Set();

  (team.vaultLog || []).forEach((log) => {
    if (log.ref?.txId && allTransactionIds.has(log.ref.txId)) {
      usedMatches.add(log.ref.txId);
    }
  });

  const entries = transactions.map((transaction) => ({
    at: transaction.createdAt || '',
    transaction,
    legacy: null,
  }));

  (team.vaultLog || []).forEach((log) => {
    if (log.ref?.txId && allTransactionIds.has(log.ref.txId)) {
      return;
    }

    let expectedType = null;
    let expectedFrom = null;
    let expectedTo = null;

    if (log.type === 'deposit') {
      expectedType = 'userToVault';
      expectedFrom = userRef(log.fromUid);
      expectedTo = ref;
    } else if (log.type === 'distribute') {
      expectedType = 'vaultToUser';
      expectedFrom = ref;
      expectedTo = userRef(log.toUid);
    }

    const matches = expectedType
      ? transactions.filter((transaction) =>
          !usedMatches.has(transaction.id) &&
          transaction.type === expectedType &&
          transaction.currency === log.currency &&
          transaction.amount === log.amount &&
          transaction.createdBy === log.fromUid &&
          transaction.createdAt === log.at &&
          sameRef(transaction.from, expectedFrom) &&
          sameRef(transaction.to, expectedTo)
        )
      : [];

    if (matches.length === 1) {
      usedMatches.add(matches[0].id);
      return;
    }

    entries.push({
      at: log.at || '',
      transaction: null,
      legacy: log,
    });
  });

  return entries.sort((a, b) =>
    String(b.at).localeCompare(String(a.at))
  );
}

function renderTeamHistory(u) {
  const team = getTeam(u.teamId);
  const ref = vaultRef(u.teamId);

  const histories = team.leaderHistory
    .slice()
    .sort((a, b) => String(b.at).localeCompare(String(a.at)));

  const entries = getVaultHistoryEntries(u.teamId);

  const requests = state.requests
    .filter((request) =>
      request.teamId === u.teamId &&
      !['pending', 'awaitingChoice'].includes(request.status)
    )
    .sort((a, b) =>
      String(b.resolvedAt || b.createdAt).localeCompare(
        String(a.resolvedAt || a.createdAt)
      )
    );

  const vaultRows = entries.map((entry) => {
    if (entry.transaction) {
      return VaultTransactionRow(entry.transaction, ref);
    }

    const log = entry.legacy;
    const deposit = log.type === 'deposit';
    const currencyLabel = CURRENCY_LABEL[log.currency] || log.currency;
    const direction = deposit ? '入金' : '出金';
    const directionLabel = direction === '入金' ? '입금' : '출금';
    const sign = deposit ? '+' : '−';
    const counterpart = deposit ? log.fromUid : log.toUid;

    const feeText = log.feeCredit
      ? `<br>과거 분배 당시 팀장 크레딧 ${log.feeCredit}개 사용 기록이 있어요.`
      : '';

    return Row(
      `${Badge('구버전 기록', 'badge-outline')} ` +
      `${Badge(deposit ? '금고에 옮기기' : '금고 분배')} ` +
      `<span class="num">${directionLabel} ${sign}${log.amount} ${esc(currencyLabel)}</span>`,
      `${log.at ? formatDateTime(log.at) : '시각 미기록'} · ` +
      `처리자 ${esc(actorName(log.fromUid))} · ` +
      `상대 ${esc(actorName(counterpart))}<br>` +
      `사유: ${esc(log.memo || '기록된 사유가 없어요')}` +
      feeText
    );
  }).join('');

  const requestRows = requests.map(
    (request) => RequestRow(request)
  ).join('');

  return (
    Card({
      title: '팀장 이력',
      body: histories.length
        ? histories.map((history) => Row(
            `${esc(history.uid ? actorName(history.uid) : '공석')}` +
            `${history.fromUid ? ` ← ${esc(actorName(history.fromUid))}` : ''}`,
            `${formatDateTime(history.at)} · ` +
            `${esc(history.memo || '')} · ` +
            `처리 ${esc(actorName(history.by))}`
          )).join('')
        : EmptyState('이력이 없어요'),
    }) +
    Card({
      title: '금고 재화 이력',
      right: Badge(`전체 ${entries.length}건`, 'badge-outline'),
      body: entries.length
        ? vaultRows
        : EmptyState('금고 재화 이력이 없어요'),
    }) +
    Card({
      title: '처리된 요청',
      right: Badge(`전체 ${requests.length}건`, 'badge-outline'),
      body: requests.length
        ? MeasuredRecordList(requestRows, 5, '팀의 처리된 요청')
        : EmptyState('처리된 요청이 없어요'),
    })
  );
}

  const present = students.filter((s) => isPresent(s.id, dateKey));
  const granted = present.filter((s) => !!getStudentDay(s.id, dateKey)?.[flag]);
  const missing = present.filter((s) => !getStudentDay(s.id, dateKey)?.[flag]);

function GrantPicker(
  currency,
  dateKey = getDateKey()
) {
  if (!['life', 'credit'].includes(currency)) {
    return EmptyState('지급할 재화를 선택해 주세요');
  }

  const teamId = currency === 'life' ? 'blue' : 'red';
  const actor = currentActorUid();
  const teacher = isTeacher();

  if (!teacher && !isTeamMember(actor, teamId)) {
    return EmptyState('이 재화를 지급할 권한이 없어요');
  }

  const leader = teacher || isLeader(actor);
  const flag = currency === 'life' ? 'lifeGranted' : 'creditGranted';
  const label = CURRENCY_LABEL[currency];
  const attendanceSaved = isAttendanceSaved(dateKey);
  const closed = getGrantClosed(currency, dateKey);
  const students = activeStudents();
  const canGrant = leader && (teacher || !closed);

  const statusOf = (student) => {
    if (!isPresent(student.id, dateKey)) return '결석';
    if (!attendanceSaved) return '출석 확인 전';
    if (getStudentDay(student.id, dateKey)?.[flag]) return '지급 완료';
    return '';
  };

  const disabledReason = (student) => {
    const status = statusOf(student);
    if (status) return status;
    if (!leader) return '미지급';
    if (closed && !teacher) return '지급 종료';
    return '';
  };

  // 팀장이 아닌 팀원: 읽기 전용(오늘 지급 결과 + 모두 비활성인 학생 격자)
  if (!leader) {
    const badges = closed ? Badge(`지급 종료됨 ${formatTime(closed.closedAt)}`, 'badge-outline') : Badge('지급 진행 중', 'badge-clean');
    const dateText = `<span class="muted num" style="font-size: 14px;">${dateKey}</span>`;
    return Card({
      title: `${label} 지급 결과`,
      right: `<div class="hstack" style="flex: 1; justify-content: space-between; margin-left: 12px;"><div class="hstack" style="gap:8px;">${badges}</div>${dateText}</div>`,
      body: `
        <p class="help" style="margin-bottom:var(--sp-3)">${label} 지급과 지급 종료는 ${TEAM_LABEL[teamId]}팀 팀장만 할 수 있어요. 여기서는 오늘 지급 결과만 볼 수 있어요.</p>
        ${attendanceSaved ? GrantResultSummary(currency, dateKey) : EmptyState('선생님이 출석을 저장하면 지급 결과를 볼 수 있어요')}
        <div style="margin-top:var(--sp-3)">
          ${StudentPicker({ students, disabledOf: disabledReason, subOf: (student) => `${TEAM_LABEL[student.teamId]}팀` })}
        </div>
      `,
    });
  }

/** 봉사 확인 보상 게이지 – PollutionGauge와 같은 .gauge 구조 재사용, 채움색 --life */
function ServiceGauge(student) {
  const max = Math.max(1, toInt(state.settings.serviceGaugeMax) || 1);
  const value = clamp(Number.isSafeInteger(student.serviceGauge) ? student.serviceGauge : 0, 0, max);
  const pct = (value / max) * 100;
  const remain = max - value;
  const label = `나의 봉사 확인 ${value} / ${max}. 보상까지 ${remain}회 남음`;
  return `
    <div class="gauge gauge-service" role="meter" aria-label="${esc(label)}" aria-valuemin="0" aria-valuemax="${max}" aria-valuenow="${value}">
      <div class="gauge-head">
        <span>나의 봉사 확인</span>
        <span class="badge badge-life" style="display:inline-flex; align-items:center; gap:4px;">
          <span style="display:flex; width:14px; height:14px;">${ICON.life}</span>+1
        </span>
      </div>
      <div class="gauge-track">
        <div class="gauge-fill" style="width:${pct}%"></div>
        <div class="gauge-text num">${value} / ${max}</div>
      </div>
      <div class="gauge-sub">나의 봉사 확인 ${value} / ${max} · 보상까지 ${remain}회 남음</div>
    </div>
  `;
}
function ServiceGaugeCard(student) {
  const max = Math.max(1, toInt(state.settings.serviceGaugeMax) || 1);
  return Card({
    title: '봉사 확인 보상 게이지',
    body: `
      ${ServiceGauge(student)}
      <p class="help" style="margin-top:var(--sp-2)">봉사 완료를 ${max}회 확인하면 라이프 1개를 받고 게이지가 0으로 돌아가요. 선생님이 확인한 건은 게이지에 포함되지 않아요.</p>
    `,
  });
}

function ServiceTargetsCard() {
  const pending = getServiceTargets();
  const today = getDateKey();
  const lookback = state.settings.serviceLookbackDays;
  const completed = [];
  
  for (let i = 0; i < lookback; i++) {
     const dk = shiftDateKey(today, -i);
     const r = state.dailyRecords[dk];
     if (!r) continue;
     activeStudents().forEach(u => {
        const d = r.students[u.id];
        if (d && d.serviceDone && !d.lifeOnTime && d.present !== false) {
           completed.push({ dateKey: dk, uid: u.id, memo: d.serviceMemo || '', approvedBy: d.serviceApprovedBy });
        }
     });
  }
  completed.sort((a,b) => b.dateKey.localeCompare(a.dateKey));

  const showHistory = !!ui.filters.showServiceHistory;
  const isT = isTeacher(); 

  const pendingRows = pending.map(x => {
     const d = getStudentDay(x.uid, x.dateKey);
     const memo = d && d.serviceMemo ? d.serviceMemo : '';
     const disabled = isT ? false : !memo; 
     
     const memoDisplay = memo 
       ? `<div class="muted" style="margin-top:4px;">↳ 제출 내용: ${esc(memo)}</div>`
       : `<div class="muted" style="margin-top:4px; color:var(--warn);">↳ 아직 내용을 제출하지 않았어요</div>`;

     return Row(
        `${esc(actorName(x.uid))} ${TeamBadge(state.users[x.uid]?.teamId)}`,
        `${x.dateKey} 라이프 미제출${memoDisplay}`,
        Button({ label: '봉사 완료', act: 'serviceDone', args: { uid: x.uid, dateKey: x.dateKey }, cls: 'btn-life btn-sm', disabled })
     );
  }).join('');

  const completedRows = completed.map(x => {
     const approverText = x.approvedBy ? `${esc(actorName(x.approvedBy))}에 의해 봉사 승인됨` : '봉사 승인됨';
     
     // 선생님일 경우 초록색 '승인 완료' 뱃지를 클릭 가능한 버튼으로 바꿉니다.
     const badgeOrBtn = isT
       ? `<button type="button" class="badge badge-clean" style="cursor:pointer; border:none; transition:opacity 0.2s;" data-act="serviceCancelAsk" data-args="${esc(JSON.stringify({uid: x.uid, dateKey: x.dateKey}))}" title="클릭하여 승인 취소" onmouseover="this.style.opacity='0.7'" onmouseout="this.style.opacity='1'">승인 완료</button>`
       : Badge('승인 완료', 'badge-clean');

     return Row(
        `${esc(actorName(x.uid))} ${TeamBadge(state.users[x.uid]?.teamId)}`,
        `${x.dateKey} ${approverText}<br><span class="muted">↳ ${esc(x.memo || '내용 없음')}</span>`,
        badgeOrBtn
     );
  }).join('');

  return Card({ title: '봉사 대상 명단', right: Badge(`${pending.length}건`, pending.length ? 'badge-warn' : 'badge-outline'), body: `
    <div class="card card-warn" style="margin-bottom:12px"><p class="label">현재 봉사 안내문</p><p class="pre">${esc(state.settings.volunteerNotice)}</p></div>
    <div class="hstack between" style="margin-bottom:12px;">
      <span class="label">승인 대기 명단</span>
      ${Button({ label: showHistory ? '완료 이력 숨기기' : '완료된 이력 보기', act: 'toggleServiceHistory', cls: 'btn-sm btn-ghost' })}
    </div>
    ${pending.length ? pendingRows : EmptyState('봉사 대상 학생이 없어요')}
    
    ${showHistory ? `
      <div class="label" style="margin-top:20px; margin-bottom:12px;">최근 2주 완료 이력</div>
      ${completed.length ? completedRows : EmptyState('최근 2주간 완료된 이력이 없어요')}
    ` : ''}
  ` });
}function renderBlueService(u) { return ServiceGaugeCard(u) + ServiceTargetsCard(); }
Object.assign(ACTIONS, {
  attendanceSave({ dateKey }) {
    if (!isTeacher()) {
      Toast('출석 체크는 선생님만 할 수 있어요', 'warn');
      return;
    }

    const absentUids = [...ui.picker].filter(
      (userId) => !!state.users[userId]
    );

    const result = saveAttendance(
      absentUids,
      TEACHER_ID,
      dateKey
    );

    if (result.ok) {
      Toast('출석을 저장했어요', 'success');
    }
  },

  grantCloseAsk({ currency, dateKey }) {
    if (!['life', 'credit'].includes(currency)) return;
    if (!isAttendanceSaved(dateKey)) {
      Toast('선생님이 먼저 출석 체크를 해 주세요', 'warn');
      return;
    }
    if (getGrantClosed(currency, dateKey)) {
      Toast('이미 지급이 종료되었어요', 'warn');
      return;
    }
    const label = CURRENCY_LABEL[currency];
    const flag = currency === 'life' ? 'lifeGranted' : 'creditGranted';
    const missing = activeStudents().filter(
      (s) => isPresent(s.id, dateKey) && !getStudentDay(s.id, dateKey)?.[flag]
    ).length;
    Confirm(
      `오늘의 ${label} 지급 종료`,
      `오늘의 ${label} 지급을 종료할까요? 종료하면 되돌릴 수 없고, 결석생을 제외한 미지급 학생 수만큼 공해가 올라가요.\n\n현재 미지급 ${missing}명 → 공해 +${missing}`,
      'grantCloseDo',
      { currency, dateKey },
      'btn-warn',
      '지급 종료'
    );
  },

  grantCloseDo({ currency, dateKey }) {
    const result = closeDailyGrant(currency, currentActorUid(), dateKey);
    if (!result.ok) return;
    ui.picker.clear();
    closeModal();
    const count = result.result.count;
    Toast(
      count > 0
        ? `지급을 종료했어요. 미지급 ${count}명 → 공해 +${count}`
        : '지급을 종료했어요. 미지급 학생이 없어요',
      count > 0 ? 'warn' : 'success'
    );
    render();
  },

  grantSubmit({ currency, dateKey }) {
    if (!['life', 'credit'].includes(currency)) {
      Toast('지급할 재화를 선택해 주세요', 'warn');
      return;
    }

    if (!isAttendanceSaved(dateKey)) {
      Toast(
        '선생님이 먼저 출석 체크를 해 주세요',
        'warn'
      );
      return;
    }

    if (!isTeacher() && getGrantClosed(currency, dateKey)) {
      Toast(`오늘의 ${CURRENCY_LABEL[currency]} 지급이 종료되었어요`, 'warn');
      return;
    }

    const flag =
      currency === 'life'
        ? 'lifeGranted'
        : 'creditGranted';

    const ids = [...ui.picker].filter((userId) => {
      if (!state.users[userId]) return false;
      if (!isPresent(userId, dateKey)) return false;

      return !getStudentDay(userId, dateKey)?.[flag];
    });

    if (!ids.length) {
      Toast('지급할 학생을 선택해 주세요', 'warn');
      return;
    }

    const grant =
      currency === 'life'
        ? grantLife
        : grantCredit;

    const result = grant(
      ids,
      currentActorUid(),
      dateKey
    );

    if (!result.ok) return;

    ui.picker.clear();

    const count =
      typeof result.result === 'number'
        ? result.result
        : result.result.count;

    Toast(
      `${count}명에게 ${CURRENCY_LABEL[currency]}을(를) 지급했어요`,
      'success'
    );

    render();
  },

  serviceDone({ uid: userId, dateKey }) {
    const result = completeService(userId, dateKey); // 여기서 봉사승인+공해증가가 0.001초만에 한 방에 끝납니다.

    if (result.ok) {
      const info = result.result || {};
      const gaugeText = info.gauge ? ` · 나의 게이지 ${info.gauge.value} / ${info.gauge.max}` : '';
      
      let penaltyMsg = '';
      if (info.penalty > 0) {
        penaltyMsg = ` (공해 +${info.penalty})`;
      }

      Toast(
        info.rewarded
          ? `${actorName(userId)} 봉사 완료 확인 · 게이지 완료! 라이프 +1${penaltyMsg}`
          : `${actorName(userId)} 봉사 완료를 확인했어요${gaugeText}${penaltyMsg}`,
        'success'
      );
      
      // 🛑 화면 즉시 갱신
      render();
    }
  },
  // 🛑 아래 두 개의 액션이 새롭게 추가됩니다.
  serviceMemoSubmit({ dateKey }) {
    const memo = val('svMemo').trim();
    if (!memo) { Toast('봉사 내용을 입력해 주세요', 'warn'); return; }
    const result = runTx(() => {
      const u = currentUser();
      const d = getStudentDay(u.id, dateKey, true);
      d.serviceMemo = memo;
      notifyTeam('blue', `${u.name}이(가) 학급 봉사 승인을 요청했어요.`, 'info');
    });
    if (result.ok) { Toast('승인 요청을 보냈어요!', 'success'); render(); }
  },
  toggleServiceHistory() {
    ui.filters.showServiceHistory = !ui.filters.showServiceHistory;
    render();
  },
  serviceCancelAsk({ uid, dateKey }) {
    Confirm(
      '봉사 승인 취소',
      `정말 이 봉사 승인을 취소할까요?\n해당 학생은 다시 대기 명단으로 돌아가며, 승인했던 블루팀원의 봉사 확인 게이지가 1 감소합니다.`,
      'serviceCancelDo',
      { uid, dateKey },
      'btn-danger',
      '승인 취소'
    );
  },
  serviceCancelDo({ uid, dateKey }) {
    const r = runTx(() => {
      if (!isTeacher()) throw new Error('선생님만 취소할 수 있어요');
      const d = getStudentDay(uid, dateKey);
      if (!d || !d.serviceDone) throw new Error('봉사 완료 상태가 아니에요');
      
      d.serviceDone = false; // 승인 취소 및 대기 명단 복귀
      
      // 승인해 주었던 블루팀원의 게이지 차감 및 보상 회수
      const approverUid = d.serviceApprovedBy;
      if (approverUid && approverUid !== TEACHER_ID && state.users[approverUid]) {
        const handler = state.users[approverUid];
        const max = Math.max(1, toInt(state.settings.serviceGaugeMax) || 1);
        
        if ((handler.serviceGauge || 0) === 0) {
          // 게이지가 0이라면 이미 보상을 받아갔다는 뜻이므로 게이지를 최대치-1로 되돌림
          handler.serviceGauge = max - 1;
          
          if (handler.balances.life > 0) {
            transfer({ type: 'adminAdjust', from: userRef(approverUid), to: null, currency: 'life', amount: 1, memo: '잘못된 봉사 승인 취소로 인한 보상 회수', createdBy: TEACHER_ID });
            notify(approverUid, `🚨 선생님이 ${esc(actorName(uid))} 학생의 봉사 승인을 취소하여, 보상으로 얻은 라이프 1개가 회수되고 게이지가 ${max - 1}로 돌아갔어요.`, 'danger');
          } else {
            // 라이프를 이미 다 써버려서 0인 경우
            notify(approverUid, `🚨 선생님이 ${esc(actorName(uid))} 학생의 봉사 승인을 취소하여 게이지가 ${max - 1}로 돌아갔어요. (회수할 라이프가 없어 차감되지는 않았어요)`, 'danger');
          }
        } else {
          // 보상을 아직 안 받았다면 단순히 게이지만 1 감소
          handler.serviceGauge = Math.max(0, handler.serviceGauge - 1);
        }
      }
      
      delete d.serviceApprovedBy; // 승인자 기록 초기화
      notify(uid, `${dateKey} 학급 봉사 승인이 선생님에 의해 취소되어 다시 대기 상태가 되었어요.`, 'warn');
    });
    
    if (r.ok) {
      closeModal();
      Toast('봉사 승인을 취소하고 대기 명단으로 되돌렸어요', 'success');
      render();
    }
  }
});

function QuizStatusBadge(st) { return { draft: Badge('임시', 'badge-outline'), open: Badge('공개 중', 'badge-clean'), closed: Badge('마감', 'badge-warn') }[st]; }

      ${StudentPicker({ students: activeStudents(), disabledOf: (x) => (!canGrade ? '출제자 전용' : (sel.winnerUids.includes(x.id) ? '정답자' : (sel.loserUids && sel.loserUids.includes(x.id)) ? '오답자' : (!sel.isSpecial && !canWinQuiz(x.id)) ? '골드팀 제외' : (!isTeacher() && !sel.submissions?.[x.id]) ? '미제출' : '')), subOf: (x) => {
        const ans = sel.submissions?.[x.id];
        const ansText = ans ? `[답: ${ans}]` : '[미제출]';

        return ansText + '\n' + (arr.join(' 또는 ') || '보상 없음');
      } })}
      <div class="grid-2" style="margin-top:12px">

        ${Button({ label: `선택 ${ui.picker.size}명 오답자로 저장`, act: 'quizLosersSave', args: { id: sel.id }, cls: 'btn-ghost btn-lg', disabled: !canGrade })}
      </div>

  }

  const showClosed = !!ui.filters.showClosedQuizzes;

  return Card({ title: '퀴즈 등록', body: `
    <div class="grid-2">${Field('제목', 'qzTitle', Input('qzTitle', { placeholder: '예: 분수 덧셈 퀴즈' }))}${Field('힌트(선택)', 'qzHint', Input('qzHint', { placeholder: '크레딧 1개로 볼 수 있는 힌트' }))}</div>
    ${isTeacher() ? `<label class="hstack" style="margin-bottom:12px; cursor:pointer;"><input type="checkbox" id="qzSpecial"> <strong style="color:var(--warn); margin-left:4px;">🌟 특별 퀴즈로 지정 (교사 전용)</strong><span class="help" style="margin-left:8px;">학생들에게 특별한 표시와 보상이 제공돼요</span></label>` : ''}
    <div class="grid-2">
      <a class="btn btn-primary btn-block btn-lg" href="${esc(state.settings.quizUrl || '#')}" target="_blank" rel="noopener" onclick="if(this.href.endsWith('#')) { alert('선생님이 규칙 수치에 공통 퀴즈 링크를 등록하지 않았어요.'); return false; }">퀴즈 내러 가기</a>

      `<div class="hstack" style="gap:4px; flex-wrap:wrap; justify-content:flex-end;">` +

      (q.status === 'open' ? Button({ label: '마감', act: 'quizStatus', args: { id: q.id, status: 'closed' }, cls: 'btn-sm btn-warn' }) : '') + 
      (q.status !== 'draft' ? Button({ label: '정답자', act: 'quizSelChange', args: { value: q.id }, cls: 'btn-sm btn-ghost' }) : '') + 
      Button({ label: '수정', act: 'quizEditAsk', args: { id: q.id }, cls: 'btn-sm btn-ghost' }) +

      `</div>`
      )).join('') : EmptyState('조건에 맞는 퀴즈가 없어요') 
    })
    + winnerCard;
}function HomeworkGauge(student) {
  const max = Math.max(1, toInt(state.settings.homeworkGaugeMax) || 10);
  const value = clamp(Number.isSafeInteger(student.homeworkGauge) ? student.homeworkGauge : 0, 0, max);
  const pct = (value / max) * 100;
  const remain = max - value;
  const label = `나의 숙제 도우미 ${value} / ${max}. 보상까지 ${remain}회 남음`;
  return `
    <div class="gauge" role="meter" aria-label="${esc(label)}" aria-valuemin="0" aria-valuemax="${max}" aria-valuenow="${value}">
      <div class="gauge-head">
        <span>나의 숙제 도우미 확인</span>
        <span class="badge badge-gold" style="display:inline-flex; align-items:center; gap:4px;">
          <span style="display:flex; width:14px; height:14px;">${ICON.gold}</span>+1
        </span>
      </div>
      <div class="gauge-track">
        <div class="gauge-fill" style="width:${pct}%; background:var(--gold);"></div>
        <div class="gauge-text num">${value} / ${max}</div>
      </div>
      <div class="gauge-sub">나의 숙제 도우미 ${value} / ${max} · 보상까지 ${remain}회 남음</div>
    </div>
  `;
}

function HomeworkGaugeCard(student) {

function renderGoldHomework(u) {

}Object.assign(ACTIONS, {
  toggleClosedQuizzes() { ui.filters.showClosedQuizzes = !ui.filters.showClosedQuizzes; render(); },
  quizCreate() { const r = createQuiz({ title: val('qzTitle'), hint: val('qzHint'), isSpecial: isTeacher() ? checked('qzSpecial') : false }); if (r.ok) Toast('퀴즈를 등록했어요. 공개 버튼을 눌러 열어 주세요.', 'success'); },

// 🛑 무공해 크레딧 게이지 현황판 추가
function EcoGaugeSummaryCard() {
  if (!state.settings.useEcoGauge) return '';
  const target = Math.max(1, state.settings.ecoGaugeTarget || 10);
  const students = activeStudents();

  const rows = students.map(s => {
    const val = s.ecoGauge || 0;
    const pct = Math.min(100, (val / target) * 100);
    return `
      <div class="card" style="padding:10px 8px; text-align:center; box-shadow:none; border:1px solid var(--border); margin:0;">
        <div style="font-weight:700; font-size:14px; margin-bottom:8px;">${esc(s.name)}</div>

          <div class="gauge-fill" style="width:${pct}%; background:var(--clean);"></div>
        </div>
        <div style="font-size:12px; color:var(--text-muted); font-variant-numeric:tabular-nums;">${val} / ${target}</div>
      </div>

    title: '전교생 무공해 크레딧 게이지 현황',

      ? `<div style="display:grid; grid-template-columns:repeat(5, 1fr); gap:8px;">${rows}</div>`

  });

}function renderTeacherApprovals() {
  const pending = pendingRequests()
    .filter(
      (request) =>
        request.status === 'pending' &&
        request.type !== 'quizReward' &&
        canResolveRequest(request, TEACHER_ID)
    )
    .sort(
      (a, b) => a.createdAt.localeCompare(b.createdAt)
    );

  const groups = {};

  pending.forEach((request) => {
    if (!groups[request.type]) {
      groups[request.type] = [];
    }

    groups[request.type].push(request);
  });

    const recent = state.requests
    .filter(
      (request) =>
        !['pending', 'awaitingChoice'].includes(request.status)
    )
    .sort(
      (a, b) =>
        (b.resolvedAt || b.createdAt).localeCompare(
          a.resolvedAt || a.createdAt
        )
    );


  const pendingCards = Object.keys(groups).length
    ? Object.entries(groups).map(([type, requests]) =>
        Card({
          title: REQUEST_TYPE_LABEL[type] || type,
          right: Badge(`${requests.length}건`, 'badge-warn'),
          body: requests.map((request) =>
            RequestRow(
              request,
              Button({
                label: '승인',
                act: 'teamApprove',
                args: { id: request.id },
                cls: 'btn-primary btn-sm',
              }) +
              Button({
                label: '거절',
                act: 'openReject',
                args: { id: request.id },
                cls: 'btn-ghost btn-sm',
              }) +
              Button({
                label: '취소',
                act: 'cancelReq',
                args: { id: request.id },
                cls: 'btn-ghost btn-sm',
              })
            )
          ).join(''),
        })
      ).join('')
    : Card({
        title: '승인 요청',
        body: EmptyState('대기 중인 요청이 없어요'),
      });

  return (
    pendingCards +
        Card({
      title: '처리된 요청',
      right: Badge(`전체 ${recent.length}건`, 'badge-outline'),
      body: recent.length

  );

      }],
    });
  },

  rejectSubmit({ id }) {
    const result = resolveRequest(
      id,
      'reject',
      currentActorUid(),
      { reason: val('rejReason') }
    );

    if (result.ok) {
      closeModal();
    }
  },

  setDate({ value }) {
    if (!isTeacher()) return;

    const nextDate = value || getDateKey();

    if (
      !/^\d{4}-\d{2}-\d{2}$/.test(nextDate) ||
      nextDate > getDateKey()
    ) {
      Toast('오늘 이전의 날짜를 선택해 주세요', 'warn');
      render();
      return;
    }

    ui.dateKey = nextDate;
    ui.picker.clear();
    ui.filters.attSeed = null;
    render();
  },

function setTeacherSummaryPane(pane, scrollToService = false) {
  if (!isTeacher()) return;

  if (!['attendance', 'life', 'credit', 'quiz'].includes(pane)) {
    return;
  }

  guardWalletNavigation(() => {
    closeModal();

    ui.teacherView = 'summary';
    ui.teacherSummaryPane = pane;
    ui.teacherDailyGrant = null;
    ui.picker.clear();
    ui.filters.attSeed = null;

    render();

    if (scrollToService) {
      requestAnimationFrame(() => {
        const section = document.getElementById(
          'teacherServiceSection'
        );

        if (section) {
          section.scrollIntoView({ block: 'start' });
        }
      });
    }
  });
}

Object.assign(ACTIONS, {
  openTeacherAttendance() {
    setTeacherSummaryPane('attendance');

  grantCur({ c }) {
    if (!['life', 'credit', 'quiz'].includes(c)) return;
    setTeacherSummaryPane(c);
  },

  openTeacherService() {
    setTeacherSummaryPane('attendance', true);

});

function LeaderHistoryStatsCard() {
  const histories = TEAM_IDS.flatMap((teamId) =>

      ...history,
      teamId,
    }))
  ).sort(
    (a, b) => b.at.localeCompare(a.at)
  );

  const changes = histories.filter(
    (history) => !!history.fromUid
  );

  const counts = TEAM_IDS.map((teamId) => ({
    teamId,
    count: changes.filter(
      (history) => history.teamId === teamId
    ).length,
  }));

  const countRows = counts.map(({ teamId, count }) =>
    Row(
      `${TeamBadge(teamId)} ${TEAM_LABEL[teamId]}팀`,
      '',
      `<span class="num">${count}회</span>`
    )
  ).join('');

  const historyRows = histories.slice(0, 30).map(
    (history) => Row(
      `

        }

      `${esc(history.memo || '')} · ` +
      `${formatDateTime(history.at)} · ` +

  return Card({

        )

}
Object.assign(ACTIONS, {

      'studentResetPinDo',
      { id },
      'btn-warn',
      '초기화'
    );

  studentResetPinDo({ id }) {

    if (result.ok) {
      closeModal();
      Toast('PIN을 초기화했어요 (0000)', 'success');
    }
  },

  studentDeleteAsk({ id }) {
    if (!isTeacher()) return;

    const student = getUser(id);

    Confirm(
      '학생 삭제',
      `${student.name} 학생을 삭제할까요?\n\n` +
      '학생의 지갑·보유 쿠폰·알림이 함께 없어져요.\n' +
      '미체결 거래와 미처리 요청은 취소돼요.\n' +

      '삭제한 학생은 되돌릴 수 없어요.',
      'studentDeleteDo',
      { id },
      'btn-danger',
      '학생 삭제'
    );
  },

  studentDeleteDo({ id }) {
    const result = deleteStudent(id);
    if (!result.ok) return;

    delete ui.walletDrafts[`user:${id}`];
    ui.picker.delete(id);

    if (ui.loginUid === id) {
      ui.loginUid = null;
    }

    closeModal();

    Toast(
      `${result.result.name} 학생을 삭제했어요. ` +
      '과거 이력은 보존했어요.',
      'success'
    );

    render();
  },

  studentsAdd() {
    // runTx가 화면을 다시 그리기 전에 입력값을 보관합니다.
    const names = val('addNames');
    const teamId = val('addTeam');

    const result = addStudents(names, teamId);
    if (!result.ok) return;

    ui.teacherTab.students = 'list';
    ui.filters.stuTeam = teamId;

    Toast(
      `${result.result.length}명을 추가했어요`,
      'success'
    );

    render();
  },

  leaderSet({ teamId }) {
    const result = setTeamLeader(
      teamId,
      val(`ld_${teamId}`) || null,
      TEACHER_ID
    );

    if (result.ok) {
      Toast('팀장을 지정했어요', 'success');
    }
  },

  startPreview({ id }) {
    ui.previewUid = id;
    ui.previewInteract = false;
    ui.previewBypassLock = false;
    ui.view = 'home';
    render();
  },

  stopPreview() {
    ui.previewUid = null;
    ui.previewInteract = false;
    ui.previewBypassLock = false;
    render();
  },

  togglePreviewInteract({ value }) {
    ui.previewInteract = value;
    render();
  },

  bypassPreviewLock() {
    ui.previewBypassLock = true;
    render();
  }
});

/** 규칙 수치 – 숙제 도움 요청자 랜덤 보상 확률 입력 UI */
function HomeworkRewardWeightFields() {
  const w = state.settings.homeworkRequesterRewardWeights || {};
  const total = sum(CURRENCIES, (c) => toInt(w[c]) || 0);
  const rows = CURRENCIES.map((c) => {
    const v = toInt(w[c]) || 0;
    const pct = total > 0 ? Math.round((v / total) * 1000) / 10 : 0;
    return `
      <div class="hstack between" style="padding:6px 0; border-bottom:1px solid var(--border);">
        <span class="badge badge-${c === 'cleanCredit' ? 'clean' : c}" style="min-width:110px; justify-content:center;">${CURRENCY_LABEL[c]}</span>
        <div class="hstack" style="gap:8px;">
          ${Input(`hrw_${c}`, { type: 'number', value: v, min: 0 }).replace('class="input"', 'class="input num" style="width:80px; min-height:36px; text-align:right;"')}
          <span class="muted num" style="min-width:64px; text-align:right;">= ${pct}%</span>
        </div>
      </div>`;
  }).join('');
  return `
    <div class="card card-soft">
      ${rows}
      <p class="help" style="margin-top:8px;">
        숙제 도우미의 골드를 선생님이 승인하는 순간, 도움을 요청한 학생도 위 확률로 재화 1개를 랜덤으로 받아요.
        숫자는 상대 가중치라 합이 100이 아니어도 괜찮아요(현재 합 ${total}). 전부 0이면 보상을 주지 않아요.
      </p>
    </div>`;
}




function renderTeacherSettings() {
  const settings = state.settings;

  const tab = [
    'numbers',

    'effects',

  ].includes(ui.teacherTab.settings)
    ? ui.teacherTab.settings
    : 'numbers';

  const tabs = Tabs(
    [
      { key: 'numbers', label: '규칙 수치' },
      { key: 'timetable', label: '시간표(앱 잠금)' },
      { key: 'texts', label: '안내 문구' },
      { key: 'account', label: '비밀번호·초기화' },
    ],
    tab,
    'setTab'
  );

  if (tab === 'timetable') {
    const periods = (settings.timetable || []).map((t, idx) => {
      const activeDays = t.days || [1, 2, 3, 4, 5];
      const daysHtml = [{v:1, l:'월'}, {v:2, l:'화'}, {v:3, l:'수'}, {v:4, l:'목'}, {v:5, l:'금'}].map(d => `
        <label class="day-label" style="cursor:pointer; margin:0;">
          <input type="checkbox" class="sr-only" id="ttDay_${idx}_${d.v}" ${activeDays.includes(d.v) ? 'checked' : ''}>

        </label>
      `).join('');

      return `
      <div class="hstack" style="margin-bottom:12px; padding:12px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); flex-wrap:wrap;">
        <span class="label" style="width:60px;">${idx + 1}교시</span>
        ${Input(`ttStart_${idx}`, {type:'time', value:t.start}).replace('class="input"', 'class="input" style="width:150px;"')}
        <span>~</span>
        ${Input(`ttEnd_${idx}`, {type:'time', value:t.end}).replace('class="input"', 'class="input" style="width:150px;"')}
        <div class="hstack" style="gap:6px; margin-left:16px; padding-left:16px; border-left:1px solid var(--border);">
          ${daysHtml}

        ${Button({label:'✕ 삭제', act:'removeTimetable', args:{idx}, cls:'btn-sm btn-ghost', style:'margin-left:auto; color:var(--danger);'})}

      title: '시간표 기반 자동 잠금 설정',

        <div id="timetableList">

        <div class="hstack" style="margin-top:16px; gap:8px;">
          ${Button({ label: '+ 교시 추가', act: 'addTimetable', cls: 'btn-ghost' })}
          ${Button({ label: '시간표 저장하기', act: 'saveTimetable', cls: 'btn-primary' }).replace('class="btn ', 'class="btn " style="flex:1;"')}
        </div>

  }

  if (tab === 'texts') {
    const textCards =
      Card({
        title: '학급 봉사 안내 문구',
        body: `

            'stVolunteer',
            settings.volunteerNotice,

          <p class="help" style="margin:8px 0">

          <p class="muted" style="margin-bottom:12px">
            초기화하면 되돌릴 수 없어요.
            설정도 기본값으로 돌아가고 기본 공지를 다시 만들어요.
          </p>

          <div class="grid-2">
            ${Button({
              label: '샘플 데이터로 초기화',
              act: 'resetAsk',
              args: { mode: 'seed' },
              cls: 'btn-warn btn-lg',
            })}

            ${Button({
              label: '빈 학급으로 초기화',
              act: 'resetAsk',
              args: { mode: 'empty' },
              cls: 'btn-danger btn-lg',
            })}
          </div>
        `,
      })
    );
  }

  const fields = SETTING_FIELDS.map((field) =>
    Field(
      field.label,
      `st_${field.key}`,
      Input(`st_${field.key}`, {
        type: field.type,
        value: settings[field.key],
        min: field.min,
      }),
      field.help || ''
    )
  ).join('');

  const teamRewardRows = TEAM_IDS.map(teamId => {
    const cfg = settings.quizRewardConfig?.[teamId] || { cur1:'life', amt1:1, cur2:'credit', amt2:1, s_cur1:'life', s_amt1:2, s_cur2:'credit', s_amt2:2 };
    const s_cur1 = cfg.s_cur1 || 'life', s_amt1 = cfg.s_amt1 || 2;
    const s_cur2 = cfg.s_cur2 || 'credit', s_amt2 = cfg.s_amt2 || 2;
    const curOpts = [{value:'none', label:'없음'}, ...CURRENCY_OPTIONS];
    return `
      <div class="card card-soft" style="margin-bottom:var(--sp-2)">
        <div class="label" style="margin-bottom:8px">${TEAM_LABEL[teamId]}팀 보상 설정</div>
        <div class="grid-2">
          <div class="field" style="border-right: 1px solid var(--border); padding-right: 8px;">
            <span class="help" style="font-weight:bold;">일반 보상 설정</span>
            <div class="hstack" style="margin-top:4px;">
              ${Select(`qr_${teamId}_c1`, curOpts, cfg.cur1).replace('class="select"', 'class="select" style="flex:1"')}
              ${Input(`qr_${teamId}_a1`, {type:'number', value:cfg.amt1, min:1}).replace('class="input"', 'class="input" style="width:60px"')}
            </div>
            <div style="text-align:center; font-size:12px; color:var(--text-muted); margin:4px 0;">또는</div>
            <div class="hstack">
              ${Select(`qr_${teamId}_c2`, curOpts, cfg.cur2).replace('class="select"', 'class="select" style="flex:1"')}
              ${Input(`qr_${teamId}_a2`, {type:'number', value:cfg.amt2, min:0}).replace('class="input"', 'class="input" style="width:60px"')}
            </div>
          </div>
          <div class="field" style="padding-left: 8px;">
            <span class="help" style="font-weight:bold; color:var(--warn);">🌟 특별 보상 설정</span>
            <div class="hstack" style="margin-top:4px;">
              ${Select(`sqr_${teamId}_c1`, curOpts, s_cur1).replace('class="select"', 'class="select" style="flex:1"')}
              ${Input(`sqr_${teamId}_a1`, {type:'number', value:s_amt1, min:1}).replace('class="input"', 'class="input" style="width:60px"')}
            </div>
            <div style="text-align:center; font-size:12px; color:var(--text-muted); margin:4px 0;">또는</div>
            <div class="hstack">
              ${Select(`sqr_${teamId}_c2`, curOpts, s_cur2).replace('class="select"', 'class="select" style="flex:1"')}
              ${Input(`sqr_${teamId}_a2`, {type:'number', value:s_amt2, min:0}).replace('class="input"', 'class="input" style="width:60px"')}
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');

  return tabs + Card({
    title: '규칙 수치',
    body: `
      <div class="grid-2">
        ${fields}
      </div>

            <div class="section">
        <div class="section-title">팀별 퀴즈 정답 보상 설정 (규칙 수치)</div>
        ${teamRewardRows}
      </div>

      <div class="section">
        <div class="section-title">숙제 도움 요청자 랜덤 보상 확률 (규칙 수치)</div>
        ${HomeworkRewardWeightFields()}
      </div>


            <div class="stack" style="margin-top:12px">
        ${Toggle(
          'st_taxTierEnabled',
          '세금 집행 시 공해 유발 Top3 가산 · 정화 Top3 면제',
          settings.taxTierEnabled,
          '켜면 유발 Top3는 등수마다 가산 세율이 붙고, 정화 Top3는 세금을 내지 않아요. 팀 금고는 기본 세율 그대로예요.'
        )}

        ${Toggle(
          'st_useEcoGauge',
          '무공해 크레딧 보상 게이지 시스템 도입',
          settings.useEcoGauge,
          '켜면 학생 홈과 교사 요약 화면에 게이지가 나타나고 보상이 자동 지급돼요.'
        )}

        ${Toggle(
          'st_useCleanCreditReduce',
          '무공해 크레딧 사용 시 공해 감소 적용',
          settings.useCleanCreditReduce,
          '켜면 무공해 크레딧을 사용할 때 설정한 감소량만큼 실제 공해 지수가 내려가요.'
        )}

        ${Toggle(
          'st_creditOnSpend',
          '포인트·골드 소비 시 크레딧 1개 추가 지불',
          settings.creditOnSpend,
          '매점·쿠폰 구매 때 크레딧을 1개 더 내요.'
        )}

        ${Toggle(
          'st_goldTeamCanWinQuiz',
          '골드팀원도 퀴즈 정답 보상 가능',
          settings.goldTeamCanWinQuiz,
          '꺼져 있으면 골드팀은 정답 보상 대상에서 빠져요.'
        )}
      </div>

      <div style="margin-top:16px">
        ${Button({
          label: '규칙 수치 저장',
          act: 'settingsSave',
          cls: 'btn-primary btn-lg btn-block',
        })}
      </div>

      <p class="help" style="margin-top:8px">
        저장한 규칙은 이후 처리부터 적용돼요.
        이미 지급한 퀴즈 보상은 바뀌지 않아요.
        교사의 직접 재화 조정은 포인트·골드 일일 한도와 별개예요.
      </p>

      <div class="section">
        <div class="section-title">숨긴 공해 프리셋</div>
        ${
          (settings.hiddenPollutionPresets || []).length
            ? `
              <div class="hstack">
                                ${(settings.hiddenPollutionPresets || []).map((k) => Badge(POLLUTION_PRESET_LABEL[k] || k, 'badge-outline')).join('')}
                ${Button({ label: '숨긴 프리셋 복구', act: 'pollutionPresetRestore', cls: 'btn-sm btn-ghost' })}

              </div>
            `
            : '<p class="help">숨긴 공해 프리셋이 없어요.</p>'
        }
      </div>
    `,
  });
}
Object.assign(ACTIONS, {
  setTab({ key }) { ui.teacherTab.settings = key; render(); },
  // 기존의 settingsSave() { ... } 부분을 아래로 교체
  settingsSave() {
    const patch = {};
    SETTING_FIELDS.forEach((f) => { patch[f.key] = val(`st_${f.key}`); });
    patch.creditOnSpend = checked('st_creditOnSpend'); patch.goldTeamCanWinQuiz = checked('st_goldTeamCanWinQuiz');
    patch.useEcoGauge = checked('st_useEcoGauge');
    patch.useCleanCreditReduce = checked('st_useCleanCreditReduce');
    patch.taxTierEnabled = checked('st_taxTierEnabled');
    patch.homeworkRequesterRewardWeights = Object.fromEntries(CURRENCIES.map((c) => [c, val(`hrw_${c}`)]));


    
    const qr = {};
    TEAM_IDS.forEach(t => {
      qr[t] = {
        cur1: val(`qr_${t}_c1`), amt1: toInt(val(`qr_${t}_a1`)) || 1,
        cur2: val(`qr_${t}_c2`), amt2: toInt(val(`qr_${t}_a2`)) || 0,
        s_cur1: val(`sqr_${t}_c1`), s_amt1: toInt(val(`sqr_${t}_a1`)) || 1,
        s_cur2: val(`sqr_${t}_c2`), s_amt2: toInt(val(`sqr_${t}_a2`)) || 0
      };
    });
    patch.quizRewardConfig = qr;

    const r = updateSettings(patch); if (r.ok) Toast('규칙 수치를 저장했어요', 'success');
  },
  settingsSaveText({ key, id }) { const r = updateSettings({ [key]: val(id) }); if (r.ok) Toast('저장했어요. 학생 화면에 바로 반영돼요.', 'success'); },
  effectsSave() {
    const list = state.settings.couponEffectTypes.map((e) => ({ ...e, label: val(`efl_${e.key}`) || e.label, description: val(`efd_${e.key}`), handler: val(`efh_${e.key}`) || 'teacher' }));
    const r = updateSettings({ couponEffectTypes: list }); if (r.ok) Toast('쿠폰 효과 목록을 저장했어요', 'success');
  },
  effectAdd() {
    const label = val('efNewLabel').trim(); if (!label) { Toast('효과 이름을 입력해 주세요', 'warn'); return; }
    const list = [...state.settings.couponEffectTypes, { key: `custom_${uid().slice(3, 9)}`, label, description: val('efNewDesc'), system: false, handler: val('efNewHandler') || 'teacher' }];
    const r = updateSettings({ couponEffectTypes: list }); if (r.ok) Toast('효과를 추가했어요', 'success');
  },
  effectRemove({ key }) {
    if (state.couponCatalog.some((c) => c.effectType === key)) { Toast('이 효과를 쓰는 쿠폰이 있어서 삭제할 수 없어요', 'warn'); return; }
    const r = updateSettings({ couponEffectTypes: state.settings.couponEffectTypes.filter((e) => e.key !== key) }); if (r.ok) Toast('효과를 삭제했어요', 'success');
  },
  teacherPwSave() {
    if (val('stPw') !== val('stPw2')) { Toast('두 번 입력한 비밀번호가 서로 달라요', 'warn'); return; }
    const r = updateSettings({ teacherPassword: val('stPw') }); if (r.ok) Toast('비밀번호를 바꿨어요', 'success');
  },
  resetAsk({ mode }) { Confirm(mode === 'seed' ? '샘플 데이터로 초기화' : '빈 학급으로 초기화', mode === 'seed' ? '모든 데이터를 지우고 샘플 학생 28명·쿠폰·퀴즈를 다시 만들어요. 로그아웃돼요.' : '모든 학생·거래·기록을 지워요. 설정 기본값과 공지 시드만 남아요. 로그아웃돼요.', 'resetDo', { mode }, 'btn-danger', '초기화하기'); },
  resetDo({ mode }) { closeModal(); if (mode === 'seed') resetToSeed(); else resetToEmpty(); Toast('초기화했어요', 'success'); },
});
Object.assign(ACTIONS, {
  addTimetable() {
    if(!isTeacher()) return;
    state.settings.timetable.push({start: '09:00', end: '09:40', days: [1, 2, 3, 4, 5]});
    render();
  },
  removeTimetable({idx}) {
    if(!isTeacher()) return;
    state.settings.timetable.splice(idx, 1);
    render();
  },
  saveTimetable() {
    if(!isTeacher()) return;
    const tt = state.settings.timetable;
    for(let i=0; i<tt.length; i++) {
      tt[i].start = val(`ttStart_${i}`);
      tt[i].end = val(`ttEnd_${i}`);
      
      const days = [];
      [1, 2, 3, 4, 5].forEach(d => {
        if (checked(`ttDay_${i}_${d}`)) days.push(d);
      });
      tt[i].days = days;
    }
    saveState();
    Toast('시간표를 저장했습니다.', 'success');
  },

  setTab({ key }) {
    if (
      !['numbers', 'timetable', 'texts', 'effects', 'account'].includes(key)
    ) {
      return;
    }

    guardWalletNavigation(() => {
      ui.teacherTab.settings = key;
      render();
    });
  },

  settingsSaveText({ key, id }) {
    if (
      ![
        'volunteerNotice',
        'pollutionNotice',
        'announcement',
        'lockMessage',
      ].includes(key)
    ) {
      return;
    }

    const inputs = snapshotInputs($('#app'));
    const text = val(id);

    const result = updateSettings({ [key]: text });

    restoreInputs($('#app'), inputs);

    if (result.ok) {
      Toast('문구를 저장했어요', 'success');
    }
  },

  resetDo({ mode }) {
    if (!isTeacher()) return;

    closeModal();

    ui.walletDrafts = {};
    ui.teacherDailyGrant = null;
    ui.picker.clear();
    ui.filters = {};
    ui.teacherTab = {};
    ui.teacherView = 'summary';
    ui.view = 'home';
    ui.dateKey = null;
    ui.loginUid = null;
    ui.pin = '';
    ui.pinStage = null;
    ui.pollutionNoticeOpen = false;

    if (mode === 'seed') {
      resetToSeed();
    } else {
      resetToEmpty();
    }

    Toast('초기화했어요', 'success');
  },
});

/* =====================================================
   39. 교사(관리자) 모드 – 쿠폰 발행점 · 상점 (I장) : 발행 / 발행 목록·수정 / 상점 전체(진열 관리)
===================================================== */
function CouponEditBody(c) {
  return `<div class="grid-2">${Field('이모지', 'ceEmoji', Input('ceEmoji', { value: c.emoji || '🎫', maxlength: 5 }))}${Field('쿠폰명', 'ceName', Input('ceName', { value: c.name, maxlength: 30 }))}</div>
    <div class="grid-2">${Field(`원가 (${CURRENCY_LABEL[couponCurrency(c.teamId)]})`, 'ceCost', Input('ceCost', { type: 'number', value: c.cost, min: 1 }))}${Field('선생님 재고 (비우면 무제한)', 'ceStock', Input('ceStock', { type: 'number', value: c.stock === null ? '' : c.stock, min: 0, placeholder: '무제한' }))}</div>`;
}
function renderTeacherCoupons() {
  const tab = ['issue', 'catalog', 'shop', 'purchases'].includes(
    ui.teacherTab.coupons
  )
    ? ui.teacherTab.coupons
    : 'issue';

  const tabs = Tabs(
    [
      { key: 'issue', label: '쿠폰 발행' },
      {
        key: 'catalog',
        label: '발행 목록',
        count: state.couponCatalog.length,
      },
      { key: 'shop', label: '쿠폰 상점(전체)' },
      { key: 'purchases', label: '사입 기록' },
    ],
    tab,
    'cpTab'
  );

  if (tab === 'purchases') {
    return tabs + TeamPurchaseHistoryCard('coupon');
  }

  if (tab === 'catalog') {
    const filterTeam = ui.filters.couponTeam || 'all';
    const filterTabs = Tabs([
      { key: 'all', label: '전체' },
      { key: 'black', label: '블랙팀 쿠폰' },
      { key: 'gold', label: '골드팀 쿠폰' }
    ], filterTeam, 'couponTeamFilter', {}, 'team-tabs');

    const list = state.couponCatalog
      .filter(c => filterTeam === 'all' || c.teamId === filterTeam)
      .slice()
      .sort((a, b) =>
        String(b.createdAt || '').localeCompare(
          String(a.createdAt || '')
        )
      );

    const cards = list.map((coupon) =>
      CouponCard(coupon, {
        showEffect: false,
        footer: `
          <div class="hstack" style="width:100%; justify-content:center; gap:8px;">
            ${Button({
              label: '수정',
              act: 'openCouponEdit',
              args: { id: coupon.id },
              cls: 'btn-sm btn-ghost',
            })}
            ${Button({
              label: '✕ 삭제',
              act: 'couponDeleteAsk',
              args: { id: coupon.id },
              cls: 'btn-sm btn-danger',
            })}
          </div>
        `,
      })
    ).join('');

    return tabs + Card({
      title: '발행한 쿠폰',
      body: filterTabs + (list.length
        ? `<div class="coupon-grid">${cards}</div>`
        : EmptyState('발행한 쿠폰이 없어요')),
    });
  }

  if (tab === 'shop') {
    const listings = state.couponListings
      .filter((listing) => listing.qty > 0)
      .sort((a, b) =>
        String(b.createdAt || '').localeCompare(
          String(a.createdAt || '')
        )
      );

    const cards = listings.map((listing) => {
      const footer = `
        <div class="hstack">
          <span class="help">판매가</span>
          ${NumberBox(`clu_${listing.id}`, listing.price)}

          ${Button({
            label: '가격 변경',
            act: 'couponListingPrice',
            args: { id: listing.id },
            cls: 'btn-sm',
          })}

          ${listing.status === 'active'
            ? Button({
                label: '중지(재고 회수)',
                act: 'couponListingStatus',
                args: {
                  id: listing.id,
                  status: 'stopped',
                },
                cls: 'btn-sm btn-ghost',
              })
            : ''}
        </div>
      `;

      return CouponListingCard(listing, {
        showCost: true,
        showStatus: true,
        showCreatedAt: true,
        footer,
        controls: true,
      });
    }).join('');

    const vaultRows = ['black', 'gold'].map((teamId) => {
      const currency = couponCurrency(teamId);

      const stock = sum(
        state.couponCatalog.filter(
          (coupon) => coupon.teamId === teamId
        ),
        (coupon) => coupon.teamStock
      );

      const displayed = sum(
        state.couponListings.filter(
          (listing) =>
            listing.teamId === teamId &&
            listing.status === 'active' &&
            listing.qty > 0
        ),
        (listing) => listing.qty
      );

      return Row(
        `${TeamBadge(teamId)} ${esc(getTeam(teamId).name)}`,
        `쿠폰 재고 ${stock}개 · 진열 중 ${displayed}개`,
        Badge(
          `금고 ${CURRENCY_LABEL[currency]} ${getTeam(teamId).vault[currency]}`,
          teamId === 'black' ? 'badge-point' : 'badge-gold'
        )
      );
    }).join('');

    return (
      tabs +
      Card({
        title: '쿠폰 상점 전체 (블랙·골드팀 진열)',
        body: listings.length
          ? `<div class="coupon-grid">${cards}</div>`
          : EmptyState('진열된 쿠폰이 없어요'),
      }) +
      Card({
        title: '팀별 쿠폰 금고',
        body: vaultRows,
      })
    );
  }

  const team = ui.filters.cpTeam || 'black';

  return tabs + Card({
    title: '새 쿠폰 발행',
    body: `
      <div class="grid-2">
        ${Field(
          '이모지',
          'ciEmoji',
          Input('ciEmoji', {
            placeholder: '예: 🍿',
            maxlength: 5,
          })
        )}

        ${Field(
          '쿠폰명',
          'ciName',
          Input('ciName', {
            placeholder: '예: 자리 바꾸기권',
            maxlength: 30,
          })
        )}
      </div>

      <div class="grid-2">
        ${Field(
          '대상 팀 (원가 재화)',
          'ciTeam',
          Select(
            'ciTeam',
            [
              { value: 'black', label: '블랙팀 (포인트 원가)' },
              { value: 'gold', label: '골드팀 (골드 원가)' },
            ],
            team,
            'cpTeamChange'
          )
        )}

        ${Field(
          `원가 (${CURRENCY_LABEL[couponCurrency(team)]})`,
          'ciCost',
          Input('ciCost', {
            type: 'number',
            value: 1,
            min: 1,
          })
        )}
      </div>

      ${Field(
        '수량 (비우면 무제한)',
        'ciStock',
        Input('ciStock', {
          type: 'number',
          value: 10,
          min: 0,
          placeholder: '무제한',
        })
      )}

      ${Button({
        label: '쿠폰 발행하기',
        act: 'couponIssue',
        cls: 'btn-primary btn-lg btn-block',
      })}
    `,
  });
}
Object.assign(ACTIONS, {
  cpTab({ key }) { ui.teacherTab.coupons = key; render(); },
  cpTeamChange({ value }) { ui.filters.cpTeam = value; refresh(); },
  couponTeamFilter({ key }) { ui.filters.couponTeam = key; render(); },
  couponIssue() {
    const r = issueCoupon({ emoji: val('ciEmoji'), name: val('ciName'), teamId: val('ciTeam'), cost: val('ciCost'), stock: val('ciStock') === '' ? null : val('ciStock') });
    if (r.ok) { Toast(`"${r.result.name}" 쿠폰을 발행했어요`, 'success'); ui.teacherTab.coupons = 'catalog'; render(); }
  },
  openCouponEdit({ id }) { const c = getCouponCatalog(id); Modal({ title: '쿠폰 수정', body: CouponEditBody(c), actions: [{ label: '저장', act: 'couponEditSave', args: { id }, cls: 'btn-primary' }] }); },
  couponEditSave({ id }) {
    const cost = toInt(val('ceCost')); if (!isInt(cost) || cost < 1) { Toast('원가는 1 이상의 정수예요', 'warn'); return; }
    const stockRaw = val('ceStock'); const stock = stockRaw === '' ? null : toInt(stockRaw); if (stock !== null && (!isInt(stock) || stock < 0)) { Toast('재고는 0 이상의 정수예요', 'warn'); return; }

  duty: '1인1역 미실시',

function TaxEventDetailBody(event) {
  const percentage = Math.round(event.rate * 100);
  const polluters = event.polluters || [];
