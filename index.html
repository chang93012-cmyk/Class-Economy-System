function deleteStudent(userId) {
  return runTx(() => {
    if (!isTeacher()) {
      throw new Error('선생님만 학생을 삭제할 수 있어요');
    }

    const student = getUser(userId);
    const name = student.name;
    const deletedAt = nowISO();

    cancelStudentHandovers(
      userId,
      TEACHER_ID,
      '학생 삭제로 팀장 교체 요청 취소'
    );

    TEAM_IDS.forEach((teamId) => {
      const team = getTeam(teamId);

      if (team.leaderUid !== userId) return;

      team.leaderUid = null;

      team.leaderHistory.push({
        uid: null,
        fromUid: userId,
        by: TEACHER_ID,
        at: deletedAt,
        memo: '학생 삭제로 팀장 공석',
      });
    });

    const cancelledTradeIds = [];

    state.trades.forEach((trade) => {
      if (trade.status !== 'open') return;

      const related =
        trade.createdBy === userId ||
        sameRef(trade.proposer, userRef(userId)) ||
        sameRef(trade.counterpart, userRef(userId));

      if (!related) return;

      trade.status = 'cancelled';
      trade.resolvedAt = deletedAt;
      trade.cancelReason = '학생 삭제로 미체결 거래 취소';

      cancelledTradeIds.push(trade.id);

      [trade.proposer, trade.counterpart].forEach((ref) => {
        if (
          ref?.kind === 'user' &&
          ref.id !== userId &&
          state.users[ref.id]
        ) {
          notify(
            ref.id,
            '거래와 관련된 학생이 삭제되어 미체결 거래를 취소했어요.',
            'warn',
            { tradeId: trade.id }
          );
        }
      });
    });

    let cancelledRequests = 0;

    state.requests.forEach((request) => {
      const related =
        request.fromUid === userId ||
        request.targetUid === userId;

      if (!related) return;

      if (
        cancelPendingRequest(
          request,
          TEACHER_ID,
          '학생 삭제로 미처리 요청 취소'
        )
      ) {
        cancelledRequests += 1;
      }
    });

    // 숙제 도우미는 별도 상태 모델이므로 따로 정리합니다.
    state.homeworkHelps.forEach((homework) => {
      const related =
        homework.requesterUid === userId ||
        homework.helperUid === userId;

      if (
        !related ||
        !['open', 'accepted', 'done'].includes(homework.status)
      ) {
        return;
      }

      homework.status = 'cancelled';
      homework.cancelledAt = deletedAt;
      homework.cancelReason = '학생 삭제로 도움 요청 취소';

      const otherUid =
        homework.requesterUid === userId
          ? homework.helperUid
          : homework.requesterUid;

      if (otherUid && otherUid !== userId) {
        notify(
          otherUid,
          '관련 학생이 삭제되어 숙제 도움 요청을 취소했어요.',
          'warn',
          { homeworkId: homework.id }
        );
      }
    });

    const discardedCoupons = student.coupons.length;

    // 잔고·보유 쿠폰·알림을 포함한 학생 객체를 완전히 제거합니다.
    // 거래·승인 요청·출석 기록·로그·완료된 도움 기록은 보존합니다.
    delete state.users[userId];

    return {
      userId,
      name,
      cancelledTrades: cancelledTradeIds.length,
      cancelledRequests,
      discardedCoupons,
    };
  });
}

function getTeacherAdjustmentTotals() {
  const totals = Object.fromEntries(
    CURRENCIES.map((currency) => [
      currency,
      {
        minted: 0,
        removed: 0,
        confiscated: 0,
        distributed: 0,
        count: 0,

    ])
  );

  const managementTypes = new Set([
    'adminGrant',
    'adminAdjust',
    'confiscate',
    'vaultToUser',
  ]);

  state.transactions.forEach((transaction) => {
    const row = totals[transaction.currency];

    if (!row || !managementTypes.has(transaction.type)) {
      return;

    row.count += 1;

    if (transaction.type === 'vaultToUser') {
      row.distributed += transaction.amount;
      return;
    }

    if (!transaction.from && transaction.to) {
      row.minted += transaction.amount;
    }

    if (transaction.from && !transaction.to) {
      row.removed += transaction.amount;

      if (transaction.type === 'confiscate') {
        row.confiscated += transaction.amount;
      }
    }
  });

  return totals;

  if (measuredListFrame) return;

  measuredListFrame = requestAnimationFrame(() => {
    measuredListFrame = 0;
    updateMeasuredRecordLists();
  });

function updateMeasuredRecordLists() {
  const containers = Array.from(
    document.querySelectorAll(
      '#app [data-list-visible], #modal-root [data-list-visible]'
    )
  );

  const nextObserved = new Set();

  containers.forEach((container) => {
    if (!container.isConnected) return;

    const rows = Array.from(container.children).filter(
      (element) => element.classList.contains('row')
    );

    nextObserved.add(container);
    rows.forEach((row) => nextObserved.add(row));

    const visibleCount = Math.max(
      1,
      Number(container.dataset.listVisible) || 1
    );

    if (!container.getClientRects().length) {
      return;
    }

    if (rows.length <= visibleCount) {
      if (container.style.maxHeight !== 'none') {
        container.style.maxHeight = 'none';
      }
      return;
    }

    const containerTop = container.getBoundingClientRect().top;
    const lastVisibleBottom =
      rows[visibleCount - 1].getBoundingClientRect().bottom;

    const height = Math.max(
      0,
      lastVisibleBottom - containerTop + container.scrollTop
    );

    if (height <= 0) return;

    const nextHeight = `${height}px`;

    if (container.style.maxHeight !== nextHeight) {
      container.style.maxHeight = nextHeight;
    }
  });

  if (!measuredListResizeObserver) return;

  measuredListObserved.forEach((element) => {
    if (!nextObserved.has(element)) {
      measuredListResizeObserver.unobserve(element);
      measuredListObserved.delete(element);
    }
  });

  nextObserved.forEach((element) => {
    if (measuredListObserved.has(element)) return;

    measuredListObserved.add(element);
    measuredListResizeObserver.observe(element);
  });

    emoji: emojiOverride,
    controls = false,
  } = options;

  const effect = effectType(c.effectType);
  const currency = couponCurrency(c.teamId);

  const emoji =
    String(emojiOverride || c.emoji || '').trim() ||
    COUPON_TEAM_EMOJI[c.teamId] ||
    '🎫';

  const lines = Array.isArray(metaLines)
    ? metaLines
    : [
        `원가 ${c.cost} ${CURRENCY_LABEL[currency]}`,
        `선생님 재고 ${c.stock === null ? '무제한' : c.stock} · ` +
          `${teamStockLabel} ${c.teamStock}`,
        c.expiresAt ? `유효기간 ${c.expiresAt}` : '',
      ].filter(Boolean);

  const text = description === undefined
    ? c.description || ''
    : description;

  return `
    <div class="coupon-card team-${esc(c.teamId || '')}">
      <div class="coupon-card-head">
        <span>${TeamBadge(c.teamId)}</span>
        <span>
          ${showEffect && effect ? Badge(effect.label, 'badge-outline') : ''}
          ${headExtra}
        </span>
      </div>

      <div class="coupon-card-body">
        <div class="coupon-card-emoji" aria-hidden="true">
          ${esc(emoji)}
        </div>

        <div class="coupon-card-name">${esc(c.name)}</div>

        ${lines.map((line) =>
          `<div class="coupon-card-meta">${esc(line)}</div>`
        ).join('')}

        ${text ? `<p class="coupon-card-desc">${esc(text)}</p>` : ''}
      </div>

      ${footer ? `
        <div class="coupon-card-footer${controls ? ' coupon-card-controls' : ''}">
          ${footer}
        </div>
      ` : ''}
    </div>
  `;
}



/* =====================================================
   20. render() – 역할별 라우팅
===================================================== */
function normalizeUiState() {
  ui.sub = ui.sub || {};
  ui.teacherTab = ui.teacherTab || {};
  ui.filters = ui.filters || {};
  ui.walletDrafts = ui.walletDrafts || {};

  ui.walletFilter = ui.walletFilter || {
    teamId: 'all',
    query: '',
  };

  if (!TEAM_IDS.includes(ui.walletFilter.teamId)) {
    ui.walletFilter.teamId = 'all';
  }

  ui.walletFilter.query = String(
    ui.walletFilter.query || ''
  );

    if (ui.teacherView === 'daily') {
    ui.teacherView = 'summary';

    ui.teacherSummaryPane =
      ['life', 'credit'].includes(ui.teacherDailyGrant)
        ? ui.teacherDailyGrant
        : 'attendance';

    ui.picker.clear();
    ui.filters.attSeed = null;
  }

  if (
    !['attendance', 'life', 'credit', 'quiz'].includes(
      ui.teacherSummaryPane
    )
  ) {
    ui.teacherSummaryPane = 'attendance';
  }

  const teacherViews = [
    'summary',
    'approvals',
    'coupons',
    'warehouse',
    'pollution',
    'manage',
    'history',
    'students',
    'settings',
  ];


  if (!teacherViews.includes(ui.teacherView)) {
    ui.teacherView = 'summary';
  }

    const allowedTabs = {
    students: ['list', 'add', 'leaders'],
    settings: ['numbers', 'texts', 'effects', 'account'],
    coupons: ['issue', 'catalog', 'shop', 'purchases'],
    warehouse: ['add', 'catalog', 'listings', 'purchases'],
    manage: ['wallets', 'trades'],
    history: ['transactions', 'statistics'],
  };


  Object.entries(allowedTabs).forEach(([group, keys]) => {
    if (!keys.includes(ui.teacherTab[group])) {
      ui.teacherTab[group] = keys[0];
    }
  });

  const permittedTeacherTabKeys = new Set([
    ...Object.keys(allowedTabs),
    'grantCur',
  ]);

  Object.keys(ui.teacherTab).forEach((key) => {
    if (!permittedTeacherTabKeys.has(key)) {
      delete ui.teacherTab[key];
    }
  });

  if (!['life', 'credit'].includes(ui.teacherTab.grantCur)) {
    ui.teacherTab.grantCur = 'life';
  }

  const studentViews = [
    'home',
    'team',
    'trade',
    'store',
    'coupons',
    'quiz',
    'homework',
  ];

  if (!studentViews.includes(ui.view)) {
    ui.view = 'home';
  }

  if (ui.loginUid && !state.users[ui.loginUid]) {
    ui.loginUid = null;
    ui.pin = '';
  }

  const student = currentUser();

  if (student) {
    const teamKeys = [
      ...teamTabsFor(student).map((tab) => tab.key),
      'approvals',
      'teamHistory',
    ];

    if (!teamKeys.includes(ui.sub.team)) {
      ui.sub.team = teamKeys[0];
    }
  }
}

function syncBodyClasses() {
  const student =
    session && session.role === 'student' && state
      ? state.users[session.uid]
      : null;

  const teamId =
    student &&
    !student.mustResetPin &&
    TEAM_IDS.includes(student.teamId)
      ? student.teamId
      : null;

  TEAM_IDS.forEach((id) => {
    document.body.classList.toggle(
      `theme-team-${id}`,
      id === teamId
    );
  });

  document.body.classList.toggle(
    'is-locked',
    isSessionLocked()
  );
}



function render() {
  const app = $('#app');
  if (!app || !state) return;

  const scrollY = window.scrollY;
  let html;

  try {
    if (
      session &&
      session.role === 'student' &&
      !state.users[session.uid]
    ) {
      session = null;
      saveSession();
    }

    normalizeUiState();

    if (!session) {
      html = renderLogin();
    } else if (session.role === 'teacher') {
      html = renderTeacher();
    } else {
      const student = currentUser();

      html = !student
        ? renderLogin()
        : student.mustResetPin
          ? renderPinReset(student)
          : renderStudent(student);
    }
  } catch (error) {
    console.error('[render 실패]', error);

    html = `
      <div class="topbar">
        <div class="title">학급 경제 시스템</div>
      </div>
      ${Card({
        cls: 'card-danger',
        title: '화면을 그리는 중 문제가 생겼어요',
        body: `
          <p
            class="pre muted"
            style="margin-bottom:12px"
          >${esc(error?.message || error)}</p>
          ${Button({
            label: '로그아웃하고 처음 화면으로',
            act: 'logout',
            cls: 'btn-primary btn-lg btn-block',
          })}
        `,
      })}
    `;
  }

    syncBodyClasses();
  app.innerHTML = html;
  renderModal();
  window.scrollTo(0, scrollY);
  scheduleMeasuredRecordLists();
}


/* =====================================================
   21. 첫 화면 – 학생 로그인 / 교사 로그인 / PIN
===================================================== */
function Keypad(backAct = null, backLabel = '') {
  const dots = [0, 1, 2, 3].map((i) => `<span class="pin-dot ${ui.pin.length > i ? 'filled' : ''}"></span>`).join('');
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'back', '0', 'cancel'];
  return `<div class="pin-dots" aria-label="입력한 자리 수 ${ui.pin.length}">${dots}</div><div class="keypad">${keys.map((k) => {
    if (k === 'back') return `<button type="button" class="key" ${act('pinKey', { k: 'back' })} aria-label="지우기">←</button>`;
    if (k === 'cancel') return backAct ? `<button type="button" class="key key-ghost" ${act(backAct)}>${esc(backLabel)}</button>` : '<span></span>';
    return `<button type="button" class="key" ${act('pinKey', { k })}>${k}</button>`;
  }).join('')}</div>`;
}function renderLogin() {
  const tabs = `<div class="login-tabs">
    <button type="button" class="tab ${ui.loginTab === 'student' ? 'active' : ''}" ${act('loginTab', { tab: 'student' })}>학생 로그인</button>
    <button type="button" class="tab ${ui.loginTab === 'teacher' ? 'active' : ''}" ${act('loginTab', { tab: 'teacher' })}>교사 로그인</button></div>`;
  let body;
  if (ui.loginTab === 'teacher') {
    body = Card({ title: '교사 로그인', body: `${Field('비밀번호', 'teacherPw', `<input id="teacherPw" class="input" type="password" placeholder="비밀번호" autocomplete="current-password">`)}${Button({ label: '로그인', act: 'teacherLogin', cls: 'btn-primary btn-block btn-lg' })}<p class="help" style="margin-top:8px">기본 비밀번호는 1234예요. 교사(관리자) 모드 설정에서 바꿀 수 있어요.</p>` });
  } else if (!ui.loginUid) {
    const list = activeStudents();
    body = Card({ title: '이름을 눌러 주세요', body: list.length ? NameGrid(list, 'loginPick') : EmptyState('등록된 학생이 없어요. 선생님이 먼저 학생을 추가해 주세요.') });
  } else {
    const u = getUser(ui.loginUid);
    body = Card({ title: `${u.name} · PIN 번호 4자리`, right: TeamBadge(u.teamId), body: Keypad('loginBack', '다른 이름') });
  }
  return `<div class="topbar"><div class="title">학급 경제 시스템</div><span class="muted num">${getDateKey()} ${getTimeKey()}</span></div>${tabs}${body}`;
}function renderPinReset(u) {
  const step = ui.pinStage && ui.pinStage.first !== null ? 2 : 1;
  return `<div class="topbar"><div class="title">PIN 번호 새로 만들기</div>${Button({ label: '로그아웃', act: 'logout', cls: 'btn-ghost btn-sm' })}</div>
    ${Card({ title: `${u.name}, 새 PIN을 만들어요`, right: Badge(`${step} / 2 단계`), body: `<p style="margin-bottom:12px">${step === 1 ? '사용할 새 PIN 4자리를 눌러 주세요. 0000은 사용할 수 없어요.' : '확인을 위해 같은 PIN을 한 번 더 눌러 주세요.'}</p>${Keypad(step === 2 ? 'pinResetRestart' : null, '처음부터')}` })}`;
}async function handlePinComplete(pin) {
  if (!session) {
    const r = await loginStudent(ui.loginUid, pin);
    ui.pin = '';
    if (!r.ok) { Toast(r.error, 'danger'); render(); return; }
    ui.loginUid = null; ui.view = 'home'; ui.pinStage = null; render(); return;
  }
  const u = currentUser();
  if (!u || !u.mustResetPin) { ui.pin = ''; render(); return; }
  if (!ui.pinStage) ui.pinStage = { first: null };
  if (pin === '0000') { Toast('0000은 사용할 수 없어요', 'danger'); ui.pin = ''; render(); return; }
  if (ui.pinStage.first === null) { ui.pinStage.first = pin; ui.pin = ''; render(); return; }
  const r = await setPin(u.id, ui.pinStage.first, pin);
  ui.pin = '';
  if (!r.ok) { Toast(r.error || '두 번 입력한 PIN이 서로 달라요', 'danger'); ui.pinStage = { first: null }; render(); return; }
  ui.pinStage = null; Toast('새 PIN을 저장했어요!', 'success'); render();
}Object.assign(ACTIONS, {
  loginTab({ tab }) { ui.loginTab = tab; ui.loginUid = null; ui.pin = ''; render(); },
  loginPick({ uid: id }) { ui.loginUid = id; ui.pin = ''; render(); },
  loginBack() { ui.loginUid = null; ui.pin = ''; render(); },
  pinResetRestart() { ui.pinStage = { first: null }; ui.pin = ''; render(); },
  pinKey({ k }) {
    if (k === 'back') { ui.pin = ui.pin.slice(0, -1); render(); return; }
    if (ui.pin.length >= 4) return;
    ui.pin += k; render();
    if (ui.pin.length === 4) return handlePinComplete(ui.pin);
  },
  teacherLogin() { const r = loginTeacher(val('teacherPw')); if (!r.ok) { Toast(r.error, 'danger'); return; } ui.teacherView = 'summary'; render(); },
  logout() { ui.view = 'home'; ui.pinStage = null; ui.pin = ''; ui.picker.clear(); closeModal(); logout(); },
  closeModal() { closeModal(); },
  modalBackdrop(args, el, e) { if (e && e.target === el) closeModal(); },
  pickToggle({ uid: id, single }) { if (single) { const had = ui.picker.has(id); ui.picker.clear(); if (!had) ui.picker.add(id); } else if (ui.picker.has(id)) ui.picker.delete(id); else ui.picker.add(id); refresh(); },
  subTab({ group, key }) { ui.sub[group] = key; ui.picker.clear(); render(); },
});
ACTIONS.logout = () => {
  guardWalletNavigation(() => {
    ui.view = 'home';
    ui.teacherView = 'summary';
    ui.teacherDailyGrant = null;
    ui.pinStage = null;
    ui.pin = '';
    ui.loginUid = null;
    ui.picker.clear();
    ui.walletDrafts = {};
    ui.filters.attSeed = null;
    ui.pollutionNoticeOpen = false;
    ui.isIdle = false; // 🛑 로그아웃 시 휴면 상태 해제

    closeModal();
    logout();
  });
};

function studentNavItems(u) {

}

// 기존 renderStudent 내부의 교체 부분
  const renderView = views[ui.view] || renderHome;

  const targets = getServiceTargetsFor(student.id);

  // 🛑 추가: 휴면 화면 UI 함수

   23. 학생 홈 (L장) – 재화 카드 / 액션 버튼 / 게이지 / 경고 카드 / 알림

function LifeSubmitButton(u) {
  const st = getLifeSubmitStatus(u.id);

  const map = {
    ready: { label: '라이프 제출', sub: `마감 ${dl} · ${minutesUntilDeadline()}분 남음`, disabled: false },
    done: { label: '제출 완료', sub: '오늘 제출을 마쳤어요', disabled: true },
    late: { label: '마감 시간이 지났어요', sub: `마감 ${dl} · 내일 봉사 후 환생`, disabled: true },

  }[st];
  return Button({ label: map.label, sub: map.sub, act: 'submitLife', cls: 'btn-life btn-action', disabled: map.disabled });
}function renderHome(student) {
  const settings = state.settings;
  const parts = [];
  const team = getTeam(student.teamId);

  // 팀장 인계 UI
  if (team.pendingHandover?.toUid === student.id) {
    const handover = team.pendingHandover;
    parts.push(Card({
      cls: 'card-soft',
      title: `${actorName(handover.fromUid)}이(가) 팀장을 넘기려고 해요`,
      body: `<div class="grid-2">${Button({ label: '팀장 변경 수락', act: 'resolveReq', args: { id: handover.requestId, decision: 'approve' }, cls: 'btn-primary btn-lg' })}${Button({ label: '거절', act: 'resolveReq', args: { id: handover.requestId, decision: 'reject' }, cls: 'btn-ghost btn-lg' })}</div>`,
    }));
  }

  // 봉사 대상자 잠금은 renderStudent의 전체 화면 오버레이(.lock-overlay)에서 처리해요.

  // 퀴즈 보상 대기
  pendingRequests({ type: 'quizReward', targetUid: student.id }).filter((r) => r.status === 'awaitingChoice').forEach((request) => {
    const choices = request.payload.choices || [{cur:'life', amt:request.payload.amount}, {cur:'credit', amt:request.payload.amount}];
    const buttons = choices.map((c, idx) => Button({ label: `${CURRENCY_LABEL[c.cur]} ${c.amt}개`, act: 'claimQuiz', args: { id: request.id, choiceIdx: idx }, cls: `btn-${c.cur} btn-lg` })).join('');

    }));
  });

  // 숙제 도우미 확인 대기

    }));
  });

  // 내 재화 카드
  const ecoTarget = Math.max(1, settings.ecoGaugeTarget || 10);
  const ecoGaugeVal = student.ecoGauge || 0;
  const ecoPct = Math.min(100, (ecoGaugeVal / ecoTarget) * 100);

  parts.push(Card({
    title: '내 재화',
    body: `
      ${CurrencyGrid(student.balances)}${settings.useEcoGauge ? `
        <div style="margin-top:16px; padding-top:16px; border-top:1px dashed var(--border);">
          <div class="gauge" role="meter">
            <div class="gauge-head">
              <span>🌱 무공해 크레딧 보상 게이지</span>
              ${Badge('보상 골드 +1', 'badge-gold')}
            </div>
            <div class="gauge-track">
              <div class="gauge-fill" style="width:${ecoPct}%; background:var(--clean);"></div>
              <div class="gauge-text num">${ecoGaugeVal} / ${ecoTarget}</div>
            </div>
          </div>
        </div>
      ` : ''}
      <div class="action-row" style="margin-top:16px">
        ${LifeSubmitButton(student)}
        ${Button({ label: '크레딧 지불하기', sub: '오프라인 특권 사용', act: 'openPay', cls: 'btn-credit btn-action' })}
      </div>
      <div class="hstack" style="margin-top:12px">
        ${Button({ label: `무공해로 바꾸기 (일반 ${settings.cleanCreditRate}개 → 무공해 1개)`, act: 'exchangeClean', cls: 'btn-clean btn-sm', disabled: student.balances.credit < settings.cleanCreditRate })}
        ${Button({ label: '팀 금고에 재화 옮기기', act: 'openVaultDeposit', cls: 'btn-sm', disabled: !CURRENCIES.some((c) => student.balances[c] > 0) })}
      </div>
    `,
  }));

  // 알림 · 이력 · 공지 통합 카드
  parts.push(HomeFeedCard(student));

  return parts.join('');
}

function renderCouponsView(u) {
  const groups = [
    ['unused', '사용 가능'],
    ['pendingRedeem', '확인 대기'],
    ['expired', '기간 만료'],
  ];

  const visibleStatuses = new Set(
    groups.map(([key]) => key)
  );

  const list = u.coupons
    .map((coupon) => ({
      coupon,
      status: couponStatus(coupon),
    }))
    .filter((entry) => visibleStatuses.has(entry.status))
    .sort((a, b) =>
      String(b.coupon.acquiredAt || '').localeCompare(
        String(a.coupon.acquiredAt || '')
      )
    );

  if (!list.length) {
    return Card({
      title: '내 쿠폰함',
      body: EmptyState(
        '표시할 쿠폰이 없어요. 매점의 쿠폰 상점에서 살 수 있어요.'
      ),
    });
  }

  return groups.map(([key, label]) => {
    const entries = list.filter(
      (entry) => entry.status === key
    );

    if (!entries.length) return '';

    const cards = entries.map(({ coupon, status }) => {
      const catalog = state.couponCatalog.find(
        (candidate) => candidate.id === coupon.catalogId
      ) || {};

      const teamId = coupon.teamId || catalog.teamId;

      const display = Object.assign({}, coupon, {
        teamId,
        name: coupon.name || catalog.name || '쿠폰',
      });

      const emoji =
        coupon.emoji ||
        catalog.emoji ||
        COUPON_TEAM_EMOJI[teamId] ||
        '🎫';

      const metaLines = [];

      if (coupon.price !== undefined && coupon.price !== null) {
        metaLines.push(
          `구매가 ${coupon.price} ${CURRENCY_LABEL[couponCurrency(teamId)]}`
        );
      }

      if (coupon.expiresAt) {

      }

      if (coupon.acquiredAt) {

      }

        footer = Badge('담당자 확인 중', 'badge-point');
      }

      return CouponCard(display, {
        emoji,
        metaLines,
        description:
          coupon.description === undefined

function HomeFeedCard(student) {
  const tab = ['notifications', 'history', 'notices'].includes(ui.sub.homeFeed) ? ui.sub.homeFeed : 'notifications';
  const unread = student.notifications.filter((n) => !n.read).length;

  // 새 공지 확인: 공지 탭을 열고 있다면 '마지막으로 공지를 확인한 시간'을 지금으로 업데이트합니다.
  if (tab === 'notices') {
    const hasNew = state.notices.some(n => !student.lastNoticeViewedAt || n.createdAt > student.lastNoticeViewedAt);
    if (hasNew || !student.lastNoticeViewedAt) {
      student.lastNoticeViewedAt = nowISO();
      Promise.resolve().then(() => saveState());
    }
  }

  // 안 읽은 새 공지 개수 계산
  const unreadNotices = state.notices.filter((n) => !student.lastNoticeViewedAt || n.createdAt > student.lastNoticeViewedAt).length;

  const tabs = Tabs(
    [
      { key: 'notifications', label: '알림', count: unread },
      { key: 'history', label: '이력' },
      { key: 'notices', label: '공지', count: unreadNotices }, // 여기에 새 공지 개수가 표시됩니다!
    ],
    tab,
    'subTab',
    { group: 'homeFeed' }
  );

  let right = '';
  let body;

  if (tab === 'notifications') {
    const notifications = student.notifications.slice(0, 20);
    right = unread ? Button({ label: '모두 읽음', act: 'markRead', cls: 'btn-sm btn-ghost' }) : '';
    body = notifications.length
      ? notifications.map((n) => Row(`${Badge(n.read ? '읽음' : '새 알림', n.read ? 'badge-outline' : NotifBadge(n.kind))} <span class="pre">${esc(n.message)}</span>`, formatDateTime(n.createdAt))).join('')
      : EmptyState('아직 알림이 없어요');

    const list = state.notices
      .filter((n) => cat === '전체' || n.category === cat)

    body = Tabs(cats.map((c) => ({ key: c, label: c })), cat, 'noticeCat')
      + (list.length
        ? list.map((n) => Row(`${n.pinned ? Badge('고정', 'badge-point') : ''} ${Badge(n.category, 'badge-outline')} ${esc(n.title)}`, `<span class="pre">${esc(n.body)}</span>`)).join('')
        : EmptyState('공지가 없어요'));
  }

  return Card({ title: '알림 · 이력 · 공지', right, body: tabs + body });
}

function getVaultHistoryEntries(teamId) {
  const ref = vaultRef(teamId);
  const team = getTeam(teamId);

  const transactions = state.transactions.filter(
    (transaction) => txInvolves(transaction, ref)
  );

  const allTransactionIds = new Set(
    state.transactions.map((transaction) => transaction.id)
  );

  const usedMatches = new Set();

  (team.vaultLog || []).forEach((log) => {
    if (log.ref?.txId && allTransactionIds.has(log.ref.txId)) {
      usedMatches.add(log.ref.txId);
    }
  });

  const entries = transactions.map((transaction) => ({
    at: transaction.createdAt || '',
    transaction,
    legacy: null,
  }));

  (team.vaultLog || []).forEach((log) => {
    if (log.ref?.txId && allTransactionIds.has(log.ref.txId)) {
      return;
    }

    let expectedType = null;
    let expectedFrom = null;
    let expectedTo = null;

    if (log.type === 'deposit') {
      expectedType = 'userToVault';
      expectedFrom = userRef(log.fromUid);
      expectedTo = ref;
    } else if (log.type === 'distribute') {
      expectedType = 'vaultToUser';
      expectedFrom = ref;
      expectedTo = userRef(log.toUid);
    }

    const matches = expectedType
      ? transactions.filter((transaction) =>
          !usedMatches.has(transaction.id) &&
          transaction.type === expectedType &&
          transaction.currency === log.currency &&
          transaction.amount === log.amount &&
          transaction.createdBy === log.fromUid &&
          transaction.createdAt === log.at &&
          sameRef(transaction.from, expectedFrom) &&
          sameRef(transaction.to, expectedTo)
        )
      : [];

    if (matches.length === 1) {
      usedMatches.add(matches[0].id);
      return;
    }

    entries.push({
      at: log.at || '',
      transaction: null,
      legacy: log,
    });
  });

  return entries.sort((a, b) =>
    String(b.at).localeCompare(String(a.at))
  );
}

function renderTeamHistory(u) {
  const team = getTeam(u.teamId);
  const ref = vaultRef(u.teamId);

  const histories = team.leaderHistory
    .slice()

  const entries = getVaultHistoryEntries(u.teamId);

  const requests = state.requests
    .filter((request) =>
      request.teamId === u.teamId &&
      !['pending', 'awaitingChoice'].includes(request.status)
    )
    .sort((a, b) =>
      String(b.resolvedAt || b.createdAt).localeCompare(
        String(a.resolvedAt || a.createdAt)
      )
    );

  const vaultRows = entries.map((entry) => {
    if (entry.transaction) {
      return VaultTransactionRow(entry.transaction, ref);
    }

    const log = entry.legacy;
    const deposit = log.type === 'deposit';
    const currencyLabel = CURRENCY_LABEL[log.currency] || log.currency;
    const direction = deposit ? '入金' : '出金';
    const directionLabel = direction === '入金' ? '입금' : '출금';
    const sign = deposit ? '+' : '−';
    const counterpart = deposit ? log.fromUid : log.toUid;

    const feeText = log.feeCredit
      ? `<br>과거 분배 당시 팀장 크레딧 ${log.feeCredit}개 사용 기록이 있어요.`
      : '';

    return Row(
      `${Badge('구버전 기록', 'badge-outline')} ` +
      `${Badge(deposit ? '금고에 옮기기' : '금고 분배')} ` +
      `<span class="num">${directionLabel} ${sign}${log.amount} ${esc(currencyLabel)}</span>`,
      `${log.at ? formatDateTime(log.at) : '시각 미기록'} · ` +
      `처리자 ${esc(actorName(log.fromUid))} · ` +
      `상대 ${esc(actorName(counterpart))}<br>` +
      `사유: ${esc(log.memo || '기록된 사유가 없어요')}` +

            `${esc(history.uid ? actorName(history.uid) : '공석')}` +
            `${history.fromUid ? ` ← ${esc(actorName(history.fromUid))}` : ''}`,
            `${formatDateTime(history.at)} · ` +
            `${esc(history.memo || '')} · ` +
            `처리 ${esc(actorName(history.by))}`
          )).join('')
        : EmptyState('이력이 없어요'),
    }) +
    Card({
      title: '금고 재화 이력',
      right: Badge(`전체 ${entries.length}건`, 'badge-outline'),
      body: entries.length
        ? vaultRows
        : EmptyState('금고 재화 이력이 없어요'),
    }) +
    Card({
      title: '처리된 요청',
      right: Badge(`전체 ${requests.length}건`, 'badge-outline'),
      body: requests.length
        ? MeasuredRecordList(requestRows, 5, '팀의 처리된 요청')
        : EmptyState('처리된 요청이 없어요'),
    })
  );

function GrantPicker(

) {
  if (!['life', 'credit'].includes(currency)) {
    return EmptyState('지급할 재화를 선택해 주세요');
  }

  const teamId = currency === 'life' ? 'blue' : 'red';
  const actor = currentActorUid();
  const teacher = isTeacher();

  if (!teacher && !isTeamMember(actor, teamId)) {
    return EmptyState('이 재화를 지급할 권한이 없어요');
  }

  const leader = teacher || isLeader(actor);
  const flag = currency === 'life' ? 'lifeGranted' : 'creditGranted';
  const label = CURRENCY_LABEL[currency];
  const attendanceSaved = isAttendanceSaved(dateKey);
  const closed = getGrantClosed(currency, dateKey);
  const students = activeStudents();
  const canGrant = leader && (teacher || !closed);

  const statusOf = (student) => {
    if (!isPresent(student.id, dateKey)) return '결석';
    if (!attendanceSaved) return '출석 확인 전';
    if (getStudentDay(student.id, dateKey)?.[flag]) return '지급 완료';
    return '';
  };

  const disabledReason = (student) => {
    const status = statusOf(student);
    if (status) return status;
    if (!leader) return '미지급';
    if (closed && !teacher) return '지급 종료';
    return '';
  };

  // 팀장이 아닌 팀원: 읽기 전용(오늘 지급 결과 + 모두 비활성인 학생 격자)
  if (!leader) {
    return Card({
      title: `${label} 지급 결과 (${dateKey})`,
      right: closed
        ? Badge(`지급 종료됨 ${formatTime(closed.closedAt)}`, 'badge-outline')
        : Badge('지급 진행 중', 'badge-clean'),
      body: `
        <p class="help" style="margin-bottom:var(--sp-3)">${label} 지급과 지급 종료는 ${TEAM_LABEL[teamId]}팀 팀장만 할 수 있어요. 여기서는 오늘 지급 결과만 볼 수 있어요.</p>

          ${StudentPicker({ students, disabledOf: disabledReason, subOf: (student) => `${TEAM_LABEL[student.teamId]}팀` })}
        </div>
      `,
    });
  }

  const selectable = new Set(
    students.filter((student) => !disabledReason(student)).map((student) => student.id)
  );

  [...ui.picker].forEach((userId) => {
    if (!selectable.has(userId)) ui.picker.delete(userId);
  });

  const selectedCount = ui.picker.size;

  const closeControl = closed
    ? `<div class="hstack" style="justify-content:center">${Badge(`지급 종료됨 ${formatTime(closed.closedAt)} · 미지급 ${closed.missingCount}명`, 'badge-outline')}</div>`
    : Button({
        label: `오늘의 ${label} 지급 종료`,
        act: 'grantCloseAsk',
        args: { currency, dateKey },
        cls: 'btn-warn btn-lg',
        disabled: !attendanceSaved,
      });

  return Card({
    title: `${label} 지급 (${dateKey})`,
    right: Badge(`선택 ${selectedCount}명`) + (closed ? Badge('지급 종료', 'badge-warn') : ''),
    body: `
      ${!attendanceSaved ? `<div class="card card-warn" style="margin-bottom:var(--sp-3)">선생님이 먼저 출석 체크를 해 주세요</div>` : ''}

      <div class="grid-2" style="margin-top:var(--sp-4)">
        ${Button({
          label: `선택 학생 ${label} +1`,
          act: 'grantSubmit',
          args: { currency, dateKey },
          cls: `btn-${currency} btn-lg`,
          disabled: !attendanceSaved || selectedCount === 0 || !canGrant,
        })}
        ${closeControl}
      </div>
      ${closed ? `<div style="margin-top:var(--sp-3)">${GrantResultSummary(currency, dateKey)}</div>` : ''}
    `,
  });

/** 봉사 확인 보상 게이지 – PollutionGauge와 같은 .gauge 구조 재사용, 채움색 --life */
function ServiceGauge(student) {
  const max = Math.max(1, toInt(state.settings.serviceGaugeMax) || 1);
  const value = clamp(Number.isSafeInteger(student.serviceGauge) ? student.serviceGauge : 0, 0, max);
  const pct = (value / max) * 100;
  const remain = max - value;
  const label = `나의 봉사 확인 ${value} / ${max}. 보상까지 ${remain}회 남음`;
  return `
    <div class="gauge gauge-service" role="meter" aria-label="${esc(label)}" aria-valuemin="0" aria-valuemax="${max}" aria-valuenow="${value}">
      <div class="gauge-head">
        <span>나의 봉사 확인</span>
        ${Badge('보상 라이프 +1', 'badge-life')}
      </div>
      <div class="gauge-track">
        <div class="gauge-fill" style="width:${pct}%"></div>
        <div class="gauge-text num">${value} / ${max}</div>
      </div>
      <div class="gauge-sub">나의 봉사 확인 ${value} / ${max} · 보상까지 ${remain}회 남음</div>
    </div>
  `;
}
function ServiceGaugeCard(student) {
  const max = Math.max(1, toInt(state.settings.serviceGaugeMax) || 1);
  return Card({
    title: '봉사 확인 보상 게이지',
    body: `
      ${ServiceGauge(student)}
      <p class="help" style="margin-top:var(--sp-2)">봉사 완료를 ${max}회 확인하면 라이프 1개를 받고 게이지가 0으로 돌아가요. 선생님이 확인한 건은 게이지에 포함되지 않아요.</p>
    `,
  });
}

function ServiceTargetsCard() {
  const pending = getServiceTargets();
  const today = getDateKey();
  const lookback = state.settings.serviceLookbackDays;
  const completed = [];
  
  for (let i = 0; i < lookback; i++) {
     const dk = shiftDateKey(today, -i);
     const r = state.dailyRecords[dk];
     if (!r) continue;
     activeStudents().forEach(u => {
        const d = r.students[u.id];
        // 라이프 미제출(lifeOnTime: false)이었으나 봉사 완료(serviceDone: true)된 이력 수집
        if (d && d.serviceDone && !d.lifeOnTime && d.present !== false) {
           completed.push({ dateKey: dk, uid: u.id, memo: d.serviceMemo || '' });
        }
     });
  }
  completed.sort((a,b) => b.dateKey.localeCompare(a.dateKey));

  const showHistory = !!ui.filters.showServiceHistory;
  
  // 🛑 추가된 부분: 현재 화면을 보는 사람이 선생님인지 확인합니다.
  const isT = isTeacher(); 

  const pendingRows = pending.map(x => {
     const d = getStudentDay(x.uid, x.dateKey);
     const memo = d && d.serviceMemo ? d.serviceMemo : '';
     
     // 🛑 수정된 부분: 선생님(isT)이면 무조건 false(활성화), 블루팀이면 메모가 없을 때만 비활성화!
     const disabled = isT ? false : !memo; 
     
     const memoDisplay = memo 
       ? `<div class="muted" style="margin-top:4px;">↳ 제출 내용: ${esc(memo)}</div>`
       : `<div class="muted" style="margin-top:4px; color:var(--warn);">↳ 아직 내용을 제출하지 않았어요</div>`;

     return Row(
        `${esc(actorName(x.uid))} ${TeamBadge(state.users[x.uid]?.teamId)}`,
        `${x.dateKey} 라이프 미제출${memoDisplay}`,
        Button({ label: '봉사 완료', act: 'serviceDone', args: { uid: x.uid, dateKey: x.dateKey }, cls: 'btn-life btn-sm', disabled })
     );
  }).join('');

  const completedRows = completed.map(x => {
     return Row(
        `${esc(actorName(x.uid))} ${TeamBadge(state.users[x.uid]?.teamId)}`,
        `${x.dateKey} 봉사 승인됨<br><span class="muted">↳ ${esc(x.memo || '내용 없음')}</span>`,
        Badge('승인 완료', 'badge-clean')
     );
  }).join('');

  return Card({ title: '봉사 대상 명단', right: Badge(`${pending.length}건`, pending.length ? 'badge-warn' : 'badge-outline'), body: `
    <div class="card card-warn" style="margin-bottom:12px"><p class="label">현재 봉사 안내문</p><p class="pre">${esc(state.settings.volunteerNotice)}</p></div>
    <div class="hstack between" style="margin-bottom:12px;">
      <span class="label">승인 대기 명단</span>
      ${Button({ label: showHistory ? '완료 이력 숨기기' : '완료된 이력 보기', act: 'toggleServiceHistory', cls: 'btn-sm btn-ghost' })}
    </div>
    ${pending.length ? pendingRows : EmptyState('봉사 대상 학생이 없어요')}
    
    ${showHistory ? `
      <div class="label" style="margin-top:20px; margin-bottom:12px;">최근 2주 완료 이력</div>
      ${completed.length ? completedRows : EmptyState('최근 2주간 완료된 이력이 없어요')}
    ` : ''}
  ` });
}function renderBlueService(u) { return ServiceGaugeCard(u) + ServiceTargetsCard(); }

        ${Field('재화', 'vdCur', Select('vdCur', opts, first))}
        ${Field('수량', 'vdAmt', Input('vdAmt', { type: 'number', value: 1, min: 1 }), '보유량 이하로 입력해요. 크레딧 소모와 공해 변동이 없어요.')}
      `,
      actions: [{ label: '옮기기', act: 'vaultDepositSubmit', cls: 'btn-primary' }],
    });
  },

  vaultDepositSubmit() {
    const u = currentUser();
    if (!u) return;
    const currency = val('vdCur');
    const amount = toInt(val('vdAmt'));
    if (!isInt(amount) || amount < 1) { Toast('수량은 1 이상의 정수예요', 'warn'); return; }
    if (!CURRENCIES.includes(currency)) { Toast('재화를 선택해 주세요', 'warn'); return; }
    if (u.balances[currency] < amount) { Toast(`보유한 ${CURRENCY_LABEL[currency]}이(가) 부족해요(보유 ${u.balances[currency]}개)`, 'warn'); return; }
    const result = depositToVault(u.id, currency, amount);
    if (result.ok) { closeModal(); Toast(`${CURRENCY_LABEL[currency]} ${amount}개를 팀 금고에 옮겼어요`, 'success'); }
  },

    distributeVault({ teamId }) {
    const user = currentUser();
    if (!user) return;

    const targetUid = val('distTarget');
    const currency = val('distCur');
    const amount = Number(val('distAmt'));

    if (user.teamId !== teamId || !isLeader(user.id)) {
      Toast('팀장만 금고를 분배할 수 있어요', 'warn');
      return;
    }

    if (
      !state.users[targetUid] ||
      state.users[targetUid].teamId !== teamId
    ) {
      Toast('분배할 팀원을 선택해 주세요', 'warn');
      return;
    }

    if (!CURRENCIES.includes(currency)) {
      Toast('재화를 선택해 주세요', 'warn');
      return;
    }

    if (!Number.isSafeInteger(amount) || amount < 1) {
      Toast('수량은 1 이상의 정수로 입력해 주세요', 'warn');
      return;
    }

    Confirm(
      '팀 금고 분배',
      `${actorName(targetUid)}에게 ${CURRENCY_LABEL[currency]} ${amount}개를 분배할까요?\n` +
      '팀 금고에서 해당 수량만 이동해요.\n' +
      '분배 수수료와 공해 증가는 없어요.',
      'distributeVaultDo',
      { teamId, targetUid, currency, amount },
      'btn-primary',
      '분배하기'
    );
  },

  distributeVaultDo({ teamId, targetUid, currency, amount }) {
    const leader = currentUser();
    if (!leader) return;

    const result = distributeVaultToMember(
      teamId,
      leader.id,
      targetUid,
      currency,
      amount
    );

    if (result.ok) {
      closeModal();
      Toast('분배를 완료했어요.', 'success');
    }
  },

  distributeStockDirectly({ catalogId, type, teamId }) {
    const targetUid = val(type === 'item' ? `sdist_${catalogId}` : `cdist_${catalogId}`);
    const result = runTx(() => {
      if (type === 'item') {
        const c = getStoreCatalog(catalogId);
        if (getTeamItemStock(catalogId) < 1) throw new Error('팀 재고가 없습니다');
        // 비용/크레딧 차감 없음
        state.storeListings.push({ id: uid(), catalogId, teamId: 'black', name: c.name, kind: c.kind, cost: c.cost, price: 0, qty: 0, listedTotal: 1, status: 'soldout', createdBy: currentActorUid(), createdAt: nowISO() });
        notify(targetUid, `블랙팀에서 "${c.name}"을(를) 무료로 나누어 주었어요!`, 'success');
      } else {
        const c = getCouponCatalog(catalogId);
        if (c.teamStock < 1) throw new Error('팀 재고가 없습니다');
        // 비용/크레딧 차감 없음
        c.teamStock -= 1;
        const user = getUser(targetUid);
        user.coupons.push({ id: uid(), catalogId: c.id, name: c.name, effectType: c.effectType, effectAmount: c.effectAmount, teamId, price: 0, status: 'unused', acquiredAt: nowISO() });
        notify(targetUid, `${TEAM_LABEL[teamId]}팀에서 쿠폰 "${c.name}"을(를) 무료로 발급해 주었어요!`, 'success');
      }
    });
    if (result.ok) Toast('해당 팀원에게 완전 무료(크레딧 없음)로 지급했습니다.', 'success');
  },

  // 🛑 실수로 지워졌던 '새 상품/쿠폰 제안하기' 기능 복구
  proposeNewItem({ kind, teamId }) {
    const name = val(kind === 'item' ? 'propItemName' : 'propCouponName');
    const cost = val(kind === 'item' ? 'propItemCost' : 'propCouponCost');
    
    if (!name.trim()) { 
      Toast('상품(또는 쿠폰) 이름을 입력해 주세요', 'warn'); 
      return; 
    }
    
    // 권한 제한(isLeader 등)이 없으므로 팀원 누구나 제안 가능합니다.
    const result = runTx(() => {
      createRequest({ 
        type: 'itemProposal', 
        fromUid: currentActorUid(), 
        teamId: teamId || 'black', 
        payload: { kind, name, cost } 
      });
    });
    
    if (result.ok) Toast('선생님께 새로운 제안을 보냈어요!', 'success');
  },
});

}Object.assign(ACTIONS, {
  storeWholesale({ id }) {
    const qty = toInt(val(`sw_${id}`));
    if (!isInt(qty) || qty < 1) { Toast('수량을 1 이상 입력해 주세요', 'warn'); return; }
    
    const catalog = getStoreCatalog(id);
    const teamId = 'black';
    const team = getTeam(teamId);

    if (team.vault.credit < qty && team.vault.cleanCredit < qty) {
      Toast(`팀 금고에 수수료로 낼 크레딧이 부족해요 (최소 ${qty}개 필요)`, 'warn');
      return;
    }
    if (catalog.stock !== null && catalog.stock < qty) {
      Toast(`선생님 재고가 부족해요(남은 ${catalog.stock}개)`, 'warn');
      return;
    }

    withVaultCreditChoice(teamId, qty, `"${catalog.name}" 사입`, `도매 창고에서 ${qty}개를 사입합니다.\n금고에서 ${catalog.cost * qty}포인트와 수수료 ${qty}크레딧이 차감됩니다.`, (creditType) => {
      const r = runTx(() => {
        purchaseStoreStock(id, qty);
        transfer({
          type: 'fee',
          from: vaultRef(teamId),
          to: null,
          currency: creditType,
          amount: qty,
          memo: `도매 사입 수수료 (${catalog.name} ${qty}개)`,
          pollutionDelta: creditType === 'credit' ? qty : 0
        });
      });
      if (r.ok) { closeModal(); Toast(`물품을 사입하고 수수료 ${qty} 크레딧을 냈어요`, 'success'); }
    });
  },
  storeList({ id }) { const r = listStoreItem(id, val(`slp_${id}`), val(`slq_${id}`)); if (r.ok) Toast('매점에 진열했어요', 'success'); },

  storeListingStatus({ id, status }) { updateStoreListing(id, { status }); },
});

  toggleClosedQuizzes() { ui.filters.showClosedQuizzes = !ui.filters.showClosedQuizzes; render(); },
  quizCreate() { const r = createQuiz({ title: val('qzTitle'), hint: val('qzHint'), isSpecial: isTeacher() ? checked('qzSpecial') : false }); if (r.ok) Toast('퀴즈를 등록했어요. 공개 버튼을 눌러 열어 주세요.', 'success'); },
  quizEditAsk({ id }) {
    const q = state.quizzes.find((x) => x.id === id);
    if (!q) return;
    const newTitle = prompt('수정할 퀴즈 제목을 입력하세요.', q.title);
    if (newTitle === null || !newTitle.trim()) return;
    const newHint = prompt('수정할 힌트를 입력하세요. (없으면 비워두세요)', q.hint || '');
    if (newHint === null) return;
    const r = runTx(() => {
      const target = state.quizzes.find((x) => x.id === id);
      if (target) { target.title = newTitle.trim(); target.hint = newHint.trim(); }
    });
    if (r.ok) { render(); Toast('퀴즈를 수정했어요.', 'success'); }
  },
  quizDeleteAsk({ id }) {
    if (!isTeacher()) return Toast('선생님만 삭제할 수 있어요.', 'error');
    if (confirm('정말로 이 퀴즈를 삭제할까요? (관련된 정답 기록도 모두 사라집니다)')) {
      const r = runTx(() => {
        const idx = state.quizzes.findIndex((x) => x.id === id);
        if (idx > -1) state.quizzes.splice(idx, 1);
      });
      if (r.ok) {
        if (ui.filters.quizSel === id) ui.filters.quizSel = null;
        render(); Toast('퀴즈가 삭제되었습니다.', 'success');
      }
    }
  },
  quizStatus({ id, status }) { const r = setQuizStatus(id, status); if (r.ok) Toast(status === 'open' ? '퀴즈를 공개했어요' : '퀴즈를 마감했어요', 'success'); },
  quizSelChange({ value }) { ui.filters.quizSel = value; ui.picker.clear(); render(); },
  quizWinnersSave({ id }) { const ids = [...ui.picker]; if (!ids.length) { Toast('정답자를 선택해 주세요', 'warn'); return; } const r = selectQuizWinners(id, ids); if (r.ok) { ui.picker.clear(); Toast(`${r.result.length}명에게 보상을 보냈어요`, 'success'); render(); } },
  hwAccept({ id }) { acceptHomeworkHelp(id); },
  hwComplete({ id }) { completeHomeworkHelp(id); },
  
  // 🛑 새롭게 추가된 퀴즈 답안 제출 기능
  quizAnswerAsk({ id }) {
    const q = getQuiz(id);
    const u = currentUser();
    const existingAnswer = (q.submissions && q.submissions[u.id]) || '';
    Modal({
      title: '퀴즈 답안 제출',
      body: Field('내 답안', 'qaText', Input('qaText', { value: existingAnswer, placeholder: '정답을 적어주세요' })),
      actions: [{ label: '제출하기', act: 'quizAnswerSubmit', args: { id }, cls: 'btn-primary' }]
    });
  },
  quizAnswerSubmit({ id }) {
    const text = val('qaText').trim();
    if (!text) { Toast('답안을 입력해 주세요', 'warn'); return; }
    
    const r = runTx(() => {
      const q = getQuiz(id);
      const u = currentUser();
      if (q.status !== 'open') throw new Error('지금은 답을 낼 수 없어요');
      if (!q.submissions) q.submissions = {}; // 답안 저장 공간 만들기
      q.submissions[u.id] = text;
    });
    
    if (r.ok) {
      closeModal();
      Toast('답안을 제출했어요!', 'success');
    }
  },
});

function EcoGaugeSummaryCard() {
  if (!state.settings.useEcoGauge) return '';
  const target = Math.max(1, state.settings.ecoGaugeTarget || 10);
  const students = activeStudents();

  const rows = students.map(s => {
    const val = s.ecoGauge || 0;
    const pct = Math.min(100, (val / target) * 100);
    return `
      <div class="card" style="padding:10px 8px; text-align:center; box-shadow:none; border:1px solid var(--border); margin:0;">
        <div style="font-weight:700; font-size:14px; margin-bottom:8px;">${esc(s.name)}</div>
        <div class="gauge-track" style="height:12px; margin-bottom:4px;">
          <div class="gauge-fill" style="width:${pct}%; background:var(--clean);"></div>
        </div>
        <div style="font-size:12px; color:var(--text-muted); font-variant-numeric:tabular-nums;">${val} / ${target}</div>
      </div>
    `;
  }).join('');

  return Card({
    title: '🌱 전교생 무공해 크레딧 게이지 현황',
    body: students.length 
      ? `<div style="display:grid; grid-template-columns:repeat(5, 1fr); gap:8px;">${rows}</div>`

// 🛑 블루팀 봉사 게이지 현황을 보여주는 새로운 함수 추가
function BlueTeamServiceGaugeCard() {
  const members = teamMembers('blue');
  const max = Math.max(1, toInt(state.settings.serviceGaugeMax) || 1);

  const rows = members.map(student => {
    const value = clamp(Number.isSafeInteger(student.serviceGauge) ? student.serviceGauge : 0, 0, max);
    const pct = (value / max) * 100;
    const remain = max - value;
    
    const miniGauge = `
      <div class="gauge" style="width:120px; margin:0;">
        <div class="gauge-track" style="height:28px;">
          <div class="gauge-fill" style="width:${pct}%; background:var(--life);"></div>
          <div class="gauge-text num" style="font-size:14px;">${value} / ${max}</div>
        </div>
      </div>
    `;
    
    return Row(
      `${esc(student.name)} ${value >= max ? Badge('보상 대기', 'badge-life') : ''}`,
      `보상까지 ${remain}회 남음`,
      miniGauge
    );
  }).join('');

  return Card({
    title: '블루팀 봉사 확인 게이지 현황',
    body: members.length 
      ? `<div class="stack">${rows}</div>`

  });
}

    );

  const groups = {};

  pending.forEach((request) => {
    if (!groups[request.type]) {
      groups[request.type] = [];
    }

    groups[request.type].push(request);
  });

    const recent = state.requests
    .filter(
      (request) =>
        !['pending', 'awaitingChoice'].includes(request.status)
    )
    .sort(
      (a, b) =>
        (b.resolvedAt || b.createdAt).localeCompare(
          a.resolvedAt || a.createdAt
        )
    );


  const pendingCards = Object.keys(groups).length
    ? Object.entries(groups).map(([type, requests]) =>
        Card({
          title: REQUEST_TYPE_LABEL[type] || type,
          right: Badge(`${requests.length}건`, 'badge-warn'),

        title: '승인 요청',

    `,
  });
}

function renderTeacherStudents() {
  const tab = ['list', 'add', 'leaders'].includes(

  )
    ? ui.teacherTab.students
    : 'list';

  const tabs = Tabs(
    [
      { key: 'list', label: '학생 목록' },
      { key: 'add', label: '학생 추가' },
      { key: 'leaders', label: '팀장 지정' },
    ],
    tab,
    'stuTab'
  );

  if (tab === 'add') {
    return tabs + Card({
      title: '학생 추가 (한 줄에 한 명씩)',
      body: `
        ${Field(
          '이름 목록',
          'addNames',
          Textarea(
            'addNames',
            '',
            '김민준\n이서연\n박도윤'
          ),
          '첫 PIN은 0000이고 첫 로그인 때 새로 만들어요.'
        )}

        ${Field(
          '배정 팀',
          'addTeam',
          Select(
            'addTeam',
            TEAM_IDS.map((teamId) => ({
              value: teamId,
              label: `${TEAM_LABEL[teamId]}팀`,

            'white'

        )}

        ${Button({
          label: '학생 추가하기',
          act: 'studentsAdd',
          cls: 'btn-primary btn-lg btn-block',
        })}
      `,
    });
  }

  if (tab === 'leaders') {
    const teams = TEAM_IDS.map((teamId) => {
      const team = getTeam(teamId);
      const members = teamMembers(teamId);

      const description = team.pendingHandover
        ? (
            `교체 요청 대기 중: ` +
            `${esc(actorName(team.pendingHandover.fromUid))} → ` +
            `${esc(actorName(team.pendingHandover.toUid))} ` +
            Button({
              label: '요청 취소',
              act: 'cancelReq',
              args: {
                id: team.pendingHandover.requestId,
              },
              cls: 'btn-sm btn-ghost',
            })
          )
        : `팀원 ${members.length}명`;

      return Row(
        `
          ${TeamBadge(teamId)}
          ${esc(team.name)}
          · 팀장 ${
            team.leaderUid
              ? esc(actorName(team.leaderUid))
              : '공석'
          }
        `,
        description,
        Select(
          `ld_${teamId}`,
          [
            { value: '', label: '공석으로' },
            ...members.map((member) => ({
              value: member.id,
              label: member.name,
            })),
          ],
          team.leaderUid || ''
        ).replace(
          'class="select"',
          'class="select" style="width:auto;min-height:44px"'
        ) +
        Button({
          label: '지정',
          act: 'leaderSet',
          args: { teamId },
          cls: 'btn-sm btn-primary',
        })
      );
    }).join('');

    return (
      tabs +
      Card({
        title: '팀장 직접 지정',
        body: `
          <p class="help" style="margin-bottom:12px">
            지정하면 바로 바뀌어요.
            해당 팀의 대기 중인 팀장 교체 요청은 취소돼요.
          </p>
          ${teams}
        `,
      }) +
      LeaderHistoryStatsCard()
    );
  }

  const students = activeStudents();

  const filter = TEAM_IDS.includes(ui.filters.stuTeam)
    ? ui.filters.stuTeam
    : 'all';

  const filtered = students.filter(
    (student) =>
      filter === 'all' ||
      student.teamId === filter
  );

  const filterTabs = Tabs(
    [
      {
        key: 'all',
        label: '전체',
        count: students.length,
      },
      ...TEAM_IDS.map((teamId) => ({
        key: teamId,
        label: TEAM_LABEL[teamId],
        count: students.filter(
          (student) => student.teamId === teamId
        ).length,
      })),
    ],
    filter,
    'stuTeamFilter'
  );

  const rows = filtered.map((student) => {
    const balances = CURRENCIES.map(
      (currency) =>
        `${CURRENCY_LABEL[currency]} ` +
        `${student.balances[currency]}`
    ).join(' · ');

    return Row(
      `
        ${esc(student.name)}
        ${TeamBadge(student.teamId)}
        ${
          isLeader(student.id)
            ? Badge('팀장', 'badge-point')
            : ''
        }
        ${
          student.mustResetPin
            ? Badge('PIN 미설정', 'badge-warn')
            : ''
        }
      `,
      `<span class="num">${esc(balances)}</span>`,
      Button({
        label: '수정',
        act: 'openStudentEdit',
        args: { id: student.id },
        cls: 'btn-sm',
      }) +
      Button({
        label: 'PIN 초기화',
        act: 'studentResetPin',
        args: {
          id: student.id,
          name: student.name,
        },
        cls: 'btn-sm btn-ghost',
      }) +
      Button({
        label: '삭제',
        act: 'studentDeleteAsk',
        args: { id: student.id },
        cls: 'btn-sm btn-danger',
      })
    );
  }).join('');

  return tabs + Card({
    title: '학생 목록',
    right: Badge(
      `전체 ${students.length}명`,
      'badge-outline'
    ),
    body:
      filterTabs +
      (
        rows ||
        EmptyState(
          '학생이 없어요. 학생 추가 탭에서 추가해 주세요.'
        )
      ),
  });
}
Object.assign(ACTIONS, {
  stuTab({ key }) {
    if (!['list', 'add', 'leaders'].includes(key)) return;

    guardWalletNavigation(() => {
      ui.teacherTab.students = key;
      ui.picker.clear();
      render();
    });
  },

  stuTeamFilter({ key }) {
    ui.filters.stuTeam =
      TEAM_IDS.includes(key)
        ? key
        : 'all';

    render();
  },

  openStudentEdit({ id }) {
    const student = getUser(id);

    Modal({
      title: `${student.name} 정보 수정`,
      body: StudentEditModalBody(student),
      actions: [{
        label: '저장',
        act: 'studentEditSave',
        args: { id },
        cls: 'btn-primary',
      }],
    });
  },

  studentEditSave({ id }) {
    const result = updateStudent(id, {
      name: val('seName'),
      teamId: val('seTeam'),
    });

    if (result.ok) {
      closeModal();
      Toast('학생 정보를 저장했어요', 'success');
    }
  },

  studentResetPin({ id, name }) {
    Confirm(
      'PIN 초기화',
      `${name}의 PIN을 0000으로 초기화할까요?\n` +
      '다음 로그인 때 새 PIN을 만들게 돼요.',
      'studentResetPinDo',
      { id },
      'btn-warn',
      '초기화'
    );
  },

  studentResetPinDo({ id }) {
    const result = resetPin(id);

    if (result.ok) {
      closeModal();
      Toast('PIN을 초기화했어요 (0000)', 'success');
    }
  },

  studentDeleteAsk({ id }) {
    if (!isTeacher()) return;

    const student = getUser(id);

    Confirm(
      '학생 삭제',
      `${student.name} 학생을 삭제할까요?\n\n` +
      '학생의 지갑·보유 쿠폰·알림이 함께 없어져요.\n' +
      '미체결 거래와 미처리 요청은 취소돼요.\n' +
      '과거 거래·로그는 남지만 학생 이름은 삭제된 학생으로 표시돼요.\n\n' +
      '삭제한 학생은 되돌릴 수 없어요.',
      'studentDeleteDo',
      { id },
      'btn-danger',
      '학생 삭제'
    );
  },

  studentDeleteDo({ id }) {
    const result = deleteStudent(id);
    if (!result.ok) return;

    delete ui.walletDrafts[`user:${id}`];
    ui.picker.delete(id);

    if (ui.loginUid === id) {
      ui.loginUid = null;
    }

    closeModal();

    Toast(
      `${result.result.name} 학생을 삭제했어요. ` +
      '과거 이력은 보존했어요.',
      'success'
    );

    render();
  },

  studentsAdd() {
    // runTx가 화면을 다시 그리기 전에 입력값을 보관합니다.
    const names = val('addNames');
    const teamId = val('addTeam');

    const result = addStudents(names, teamId);
    if (!result.ok) return;

    ui.teacherTab.students = 'list';
    ui.filters.stuTeam = teamId;

    Toast(
      `${result.result.length}명을 추가했어요`,
      'success'
    );

    render();
  },

  leaderSet({ teamId }) {
    const result = setTeamLeader(
      teamId,
      val(`ld_${teamId}`) || null,
      TEACHER_ID
    );

    if (result.ok) {
      Toast('팀장을 지정했어요', 'success');
    }
  },
});

/** 규칙 수치 – 숙제 도움 요청자 랜덤 보상 확률 입력 UI */
function HomeworkRewardWeightFields() {
  const w = state.settings.homeworkRequesterRewardWeights || {};
  const total = sum(CURRENCIES, (c) => toInt(w[c]) || 0);
  const rows = CURRENCIES.map((c) => {
    const v = toInt(w[c]) || 0;
    const pct = total > 0 ? Math.round((v / total) * 1000) / 10 : 0;
    return `
      <div class="hstack between" style="padding:6px 0; border-bottom:1px solid var(--border);">
        <span class="badge badge-${c === 'cleanCredit' ? 'clean' : c}" style="min-width:110px; justify-content:center;">${CURRENCY_LABEL[c]}</span>
        <div class="hstack" style="gap:8px;">
          ${Input(`hrw_${c}`, { type: 'number', value: v, min: 0 }).replace('class="input"', 'class="input num" style="width:80px; min-height:36px; text-align:right;"')}
          <span class="muted num" style="min-width:64px; text-align:right;">= ${pct}%</span>
        </div>
      </div>`;
  }).join('');
  return `
    <div class="card card-soft">
      ${rows}
      <p class="help" style="margin-top:8px;">
        숙제 도우미의 골드를 선생님이 승인하는 순간, 도움을 요청한 학생도 위 확률로 재화 1개를 랜덤으로 받아요.
        숫자는 상대 가중치라 합이 100이 아니어도 괜찮아요(현재 합 ${total}). 전부 0이면 보상을 주지 않아요.
      </p>
    </div>`;
}

            현재는 이 브라우저에 저장된 비밀번호를 사용해요.

      }) +
      Card({
        cls: 'card-warn',
        title: '데이터 초기화',
        body: `
          <p class="muted" style="margin-bottom:12px">
            초기화하면 되돌릴 수 없어요.
            설정도 기본값으로 돌아가고 기본 공지를 다시 만들어요.
          </p>

          <div class="grid-2">
            ${Button({
              label: '샘플 데이터로 초기화',
              act: 'resetAsk',
              args: { mode: 'seed' },
              cls: 'btn-warn btn-lg',
            })}

            ${Button({
              label: '빈 학급으로 초기화',
              act: 'resetAsk',
              args: { mode: 'empty' },
              cls: 'btn-danger btn-lg',
            })}

  const fields = SETTING_FIELDS.map((field) =>
    Field(
      field.label,
      `st_${field.key}`,
      Input(`st_${field.key}`, {
        type: field.type,
        value: settings[field.key],
        min: field.min,
      }),
      field.help || ''
    )
  ).join('');

  const teamRewardRows = TEAM_IDS.map(teamId => {
    const cfg = settings.quizRewardConfig?.[teamId] || { cur1:'life', amt1:1, cur2:'credit', amt2:1, s_cur1:'life', s_amt1:2, s_cur2:'credit', s_amt2:2 };
    const s_cur1 = cfg.s_cur1 || 'life', s_amt1 = cfg.s_amt1 || 2;
    const s_cur2 = cfg.s_cur2 || 'credit', s_amt2 = cfg.s_amt2 || 2;
    const curOpts = [{value:'none', label:'없음'}, ...CURRENCY_OPTIONS];
    return `
      <div class="card card-soft" style="margin-bottom:var(--sp-2)">
        <div class="label" style="margin-bottom:8px">${TEAM_LABEL[teamId]}팀 보상 설정</div>
        <div class="grid-2">
          <div class="field" style="border-right: 1px solid var(--border); padding-right: 8px;">
            <span class="help" style="font-weight:bold;">일반 보상 설정</span>
            <div class="hstack" style="margin-top:4px;">
              ${Select(`qr_${teamId}_c1`, curOpts, cfg.cur1).replace('class="select"', 'class="select" style="flex:1"')}
              ${Input(`qr_${teamId}_a1`, {type:'number', value:cfg.amt1, min:1}).replace('class="input"', 'class="input" style="width:60px"')}
            </div>
            <div style="text-align:center; font-size:12px; color:var(--text-muted); margin:4px 0;">또는</div>
            <div class="hstack">
              ${Select(`qr_${teamId}_c2`, curOpts, cfg.cur2).replace('class="select"', 'class="select" style="flex:1"')}
              ${Input(`qr_${teamId}_a2`, {type:'number', value:cfg.amt2, min:0}).replace('class="input"', 'class="input" style="width:60px"')}
            </div>
          </div>
          <div class="field" style="padding-left: 8px;">
            <span class="help" style="font-weight:bold; color:var(--warn);">🌟 특별 보상 설정</span>
            <div class="hstack" style="margin-top:4px;">
              ${Select(`sqr_${teamId}_c1`, curOpts, s_cur1).replace('class="select"', 'class="select" style="flex:1"')}
              ${Input(`sqr_${teamId}_a1`, {type:'number', value:s_amt1, min:1}).replace('class="input"', 'class="input" style="width:60px"')}
            </div>
            <div style="text-align:center; font-size:12px; color:var(--text-muted); margin:4px 0;">또는</div>
            <div class="hstack">
              ${Select(`sqr_${teamId}_c2`, curOpts, s_cur2).replace('class="select"', 'class="select" style="flex:1"')}
              ${Input(`sqr_${teamId}_a2`, {type:'number', value:s_amt2, min:0}).replace('class="input"', 'class="input" style="width:60px"')}
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');

  return tabs + Card({
    title: '규칙 수치',
    body: `
      <div class="grid-2">
        ${fields}
      </div>

            <div class="section">
        <div class="section-title">팀별 퀴즈 정답 보상 설정 (규칙 수치)</div>
        ${teamRewardRows}
      </div>

      <div class="section">
        <div class="section-title">숙제 도움 요청자 랜덤 보상 확률 (규칙 수치)</div>
        ${HomeworkRewardWeightFields()}
      </div>


            <div class="stack" style="margin-top:12px">
        ${Toggle(
          'st_taxTierEnabled',
          '세금 집행 시 공해 유발 Top3 가산 · 정화 Top3 면제',
          settings.taxTierEnabled,
          '켜면 유발 Top3는 등수마다 가산 세율이 붙고, 정화 Top3는 세금을 내지 않아요. 팀 금고는 기본 세율 그대로예요.'
        )}

        ${Toggle(
          'st_useEcoGauge',

          '무공해 크레딧 보상 게이지 시스템 도입',
          settings.useEcoGauge,
          '켜면 학생 홈과 교사 요약 화면에 게이지가 나타나고 보상이 자동 지급돼요.'
        )}

        ${Toggle(
          'st_creditOnSpend',
          '포인트·골드 소비 시 크레딧 1개 추가 지불',
          settings.creditOnSpend,
          '매점·쿠폰 구매 때 크레딧을 1개 더 내요.'
        )}

        ${Toggle(
          'st_goldTeamCanWinQuiz',
          '골드팀원도 퀴즈 정답 보상 가능',
          settings.goldTeamCanWinQuiz,
          '꺼져 있으면 골드팀은 정답 보상 대상에서 빠져요.'
        )}
      </div>

      <div style="margin-top:16px">
        ${Button({
          label: '규칙 수치 저장',
          act: 'settingsSave',
          cls: 'btn-primary btn-lg btn-block',
        })}
      </div>

      <p class="help" style="margin-top:8px">
        저장한 규칙은 이후 처리부터 적용돼요.
        이미 지급한 퀴즈 보상은 바뀌지 않아요.
        교사의 직접 재화 조정은 포인트·골드 일일 한도와 별개예요.
      </p>

      <div class="section">
        <div class="section-title">숨긴 공해 프리셋</div>
        ${
          (settings.hiddenPollutionPresets || []).length
            ? `
              <div class="hstack">
                                ${(settings.hiddenPollutionPresets || []).map((k) => Badge(POLLUTION_PRESET_LABEL[k] || k, 'badge-outline')).join('')}
                ${Button({ label: '숨긴 프리셋 복구', act: 'pollutionPresetRestore', cls: 'btn-sm btn-ghost' })}

              </div>
            `
            : '<p class="help">숨긴 공해 프리셋이 없어요.</p>'
        }
      </div>
    `,
  });
}
Object.assign(ACTIONS, {
  setTab({ key }) { ui.teacherTab.settings = key; render(); },
  // 기존의 settingsSave() { ... } 부분을 아래로 교체
  settingsSave() {
    const patch = {};
    SETTING_FIELDS.forEach((f) => { patch[f.key] = val(`st_${f.key}`); });
    patch.creditOnSpend = checked('st_creditOnSpend'); patch.goldTeamCanWinQuiz = checked('st_goldTeamCanWinQuiz');
        patch.useEcoGauge = checked('st_useEcoGauge');
       patch.taxTierEnabled = checked('st_taxTierEnabled');
    patch.homeworkRequesterRewardWeights = Object.fromEntries(CURRENCIES.map((c) => [c, val(`hrw_${c}`)]));


    
    const qr = {};
    TEAM_IDS.forEach(t => {
      qr[t] = {
        cur1: val(`qr_${t}_c1`), amt1: toInt(val(`qr_${t}_a1`)) || 1,
        cur2: val(`qr_${t}_c2`), amt2: toInt(val(`qr_${t}_a2`)) || 0,
        s_cur1: val(`sqr_${t}_c1`), s_amt1: toInt(val(`sqr_${t}_a1`)) || 1,
        s_cur2: val(`sqr_${t}_c2`), s_amt2: toInt(val(`sqr_${t}_a2`)) || 0
      };
    });
    patch.quizRewardConfig = qr;

    const r = updateSettings(patch); if (r.ok) Toast('규칙 수치를 저장했어요', 'success');
  },
  settingsSaveText({ key, id }) { const r = updateSettings({ [key]: val(id) }); if (r.ok) Toast('저장했어요. 학생 화면에 바로 반영돼요.', 'success'); },
  effectsSave() {
    const list = state.settings.couponEffectTypes.map((e) => ({ ...e, label: val(`efl_${e.key}`) || e.label, description: val(`efd_${e.key}`), handler: val(`efh_${e.key}`) || 'teacher' }));
    const r = updateSettings({ couponEffectTypes: list }); if (r.ok) Toast('쿠폰 효과 목록을 저장했어요', 'success');
  },
  effectAdd() {
    const label = val('efNewLabel').trim(); if (!label) { Toast('효과 이름을 입력해 주세요', 'warn'); return; }
    const list = [...state.settings.couponEffectTypes, { key: `custom_${uid().slice(3, 9)}`, label, description: val('efNewDesc'), system: false, handler: val('efNewHandler') || 'teacher' }];
    const r = updateSettings({ couponEffectTypes: list }); if (r.ok) Toast('효과를 추가했어요', 'success');
  },
  effectRemove({ key }) {
    if (state.couponCatalog.some((c) => c.effectType === key)) { Toast('이 효과를 쓰는 쿠폰이 있어서 삭제할 수 없어요', 'warn'); return; }
    const r = updateSettings({ couponEffectTypes: state.settings.couponEffectTypes.filter((e) => e.key !== key) }); if (r.ok) Toast('효과를 삭제했어요', 'success');
  },
  teacherPwSave() {
    if (val('stPw') !== val('stPw2')) { Toast('두 번 입력한 비밀번호가 서로 달라요', 'warn'); return; }
    const r = updateSettings({ teacherPassword: val('stPw') }); if (r.ok) Toast('비밀번호를 바꿨어요', 'success');
  },
  resetAsk({ mode }) { Confirm(mode === 'seed' ? '샘플 데이터로 초기화' : '빈 학급으로 초기화', mode === 'seed' ? '모든 데이터를 지우고 샘플 학생 28명·쿠폰·퀴즈를 다시 만들어요. 로그아웃돼요.' : '모든 학생·거래·기록을 지워요. 설정 기본값과 공지 시드만 남아요. 로그아웃돼요.', 'resetDo', { mode }, 'btn-danger', '초기화하기'); },
  resetDo({ mode }) { closeModal(); if (mode === 'seed') resetToSeed(); else resetToEmpty(); Toast('초기화했어요', 'success'); },
});
Object.assign(ACTIONS, {
  setTab({ key }) {
    if (
      !['numbers', 'texts', 'effects', 'account'].includes(key)
    ) {
      return;
    }

    guardWalletNavigation(() => {
      ui.teacherTab.settings = key;
      render();
    });
  },

  settingsSaveText({ key, id }) {
    if (
      ![
        'volunteerNotice',
        'pollutionNotice',
        'announcement',
      ].includes(key)
    ) {
      return;
    }

    const inputs = snapshotInputs($('#app'));
    const text = val(id);

    const result = updateSettings({ [key]: text });

    restoreInputs($('#app'), inputs);

    if (result.ok) {
      Toast('문구를 저장했어요', 'success');
    }
  },

  resetDo({ mode }) {
    if (!isTeacher()) return;

    closeModal();

    ui.walletDrafts = {};
    ui.teacherDailyGrant = null;
    ui.picker.clear();
    ui.filters = {};
    ui.teacherTab = {};
    ui.teacherView = 'summary';
    ui.view = 'home';
    ui.dateKey = null;
    ui.loginUid = null;
    ui.pin = '';
    ui.pinStage = null;
    ui.pollutionNoticeOpen = false;

    if (mode === 'seed') {
      resetToSeed();
    } else {
      resetToEmpty();
    }

    Toast('초기화했어요', 'success');
  },
});

/* =====================================================
   39. 교사(관리자) 모드 – 쿠폰 발행점 · 상점 (I장) : 발행 / 발행 목록·수정 / 상점 전체(진열 관리)
===================================================== */
function CouponEditBody(c) {
  return `<div class="grid-2">${Field('이모지', 'ceEmoji', Input('ceEmoji', { value: c.emoji || '🎫', maxlength: 5 }))}${Field('쿠폰명', 'ceName', Input('ceName', { value: c.name, maxlength: 30 }))}</div>
    <div class="grid-2">${Field(`원가 (${CURRENCY_LABEL[couponCurrency(c.teamId)]})`, 'ceCost', Input('ceCost', { type: 'number', value: c.cost, min: 1 }))}${Field('선생님 재고 (비우면 무제한)', 'ceStock', Input('ceStock', { type: 'number', value: c.stock === null ? '' : c.stock, min: 0, placeholder: '무제한' }))}</div>`;
}
function renderTeacherCoupons() {
  const tab = ['issue', 'catalog', 'shop', 'purchases'].includes(
    ui.teacherTab.coupons
  )
    ? ui.teacherTab.coupons
    : 'issue';

  const tabs = Tabs(
    [
      { key: 'issue', label: '쿠폰 발행' },
      {
        key: 'catalog',
        label: '발행 목록',
        count: state.couponCatalog.length,
      },
      { key: 'shop', label: '쿠폰 상점(전체)' },
      { key: 'purchases', label: '사입 기록' },
    ],
    tab,
    'cpTab'
  );

  if (tab === 'purchases') {
    return tabs + TeamPurchaseHistoryCard('coupon');
  }

  if (tab === 'catalog') {
    const filterTeam = ui.filters.couponTeam || 'all';
    const filterTabs = Tabs([
      { key: 'all', label: '전체' },
      { key: 'black', label: '블랙팀 쿠폰' },
      { key: 'gold', label: '골드팀 쿠폰' }
    ], filterTeam, 'couponTeamFilter', {}, 'team-tabs');

    const list = state.couponCatalog
      .filter(c => filterTeam === 'all' || c.teamId === filterTeam)
      .slice()
      .sort((a, b) =>
        String(b.createdAt || '').localeCompare(
          String(a.createdAt || '')
        )
      );

    const cards = list.map((coupon) =>
      CouponCard(coupon, {
        showEffect: false,
        footer: `
          <div class="hstack" style="width:100%; justify-content:center; gap:8px;">
            ${Button({
              label: '수정',
              act: 'openCouponEdit',
              args: { id: coupon.id },
              cls: 'btn-sm btn-ghost',
            })}
            ${Button({
              label: '✕ 삭제',
              act: 'couponDeleteAsk',
              args: { id: coupon.id },
              cls: 'btn-sm btn-danger',
            })}
          </div>
        `,
      })
    ).join('');

    return tabs + Card({
      title: '발행한 쿠폰',
      body: filterTabs + (list.length
        ? `<div class="coupon-grid">${cards}</div>`
        : EmptyState('발행한 쿠폰이 없어요')),
    });
  }

  if (tab === 'shop') {
    const listings = state.couponListings
      .filter((listing) => listing.qty > 0)
      .sort((a, b) =>
        String(b.createdAt || '').localeCompare(
          String(a.createdAt || '')
        )
      );

    const cards = listings.map((listing) => {
      const footer = `
        <div class="hstack">
          <span class="help">판매가</span>
          ${NumberBox(`clu_${listing.id}`, listing.price)}

          ${Button({
            label: '가격 변경',
            act: 'couponListingPrice',
            args: { id: listing.id },
            cls: 'btn-sm',
          })}

          ${listing.status === 'active'
            ? Button({
                label: '중지(재고 회수)',
                act: 'couponListingStatus',
                args: {
                  id: listing.id,
                  status: 'stopped',
                },
                cls: 'btn-sm btn-ghost',
              })
            : ''}
        </div>
      `;

      return CouponListingCard(listing, {
        showCost: true,
        showStatus: true,
        showCreatedAt: true,
        footer,
        controls: true,
      });
    }).join('');

    const vaultRows = ['black', 'gold'].map((teamId) => {
      const currency = couponCurrency(teamId);

      const stock = sum(
        state.couponCatalog.filter(
          (coupon) => coupon.teamId === teamId
        ),
        (coupon) => coupon.teamStock
      );

      const displayed = sum(
        state.couponListings.filter(
          (listing) =>
            listing.teamId === teamId &&
            listing.status === 'active' &&
            listing.qty > 0
        ),
        (listing) => listing.qty
      );

      return Row(
        `${TeamBadge(teamId)} ${esc(getTeam(teamId).name)}`,
        `쿠폰 재고 ${stock}개 · 진열 중 ${displayed}개`,
        Badge(
          `금고 ${CURRENCY_LABEL[currency]} ${getTeam(teamId).vault[currency]}`,
          teamId === 'black' ? 'badge-point' : 'badge-gold'
        )
      );
    }).join('');

    return (
      tabs +
      Card({
        title: '쿠폰 상점 전체 (블랙·골드팀 진열)',
        body: listings.length
          ? `<div class="coupon-grid">${cards}</div>`
          : EmptyState('진열된 쿠폰이 없어요'),
      }) +
      Card({
        title: '팀별 쿠폰 금고',
        body: vaultRows,
      })
    );
  }

  const team = ui.filters.cpTeam || 'black';

  return tabs + Card({
    title: '새 쿠폰 발행',
    body: `
      <div class="grid-2">
        ${Field(
          '이모지',
          'ciEmoji',
          Input('ciEmoji', {
            placeholder: '예: 🍿',
            maxlength: 5,
          })
        )}

        ${Field(
          '쿠폰명',
          'ciName',
          Input('ciName', {
            placeholder: '예: 자리 바꾸기권',
            maxlength: 30,
          })
        )}
      </div>

      <div class="grid-2">
        ${Field(
          '대상 팀 (원가 재화)',
          'ciTeam',
          Select(
            'ciTeam',
            [
              { value: 'black', label: '블랙팀 (포인트 원가)' },
              { value: 'gold', label: '골드팀 (골드 원가)' },
            ],
            team,
            'cpTeamChange'
          )
        )}

        ${Field(
          `원가 (${CURRENCY_LABEL[couponCurrency(team)]})`,
          'ciCost',
          Input('ciCost', {
            type: 'number',
            value: 1,
            min: 1,
          })
        )}
      </div>

      ${Field(
        '수량 (비우면 무제한)',
        'ciStock',
        Input('ciStock', {
          type: 'number',
          value: 10,
          min: 0,
          placeholder: '무제한',
        })
      )}

      ${Button({
        label: '쿠폰 발행하기',
        act: 'couponIssue',
        cls: 'btn-primary btn-lg btn-block',
      })}
    `,
  });
}
Object.assign(ACTIONS, {
  cpTab({ key }) { ui.teacherTab.coupons = key; render(); },
  cpTeamChange({ value }) { ui.filters.cpTeam = value; refresh(); },
  couponTeamFilter({ key }) { ui.filters.couponTeam = key; render(); },
  couponIssue() {
    const r = issueCoupon({ emoji: val('ciEmoji'), name: val('ciName'), teamId: val('ciTeam'), cost: val('ciCost'), stock: val('ciStock') === '' ? null : val('ciStock') });
    if (r.ok) { Toast(`"${r.result.name}" 쿠폰을 발행했어요`, 'success'); ui.teacherTab.coupons = 'catalog'; render(); }
  },
  openCouponEdit({ id }) { const c = getCouponCatalog(id); Modal({ title: '쿠폰 수정', body: CouponEditBody(c), actions: [{ label: '저장', act: 'couponEditSave', args: { id }, cls: 'btn-primary' }] }); },
  couponEditSave({ id }) {
    const cost = toInt(val('ceCost')); if (!isInt(cost) || cost < 1) { Toast('원가는 1 이상의 정수예요', 'warn'); return; }
    const stockRaw = val('ceStock'); const stock = stockRaw === '' ? null : toInt(stockRaw); if (stock !== null && (!isInt(stock) || stock < 0)) { Toast('재고는 0 이상의 정수예요', 'warn'); return; }
    const name = val('ceName').trim(); if (!name) { Toast('쿠폰 이름을 입력해 주세요', 'warn'); return; }
    const emoji = val('ceEmoji').trim();
    const r = updateCouponCatalog(id, { emoji, name, cost, stock });
    if (r.ok) { closeModal(); Toast('쿠폰을 수정했어요', 'success'); }
  },
  couponDeleteAsk({ id }) {
    const c = state.couponCatalog.find(x => x.id === id);
    if (!c) return;
    Confirm('쿠폰 삭제', `"${c.name}" 쿠폰을 정말 삭제하시겠습니까?\n매점 진열 목록에서도 함께 사라집니다.\n(이미 학생이 구매하여 보유 중인 쿠폰은 삭제되지 않아요.)`, 'couponDeleteDo', { id }, 'btn-danger', '삭제');
  },
  couponDeleteDo({ id }) {
    const r = runTx(() => {
      state.couponCatalog = state.couponCatalog.filter(x => x.id !== id);

        <span class="help">재고</span>
        ${NumberBox(`whs_${item.id}`, item.stock, 0)}

          `whk_${item.id}`,
          [
            { value: 'snack', label: '간식' },
            { value: 'supply', label: '학용품' },
          ],
          item.kind
        ).replace(
          'class="select"',
          'class="select" style="width:auto;min-height:40px"'

          label: '저장',

          args: { id: item.id },

        })}

        `${Badge(kindLabel[item.kind] || item.kind, 'badge-outline')}` +
        `${item.stock <= 0 ? Badge('재고 없음', 'badge-warn') : ''}`,
        `창고 재고 ${item.stock} · 원가 ${item.cost}P · ` +
