<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학급 경제 시스템</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
/* =====================================================
   1. 디자인 토큰 (M장) – 임의 색 혼용 금지, 아래 변수만 사용
===================================================== */
:root {
  /* 기본 배경 및 텍스트 색상 */
  --bg:#FBFAF7; --card:#FFFFFF; --border:#ECE9E4; --text:#3F3D56; --muted:#8A8799;

  /* 1. 팀 고유 색상 정의 (골드팀을 보라색에서 진짜 골드색으로 변경) */
  --team-white: #F4F1EC; /* 화이트팀 (베이지) */
  --team-blue: #A7C7E7;  /* 블루팀 (파랑) */
  --team-red: #F8B4B4;   /* 레드팀 (빨강/핑크) */
  --team-black: #CFCFD6; /* 블랙팀 (회색) */
  --team-gold: #FBE7A1;  /* 골드팀 (노랑/골드) */

  /* 2. 재화 색상을 담당 팀 색상과 1:1로 완벽히 동기화 */
  --life: var(--team-blue);        /* 라이프 = 블루팀 색상 일치 */
  --credit: var(--team-red);       /* 크레딧 = 레드팀 색상 일치 */
  --clean: #B5E2C5;                /* 무공해 크레딧 (기존 고유 초록색 유지) */
  --point: var(--team-white);      /* 포인트 = 화이트팀 색상 일치 */
  --gold: var(--team-gold);        /* 골드 = 골드팀 색상 일치 */

  /* 경고 색상 및 여백/크기 토큰 (기존과 동일) */
  --warn:#F7C59F; --danger:#F29B9B;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;
  --radius:16px; --radius-sm:12px;
  --touch:44px;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}/* ===== 2. 리셋 · 기본 ===== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit}
h1,h2,h3{line-height:1.3}
h1{font-size:24px} h2{font-size:20px} h3{font-size:18px}
.muted{color:var(--muted);font-size:14px}
.num{font-variant-numeric:tabular-nums}
.pre{white-space:pre-wrap;word-break:keep-all}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0)}
/* ===== 3. 레이아웃 ===== */
.app{max-width:1100px;margin:0 auto;padding:var(--sp-4);padding-bottom:104px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);min-height:56px;margin-bottom:var(--sp-4)}
.topbar .title{font-size:20px;font-weight:700}
.stack{display:flex;flex-direction:column;gap:var(--sp-3)}
.hstack{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.between{justify-content:space-between}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-3)}
.section{margin-top:var(--sp-4)}
.section-title{font-size:16px;font-weight:700;margin-bottom:var(--sp-2)}
/* 하단(모바일) / 상단(넓은 화면) 내비게이션 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:var(--sp-2);padding:var(--sp-2);overflow-x:auto;background:var(--card);border-top:1px solid var(--border)}
.nav-item{flex:1 0 auto;min-width:76px;min-height:var(--touch);padding:0 var(--sp-3);border-radius:var(--radius-sm);font-size:14px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:var(--sp-1);white-space:nowrap}
.nav-item.active{background:var(--text);color:var(--card)}
.nav-item .count{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--danger);color:var(--text);font-size:12px;display:grid;place-items:center}
/* ===== 4. 카드 ===== */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:var(--sp-5)}
.card + .card{margin-top:var(--sp-3)}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);font-size:18px;font-weight:700;margin-bottom:var(--sp-3)}
.card-warn{border:2px solid var(--warn);background:var(--warn);background:color-mix(in srgb,var(--warn) 30%,var(--card))}
.card-danger{border:2px solid var(--danger);background:var(--danger);background:color-mix(in srgb,var(--danger) 30%,var(--card))}
.card-soft{background:var(--bg)}
/* ===== 5. 버튼 ===== */
.btn{min-height:var(--touch);min-width:var(--touch);padding:0 var(--sp-4);border-radius:var(--radius-sm);font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);background:var(--border);color:var(--text);transition:transform .1s ease}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:var(--text);color:var(--card)}
.btn-ghost{background:transparent;border:1px solid var(--border)}
.btn-card{background:var(--card);border:1px solid var(--border)} /* 이 줄을 추가합니다 */
.btn-life{background:var(--life)} .btn-credit{background:var(--credit)} .btn-clean{background:var(--clean)}
.btn-point{background:var(--point)} .btn-gold{background:var(--gold)}
.btn-warn{background:var(--warn)} .btn-danger{background:var(--danger)}
.btn-sm{min-height:36px;font-size:14px;padding:0 var(--sp-3)}
.btn-lg{min-height:56px;font-size:18px}
.btn-block{width:100%}
/* 홈 메인 액션(라이프 제출 / 크레딧 지불하기) – 두 버튼 동일 규격 */
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.btn-action{min-height:72px;border-radius:var(--radius);flex-direction:column;gap:2px;font-size:18px}
.btn-action .sub{font-size:13px;font-weight:500;color:var(--text);opacity:.75}
/* ===== 6. 배지 · 재화 칩 ===== */
.badge{display:inline-flex;align-items:center;min-height:24px;padding:0 var(--sp-2);border-radius:8px;font-size:13px;font-weight:700;background:var(--border);color:var(--text);white-space:nowrap}
.badge-white{background:var(--team-white)} .badge-blue{background:var(--team-blue)} .badge-red{background:var(--team-red)}
.badge-black{background:var(--team-black)} .badge-gold{background:var(--team-gold)}
.badge-life{background:var(--life)} .badge-credit{background:var(--credit)} .badge-clean{background:var(--clean)}
.badge-point{background:var(--point)} .badge-warn{background:var(--warn)} .badge-danger{background:var(--danger)}
.badge-outline{background:transparent;border:1px solid var(--border)}
.currency-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--sp-3)}
.chip{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);min-height:64px;padding:var(--sp-3) var(--sp-4);border-radius:var(--radius);border:1px solid var(--border);background:var(--card)}
.chip-left{display:flex;align-items:center;gap:var(--sp-2);min-width:0}
.chip-icon{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:0 0 32px}
.chip-icon svg{width:18px;height:18px}
.chip-label{font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap}
.chip-value{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.chip-life .chip-icon{background:var(--life)} .chip-credit .chip-icon{background:var(--credit)}
.chip-cleanCredit .chip-icon{background:var(--clean)} .chip-point .chip-icon{background:var(--point)} .chip-gold .chip-icon{background:var(--gold)}
/* ===== 7. 탭 · 빈 상태 · 목록 ===== */
.tabs{display:flex;gap:var(--sp-2);overflow-x:auto;padding-bottom:0;margin:0 0 var(--sp-4)}
.tabs.team-tabs{margin-top:var(--sp-4)}
.tab{min-height:var(--touch);padding:0 var(--sp-4);border-radius:var(--radius-sm);font-weight:700;font-size:15px;background:var(--card);border:1px solid var(--border);white-space:nowrap;display:inline-flex;align-items:center;gap:var(--sp-1)}.tab.active{background:var(--text);color:var(--card);border-color:var(--text)}
.tab .count{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--danger);color:var(--text);font-size:12px;display:grid;place-items:center}
.empty{padding:var(--sp-6);text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius);font-size:15px}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:var(--sp-3) 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row-main{min-width:0;flex:1}
.row-title{font-weight:700}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
.table th{color:var(--muted);font-weight:700}
.table td.num,.table th.num{text-align:right}
/* ===== 8. 입력 ===== */
.field{display:flex;flex-direction:column;gap:var(--sp-1);margin-bottom:var(--sp-3)}
.label{font-size:14px;color:var(--muted);font-weight:700}
.help{font-size:13px;color:var(--muted)}
.input,.select,.textarea{width:100%;min-height:var(--touch);padding:var(--sp-2) var(--sp-3);border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card);font-size:16px}
.input:focus,.select:focus,.textarea:focus{outline:2px solid var(--credit);outline-offset:1px}
.textarea{min-height:120px;resize:vertical;line-height:1.5}
.stepper{display:flex;align-items:center;gap:var(--sp-2)}
.stepper .btn{width:56px;min-height:56px;font-size:24px}
.stepper .input{text-align:center;font-size:24px;font-weight:700;min-height:56px}
.radio-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}
.radio-card{min-height:56px;padding:var(--sp-2) var(--sp-3);border:2px solid var(--border);border-radius:var(--radius-sm);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;background:var(--card);text-align:left}
.radio-card.selected{border-color:var(--text);background:var(--bg)}
.radio-card:disabled{opacity:.45;cursor:not-allowed}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);min-height:var(--touch)}
/* ===== 9. 모달 · 토스트 ===== */
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(63,61,86,.45);display:flex;align-items:flex-end;justify-content:center;padding:var(--sp-4)}
.modal{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--card);border-radius:var(--radius);padding:var(--sp-5)}
.modal-title{font-size:20px;font-weight:700;margin-bottom:var(--sp-4)}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin-top:var(--sp-4)}
.toast-root{position:fixed;top:var(--sp-4);left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:var(--sp-2);width:min(92vw,480px);pointer-events:none}
.toast{padding:var(--sp-3) var(--sp-4);border-radius:var(--radius-sm);background:var(--text);color:var(--card);font-weight:700;font-size:15px;border-left:6px solid var(--clean);white-space:pre-wrap}
.toast-warn{border-left-color:var(--warn)} .toast-danger{border-left-color:var(--danger)}
/* ===== 10. 공해 게이지 (G장) ===== */
.gauge{display:block}
.gauge-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);margin-bottom:var(--sp-1);font-size:14px;color:var(--muted);font-weight:700}
.gauge-track{position:relative;height:28px;border-radius:14px;background:var(--border);overflow:hidden}
.gauge-fill{height:100%;border-radius:14px;background:var(--clean);transition:width .3s ease}
.gauge.warn .gauge-fill{background:var(--warn)}
.gauge.danger .gauge-fill{background:var(--danger)}
.gauge-text{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.gauge-sub{margin-top:var(--sp-1);font-size:14px;color:var(--muted);text-align:right}
.gauge.warn .gauge-sub,.gauge.danger .gauge-sub{color:var(--text)}
/* ===== 11. 로그인 이름 격자 · PIN 키패드 ===== */
.login-tabs{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.login-tabs .tab{min-height:56px;font-size:18px;justify-content:center}
.name-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:var(--sp-3)}
.name-btn{min-height:64px;border-radius:var(--radius);border:3px solid var(--border);background:var(--card);font-size:18px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.name-btn .sub{font-size:12px;color:var(--muted);font-weight:500}
.name-btn.team-white{border-color:var(--team-white)} .name-btn.team-blue{border-color:var(--team-blue)}
.name-btn.team-red{border-color:var(--team-red)} .name-btn.team-black{border-color:var(--team-black)} .name-btn.team-gold{border-color:var(--team-gold)}
.name-btn.selected{background:var(--text);color:var(--card)}
.name-btn.selected .sub{color:var(--card)}
.name-btn:disabled{opacity:.4;cursor:not-allowed}
.pin-dots{display:flex;justify-content:center;gap:var(--sp-3);margin:var(--sp-4) 0}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--text)}
.pin-dot.filled{background:var(--text)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-3);max-width:320px;margin:0 auto}
.key{min-height:64px;border-radius:var(--radius);background:var(--card);border:1px solid var(--border);font-size:24px;font-weight:700}
.key-ghost{background:transparent;border-color:transparent;font-size:16px}
/* ===== 12. 반응형 ===== */
@media (max-width:720px){
  .currency-grid{grid-template-columns:repeat(2,1fr)}
  .currency-grid .chip:last-child{grid-column:span 2}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .modal-actions{grid-template-columns:1fr}
}@media (min-width:900px){
  .nav{position:sticky;top:0;bottom:auto;border-top:none;border-bottom:1px solid var(--border);margin-bottom:var(--sp-4);border-radius:var(--radius)}
  .app{padding-bottom:var(--sp-6)}
  .modal-backdrop{align-items:center}
}

/* =====================================================
   간소화 v2: 공통 셸 · 지급 이동 버튼 · 재화 편집 카드
===================================================== */

.btn-blue {
  background: var(--team-blue);
  color: var(--text);
}

.btn-red {
  background: var(--team-red);
  color: var(--text);
}

/* TopBar 아래에서 공해 바만 고정합니다.
   내비게이션보다 높고, 모달·토스트보다 낮습니다. */
.app-shell .shell-pollution {
  position: sticky;
  top: 0;
  z-index: 60;
  margin-bottom: var(--sp-3);
  padding: var(--sp-2) 0;
  background: var(--team-bg, var(--bg));
}

.compact-gauge {
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--card);
  overflow: hidden;
}

.compact-gauge-line {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  width: 100%;
  min-height: var(--touch);
  padding: var(--sp-2) var(--sp-3);
  color: var(--text);
  text-align: left;
}

button.compact-gauge-line {
  cursor: pointer;
}

.compact-gauge-line:focus-visible {
  outline: 2px solid var(--credit);
  outline-offset: -2px;
}

.compact-gauge-title {
  flex: 0 0 auto;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}

.compact-gauge-meter {
  position: relative;
  flex: 1 1 auto;
  min-width: 72px;
  height: 26px;
  overflow: hidden;
  border-radius: var(--radius-sm);
  background: var(--border);
}

.compact-gauge-fill {
  display: block;
  height: 100%;
  background: var(--clean);
}

.compact-gauge.warn .compact-gauge-fill {
  background: var(--warn);
}

.compact-gauge.danger .compact-gauge-fill {
  background: var(--danger);
}

.compact-gauge-value {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.compact-gauge-remaining {
  flex: 0 0 auto;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}

.compact-gauge-notice {
  padding: var(--sp-3);
  border-top: 1px solid var(--border);
  color: var(--text);
  font-size: 14px;
}

.daily-shortcuts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-3);
  margin-bottom: var(--sp-3);
}

.daily-shortcuts .btn {
  min-height: 64px;
  padding: var(--sp-2) var(--sp-3);
}

/* 비활성 학생 선택 버튼은 상태를 분명하게 표시합니다. */
.name-btn:disabled {
  opacity: 1;
  cursor: not-allowed;
  background: var(--bg);
  color: var(--muted);
  border-color: var(--border);
}

.name-btn:disabled .sub {
  color: var(--muted);
}

.name-btn .badge {
  font-size: 12px;
  min-height: 22px;
}

/* 설정 안의 공지 관리 등 큰 섹션을 구분합니다. */
.console-section {
  margin-top: var(--sp-5);
}

.console-section-heading {
  margin-bottom: var(--sp-3);
  font-size: 18px;
  font-weight: 700;
}

/* 재화 관리 필터 */
.wallet-filter-grid {
  display: grid;
  grid-template-columns: minmax(140px, 1fr) minmax(180px, 2fr);
  gap: var(--sp-3);
}

.wallet-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--sp-3);
}

.wallet-grid > .card {
  margin-top: 0;
}

.wallet-card {
  scroll-margin-top: 92px;
  padding: var(--sp-3);
}

.wallet-card .card-title {
  font-size: 16px;
  margin-bottom: var(--sp-2);
}

.wallet-card.is-dirty {
  border-color: var(--credit);
}

.wallet-card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--sp-2);
  margin-bottom: var(--sp-2);
}

.wallet-edit-list {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.wallet-edit-row {
  display: grid;
  grid-template-columns: minmax(56px, auto) minmax(0, 1fr) 72px;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-1) 0;
  border-bottom: 1px solid var(--border);
}

.wallet-edit-row:last-child {
  border-bottom: 0;
}

.wallet-currency-label {
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}

.wallet-balance-preview {
  font-size: 14px;
  text-align: left;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}

.wallet-edit-buttons {
  display: flex;
  gap: var(--sp-1);
  flex-wrap: nowrap;
}

.wallet-edit-buttons .btn {
  min-width: 36px;
  min-height: 36px;
  padding: 0 var(--sp-2);
  font-size: 14px;
}

.wallet-delta-input {
  width: 100%;
  min-height: 36px;
  padding: 0 var(--sp-2);
  text-align: right;
  font-size: 14px;
}

.wallet-stale-note {
  margin-bottom: var(--sp-2);
  padding: var(--sp-2);
  border: 1px solid var(--warn);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--warn) 30%, var(--card));
  font-size: 13px;
}

.wallet-reason {
  margin-top: var(--sp-2);
}

function buildSeedState(empty = false) {

    item('공책', 3, 20, 'supply'),

    name,
    teamId,

      0

      'black',

    coupon(

      'black',
      4,
      10,
      '급식 줄 맨 앞에 설 수 있어요.',
      'none',
      0
    ),
    coupon(
      '숙제 면제권',
      'gold',
      1,
      20,
      '숙제 1회를 면제받아요.',
      'homeworkPass',
      0
    ),
    coupon(
      '팀 이동권',
      'gold',
      3,
      5,
      '선생님 승인 후 다른 팀으로 이동해요.',
      'teamChange',
      0

    rewardAmount: 1,
    status: 'open',
    createdBy: goldFirst.id,
    winnerUids: [],
    hintViewers: [],
    createdAt: nowISO(),
    openedAt: nowISO(),

    const paidAt = new Date(
      clock.getTime() - minutesAgo * 60000

    const transaction = {

function migrateLegacyDelegateRequest(s, request, migratedAt) {
  if (
    request.type !== 'dutyDelegate' ||
    !['pending', 'awaitingChoice'].includes(request.status)
  ) {
    return;
  }

  const payload = request.payload || (request.payload = {});
  const student = s.users[request.fromUid];
  const currency = payload.creditType;
  const amount = Number(payload.cost);
  const dateKey = getDateKey(new Date(migratedAt));

  const canRefund =
    student &&
    !payload.refunded &&
    ['credit', 'cleanCredit'].includes(currency) &&
    Number.isSafeInteger(amount) &&
    amount >= 0;

  if (canRefund) {
    if (amount > 0) {
      student.balances[currency] += amount;

      s.transactions.push({
        id: uid(),
        type: 'delegateRefund',
        from: null,
        to: { kind: 'user', id: student.id },
        currency,
        amount,
        fee: 0,
        feeCurrency: null,
        feePayer: null,
        pollutionDelta: 0,
        memo: '알바 기능 종료로 대기 요청 비용 환불',
        createdBy: SYSTEM_ID,
        createdAt: migratedAt,
        dateKey,
        ref: {
          requestId: request.id,
          migrationVersion: STATE_VERSION,
        },
      });

      if (currency === 'credit') {
        const before = s.settings.pollution;
        const after = Math.max(0, before - amount);

        s.settings.pollution = after;

        s.pollutionLogs.push({
          id: uid(),
          delta: -amount,
          before,
          after,
          reason: '알바 기능 종료로 대기 요청 비용 환불',
          preset: 'refund',
          teamIds: [],
          ref: {
            requestId: request.id,
            migrationVersion: STATE_VERSION,
          },
          createdBy: SYSTEM_ID,
          createdAt: migratedAt,
          dateKey,
        });
      }

      student.notifications.unshift({
        id: uid(),
        message:
          `알바 기능이 없어져 대기 중인 요청을 취소했어요. ` +
          `${CURRENCY_LABEL[currency]} ${amount}개를 돌려드렸어요.`,
        kind: 'info',
        read: false,
        createdAt: migratedAt,
        dateKey,
        ref: { requestId: request.id },
      });
    }

    payload.refunded = true;
  }

  request.status = 'cancelled';
  request.resolvedAt = migratedAt;
  request.resolvedBy = SYSTEM_ID;
  request.cancelReason = '알바 기능 종료';
}
function migrateState(input) {
  const s =
    input && typeof input === 'object'
      ? input
      : {};

  const oldVersion = Number(s.version) || 1;
  const defaults = buildSeedState(true);
  const migratedAt = nowISO();

  s.settings = {
    ...defaults.settings,
    ...(s.settings || {}),
  };

  s.users =
    s.users && typeof s.users === 'object'
      ? s.users
      : {};

  s.teams =
    s.teams && typeof s.teams === 'object'
      ? s.teams
      : {};

  s.dailyRecords =
    s.dailyRecords && typeof s.dailyRecords === 'object'
      ? s.dailyRecords
      : {};

  const arrayKeys = [
    'requests',
    'transactions',
    'pollutionLogs',
    'pollutionEvents',
    'trades',
    'couponCatalog',
    'couponListings',
    'storeCatalog',
    'storeListings',
    'storeSales',
    'teamPurchases',
    'quizzes',
    'homeworkHelps',
    'notices',
  ];

  arrayKeys.forEach((key) => {
    if (!Array.isArray(s[key])) {
      s[key] = cloneDeep(defaults[key]);
    }
  });

  Object.entries(s.users).forEach(([id, student]) => {
    student.id = id;
    student.balances = student.balances || {};

    CURRENCIES.forEach((currency) => {
      const value = student.balances[currency];

      student.balances[currency] =
        Number.isSafeInteger(value) && value >= 0
          ? value
          : 0;
    });

    student.coupons = Array.isArray(student.coupons)
      ? student.coupons
      : [];

    student.notifications = Array.isArray(student.notifications)
      ? student.notifications
      : [];

    student.serviceGauge =
      Number.isSafeInteger(student.serviceGauge) && student.serviceGauge >= 0
        ? student.serviceGauge
        : 0;

    if (!student.pinHash) {
      student.pinHash = DEFAULT_PIN_HASH;
      student.mustResetPin = true;
    }

    // 구버전의 비활성 학생도 데이터 손실 없이 학생 명단에 남깁니다.
    delete student.active;
    delete student.dutyId;
  });

  TEAM_IDS.forEach((teamId) => {
    if (!s.teams[teamId]) {
      s.teams[teamId] = makeTeam(teamId, null, s.settings);
    }

    const team = s.teams[teamId];
    team.vault = team.vault || emptyVault();

    CURRENCIES.forEach((currency) => {
      const value = team.vault[currency];

      team.vault[currency] =
        Number.isSafeInteger(value) && value >= 0
          ? value
          : 0;
    });

    team.leaderHistory = Array.isArray(team.leaderHistory)
      ? team.leaderHistory
      : [];

    team.vaultLog = Array.isArray(team.vaultLog)

    if (
      team.leaderUid &&

      const previous = team.leaderUid;
      team.leaderUid = null;

      team.leaderHistory.push({

        fromUid: previous,
        by: SYSTEM_ID,
        at: migratedAt,
        memo: '데이터 정리로 팀장 공석',
      });

    if (!team.dailyIssued) {

        gold: 0,

  });

  Object.values(s.dailyRecords).forEach((record) => {

    // 과거 일일 출석·지급·봉사 기록은 유지합니다.

        .map((p) => ({ id: String(p.id || uid()), label: String(p.label).trim().slice(0, 100), delta: Math.trunc(Number(p.delta)) }))

/* =====================================================
   4. 트랜잭션 코어: runTx · transfer · applyPollution · runPollutionTax
===================================================== */
let txDepth = 0;
let isTxProcessing = false; // 동시 클릭 방지용 락(Lock) 추가

/**
 * 모든 재화 변동의 유일한 진입점. fn 안에서 예외가 나면 state 전체를 스냅샷으로 되돌립니다(원자성).
 * 성공 시 저장 → render → 임계값 도달 시 세금 집행.
 */
function runTx(fn, opts = {}) {
  // 이미 다른 작업이 처리 중이면 튕겨냅니다 (덮어쓰기 방지)
  if (txDepth === 0 && isTxProcessing && !opts.inTax) {
    if (!opts.silent && typeof Toast === 'function') Toast('이전 작업 처리 중입니다. 잠시만 기다려주세요.', 'warn');
    return { ok: false, error: '처리 중복 방지' };
  }

  // 중첩 거래의 실패는 바깥 거래에서 처리합니다.
  if (txDepth > 0) {
    return { ok: true, result: fn() };
  }

  isTxProcessing = true; // 락 걸기
  const snapshot = cloneDeep(state);
  let result;
  txDepth++;

  try {
    result = fn();
    saveState();
  } catch (error) {
    state = snapshot;
    const message = error?.message || '처리 중 문제가 생겼어요';
    console.warn('[runTx 실패]', error);
    if (!opts.silent && typeof Toast === 'function') Toast(message, 'danger');
    isTxProcessing = false; // 에러 시 즉각 락 해제
    return { ok: false, error: message };
  } finally {
    txDepth--;
  }

  // 작업 성공 시 0.5초 뒤에 락을 풀어 연타를 방지합니다.
  setTimeout(() => { isTxProcessing = false; }, 500);

  // 여기부터는 이미 저장된 거래의 후속 처리입니다.
  if (!opts.silent && typeof render === 'function') {
    try { render(); } catch (error) { console.error('[화면 갱신 실패]', error); }
  }

  if (state.settings.pendingTaxEventId && !opts.inTax) {
    try {
      const taxResult = runPollutionTax(state.settings.pendingTaxEventId);
      if (!taxResult.ok) console.warn('[세금 대기]', taxResult.error);
    } catch (error) { console.error('[세금 처리 실패]', error); }
  }

  return { ok: true, result };
}
function assertInTx() { if (txDepth === 0) throw new Error('재화 변동은 runTx 안에서만 할 수 있어요'); }
function assertAmount(amount, allowZero = false) {
  if (!isInt(amount) || amount < 0 || (!allowZero && amount === 0)) throw new Error('수량은 1 이상의 정수여야 해요');
}function assertBalance(ref, currency, amount) {
  const w = walletOf(ref);
  if (w[currency] < amount) throw new Error(`${walletName(ref)}의 ${CURRENCY_LABEL[currency]}이(가) 부족해요(보유 ${w[currency]}개)`);
}function assertReason(reason, max = 50) {
  if (!reason || !String(reason).trim()) throw new Error('사유를 입력해 주세요');
  if (String(reason).trim().length > max) throw new Error(`사유는 ${max}자 이내로 적어 주세요`);
  return String(reason).trim();
}/**
 * 재화 이동/발행/소각 1건. from=null이면 발행, to=null이면 소각.
 * 순서: 잔고 검증 → 잔고 변경 → transactions 기록 → 공해 변동.
 */
function transfer({ type, from = null, to = null, currency, amount, memo = '', createdBy = currentActorUid(),
  fee = 0, feeCurrency = null, feePayer = null, pollutionDelta = 0, ref = null }) {
  assertInTx();
  if (!CURRENCIES.includes(currency)) throw new Error('알 수 없는 재화예요');
  assertAmount(amount, true);
  if (!from && !to) throw new Error('보내는 곳과 받는 곳이 모두 없어요');
  if (from && amount > 0) assertBalance(from, currency, amount);
  if (fee > 0 && (!feePayer || !['credit', 'cleanCredit'].includes(feeCurrency))) throw new Error('수수료 정보가 올바르지 않아요');
  if (from && amount > 0) walletOf(from)[currency] -= amount;
  if (to && amount > 0) walletOf(to)[currency] += amount;
  if (fee > 0) {
    assertBalance(feePayer, feeCurrency, fee);           // 본 거래 차감 이후 잔고로 재검증
    walletOf(feePayer)[feeCurrency] -= fee;
    if (feeCurrency === 'credit') pollutionDelta += fee;
  }
  const tx = { id: uid(), type, from, to, currency, amount, fee, feeCurrency, feePayer, pollutionDelta, memo, createdBy, createdAt: nowISO(), dateKey: getDateKey(), ref };
  state.transactions.push(tx);
  if (pollutionDelta) applyPollution(pollutionDelta, memo || TX_TYPE_LABEL[type] || type, 'credit', { txId: tx.id });
  return tx;
}// 🛑 무공해 크레딧 게이지 증가 및 보상 함수
function processEcoGauge(userId, amount) {
  if (!state.settings.useEcoGauge) return;
  const u = getUser(userId);
  const target = Math.max(1, state.settings.ecoGaugeTarget || 10);
  u.ecoGauge = (u.ecoGauge || 0) + amount;
  while (u.ecoGauge >= target) {
    u.ecoGauge -= target;
    transfer({ type: 'goldIssue', from: null, to: userRef(userId), currency: 'gold', amount: 1, memo: `🌱 무공해 크레딧 보상 (${target}개 달성)`, createdBy: SYSTEM_ID });
    notify(userId, `🌱 무공해 크레딧 사용 게이지를 채워서 골드 1개를 받았어요!`, 'success');
  }
}

function assertCreditType(creditType) {
  if (!['credit', 'cleanCredit'].includes(creditType)) throw new Error('크레딧 종류를 선택해 주세요');
}/** 크레딧 소각(결제). 일반 크레딧이면 1개당 공해 +1, 무공해면 변동 없음. */
function spendCredit(payerRef, amount, creditType, type, memo, extra = {}) {
  assertCreditType(creditType);
  if (amount <= 0) return null;
  if (creditType === 'cleanCredit' && payerRef && payerRef.kind === 'user') processEcoGauge(payerRef.id, amount);
  return transfer({ type, from: payerRef, to: null, currency: creditType, amount, memo, pollutionDelta: creditType === 'credit' ? amount : 0, ...extra });
}/** 포인트·골드 소비 시 크레딧 1개 추가 지불(creditOnSpend) */
function spendExtraCredit(payerRef, creditType, memo) {
  if (!state.settings.creditOnSpend) return null;
  return spendCredit(payerRef, 1, creditType, 'spendFee', memo);
}/**
 * 공해 변동의 유일한 진입점. 값 갱신 + pollutionLogs 기록 + 임계값 도달 시 pendingTaxEventId 설정.
 * preset: credit | duty | noise | leaderMiss | manual | coupon | tax | refund
 */
function applyPollution(delta, reason, preset = 'manual', ref = null) {
  delta = Math.trunc(Number(delta) || 0);
  if (!delta) return null;
  const s = state.settings;
  const before = s.pollution;
  const after = clamp(before + delta, 0, s.pollutionThreshold);
  s.pollution = after;
  const log = { id: uid(), delta, before, after, reason, preset, teamIds: (ref && ref.teamIds) || [], ref, createdBy: currentActorUid(), createdAt: nowISO(), dateKey: getDateKey() };
  state.pollutionLogs.push(log);
  if (after >= s.pollutionThreshold && !s.pendingTaxEventId && preset !== 'tax') s.pendingTaxEventId = uid();
  if (txDepth === 0) {                        // runTx 밖에서 호출된 경우 직접 저장·렌더·세금
    saveState();
    if (typeof render === 'function') render();
    if (s.pendingTaxEventId) runPollutionTax(s.pendingTaxEventId);
  }
  return log;
}function formatTaxLine(currency, x, raw, loss, remain, pct) {
  const label = CURRENCY_LABEL[currency];
  if (Number.isInteger(raw)) return `${label}: ${x} × ${pct}% = ${loss} 소멸 → ${remain} 남음`;
  return `${label}: ${x} × ${pct}% = ${raw} → ${loss} 소멸 (소수점 절사) → ${remain} 남음`;
}/** 이번 세금 주기(마지막 tax 리셋 이후)의 공해 기여도 집계. 기여도 모달·세금 집행 공용 */
function computePollutionContribution() {
  let lastTaxIdx = -1;
  for (let i = state.pollutionLogs.length - 1; i >= 0; i--) {
    if (state.pollutionLogs[i].preset === 'tax') { lastTaxIdx = i; break; }
  }
  const recentLogs = state.pollutionLogs.slice(lastTaxIdx + 1);
  const byTeam = { white: 0, blue: 0, red: 0, black: 0, gold: 0 };
  const byStudent = {};
  const byStudentReduce = {};
  let totalDelta = 0;

  recentLogs.forEach((log) => {
    if (log.delta < 0 && log.preset === 'coupon') {
      if (log.ref && log.ref.requestId) {
        const req = state.requests.find((r) => r.id === log.ref.requestId);
        if (req && state.users[req.fromUid]) {
          byStudentReduce[req.fromUid] = (byStudentReduce[req.fromUid] || 0) + Math.abs(log.delta);
        }
      }
      return;
    }
    if (log.delta < 0) { totalDelta += log.delta; return; }
    if (log.delta === 0) return;
    totalDelta += log.delta;

    const targets = [];
    if (log.preset === 'grantClose' && log.ref && Array.isArray(log.ref.uids)) {
      log.ref.uids.forEach((u) => targets.push({ uid: u }));
    } else if (log.preset === 'leaderMiss' && log.ref && Array.isArray(log.ref.teamIds)) {
      log.ref.teamIds.forEach((tid) => {
        const team = state.teams[tid];
        if (team && team.leaderUid) targets.push({ uid: team.leaderUid, tid });
        else targets.push({ tid });
      });
    } else if (log.reason && log.reason.includes('[봉사지연]')) {
      const parts = log.reason.split(' ');
      if (parts.length >= 2) {
        const u = Object.values(state.users).find((x) => x.name === parts[1]);
        if (u) targets.push({ uid: u.id });
      }
    } else if (state.users[log.createdBy]) {
      targets.push({ uid: log.createdBy });
    }

    if (targets.length > 0) {
      const per = log.delta / targets.length;
      targets.forEach((t) => {
        if (t.uid && state.users[t.uid]) {
          const u = state.users[t.uid];
          byStudent[u.id] = (byStudent[u.id] || 0) + per;
          byTeam[u.teamId] = (byTeam[u.teamId] || 0) + per;
        } else if (t.tid) {
          byTeam[t.tid] = (byTeam[t.tid] || 0) + per;
        }
      });
    }
  });

  const teamTotal = sum(Object.values(byTeam));
  const commonDelta = totalDelta - teamTotal;
  const rank = (m) => Object.entries(m)
    .filter(([uid, v]) => v > 0 && state.users[uid])
    .sort((a, b) => b[1] - a[1])
    .slice(0, 3)
    .map(([uid, v], i) => ({ uid, value: v, rank: i + 1 }));

  return { byTeam, byStudent, byStudentReduce, totalDelta, commonDelta, topPolluters: rank(byStudent), topCleaners: rank(byStudentReduce) };
}

/** 세금 계획: 유발 Top3 가산(3위 +1단계 … 1위 +3단계) · 정화 Top3 면제(0%). 둘 다 해당하면 면제 우선 */
function getTaxPlan() {
  const s = state.settings;
  const base = s.penaltyRate;
  const plan = { enabled: !!s.taxTierEnabled, base, step: (toInt(s.taxTierStepPct) || 0) / 100, byUid: {}, polluters: [], cleaners: [] };
  if (!plan.enabled) return plan;
  const c = computePollutionContribution();
  c.topPolluters.forEach((p) => {
    const rate = Math.min(1, round3(base + plan.step * (4 - p.rank)));
    plan.byUid[p.uid] = { tier: 'polluter', rank: p.rank, rate, value: p.value };
    plan.polluters.push({ uid: p.uid, name: state.users[p.uid].name, rank: p.rank, rate, value: p.value });
  });
  c.topCleaners.forEach((p) => {
    if (plan.byUid[p.uid]?.tier === 'polluter') plan.polluters = plan.polluters.filter((x) => x.uid !== p.uid);
    plan.byUid[p.uid] = { tier: 'cleaner', rank: p.rank, rate: 0, value: p.value };
    plan.cleaners.push({ uid: p.uid, name: state.users[p.uid].name, rank: p.rank, rate: 0, value: p.value });
  });
  return plan;
}
/**
 * 공해 정화 세금 집행(멱등). 활성 학생 전원의 포인트·골드에서 floor(x × 세율)만큼 소멸.

 * 테스트: 100P/10G → 80P/8G, 20P/2G → 16P/2G, 5P/0G → 4P/0G
 */
function runPollutionTax(eventId) {
  if (!eventId) return { ok: true };
  if (state.pollutionEvents.some((e) => e.id === eventId)) {
    if (state.settings.pendingTaxEventId === eventId) { state.settings.pendingTaxEventId = null; saveState(); }
    return { ok: true, already: true };
  }
  return runTx(() => {
    const s = state.settings;
    const rate = s.penaltyRate;
    const pct = Math.round(rate * 100);
    const before = s.pollution;
    const details = [];

       // 1. 학생 개인 지갑 세금 징수 (유발 Top3 가산 · 정화 Top3 면제 적용)
    const plan = getTaxPlan();
    activeStudents().forEach((u) => {
      const tier = plan.byUid[u.id] || null;
      const myRate = tier ? tier.rate : rate;
      const myPct = Math.round(myRate * 100);
      const tag = tier ? (tier.tier === 'cleaner' ? ' (정화 Top3 면제)' : ` (유발 ${tier.rank}위 가산)`) : '';
      const lines = [];
      const detail = { uid: u.id, name: u.name, rate: myRate, tier: tier ? tier.tier : null, rank: tier ? tier.rank : null };
      CURRENCIES.forEach((cur) => {
        const x = u.balances[cur];
        const raw = x * myRate;
        const loss = Math.floor(raw);
        const remain = x - loss;
        if (loss > 0) {
          transfer({ type: 'pollutionTax', from: userRef(u.id), to: null, currency: cur, amount: loss, memo: `공해 정화 세금 ${myPct}%${tag}`, createdBy: SYSTEM_ID, ref: { eventId } });
          lines.push(formatTaxLine(cur, x, raw, loss, remain, myPct));
        }
        detail[cur] = { before: x, loss, after: remain };
      });

      if (tier && tier.tier === 'cleaner') {
        notify(u.id, `🍀 공해 정화 Top3 ${tier.rank}위! 이번 공해 정화 세금은 전액 면제예요.`, 'success', { eventId });
      } else if (lines.length > 0) {
        const head = tier ? `🚨 공해 유발 Top3 ${tier.rank}위라서 세율이 ${pct}% → ${myPct}%로 올랐어요.` : '공해 정화 세금이 적용되었어요.';
        notify(u.id, `${head}\n${lines.join('\n')}`, 'danger', { eventId });
      } else {
        notify(u.id, `${tier ? `🚨 공해 유발 Top3 ${tier.rank}위(세율 ${myPct}%)지만 ` : ''}납부할 세금이 없어요. (절세 성공!)`, 'info', { eventId });
      }
      details.push(detail);
    });


    // 2. 팀 금고 모든 재화 세금 징수
    TEAM_IDS.forEach((teamId) => {
      const team = getTeam(teamId);
      const lines = [];
      const detail = { uid: `vault_${teamId}`, name: `${TEAM_LABEL[teamId]}팀 금고` };
      let hasLoss = false;

      CURRENCIES.forEach((cur) => {
        const x = team.vault[cur];
        const raw = x * rate;
        const loss = Math.floor(raw);
        const remain = x - loss;
        if (loss > 0) {
          transfer({ type: 'pollutionTax', from: vaultRef(teamId), to: null, currency: cur, amount: loss, memo: `금고 공해 세금 ${pct}%`, createdBy: SYSTEM_ID, ref: { eventId } });
          hasLoss = true;
          lines.push(formatTaxLine(cur, x, raw, loss, remain, pct));
        }
        detail[cur] = { before: x, loss, after: remain };
      });

      if (hasLoss) {
        notifyTeam(teamId, `우리 팀 금고에 공해 정화 세금이 적용되었어요.\n${lines.join('\n')}`, 'danger', { eventId });
      }
      details.push(detail);
    });

        state.pollutionEvents.push({
      id: eventId, pollutionBefore: before, threshold: s.pollutionThreshold, rate, details,
      tierEnabled: plan.enabled, tierStep: plan.step,
      polluters: plan.polluters.map((p) => ({ uid: p.uid, name: p.name, rank: p.rank, rate: p.rate })),
      cleaners: plan.cleaners.map((p) => ({ uid: p.uid, name: p.name, rank: p.rank })),
      createdAt: nowISO(), dateKey: getDateKey(),
    });

    s.pendingTaxEventId = null;
    applyPollution(-before, '공해 정화 세금 집행 후 리셋', 'tax', { eventId });
    s.pollution = 0;
  }, { inTax: true });
}/* =====================================================
   5. 요청(Request) 모델 (F장)
===================================================== */
function createRequest({ type, fromUid, targetUid = null, teamId = null, payload = {}, status = 'pending' }) {
  const req = { id: uid(), type, fromUid, targetUid, teamId, status, payload, createdAt: nowISO(), resolvedAt: null, resolvedBy: null, dateKey: getDateKey() };
  state.requests.push(req);
  return req;
}function canResolveRequest(request, actorUid) {
  const supported = Object.prototype.hasOwnProperty.call(
    REQUEST_HANDLERS,
    request.type
  );

  if (!supported) return false;

  if (actorUid === TEACHER_ID) return true;

  switch (request.type) {
    case 'pointIssue':
    case 'goldIssue':
    case 'teamChange':
      return false;

    case 'leaderHandover':
      return (
        request.targetUid === actorUid &&
        !!state.users[actorUid]
      );

    case 'couponRedeem': {
      const handler = effectHandler(request.payload.effectType);

      return (
        handler !== 'teacher' &&
        isTeamMember(actorUid, handler)
      );
    }

    case 'quizReward':
      return (
        request.targetUid === actorUid &&
        !!state.users[actorUid]
      );

    default:
      return false;
  }
}
function cancelPendingRequest(
  request,
  actorUid,
  reason = '요청 취소'
) {
  assertInTx();

  if (!['pending', 'awaitingChoice'].includes(request.status)) {
    return false;
  }

  if (request.type === 'leaderHandover') {
    const team = state.teams[request.teamId];

    if (team?.pendingHandover?.requestId === request.id) {
      team.pendingHandover = null;
    }
  }

  if (request.type === 'couponRedeem') {
    const student = state.users[request.fromUid];

    const coupon = student?.coupons.find(
      (candidate) => candidate.id === request.payload?.couponId
    );

    if (coupon?.status === 'pendingRedeem') {
      coupon.status = 'unused';
    }
  }

  request.status = 'cancelled';
  request.resolvedAt = nowISO();
  request.resolvedBy = actorUid;
  request.cancelReason = reason;

  return true;
}

function cancelRequest(
  requestId,
  actorUid = currentActorUid()
) {
  return runTx(() => {
    const request = getRequest(requestId);

    if (!['pending', 'awaitingChoice'].includes(request.status)) {
      throw new Error('이미 처리된 요청이에요');
    }

    if (
      actorUid !== TEACHER_ID &&
      request.fromUid !== actorUid
    ) {
      throw new Error('요청한 사람만 취소할 수 있어요');
    }

    // 퀴즈 정답 보상은 기존처럼 정답자가 선택해서 받아요.
    if (request.type === 'quizReward') {
      throw new Error('퀴즈 보상은 취소할 수 없어요');
    }

    cancelPendingRequest(request, actorUid);

    if (request.targetUid) {
      notify(
        request.targetUid,
        `${actorName(request.fromUid)}의 요청이 취소되었어요.`
      );
    }

    return request;
  });
}
function resolveRequest(requestId, decision, actorUid = currentActorUid(), extra = {}) {
  return runTx(() => {
    const req = getRequest(requestId);
    if (req.status !== 'pending') throw new Error('이미 처리된 요청이에요');
    if (!canResolveRequest(req, actorUid)) throw new Error('이 요청을 처리할 권한이 없어요');
    const h = REQUEST_HANDLERS[req.type];
    if (!h) throw new Error('알 수 없는 요청 유형이에요');
    if (decision === 'approve') h.approve(req, actorUid, extra); else h.reject(req, actorUid, extra);
    req.status = decision === 'approve' ? 'approved' : 'rejected';
    req.resolvedAt = nowISO(); req.resolvedBy = actorUid;
    return req;
  });
}

/** 숙제 도움 요청자 랜덤 보상 추첨. 규칙 수치의 가중치 비율로 재화 1종을 뽑고, 전부 0이면 null */
function pickHomeworkRequesterReward() {
  const w = state.settings.homeworkRequesterRewardWeights || {};
  const entries = CURRENCIES.map((c) => [c, Math.max(0, toInt(w[c]) || 0)]).filter(([, v]) => v > 0);
  const total = sum(entries, ([, v]) => v);
  if (total <= 0) return null;
  let r = Math.random() * total;
  for (const [c, v] of entries) { r -= v; if (r < 0) return c; }
  return entries[entries.length - 1][0];
}

const REQUEST_HANDLERS = {
  itemProposal: {

    approve(request, actor) {
      const p = request.payload;
      
      // 1. 승인 시 아이템/쿠폰 자동 생성 (임의의 기본값 부여)
      if (p.kind === 'item') {
        // 물품: 도매 창고로 등록 (기본 간식, 재고 10개)
        addStoreItem({ name: p.name, cost: p.cost, stock: 10, kind: 'snack' });
      } else {
        // 쿠폰: 해당 팀 발행 목록으로 등록 (기본 이모지 🎫, 재고 10장)
        issueCoupon({ emoji: '🎫', name: p.name, teamId: request.teamId, cost: p.cost, stock: 10 });
      }

      // 2. 학생에게 자동 등록 완료 알림 전송
      notify(
        request.fromUid,
        `제안하신 신규 ${p.kind === 'item' ? '물품' : '쿠폰'} "${p.name}"이(가) 승인되어 자동으로 상점에 등록되었어요!`,
        'success'
      );
    },
    reject(request, actor, extra) {
      notify(
        request.fromUid,
        `제안하신 "${request.payload.name}" 추가가 거절되었어요.${extra.reason ? ` (${extra.reason})` : ''}`,
        'warn'
      );
    }
  },
  pointIssue: {
    approve(request, actor) {
      const { amount, reason } = request.payload;
      assertAmount(amount);

      const remaining = getRemainingIssue('white', 'point');

      if (amount > remaining) {
        throw new Error(
          `오늘 남은 포인트 발행 한도는 ${remaining}개예요`
        );
      }

      transfer({
        type: 'pointIssue',
        from: null,
        to: vaultRef('white'),
        currency: 'point',
        amount,
        memo: `포인트 발행: ${reason}`,
        createdBy: actor,
        ref: { requestId: request.id },
      });

      getDailyIssued('white').point += amount;

      notify(
        request.fromUid,
        `포인트 발행 ${amount}개가 승인되어 화이트팀 금고에 들어왔어요.`,
        'success'
      );
    },

    reject(request, actor, extra) {
      notify(
        request.fromUid,
        `포인트 발행 신청이 거절되었어요.${
          extra.reason ? ` (${extra.reason})` : ''
        }`,
        'warn'
      );
    },
  },

  goldIssue: {
    approve(request, actor) {
      const student = getUser(request.fromUid);

      if (student.teamId !== 'gold') {
        throw new Error('골드팀원만 골드를 받을 수 있어요');
      }

      const today = getDateKey();

      const already = state.requests.some(
        (candidate) =>
          candidate.id !== request.id &&
          candidate.type === 'goldIssue' &&
          candidate.fromUid === student.id &&
          candidate.status === 'approved' &&
          candidate.resolvedAt &&
          getDateKey(new Date(candidate.resolvedAt)) === today
      );

      if (already) {
        throw new Error(
          `${student.name}은(는) 오늘 이미 골드를 받았어요`
        );
      }

      if (getRemainingIssue('gold', 'gold') < 1) {
        throw new Error('오늘 학급 골드 한도를 모두 썼어요');
      }

      transfer({
        type: 'goldIssue',
        from: null,
        to: userRef(student.id),
        currency: 'gold',
        amount: 1,
        memo: `골드 지급: ${request.payload.reason}`,
        createdBy: actor,
        ref: { requestId: request.id },
      });

            getDailyIssued('gold').gold += 1;

      notify(
        student.id,
        `골드 1개를 받았어요! (${request.payload.reason})`,
        'success'
      );

            // 숙제 도우미 건이면 도움을 요청한 학생에게도 같은 시점에 재화 1개를 확률 추첨으로 지급
      const refKey = String(request.payload.refKey || '');
      if (refKey.startsWith('homework:')) {
        const homework = state.homeworkHelps.find((h) => h.id === refKey.slice('homework:'.length));
        const requester = homework ? state.users[homework.requesterUid] : null;
        const picked = pickHomeworkRequesterReward();
        if (requester && picked) {
          transfer({
            type: 'homeworkReward',
            from: null,
            to: userRef(requester.id),
            currency: picked,
            amount: 1,
            memo: `숙제 도움 요청 랜덤 보상 (${homework.subject} · 도우미 ${student.name})`,
            createdBy: actor,
            ref: { requestId: request.id, homeworkId: homework.id },
          });
          notify(
            requester.id,
            `🎁 ${student.name}의 숙제 도우미 골드가 승인되어 랜덤 보상으로 ${CURRENCY_LABEL[picked]} 1개를 받았어요! (${homework.subject})`,
            'success'
          );
        }
      }
    },



    reject(request, actor, extra) {
      notify(
        request.fromUid,
        `골드 신청(${request.payload.reason})이 거절되었어요.${
          extra.reason ? ` (${extra.reason})` : ''
        }`,
        'warn'
      );
    },
  },

  leaderHandover: {
    approve(request) {
      const team = getTeam(request.teamId);

      if (team.leaderUid !== request.fromUid) {
        throw new Error('요청한 사람이 더 이상 팀장이 아니에요');
      }

      const next = getUser(request.targetUid);

      if (next.teamId !== request.teamId) {
        throw new Error('팀장을 넘길 수 없는 학생이에요');
      }

      team.leaderUid = next.id;

      team.leaderHistory.push({
        uid: next.id,
        fromUid: request.fromUid,
        by: next.id,
        at: nowISO(),
        memo: '교체 요청 수락',
      });

      team.pendingHandover = null;

      notify(
        request.fromUid,
        `${next.name}이(가) 팀장 교체를 수락했어요. 이제 ${next.name}이(가) ${team.name} 팀장이에요.`,
        'success'
      );

      notify(
        next.id,
        `이제 ${team.name}의 팀장이에요!`,
        'success'
      );
    },

    reject(request) {
      const team = getTeam(request.teamId);

      if (team.pendingHandover?.requestId === request.id) {
        team.pendingHandover = null;
      }

      notify(
        request.fromUid,
        `${actorName(request.targetUid)}이(가) 팀장 교체를 거절했어요. 팀장은 그대로예요.`,
        'warn'
      );
    },
  },

  couponRedeem: {
    approve(request, actor, extra) {
      applyCouponEffect(request, actor, extra);
    },

    reject(request, actor, extra) {
      const student = getUser(request.fromUid);

      const coupon = student.coupons.find(
        (candidate) => candidate.id === request.payload.couponId
      );

      if (coupon?.status === 'pendingRedeem') {
        coupon.status = 'unused';
      }

      notify(
        student.id,
        `쿠폰 "${request.payload.couponName}" 사용이 거절되었어요.${
          extra.reason ? ` (${extra.reason})` : ''
        } 쿠폰은 그대로 남아 있어요.`,
        'warn'
      );
    },
  },

  teamChange: {
    approve(request, actor) {
      const student = getUser(request.fromUid);
      const nextTeamId = request.payload.toTeamId;

      if (!TEAM_IDS.includes(nextTeamId)) {
        throw new Error('이동할 팀이 올바르지 않아요');
      }

      cancelStudentHandovers(
        student.id,
        actor,
        '팀 이동으로 팀장 교체 요청 취소'
      );

      const oldTeam = getTeam(student.teamId);

      if (oldTeam.leaderUid === student.id) {
        oldTeam.leaderUid = null;

        oldTeam.leaderHistory.push({
          uid: null,
          fromUid: student.id,
          by: actor,
          at: nowISO(),
          memo: '팀 이동으로 팀장 공석',
        });
      }

      student.teamId = nextTeamId;

      notify(
        student.id,
        `${TEAM_LABEL[nextTeamId]}팀으로 이동했어요!`,
        'success'
      );
    },

    reject(request, actor, extra) {
      notify(
        request.fromUid,
        `팀 이동 요청이 거절되었어요.${
          extra.reason ? ` (${extra.reason})` : ''
        }`,
        'warn'
      );
    },
  },

  quizReward: {
    approve() {
      throw new Error('퀴즈 보상은 정답자가 직접 선택해요');
    },

    reject() {
      throw new Error('퀴즈 보상은 거절할 수 없어요');
    },
  },
};

/* =====================================================
   6. 출석 · 라이프 · 봉사 (블루팀)
===================================================== */
function saveAttendance(
  absentUids,
  actorUid = currentActorUid(),
  dateKey = getDateKey()
) {
  return runTx(() => {
    if (!isTeacher() || actorUid !== TEACHER_ID) {
      throw new Error('출석 체크는 선생님만 할 수 있어요');
    }

    const record = getDailyRecord(dateKey, true);
    const absent = new Set(absentUids || []);

    activeStudents().forEach((student) => {
      getStudentDay(student.id, dateKey, true).present =
        !absent.has(student.id);
    });

    record.attendanceSavedAt = nowISO();
    record.attendanceSavedBy = actorUid;

    return record;
  });
}
function grantLife(
  userIds,
  actorUid = currentActorUid(),
  dateKey = getDateKey()
) {
  return runTx(() => {
    const teacher = actorUid === TEACHER_ID && isTeacher();

    if (!teacher && !isTeamMember(actorUid, 'blue')) {
      throw new Error('라이프 지급은 블루팀만 할 수 있어요');
    }

    if (!teacher && !isLeader(actorUid)) {
      throw new Error('라이프 지급은 블루팀 팀장만 할 수 있어요');
    }

    if (!isAttendanceSaved(dateKey)) {
      throw new Error('선생님이 먼저 출석 체크를 해 주세요');
    }

    if (!teacher && getGrantClosed('life', dateKey)) {
      throw new Error('오늘의 라이프 지급이 종료되었어요');
    }

    const selected = [...new Set(userIds || [])];

    if (!selected.length) {
      throw new Error('학생을 선택해 주세요');
    }

    selected.forEach((id) => {
      const student = getUser(id);

      if (!isPresent(id, dateKey)) {
        throw new Error(
          `${student.name}은(는) 선택한 날짜에 결석이에요`
        );
      }

      const day = getStudentDay(id, dateKey, true);

      if (day.lifeGranted && !teacher) {
        throw new Error(
          `${student.name}은(는) 오늘 이미 라이프를 받았어요`
        );
      }

      transfer({
        type: 'lifeGrant',
        from: null,
        to: userRef(id),
        currency: 'life',
        amount: 1,
        memo: '라이프 지급',
        createdBy: actorUid,
        ref: { attendanceDateKey: dateKey },
      });

      day.lifeGranted = true;
      notify(id, '라이프 1개를 받았어요!', 'success');
    });

    return selected.length;
  });
}
function submitLife(userId = currentActorUid()) {
  return runTx(() => {
    const u = getUser(userId);
    if (!isPresent(userId)) throw new Error('오늘은 결석이라 라이프를 제출하지 않아도 돼요');
    const d = getStudentDay(userId, getDateKey(), true);
    if (d.lifeSubmittedAt) throw new Error('오늘은 이미 제출했어요');
    if (isPastDeadline()) throw new Error('마감 시간이 지났어요. 내일 봉사 후 환생할 수 있어요');
    if (u.balances.life <= 0) throw new Error('라이프가 없어요');
    transfer({ type: 'lifeSubmit', from: userRef(userId), to: null, currency: 'life', amount: 1, memo: '라이프 제출', createdBy: userId });
    d.lifeSubmittedAt = nowISO(); d.lifeOnTime = true;
    notify(userId, `라이프를 제출했어요. (${getTimeKey()})`, 'success');
  });
}

/** 지급 종료 정보: dailyRecord.lifeGrantClosed / creditGrantClosed = { closedAt, closedBy, missingCount } */
function getGrantClosed(currency, dateKey = getDateKey()) {
  const record = getDailyRecord(dateKey);
  if (!record) return null;
  return record[currency === 'life' ? 'lifeGrantClosed' : 'creditGrantClosed'] || null;
}

/** 오늘의 라이프/크레딧 지급 종료. 결석 제외 미지급 수만큼 공해 +n (preset 'grantClose') */
function closeDailyGrant(currency, actorUid = currentActorUid(), dateKey = getDateKey()) {
  return runTx(() => {
    if (!['life', 'credit'].includes(currency)) throw new Error('지급할 재화를 선택해 주세요');
    const teacher = actorUid === TEACHER_ID && isTeacher();
    const teamId = currency === 'life' ? 'blue' : 'red';
    const label = CURRENCY_LABEL[currency];
    if (!teacher && !(isTeamMember(actorUid, teamId) && isLeader(actorUid))) {
      throw new Error(`${label} 지급 종료는 ${TEAM_LABEL[teamId]}팀 팀장만 할 수 있어요`);
    }
    if (!isAttendanceSaved(dateKey)) throw new Error('선생님이 먼저 출석 체크를 해 주세요');
    const record = getDailyRecord(dateKey, true);
    const closedKey = currency === 'life' ? 'lifeGrantClosed' : 'creditGrantClosed';
    if (record[closedKey]) throw new Error(`오늘의 ${label} 지급은 이미 종료되었어요`);
    const flag = currency === 'life' ? 'lifeGranted' : 'creditGranted';
    const uids = activeStudents()
      .filter((s) => isPresent(s.id, dateKey))
      .filter((s) => !getStudentDay(s.id, dateKey)?.[flag])
      .map((s) => s.id);
    const count = uids.length;
    if (count > 0) {
      applyPollution(count, `${label} 지급 종료: 미지급 ${count}명`, 'grantClose', { dateKey, currency, uids });
    }
    record[closedKey] = { closedAt: nowISO(), closedBy: actorUid, missingCount: count };
    notifyAllStudents(
      count > 0
        ? `오늘의 ${label} 지급이 종료되었어요. 미지급 ${count}명만큼 공해가 ${count} 올라갔어요.`
        : `오늘의 ${label} 지급이 종료되었어요. 출석한 학생 모두 받았어요.`,
      count > 0 ? 'warn' : 'info',
      { dateKey, currency }
    );
    return { count, uids };
  });
}

function completeService(userId, dateKey, actorUid = currentActorUid()) {
  return runTx(() => {
    const teacher = actorUid === TEACHER_ID;
    if (!teacher && !isTeamMember(actorUid, 'blue')) throw new Error('봉사 완료 처리는 블루팀만 할 수 있어요');
    const target = getServiceTargets().find((t) => t.uid === userId && t.dateKey === dateKey);
    if (!target) throw new Error('봉사 대상 명단에 없어요');
    getStudentDay(userId, dateKey, true).serviceDone = true;
    notify(userId, '학급 봉사가 확인되었어요. 이제 앱을 다시 사용할 수 있어요.', 'success', { dateKey });

    let rewarded = false;
    let gauge = null;
    if (!teacher) {
      const handler = getUser(actorUid);
      const max = Math.max(1, toInt(state.settings.serviceGaugeMax) || 1);
      handler.serviceGauge = (Number.isSafeInteger(handler.serviceGauge) ? handler.serviceGauge : 0) + 1;
      if (handler.serviceGauge >= max) {
        transfer({ type: 'serviceReward', from: null, to: userRef(actorUid), currency: 'life', amount: 1, memo: '봉사 확인 게이지 완료 보상', createdBy: SYSTEM_ID, ref: { dateKey, targetUid: userId } });
        handler.serviceGauge = 0;
        rewarded = true;
        notify(actorUid, `봉사 확인 ${max}회를 모두 채워서 라이프 1개를 받았어요! 게이지가 0으로 돌아갔어요.`, 'success');
      }
      gauge = { value: handler.serviceGauge, max };
    }

    // 🛑 핵심: 선생님 앱의 '공해 전용 엔진(applyPollution)'을 직접 호출합니다!
    const penalty = toInt(state.settings.servicePollutionDelta) || 0;
    if (penalty > 0) {
      applyPollution(
        penalty, 
        `[봉사지연] ${actorName(userId)} 봉사 완료`, 
        'manual'
      );
      
      // (옵션) 공해가 올랐다는 것을 학급 전체에 알림으로 띄우고 싶다면 아래 코드가 작동합니다.
      notifyAllStudents(`봉사 완료 지연으로 공해 지수가 ${penalty}만큼 올랐어요`, 'warn');
    }

    return { rewarded, gauge, penalty };
  });
}/* =====================================================
   7. 크레딧 · 1인1역 · 알바 · 무공해 · 자율 지불 (레드팀)
===================================================== */
function grantCredit(
  userIds,
  actorUid = currentActorUid(),
  dateKey = getDateKey()
) {
  return runTx(() => {
    const teacher = actorUid === TEACHER_ID && isTeacher();

    if (!teacher && !isTeamMember(actorUid, 'red')) {
      throw new Error('크레딧 지급은 레드팀만 할 수 있어요');
    }

    if (!teacher && !isLeader(actorUid)) {
      throw new Error('크레딧 지급은 레드팀 팀장만 할 수 있어요');
    }

    if (!isAttendanceSaved(dateKey)) {
      throw new Error('선생님이 먼저 출석 체크를 해 주세요');
    }

    if (!teacher && getGrantClosed('credit', dateKey)) {
      throw new Error('오늘의 크레딧 지급이 종료되었어요');
    }

    const selected = [...new Set(userIds || [])];

    if (!selected.length) {
      throw new Error('학생을 선택해 주세요');
    }

    selected.forEach((id) => {
      const student = getUser(id);

      if (!isPresent(id, dateKey)) {
        throw new Error(
          `${student.name}은(는) 선택한 날짜에 결석이에요`
        );
      }

      const day = getStudentDay(id, dateKey, true);

      if (day.creditGranted && !teacher) {
        throw new Error(
          `${student.name}은(는) 오늘 이미 크레딧을 받았어요`
        );
      }

      transfer({
        type: 'creditGrant',
        from: null,
        to: userRef(id),
        currency: 'credit',
        amount: 1,
        memo: '크레딧 지급',
        createdBy: actorUid,
        ref: { attendanceDateKey: dateKey },
      });

      day.creditGranted = true;
      notify(id, '크레딧 1개를 받았어요!', 'success');
    });

    return { count: selected.length };
  });
}
function exchangeCleanCredit(userId = currentActorUid(), count = 1) {
  return runTx(() => {
    assertAmount(count);
    const rate = state.settings.cleanCreditRate;
    const u = getUser(userId);
    if (u.balances.credit < rate * count) throw new Error(`일반 크레딧 ${rate * count}개가 필요해요(보유 ${u.balances.credit}개)`);
    transfer({ type: 'cleanExchange', from: userRef(userId), to: null, currency: 'credit', amount: rate * count, memo: `무공해 교환(${rate}:1)`, createdBy: userId, pollutionDelta: 0 });
    transfer({ type: 'cleanExchange', from: null, to: userRef(userId), currency: 'cleanCredit', amount: count, memo: `무공해 교환(${rate}:1)`, createdBy: userId });
    notify(userId, `일반 크레딧 ${rate * count}개를 무공해 크레딧 ${count}개로 바꿨어요.`, 'success');
  });
}/** 크레딧 자율 지불 – 오프라인 특권 결제(승인 없음, 즉시 처리) */
function payCreditOffline(userId, amount, reason, creditType) {
  return runTx(() => {
    const u = getUser(userId);
    amount = toInt(amount);
    const text = String(reason || '').trim();
    if (!isInt(amount) || amount < 1 || !text || text.length > 50) throw new Error('사유와 수량을 입력해 주세요');
    assertCreditType(creditType);
    if (u.balances[creditType] < amount) throw new Error(`크레딧이 부족해요(보유 ${u.balances[creditType]}개)`);
    // 소각(to=null) + offlinePay 기록. 일반 크레딧이면 applyPollution(+amount) (transfer 내부에서 pollutionDelta로 처리)
    if (creditType === 'cleanCredit') processEcoGauge(userId, amount);
    const tx = transfer({
      type: 'offlinePay', from: userRef(userId), to: null, currency: creditType, amount, memo: text, createdBy: userId,
      pollutionDelta: creditType === 'credit' ? amount : 0,
    });
    if (creditType === 'credit') { const log = state.pollutionLogs[state.pollutionLogs.length - 1]; if (log && log.ref && log.ref.txId === tx.id) log.reason = `크레딧 자율 지불: ${text}`; }
    notify(userId, `${amount}크레딧을 지불했어요. 선생님께 보여 주세요. (${text})`, 'success', { txId: tx.id });
    if (typeof Toast === 'function') Toast(`${amount}크레딧을 지불했어요. 선생님께 보여 주세요.`, 'success');
    return tx;
  });
}/* =====================================================

/** 학생 → 팀 금고로 재화 옮기기(크레딧 소모·공해 변동 없음). vaultLog type 'deposit' */
function depositToVault(userId, currency, amount) {
  return runTx(() => {
    const u = getUser(userId);
    if (!CURRENCIES.includes(currency)) throw new Error('재화를 선택해 주세요');
    amount = toInt(amount);
    assertAmount(amount);
    if (u.balances[currency] < amount) throw new Error(`보유한 ${CURRENCY_LABEL[currency]}이(가) 부족해요(보유 ${u.balances[currency]}개)`);
    const tx = transfer({ type: 'userToVault', from: userRef(userId), to: vaultRef(u.teamId), currency, amount, memo: '팀 금고에 옮기기', createdBy: userId });
    pushVaultLog(u.teamId, { type: 'deposit', fromUid: userId, toUid: null, currency, amount, memo: '팀 금고에 옮기기', feeCredit: 0, ref: { txId: tx.id } });
    notifyTeam(u.teamId, `${u.name}이(가) ${CURRENCY_LABEL[currency]} ${amount}개를 팀 금고에 옮겼어요.`, 'info', { txId: tx.id });
    return tx;
  });
}

/** 팀장 → 같은 팀원에게 금고 재화 분배. 분배 수수료와 공해 증가 없음. */
function distributeVaultToMember(
  teamId,
  leaderUid,
  targetUid,
  currency,
  amount
) {
  return runTx(() => {
    if (
      !isTeamMember(leaderUid, teamId) ||
      !isLeader(leaderUid)
    ) {
      throw new Error('팀장만 금고를 분배할 수 있어요');
    }

    const target = getUser(targetUid);

    if (target.teamId !== teamId) {
      throw new Error('같은 팀 팀원에게만 분배할 수 있어요');
    }

    if (!CURRENCIES.includes(currency)) {
      throw new Error('재화를 선택해 주세요');
    }

    amount = Number(amount);

    if (!Number.isSafeInteger(amount) || amount <= 0) {
      throw new Error('수량은 1 이상의 정수여야 해요');
    }

    const tx = transfer({
      type: 'vaultToUser',
      from: vaultRef(teamId),
      to: userRef(targetUid),
      currency,
      amount,
      memo: '팀장이 금고에서 분배',
      createdBy: leaderUid,
    });

    pushVaultLog(teamId, {
      type: 'distribute',
      fromUid: leaderUid,
      toUid: targetUid,
      currency,
      amount,
      memo: '팀장이 금고에서 분배',
      feeCredit: 0,
      ref: { txId: tx.id },
    });

    notify(
      targetUid,
      `팀장이 금고에서 ${CURRENCY_LABEL[currency]} ${amount}개를 분배해 줬어요!`,
      'success',
      { txId: tx.id }
    );

    return tx;
  });
}


function requestPointIssue(userId, amount, reason) {
  return runTx(() => {
    if (!isTeamMember(userId, 'white')) throw new Error('포인트 발행 신청은 화이트팀만 할 수 있어요');
    if (!isLeader(userId)) throw new Error('포인트 발행 신청은 화이트팀 팀장만 할 수 있어요');
    amount = toInt(amount); assertAmount(amount); reason = assertReason(reason);
    const remain = getRemainingIssue('white', 'point');
    if (amount > remain) throw new Error(`오늘 남은 발행 한도는 ${remain}개예요`);
    return createRequest({ type: 'pointIssue', fromUid: userId, teamId: 'white', payload: { amount, reason } });
  });
}/** 골드 자격 발생 시 자동 생성(퀴즈 출제 / 숙제 도우미). 같은 ref로는 1회만. */
function createGoldIssueRequest(userId, reason, refKey) {
  const student = state.users[userId];

  if (!student || student.teamId !== 'gold') {
    return null;
  }

  if (
    refKey &&
    state.requests.some(
      (request) =>
        request.type === 'goldIssue' &&
        request.payload.refKey === refKey
    )
  ) {
    return null;
  }

  const request = createRequest({
    type: 'goldIssue',
    fromUid: userId,
    teamId: 'gold',
    payload: { reason, refKey },
  });

  notify(
    userId,
    `골드 신청(${reason})이 선생님께 전달되었어요. 승인되면 골드 1개를 받아요.`,
    'info',
    { requestId: request.id }
  );

  return request;
}
/** 교사 직접 지급. mode: mint(발행) | vaultToUser(금고→학생). 사유 필수 */
function adminGrant({
  mode = 'mint',
  targetUid,
  teamId = null,
  currency,
  amount,
  reason,
  notifyResult = true,
}) {
  return runTx(() => {
    if (!isTeacher()) {
      throw new Error('선생님만 사용할 수 있어요');
    }

    if (!['mint', 'vaultToUser'].includes(mode)) {
      throw new Error('지급 방식을 선택해 주세요');
    }

    amount = toInt(amount);
    assertAmount(amount);
    reason = assertReason(reason, 100);

    const target = getUser(targetUid);
    const to = userRef(target.id);

    if (mode === 'vaultToUser') {
      if (!TEAM_IDS.includes(teamId)) {
        throw new Error('금고 팀을 선택해 주세요');
      }

      transfer({
        type: 'vaultToUser',
        from: vaultRef(teamId),
        to,
        currency,
        amount,
        memo: `금고→학생: ${reason}`,
        createdBy: TEACHER_ID,
      });

      if (notifyResult) {
        notify(
          targetUid,
          `${TEAM_LABEL[teamId]}팀 금고에서 ${CURRENCY_LABEL[currency]} ${amount}개를 받았어요. (${reason})`,
          'success'
        );
      }
    } else {
      transfer({
        type: 'adminGrant',
        from: null,
        to,
        currency,
        amount,
        memo: reason,
        createdBy: TEACHER_ID,
      });

      if (notifyResult) {
        notify(
          targetUid,
          `선생님이 ${CURRENCY_LABEL[currency]} ${amount}개를 주셨어요. (${reason})`,
          'success'
        );
      }
    }
  });
}
/** 교사 수동 조정(±). 음수면 차감(잔고 부족 시 실패) */
function adminAdjust(
  ref,
  currency,
  delta,
  reason,
  { notifyResult = true } = {}
) {
  return runTx(() => {
    if (!isTeacher()) {
      throw new Error('선생님만 사용할 수 있어요');
    }

    delta = toInt(delta);

    if (!Number.isSafeInteger(delta) || delta === 0) {
      throw new Error('0이 아닌 정수를 입력해 주세요');
    }

    reason = assertReason(reason, 100);

    if (delta > 0) {
      transfer({
        type: 'adminAdjust',
        from: null,
        to: ref,
        currency,
        amount: delta,
        memo: reason,
        createdBy: TEACHER_ID,
      });
    } else {
      transfer({
        type: 'adminAdjust',
        from: ref,
        to: null,
        currency,
        amount: -delta,
        memo: reason,
        createdBy: TEACHER_ID,
      });
    }

    if (notifyResult && ref.kind === 'user') {
      notify(
        ref.id,
        `선생님이 ${CURRENCY_LABEL[currency]}을(를) ${
          delta > 0 ? '+' : ''
        }${delta} 조정했어요. (${reason})`,
        delta > 0 ? 'success' : 'warn'
      );
    }
  });
}
/** 전 재화 몰수(사유 필수) */
function confiscateAll(userId, reason) {
  return runTx(() => {
    if (!isTeacher()) throw new Error('선생님만 사용할 수 있어요');
    reason = assertReason(reason, 100);
    const u = getUser(userId);
    CURRENCIES.forEach((c) => {
      const amt = u.balances[c];
      if (amt > 0) transfer({ type: 'confiscate', from: userRef(userId), to: null, currency: c, amount: amt, memo: `몰수: ${reason}`, createdBy: TEACHER_ID });
    });
    notify(userId, `모든 재화가 몰수되었어요. (${reason})`, 'danger');

}
function applyWalletChanges({
  ref,
  base,
  deltas,
  reason,
  sourceMode = 'mint',
  sourceTeam = null,
}) {
  return runTx(() => {
    if (!isTeacher()) {
      throw new Error('선생님만 사용할 수 있어요');
    }

    if (!ref || !['user', 'vault'].includes(ref.kind)) {
      throw new Error('대상 지갑을 선택해 주세요');
    }

    reason = assertReason(reason, 100);

    const wallet = walletOf(ref);
    const changes = [];

    CURRENCIES.forEach((currency) => {
      if (
        !base ||
        !Number.isSafeInteger(base[currency]) ||
        base[currency] !== wallet[currency]
      ) {
        throw new Error(
          '잔고가 바뀌었어요. 되돌리기를 누른 뒤 다시 조정해 주세요'
        );
      }

      const delta = deltas?.[currency] ?? 0;

      if (!Number.isSafeInteger(delta)) {
        throw new Error('변경 수량은 정수여야 해요');
      }

      const next = wallet[currency] + delta;

      if (!Number.isSafeInteger(next) || next < 0) {
        throw new Error(
          `${CURRENCY_LABEL[currency]} 잔고는 0 이상이어야 해요`
        );
      }

      if (delta !== 0) {
        changes.push({ currency, delta });
      }
    });

    if (!changes.length) {
      throw new Error('바꿀 재화가 없어요');
    }

    if (
      ref.kind === 'user' &&
      !['mint', 'vaultToUser'].includes(sourceMode)
    ) {
      throw new Error('늘릴 재화를 가져올 곳을 선택해 주세요');
    }

    if (
      ref.kind === 'user' &&
      sourceMode === 'vaultToUser' &&
      changes.some((change) => change.delta > 0)
    ) {
      if (!TEAM_IDS.includes(sourceTeam)) {
        throw new Error('가져올 팀 금고를 선택해 주세요');
      }

      changes
        .filter((change) => change.delta > 0)
        .forEach(({ currency, delta }) => {
          assertBalance(vaultRef(sourceTeam), currency, delta);
        });
    }

    changes.forEach(({ currency, delta }) => {
      if (ref.kind === 'user' && delta > 0) {
        adminGrant({
          mode: sourceMode,
          targetUid: ref.id,
          teamId:
            sourceMode === 'vaultToUser'
              ? sourceTeam
              : null,
          currency,
          amount: delta,
          reason,
          notifyResult: false,
        });
      } else {
        adminAdjust(ref, currency, delta, reason, {
          notifyResult: false,
        });
      }
    });

    if (ref.kind === 'user') {
      const lines = changes.map(
        ({ currency, delta }) =>
          `${CURRENCY_LABEL[currency]} ${
            delta > 0 ? '+' : ''
          }${delta}`
      );

      const sourceText =
        sourceMode === 'vaultToUser' &&
        changes.some((change) => change.delta > 0)
          ? `\n늘어난 재화는 ${TEAM_LABEL[sourceTeam]}팀 금고에서 가져왔어요.`
          : '';

      notify(
        ref.id,

function confiscateVault(teamId, reason) {

        from: ref,
        to: null,
        currency,
        amount,
        memo: `금고 전액 몰수: ${reason}`,
        createdBy: TEACHER_ID,

      teamId,
      `선생님이 ${TEAM_LABEL[teamId]}팀 금고의 모든 재화를 몰수했어요. (${reason})`,

function requestLeaderHandover(teamId, fromUid, toUid) {

      throw new Error('이미 팀장 교체 요청이 대기 중이에요');
    }

    const next = getUser(toUid);

    if (
      toUid === fromUid ||
      next.teamId !== teamId ||
      !isPresent(toUid)
    ) {
      throw new Error(
        '팀장을 넘길 수 없는 학생이에요(본인·결석 제외)'
      );
    }

    const request = createRequest({
      type: 'leaderHandover',
      fromUid,
      targetUid: toUid,
      teamId,
    });

    team.pendingHandover = {
      toUid,
      fromUid,
      requestId: request.id,
    };

    notify(
      toUid,
      `${actorName(fromUid)}이(가) 팀장을 넘기려고 해요.`,

/** 교사 직접 지정(즉시 반영, 대기 중 요청 자동 취소) */

}/* =====================================================
   10. 거래소 (H장) – 에스크로 없음, 수락 시 재검증

function getTrade(id) { const t = state.trades.find((x) => x.id === id); if (!t) throw new Error('거래를 찾을 수 없어요'); return t; }
function canActForRef(actorUid, ref) {

function createTrade({ proposer, counterpart = null, give, receive, feePayer = 'proposer', feeCurrency = 'credit', createdBy = currentActorUid() }) {

}function acceptTrade(tradeId, acceptorRef, actorUid = currentActorUid()) {

    if (t.counterpart && !sameRef(t.counterpart, acceptorRef)) throw new Error('이 거래의 상대가 아니에요');
    if (sameRef(t.proposer, acceptorRef)) throw new Error('자기 자신의 제안은 수락할 수 없어요');
    const counterpart = t.counterpart || acceptorRef;

    if (t.receive.amount > 0) { const tx2 = transfer({ type: 'trade', from: counterpart, to: t.proposer, currency: t.receive.currency, amount: t.receive.amount, memo, createdBy: actorUid, ref: { tradeId } }); t.txIds.push(tx2.id); }

    if (counterpart.kind === 'user') notify(counterpart.id, `${walletName(t.proposer)}와(과)의 거래가 체결되었어요.`, 'success', { tradeId });
    return t;
  });
}function rejectTrade(tradeId, actorUid = currentActorUid()) {
  return runTx(() => {
    const t = getTrade(tradeId);
    if (t.status !== 'open') throw new Error('이미 끝난 거래예요');
    if (!t.counterpart) throw new Error('공개 제안은 거절할 수 없어요(그냥 두면 돼요)');
    if (!canActForRef(actorUid, t.counterpart)) throw new Error('거래 상대만 거절할 수 있어요');
    t.status = 'rejected'; t.resolvedAt = nowISO(); t.acceptedBy = actorUid;
    if (t.proposer.kind === 'user') notify(t.proposer.id, `${walletName(t.counterpart)}이(가) 거래를 거절했어요.`, 'warn', { tradeId });

}function cancelTrade(tradeId, actorUid = currentActorUid(), reason = '') {
  return runTx(() => {

    if (!canActForRef(actorUid, t.proposer)) throw new Error('제안자만 취소할 수 있어요');
    t.status = 'cancelled'; t.resolvedAt = nowISO(); t.cancelReason = reason || null;
    if (t.counterpart && t.counterpart.kind === 'user') notify(t.counterpart.id, `${walletName(t.proposer)}이(가) 거래 제안을 취소했어요.`, 'info', { tradeId });
  });
}function cancelAllOpenTrades(reason) {
  return runTx(() => {
    if (!isTeacher()) throw new Error('선생님만 사용할 수 있어요');
    reason = assertReason(reason, 100);
    const open = state.trades.filter((t) => t.status === 'open');

}/** 체결된 거래 되돌리기(교사). 이동 재화·수수료를 역방향으로 복구 */
function rollbackTrade(tradeId, reason) {
  return runTx(() => {
    if (!isTeacher()) throw new Error('선생님만 사용할 수 있어요');
    reason = assertReason(reason, 100);

        if (tx.pollutionDelta) applyPollution(-tx.pollutionDelta, `거래 롤백(수수료 공해 복구): ${reason}`, 'refund', { tradeId });
      } else {
        transfer({ type: 'tradeRollback', from: tx.to, to: tx.from, currency: tx.currency, amount: tx.amount, memo: `거래 롤백: ${reason}`, createdBy: TEACHER_ID, ref: { tradeId } });

      type: 'couponRedeem',

  });

  }

  if (coupon.status !== 'pendingRedeem') {
    throw new Error('사용 대기 중인 쿠폰이 아니에요');
  }

  switch (coupon.effectType) {
    case 'pollutionReduce': {
      const reduction = Math.abs(coupon.effectAmount || 0);

      applyPollution(
        -reduction,
        `쿠폰 사용: ${coupon.name} (${student.name})`,
        'coupon',
        { requestId: request.id }
      );

      notifyAllStudents(
        `${student.name}이(가) "${coupon.name}"을(를) 사용해 공해 지수가 ${reduction} 내려갔어요.`,
        'success'
      );

      break;
    }

    case 'teamChange': {
      const nextTeamId = request.payload.toTeamId;

      if (
        !TEAM_IDS.includes(nextTeamId) ||
        nextTeamId === student.teamId
      ) {
        throw new Error('이동할 팀을 다시 확인해 주세요');
      }

      const teamRequest = createRequest({
        type: 'teamChange',
        fromUid: student.id,
        teamId: student.teamId,
        payload: {
          toTeamId: nextTeamId,
          couponId: coupon.id,
        },
      });

      notify(
        student.id,
        `팀 이동 요청이 선생님께 전달되었어요. (→ ${TEAM_LABEL[nextTeamId]}팀)`,
        'info',
        { requestId: teamRequest.id }
      );

      break;
    }

    default:
      // 확인만·숙제 면제·기타 효과는 담당자 확인으로 완료합니다.
      break;
  }

  coupon.status = 'used';
  coupon.usedAt = nowISO();
  coupon.usedBy = actor;

  notify(
    student.id,
    `쿠폰 "${coupon.name}" 사용이 확인되었어요.${
      extra.memo ? ` (${extra.memo})` : ''
    }`,
    'success'
  );
}

function getStoreCatalog(id) { const c = state.storeCatalog.find((x) => x.id === id); if (!c) throw new Error('물품을 찾을 수 없어요'); return c; }
function addStoreItem({ name, cost, stock, kind = 'snack' }) {

    const it = { id: uid(), name: String(name).trim(), cost, stock, kind: kind === 'supply' ? 'supply' : 'snack', createdAt: nowISO() };

}function updateStoreItem(id, patch) {

}function getTeamItemStock(catalogId) {
  const bought = sum(state.teamPurchases.filter((p) => p.kind === 'item' && p.catalogId === catalogId), (p) => p.qty);
  const listed = sum(state.storeListings.filter((l) => l.catalogId === catalogId), (l) => l.listedTotal || 0);
  return bought - listed;
}function purchaseStoreStock(catalogId, qty, actorUid = currentActorUid()) {
  return runTx(() => {

    const it = getStoreCatalog(catalogId);
    if (getTeamItemStock(catalogId) < qty) throw new Error(`팀 재고가 부족해요(보유 ${getTeamItemStock(catalogId)}개)`);
    const l = { id: uid(), catalogId, teamId: 'black', name: it.name, kind: it.kind, cost: it.cost, price, qty, listedTotal: qty, status: 'active', createdBy: actorUid, createdAt: nowISO() };

}function updateStoreListing(listingId, patch, actorUid = currentActorUid()) {
  return runTx(() => {

    couponRevenue: sum(coupons, (s) => s.price), couponCost: sum(coupons, (s) => s.cost),

/** 교사 수동 공해 조정. preset: noise | leaderMiss | manual */
function adjustPollutionManual(
  preset,
  {
    delta = 0,
    reason = '',
    teamIds = [],
    count = 0,
  } = {}
) {
  return runTx(() => {
    if (!isTeacher()) {
      throw new Error('선생님만 공해를 조정할 수 있어요');
    }

    const settings = state.settings;
    let change;
    let text;
    let reference = {};

    if (preset === 'noise') {
      change = settings.noiseDelta;
      text = reason
        ? `교실 소음 (${String(reason).trim()})`
        : '교실 소음';
    } else if (preset === 'leaderMiss') {
      const selected = [
        ...new Set(
          (teamIds || []).filter((teamId) =>
            TEAM_IDS.includes(teamId)
          )
        ),
      ];

      if (!selected.length) {
        throw new Error('팀을 1개 이상 선택해 주세요');
      }

      change = settings.leaderMissDelta * selected.length;

      text =
        '팀장 미승인: ' +
        selected
          .map((teamId) => `${TEAM_LABEL[teamId]}팀`)
          .join(', ');

      reference = {
        teamIds: selected,
        unitDelta: settings.leaderMissDelta,
      };
    } else if (preset === 'duty') {
      const people = Number(count);

      if (!Number.isSafeInteger(people) || people < 1) {
        throw new Error('인원수는 1 이상의 정수로 입력해 주세요');
      }

      change = people * settings.dutyMissDelta;

      if (!Number.isSafeInteger(change)) {
